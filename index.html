  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  animation:dl 160ms var(--ease);
}
@keyframes dl{from{opacity:0;transform:scaleX(.9)}to{opacity:1;transform:none}}

@media(max-width:860px){
  .searchwrap{max-width:none;min-width:0;width:100%;order:-1}
  .sortwrap{flex:1}
  .sortwrap .sel{width:100%}
  .fgrid{grid-template-columns:1fr;gap:15px}
  .filterpanel{padding:15px}
}

/* ===== shopping ===== */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.stile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:13px 8px 11px;border-radius:var(--r-md);background:var(--surface);
  border:1.5px solid var(--line-soft);box-shadow:var(--sh-xs);min-height:98px;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease),background var(--t) var(--ease);
}
.stile:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--line-strong)}
.stile:active{transform:translateY(-1px) scale(.97)}
.stile .sic{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb, var(--tc) 14%, transparent);
  transition:background var(--t) var(--ease),transform var(--t) var(--ease);
}
.stile .sn{font-size:11.5px;font-weight:600;line-height:1.25;text-align:center;color:var(--text-2)}
.stile.on{border-color:var(--tc);background:color-mix(in srgb, var(--tc) 7%, var(--surface))}
.stile.on .sic{background:var(--tc);transform:scale(1.04)}
.stile.on .sn{color:var(--text)}
.stile .sq{
  position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;
  background:var(--tc);color:#fff;font-size:12px;font-weight:750;display:grid;place-items:center;
  box-shadow:var(--sh-sm);animation:pop 220ms var(--ease);
}
.stile .sminus{
  position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line-strong);color:var(--text-2);
  font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:var(--sh-xs);
}
.stile .sminus:hover{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.tier{margin-bottom:16px}
.tier-h{
  display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);transition:background var(--t) var(--ease)}
.tier-h:hover{background:var(--surface-2)}
.tier.open .tier-h{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:transparent}
.tier-h .tchev{color:var(--text-faint);display:flex;width:20px}
.tier-h .tn{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.02em}
.tier-h .td{display:block;font-size:12.5px;color:var(--text-muted);margin-top:1px}
.tier-h .count{margin-left:auto}
.tier-b{
  background:var(--surface);border:1px solid var(--line-soft);border-top:none;
  border-radius:0 0 var(--r-lg) var(--r-lg);padding:6px 16px 18px;
}
.scat-block{margin-top:14px}
.scat-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.scat-h .se{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb, var(--tc) 15%, transparent)}
.scat-h .sname{font-size:13.5px;font-weight:650}

.basket .srow{
  display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line-soft);
  cursor:pointer;transition:opacity var(--t) var(--ease)}
.basket .srow:last-child{border-bottom:none}
.basket .sicon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  background:color-mix(in srgb, var(--tc) 14%, transparent);flex:none}
.basket .sname{flex:1;font-size:14.5px;font-weight:550}
.basket .scat{width:132px;text-align:right}
.basket .srow.done{opacity:.45}
.basket .srow.done .sname{text-decoration:line-through}
.minitile{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;position:relative;
  background:color-mix(in srgb, var(--tc) 15%, transparent)}
.minitile b{position:absolute;bottom:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;
  background:var(--tc);color:#fff;font-size:10px;font-weight:750;display:grid;place-items:center}
.minitile.more{background:var(--surface-3);font-size:12px;font-weight:700;color:var(--text-muted)}

/* ===== all-day band ===== */
.allday{display:grid;border-bottom:1px solid var(--line);background:var(--surface-2);min-height:34px}
.adlabel{
  display:flex;align-items:center;justify-content:flex-end;padding:6px 10px;
  font-size:11px;font-weight:650;color:var(--text-faint);border-right:1px solid var(--line-soft)}
.adcell{padding:5px 4px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line-soft);min-width:0}
.adcell:last-child{border-right:none}
.adchip{
  display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;width:100%;
  font-size:11.5px;font-weight:600;text-align:left;line-height:1.35;
  background:color-mix(in srgb, var(--ac) 16%, transparent);color:var(--ac);
  border-left:3px solid var(--ac);
  transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.adchip:hover{background:color-mix(in srgb, var(--ac) 26%, transparent);transform:translateX(1px)}
.adchip .addot{width:5px;height:5px;border-radius:50%;background:var(--ac);flex:none}
.adchip .adt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adchip.holiday{font-weight:680}
.adchip.mini{padding:2px 6px;font-size:10.5px;margin-top:3px}
.gh.free .dd{box-shadow:inset 0 0 0 2px color-mix(in srgb,#d64545 55%,transparent)}
.mcell.free{background:color-mix(in srgb,#d64545 5%,transparent)}
.allday-switch{
  padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft)}

/* ===== birthdays ===== */
.bdbanner{
  display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r-lg);
  margin-bottom:18px;cursor:pointer;border:1px solid transparent;
  background:linear-gradient(120deg,color-mix(in srgb,#e8618a 16%,var(--surface)),color-mix(in srgb,#d99022 12%,var(--surface)));
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.bdbanner:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.bdbanner .bb-ic{font-size:30px}
.bdbanner .bb-t{font-size:16px;font-weight:680;letter-spacing:-.022em}
.bdbanner .bb-s{font-size:13.5px;color:var(--text-2);margin-top:2px}
.bdbanner.now{box-shadow:0 0 0 1px color-mix(in srgb,#e8618a 30%,transparent),var(--sh-sm)}
.panel.bdglow{box-shadow:0 0 0 1px color-mix(in srgb,#e8618a 32%,transparent),var(--sh-md)}

.bdtoday{position:relative;overflow:hidden;border-radius:var(--r-xl);margin-bottom:20px;
  background:linear-gradient(140deg,#e8618a 0%,#d9557e 46%,#8b5fd0 100%);box-shadow:var(--sh-md)}
.bdtoday-in{position:relative;z-index:1;padding:26px 28px;color:#fff}
.bdtoday-in h2{font-size:26px;font-weight:720;letter-spacing:-.03em;margin-top:8px;line-height:1.15}
.bdtoday-in p{margin:8px 0 0;font-size:14.5px;opacity:.9}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti span{
  position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;background:var(--c);opacity:.75;
  animation:fall 4.2s linear infinite;animation-delay:var(--d)}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(240px) rotate(420deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}}

.bdnext{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.bdnext-c{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);text-align:left;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.bdnext-c:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.bdnext-c .nn{font-size:15px;font-weight:650;margin-top:8px}
.bdnext-c .nd{font-size:12.5px;color:var(--text-muted)}
.bdnext-c .na{font-size:12px;font-weight:650;color:var(--rc);margin-top:5px}

.bd-av{
  width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;
  font-size:14px;font-weight:720;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(150deg,var(--rc,#e8618a),color-mix(in srgb,var(--rc,#e8618a) 62%,#2b1a24))}
.bd-av.sm{width:32px;height:32px;border-radius:11px;font-size:11.5px}

.bdmonth{margin-bottom:22px}
.bdmonth-h{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.bdmonth-h span:first-child{font-size:14px;font-weight:700;letter-spacing:-.015em}
.bdline{flex:1;height:1px;background:var(--line)}

.bdcard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);margin-bottom:10px;overflow:hidden;
  transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.bdcard:hover{box-shadow:var(--sh-sm);border-color:var(--line-strong)}
.bdcard.today{border-color:color-mix(in srgb,#e8618a 45%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,#e8618a 22%,transparent),var(--sh-sm)}
.bd-h{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;width:100%;text-align:left;
  transition:background var(--t) var(--ease)}
.bd-h:hover{background:var(--surface-2)}
.bd-main{flex:1;min-width:0}
.bd-n{font-size:15px;font-weight:650;letter-spacing:-.018em}
.bd-today{font-size:11.5px;font-weight:700;color:#e8618a;margin-left:5px}
.bd-s{font-size:12.5px;color:var(--text-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-rel{font-size:12px;font-weight:600;color:var(--rc);padding:3px 10px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--rc) 12%,transparent);white-space:nowrap}
.bd-away{font-size:12.5px;font-weight:650;color:var(--text-faint);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.bd-away.soon{color:var(--warning)}
.bd-away.now{color:#e8618a}
.bd-chev{color:var(--text-faint);display:flex}
.bd-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows 280ms var(--ease)}
.bdcard.open .bd-b{grid-template-rows:1fr}
.bd-inner{overflow:hidden;min-height:0}
.bdcard.open .bd-inner{padding:2px 16px 16px}
.bd-note{margin:0 0 13px;font-size:13.5px;color:var(--text-2);line-height:1.6}
.bd-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.bd-fv{font-size:14.5px;font-weight:650;margin-top:2px}

.giftbox{background:var(--surface-2);border-radius:var(--r-md);padding:14px 15px}
.gift-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650;margin-bottom:8px}
.giftrow{display:flex;align-items:center;gap:11px;padding:6px 0}
.giftrow .gt{flex:1;font-size:13.5px}
.giftrow.done .gt{color:var(--text-faint);text-decoration:line-through}
.giftadd{display:flex;gap:8px;margin-top:10px}
.giftadd .inp{flex:1}

.hdrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.hdrow:last-child{border-bottom:none}
.hddot{width:9px;height:9px;border-radius:50%;flex:none}
.hdn{font-size:14px;font-weight:600}

@media(max-width:860px){
  .sgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .stile{min-height:88px;padding:11px 5px 9px}
  .stile .sic{width:38px;height:38px;font-size:19px}
  .stile .sn{font-size:10.5px}
  .basket .scat{display:none}
  .adlabel{font-size:0;padding:6px 4px}
  .adlabel::after{content:"⏱";font-size:12px}
  .bd-rel{display:none}
  .bdtoday-in{padding:20px}
  .bdtoday-in h2{font-size:21px}
  .tier-b{padding:4px 11px 14px}
}

/* ===== journal calendar ===== */
/* the base rule is a grid; with two children the dot created a second row,
   so cells with an entry grew taller than cells without. Flex + absolute dot. */
.jday{
  display:flex;align-items:center;justify-content:center;position:relative;
  aspect-ratio:1;min-width:0;padding:0;overflow:hidden;
  transition:background var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.jday .jd-n{line-height:1;font-variant-numeric:tabular-nums}
.jday .jd-dot{
  position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--md,var(--primary))}
.jday.out{opacity:.34}
.jday.future{opacity:.5}
.jday.has{background:color-mix(in srgb,var(--md,var(--primary)) 16%,transparent);color:var(--text);font-weight:700}
.jday.today{box-shadow:inset 0 0 0 2px var(--primary)}
.jday.sel{background:var(--primary);color:#fff;font-weight:750}
.jday.sel .jd-dot{background:rgba(255,255,255,.85)}
.jday.sel.today{box-shadow:inset 0 0 0 2px var(--primary-deep)}

/* ===== journal timeline ===== */
.jtl-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.jtl-stats{display:flex;gap:22px}
.jtl-wrap{position:relative}
.jtl{
  display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:26px 0 30px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.jtl::-webkit-scrollbar{display:none}
.jtl-pad{flex:0 0 calc(50% - 150px);min-width:8px}
.jcard{
  flex:0 0 300px;scroll-snap-align:center;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:20px 22px;
  box-shadow:var(--sh-sm);cursor:pointer;position:relative;overflow:hidden;
  transform:scale(.9);opacity:.55;
  transition:transform 420ms var(--ease),opacity 420ms var(--ease),box-shadow 420ms var(--ease);
}
.jcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--mc)}
.jcard.on{transform:scale(1);opacity:1;box-shadow:var(--sh-lg)}
.jcard:active{transform:scale(.98)}
.jc-top{display:flex;align-items:flex-start;gap:12px}
.jc-date{display:flex;flex-direction:column;line-height:1}
.jc-d{font-size:40px;font-weight:760;letter-spacing:-.05em}
.jc-m{font-size:12.5px;font-weight:650;color:var(--text-muted);margin-top:4px}
.jc-day{font-size:13px;font-weight:600;color:var(--mc);margin-top:10px}
.jc-text{
  margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--text-2);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;min-height:112px}
.jc-foot{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)}
.jc-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc)}
.jc-rel{font-size:11.5px;color:var(--text-faint);font-weight:600}
.jtl-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface-glass);backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:var(--sh-md);color:var(--text-2);
  transition:transform var(--t) var(--ease),background var(--t) var(--ease)}
.jtl-nav:hover{background:var(--surface);transform:translateY(-50%) scale(1.08)}
.jtl-nav.left{left:-6px}
.jtl-nav.right{right:-6px}
.jrail{
  display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding:4px 2px 8px;
  justify-content:center;scrollbar-width:none}
.jrail::-webkit-scrollbar{display:none}
.jrail-y{display:flex;flex-direction:column;gap:5px;flex:none}
.jrail-y .ry-l{font-size:11px;font-weight:750;color:var(--text-faint);letter-spacing:.03em;padding-left:2px}
.jrail-y .ry-m{display:flex;gap:5px}
.jrail-m{
  padding:6px 10px;border-radius:var(--r-sm);background:var(--surface-3);
  font-size:12px;font-weight:650;color:var(--text-2);
  transition:background var(--t) var(--ease),color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.jrail-m:hover{background:var(--primary-soft);color:var(--primary-deep);transform:translateY(-2px)}

/* delete affordances on the timeline */
.jc-del{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--text-faint);opacity:0;pointer-events:none;
  transition:opacity var(--t) var(--ease),background var(--t) var(--ease),color var(--t) var(--ease)}
.jcard.on .jc-del{opacity:1;pointer-events:auto}
.jc-del:hover{background:var(--danger-soft);color:var(--danger)}
.jcard{touch-action:pan-x}
.jcard.lifting{transition:none;z-index:4;box-shadow:var(--sh-xl)}
.jtrash{
  display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;
  height:0;overflow:hidden;opacity:0;border-radius:var(--r-lg);
  font-size:13.5px;font-weight:650;color:var(--text-muted);background:var(--surface-3);
  transition:height var(--t) var(--ease),opacity var(--t) var(--ease),background var(--t) var(--ease),color var(--t) var(--ease)}
.jtrash.on{height:52px;opacity:1}
.jtrash.armed{background:var(--danger-soft);color:var(--danger)}
.jtrash.armed span:first-child{transform:scale(1.12)}
.jtrash span:first-child{display:flex;transition:transform var(--t) var(--ease)}

/* draggable course list */
.courserow{position:relative}
.courserow.dragging{opacity:.4}
.cgrip{
  width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;
  color:var(--text-faint);cursor:grab}
.cgrip:hover{background:var(--surface-3);color:var(--text-2)}
.cgrip:active{cursor:grabbing}

/* journal detail overlay */
.jdlg-h{display:flex;align-items:center;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.jdlg-h h2{font-size:23px;letter-spacing:-.03em;margin-top:4px}
.jdlg-scales{display:grid;gap:10px;margin:16px 0}
.jdlg-s{display:flex;align-items:center;gap:12px}
.jdlg-s .meta{width:96px}
.jdlg-s .bar{flex:1;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.jdlg-s .bar i{display:block;height:100%;border-radius:5px;background:var(--pc)}
.jdlg-s .v{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.jdlg-sec{margin-top:18px}
.jdlg-sec h4{font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.jdlg-sec p{margin:0;font-size:14.5px;line-height:1.7;color:var(--text);white-space:pre-wrap}

/* ===== growth ===== */
.gseg{flex-wrap:wrap}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcat{margin-bottom:14px}
.gcat-h{
  display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.gcat-h:hover{background:var(--surface-2)}
.gcat.open .gcat-h{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:transparent}
.gc-chev{color:var(--text-faint);display:flex}
.gc-e{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb,var(--tc) 15%,transparent)}
.gc-n{font-size:15px;font-weight:650;letter-spacing:-.018em;flex:1}
.gcat-b{background:var(--surface);border:1px solid var(--line-soft);border-top:none;
  border-radius:0 0 var(--r-lg) var(--r-lg);padding:14px 16px 18px}

.contcard{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line-soft);text-align:left;width:100%;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),background var(--t) var(--ease)}
.contcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md);background:var(--surface)}
.cc-ic{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc)}
.cc-main{flex:1;min-width:0}
.cc-t{display:block;font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-s{display:block;font-size:12.5px;color:var(--text-muted);margin-top:1px}
.cc-p{font-size:13.5px;font-weight:700;color:var(--cc);font-variant-numeric:tabular-nums;display:flex}

.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.cattile{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--tc) 9%,var(--surface));border:1px solid transparent;

.cattile:hover{transform:translateY(-3px);box-shadow:var(--sh-md);background:color-mix(in srgb,var(--tc) 15%,var(--surface))}
.ct-e{font-size:21px}
.ct-n{font-size:11.5px;font-weight:650;text-align:center;line-height:1.25;color:var(--text-2)}
.ct-c{font-size:16px;font-weight:750;color:var(--tc);font-variant-numeric:tabular-nums}

.shelf{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}

.shelf-b{flex:0 0 62px}
.sb-cv{

.shelf-b:hover .sb-cv{transform:translateY(-4px) rotate(-1.5deg)}
.sb-cv.fertig{opacity:.55}
.sb-p{display:block;height:3px;border-radius:2px;background:var(--surface-3);margin-top:5px;overflow:hidden}
.sb-p i{display:block;height:100%;background:var(--info)}

.guideteaser{
  display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r-lg);
  background:linear-gradient(120deg,color-mix(in srgb,#3d9bd8 12%,var(--surface)),var(--surface));
  border:1px solid var(--line-soft);box-shadow:var(--sh-xs);color:var(--text);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.guideteaser:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.gt-e{font-size:26px}
.gt-t{display:block;font-size:15px;font-weight:650}
.gt-s{display:block;font-size:12.5px;color:var(--text-muted);margin-top:2px}

@media(max-width:860px){
