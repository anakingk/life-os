function calPointerMove(e){
  if(!drag)return;
  const dy=e.clientY-drag.startY,dx=e.clientX-drag.startX;
  if(Math.abs(dy)>3||Math.abs(dx)>3)drag.moved=true;
  if(!drag.moved)return;
  const snap=S.settings.snap||15;
  const dm=Math.round(dy/HH*60/snap)*snap;
  let s=drag.origStart,en=drag.origEnd;
  if(drag.mode==="move"){
    const len=en-s;
    s=clamp(drag.origStart+dm,0,24*60-len);en=s+len;
  }else{
    en=clamp(drag.origEnd+dm,s+snap,24*60);
  }
  drag.curStart=s;drag.curEnd=en;
  drag.el.style.top=(s/60*HH)+"px";
  drag.el.style.height=Math.max((en-s)/60*HH-3,14)+"px";
  drag.el.querySelector(".bm").textContent=`${hhmm(s)} – ${hhmm(en)}`;
  if(drag.mode==="move"&&drag.days.length>1){
    const hit=drag.days.find(d=>e.clientX>=d.rect.left&&e.clientX<=d.rect.right);
    if(hit&&hit.key!==drag.dk){drag.targetDay=hit.key;drag.el.style.opacity=".72";}
    else{drag.targetDay=null;drag.el.style.opacity="";}
  }
}

/* ============================================================
   NUTRITION — personal energy target engine
   Everything here is an estimate that gets calibrated against
   the real weight trend. Nothing is presented as measured.
   ============================================================ */
function defaultNutrition(){
  return {
    profile:{sex:"m",age:28,height:182,weight:78.4,bodyFat:null,
      occupation:"sitting",steps:8000,trainingFreq:4,trainingType:"mixed",trainingMin:75},
    whoop:{enabled:false,avgBurn:2700,avgStrain:12,todayBurn:null,todayStrain:null,todayTrainingMin:null,weight:0.35},
    goal:"maintain", rate:"moderate",
    proteinPerKg:1.8, proteinOverride:null,
    dietMode:"highcarb", carbShare:0.72, customSplit:null,
    autoAdjust:false, adjustFactor:0.5, dayType:"normal",
    intakeAvg:null,
    weights:[], targetHistory:[], lastCalc:null
  };
}
const N_=()=>S.nutrition;

const OCCUPATION={sitting:{n:"Überwiegend sitzend",f:0.15},light:{n:"Leicht aktiv",f:0.25},
  standing:{n:"Viel stehend",f:0.35},physical:{n:"Körperlich arbeitend",f:0.50}};
const TRAIN_TYPE={strength:{n:"Kraft",k:0.090},mixed:{n:"Gemischt",k:0.112},
  cardio:{n:"Ausdauer",k:0.140},hiit:{n:"HIIT / Intervall",k:0.160}};
const RATES={
  lose:[{id:"conservative",n:"Konservativ",pct:0.10},{id:"moderate",n:"Moderat",pct:0.18},{id:"aggressive",n:"Ambitioniert",pct:0.25}],
  gain:[{id:"conservative",n:"Konservativ",pct:0.07},{id:"moderate",n:"Moderat",pct:0.14}],
  maintain:[{id:"moderate",n:"Erhalt",pct:0}]
};
const DIET_MODES={highcarb:{n:"High Carb",carb:0.72},balanced:{n:"Ausgewogen",carb:0.58},
  lowcarb:{n:"Low Carb",carb:0.30},custom:{n:"Eigene",carb:null}};
const DAY_TYPES=[{id:"rest",n:"Ruhetag",f:-0.08},{id:"normal",n:"Normal",f:0},
  {id:"active",n:"Aktiv",f:0.08},{id:"veryactive",n:"Sehr aktiv",f:0.15}];
const KCAL_PER_KG=7700; // classic approximation for body-mass change

/* ---------- resting energy ---------- */
function restingEnergy(){
  const p=N_().profile;
  if(p.bodyFat&&p.bodyFat>3&&p.bodyFat<60){
    const lbm=p.weight*(1-p.bodyFat/100);
    return{kcal:Math.round(370+21.6*lbm),method:"Katch-McArdle",note:"nutzt deinen Körperfettanteil"};
  }
  const base=10*p.weight+6.25*p.height-5*p.age;
  return{kcal:Math.round(base+(p.sex==="m"?5:-161)),method:"Mifflin-St Jeor",note:"Standardformel ohne Körperfettwert"};
}
function energyBreakdown(){
  const p=N_().profile,w=N_().whoop;
  const rmr=restingEnergy();
  const neat=Math.round(rmr.kcal*(OCCUPATION[p.occupation]?.f??0.15));
  const steps=Math.round((p.steps||0)*0.045*(p.weight/70));
  const t=TRAIN_TYPE[p.trainingType]||TRAIN_TYPE.mixed;
  const exercise=Math.round((p.trainingFreq||0)*(p.trainingMin||0)*t.k*p.weight/7);
  const sub=rmr.kcal+neat+steps+exercise;
  const tef=Math.round(sub*0.10);
  const modelled=sub+tef;
  let blended=modelled,whoopUsed=false;
  if(w.enabled&&w.avgBurn>800){
    const k=clamp(w.weight??0.35,0,1);
    blended=Math.round(modelled*(1-k)+(w.avgBurn*1.10)*k);
    whoopUsed=true;
  }
  return{rmr,neat,steps,exercise,tef,modelled,blended:Math.round(blended),whoopUsed};
}
/* ---------- weight trend ---------- */
function sortedWeights(){ return [...(N_().weights||[])].sort((a,b)=>a.date.localeCompare(b.date)); }
function avgWindow(days,offset=0){
  const w=sortedWeights();if(!w.length)return null;
  const end=addDays(berlinNow(),-offset), start=addDays(end,-(days-1));
  const sel=w.filter(x=>x.date>=dkey(start)&&x.date<=dkey(end));
  if(!sel.length)return null;
  return sel.reduce((s,x)=>s+x.kg,0)/sel.length;
}
function weightTrend(){
  const a=avgWindow(7,0), b=avgWindow(7,7);
  const w=sortedWeights();
  const latest=w.length?w[w.length-1]:null;
  if(a==null||b==null)return{avg7:a,prev7:b,deltaWeek:null,latest,points:w.length};
  return{avg7:a,prev7:b,deltaWeek:a-b,latest,points:w.length};
}
/** Real-world calibration: what the scale says the maintenance actually is. */
function calibratedMaintenance(){
  const est=energyBreakdown().blended;
  const tr=weightTrend(),intake=N_().intakeAvg;
  if(!intake||tr.deltaWeek==null||tr.points<6)return{kcal:est,calibrated:false,est};
  const implied=Math.round(intake-(tr.deltaWeek*KCAL_PER_KG/7));
  // trust the scale, but not blindly: cap the correction at 20%
  const capped=clamp(implied,est*0.8,est*1.2);
  return{kcal:Math.round(est*0.4+capped*0.6),calibrated:true,est,implied};
}
function goalDelta(maintenance){
  const g=N_().goal;
  if(g==="maintain")return 0;
  const r=(RATES[g]||[]).find(x=>x.id===N_().rate)||RATES[g][0];
  return Math.round(maintenance*r.pct*(g==="lose"?-1:1));
}
function dayFactor(){
  const d=DAY_TYPES.find(x=>x.id===N_().dayType)||DAY_TYPES[1];
  return d.f;
}
function activityAdjust(){
  const w=N_().whoop;
  if(!N_().autoAdjust||!w.enabled||w.todayBurn==null||!w.avgBurn)return 0;
  const raw=(w.todayBurn-w.avgBurn)*clamp(N_().adjustFactor??0.5,0,1);
  return Math.round(clamp(raw,-400,400));
}
function targets(){
  const cal=calibratedMaintenance();
  const maintenance=cal.kcal;
  const delta=goalDelta(maintenance);
  const base=maintenance+delta;
  const floor=Math.round(restingEnergy().kcal*1.05);
  const weekly=Math.max(base,floor);
  const today=Math.max(Math.round(weekly*(1+dayFactor()))+activityAdjust(),floor);
  const p=N_().profile;
  const proteinG=N_().proteinOverride??Math.round((N_().proteinPerKg||1.8)*p.weight);
  const mk=kcal=>{
    const pk=Math.min(proteinG*4,kcal*0.6);
    const rest=Math.max(0,kcal-pk);
    let share=N_().dietMode==="custom"?(N_().customSplit?.carb??0.6):(DIET_MODES[N_().dietMode]?.carb??0.6);
    share=clamp(share,0,1);
    const carbG=Math.round(rest*share/4), fatG=Math.round(rest*(1-share)/9);
    const total=Math.max(1,carbG*4+proteinG*4+fatG*9);
    return{kcal,carbG,proteinG,fatG,
      carbPct:Math.round(carbG*4/total*100),proteinPct:Math.round(proteinG*4/total*100),
      fatPct:100-Math.round(carbG*4/total*100)-Math.round(proteinG*4/total*100)};
  };
  return{maintenance,delta,weekly,today,floor,belowFloor:base<floor,
    macros:mk(today),weeklyMacros:mk(weekly),calibrated:cal.calibrated,
    perKg:+(proteinG/p.weight).toFixed(2)};
}
function expectedRate(){
  const t=targets();
  const perDay=t.weekly-t.maintenance;
  return +(perDay*7/KCAL_PER_KG).toFixed(2); // kg per week
}
/* ---------- adjustment engine ---------- */
function adjustmentAdvice(){
  const tr=weightTrend();
  if(tr.points<6||tr.deltaWeek==null)
    return{k:"ok",t:"Noch zu wenig Daten",d:"Trage etwa zwei Wochen lang regelmäßig dein Gewicht ein, dann kann hier eine belastbare Aussage stehen."};
  const want=expectedRate(), got=tr.deltaWeek;
  const diff=got-want;
  const tol=Math.max(0.15,Math.abs(want)*0.5);
  if(Math.abs(diff)<=tol)
    return{k:"ok",t:"Sieht stimmig aus",d:`Dein Trend liegt bei ${got>0?"+":""}${got.toFixed(2).replace(".",",")} kg pro Woche, angepeilt sind ${want>0?"+":""}${want.toFixed(2).replace(".",",")}. Das aktuelle Ziel scheint zu funktionieren.`};
  if(Math.abs(diff)<=tol*2.2)
    return{k:"warn",t:"Kleine Anpassung denkbar",d:`Dein Trend (${got>0?"+":""}${got.toFixed(2).replace(".",",")} kg/Woche) weicht etwas vom Ziel (${want>0?"+":""}${want.toFixed(2).replace(".",",")}) ab. Eine Änderung von 100 bis 150 kcal wäre ein sinnvoller nächster Schritt — nicht mehr.`};
  return{k:"review",t:"Nochmal anschauen",d:`Der Trend (${got>0?"+":""}${got.toFixed(2).replace(".",",")} kg/Woche) läuft deutlich am Ziel (${want>0?"+":""}${want.toFixed(2).replace(".",",")}) vorbei. Bevor du das Kalorienziel änderst: stimmt die geschätzte Zufuhr, hat sich Training oder Alltagsbewegung verändert, ist die Waage konsistent?`};
}
/* ---------- history ---------- */
function snapshotTarget(){
  const t=targets(),today=todayKey();
  const H=N_().targetHistory;
  const last=H[0];
  if(last&&last.date===today){Object.assign(last,{weight:N_().profile.weight,goal:N_().goal,kcal:t.weekly,
    c:t.weeklyMacros.carbG,p:t.weeklyMacros.proteinG,f:t.weeklyMacros.fatG});return;}
  if(last&&Math.abs(last.kcal-t.weekly)<25&&last.goal===N_().goal)return;
  H.unshift({date:today,weight:N_().profile.weight,goal:N_().goal,kcal:t.weekly,
    c:t.weeklyMacros.carbG,p:t.weeklyMacros.proteinG,f:t.weeklyMacros.fatG});
  if(H.length>60)H.length=60;
}
function addWeight(kg,date){
  const d=date||todayKey();
  const W=N_().weights;
  const i=W.findIndex(x=>x.date===d);
  if(i>=0)W[i].kg=kg; else W.push({date:d,kg});
  N_().profile.weight=kg;
  N_().lastCalc=new Date().toISOString();
  snapshotTarget();save();
}

  const cal=calibratedMaintenance().kcal;
  const opts=[
    {id:"maintain",e:"⚖️",n:"Halten",c:"var(--primary)"},
    {id:"lose",e:"🔥",n:"Abnehmen",c:"var(--coral)"},
    {id:"gain",e:"💪",n:"Aufbauen",c:"var(--second)"}];
  return `<div class="goalgrid">${opts.map(o=>{
    const r=(RATES[o.id]||[]).find(x=>x.id===N_().rate)||RATES[o.id][0];
    const v=o.id==="maintain"?cal:Math.round(cal*(1+r.pct*(o.id==="lose"?-1:1)));
    const kgw=o.id==="maintain"?0:+(cal*r.pct*7/KCAL_PER_KG*(o.id==="lose"?-1:1)).toFixed(2);
    return `<button class="goalcard ${N_().goal===o.id?"on":""}" data-ngoal="${o.id}" style="--gc:${o.c}">
      <span class="ge">${o.e}</span>
      <span class="gn">${o.n}</span>
      <span class="gv">${v.toLocaleString("de-DE")}<span style="font-size:13px;font-weight:600"> kcal</span></span>
      <span class="gs">${o.id==="maintain"?"geschätzter Erhalt":`${kgw>0?"+":""}${numFmt(kgw,2)} kg/Woche`}</span>
    </button>`;}).join("")}</div>`;
}
function trendHTML(){
  const tr=weightTrend();
  const up=tr.deltaWeek!=null&&tr.deltaWeek>0;
  const col=tr.deltaWeek==null?"var(--text-muted)":Math.abs(tr.deltaWeek)<0.1?"var(--text-2)":up?"var(--warning)":"var(--info)";
  const soft=tr.deltaWeek==null?"var(--surface-3)":`color-mix(in srgb, ${col} 14%, transparent)`;
  return `<span class="trendpill" style="background:${soft};color:${col}">
    ${tr.deltaWeek==null?"Trend braucht mehr Einträge"
      :`${up?"↑":tr.deltaWeek<0?"↓":"→"} ${numFmt(Math.abs(tr.deltaWeek),2)} kg / Woche`}</span>`;
}
function weightSparkHTML(){
  const w=sortedWeights().slice(-42);
  if(w.length<2)return `<p class="meta">Noch zu wenige Einträge für eine Kurve.</p>`;
  const vals=w.map(x=>x.kg),min=Math.min(...vals),max=Math.max(...vals);
  const span=Math.max(0.6,max-min),W=300,H=58;
  const pt=(v,i)=>[(i/(w.length-1))*W,H-4-((v-min)/span)*(H-10)];
  const d=vals.map((v,i)=>{const[x,y]=pt(v,i);return `${i?"L":"M"}${x.toFixed(1)} ${y.toFixed(1)}`;}).join(" ");
  const area=`${d} L${W} ${H} L0 ${H} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="color-mix(in srgb, var(--primary) 14%, transparent)"/>
    <path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <div style="display:flex;justify-content:space-between"><span class="meta">${esc(fmtDate(w[0].date))} · ${kgFmt(min)} kg</span>
    <span class="meta">${esc(fmtDate(w[w.length-1].date))} · ${kgFmt(vals[vals.length-1])} kg</span></div>`;
}

          </div>
        </div>
      </div>
    </div>
    <p class="meta" style="margin-top:20px">Geschätzter Tagesbedarf, keine medizinische Messung. Für die eigentliche Lebensmittelerfassung nutzt du Nutrilize — dieses Modul rechnet nur die Zielwerte.</p>
  </div>`;
}

const F_=()=>S.focus;

const fSessions=()=>F_().sessions||[];
const totalFocusMin=()=>fSessions().reduce((s,x)=>s+(x.actualMin||0),0);
function treeUnlocked(t){
  const done=fSessions().filter(s=>s.completed).length;
  const hrs=totalFocusMin()/60;
  if(t.unlock.sessions&&done<t.unlock.sessions)return false;
  if(t.unlock.hours&&hrs<t.unlock.hours)return false;
  return true;
}
function focusOn(dateKey){ return fSessions().filter(s=>s.date===dateKey); }
function focusMinutes(list){ return list.reduce((s,x)=>s+(x.actualMin||0),0); }
function focusStreak(){
  if(!F_().settings.streakEnabled)return 0;
  let n=0,d=berlinNow();
  if(!focusOn(dkey(d)).some(s=>s.completed))d=addDays(d,-1);
  for(let i=0;i<400;i++){
    if(focusOn(dkey(d)).some(s=>s.completed))n++; else break;
    d=addDays(d,-1);
  }
  return n;
}
function bestStreak(){
  const days=[...new Set(fSessions().filter(s=>s.completed).map(s=>s.date))].sort();
  let best=0,run=0,prev=null;
  days.forEach(d=>{
    run=(prev&&daysBetween(prev,d)===1)?run+1:1;
    best=Math.max(best,run);prev=d;
  });
  return best;
}
function focusRange(kind){
  const t=berlinNow();
  if(kind==="today")return fSessions().filter(s=>s.date===todayKey());
  if(kind==="week"){const a=dkey(startOfWeek(t));return fSessions().filter(s=>s.date>=a);}
  if(kind==="month"){const a=dkey(new Date(t.getFullYear(),t.getMonth(),1));return fSessions().filter(s=>s.date>=a);}
  return fSessions();
}
const fmtMin=m=>{const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`;};
const fmtClock=sec=>{const m=Math.floor(Math.abs(sec)/60),s=Math.abs(sec)%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;};

/* ---------- session lifecycle ---------- */
function focusElapsed(){
  const a=F_().active; if(!a)return 0;
  return Math.floor((Date.now()-a.startedAt)/1000);
}
function focusRemaining(){
  const a=F_().active; if(!a)return 0;
  return a.plannedMin*60-focusElapsed();
}
function startFocus(min,catId,taskId,title){
  F_().active={startedAt:Date.now(),plannedMin:min,category:catId,taskId:taskId||null,
    tree:F_().selectedTree,title:title||"",notified:false};
  F_().lastCategory=catId;F_().lastMinutes=min;
  save();render();
}
function finishFocus(actualMin,completed){
  const a=F_().active; if(!a)return null;
  const s={id:uid(),date:dkey(new Date(a.startedAt)),
    start:hhmm(new Date(a.startedAt).getHours()*60+new Date(a.startedAt).getMinutes()),
    end:hhmm(new Date().getHours()*60+new Date().getMinutes()),
    plannedMin:a.plannedMin,actualMin:Math.max(1,Math.round(actualMin)),
    category:a.category,taskId:a.taskId||null,tree:a.tree,completed:!!completed,
    title:a.title||"",notes:""};
  F_().sessions.unshift(s);
  if(completed)F_().trees.unshift({id:uid(),type:a.tree,createdAt:Date.now(),sessionId:s.id,
    category:a.category,season:seasonOf(new Date())});
  F_().active=null;save();
  return s;
}
function seasonOf(d){const m=d.getMonth();return m<2||m===11?"winter":m<5?"spring":m<8?"summer":"autumn";}
function chime(){
  if(!F_().settings.soundEnabled)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=new C();
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+i*0.16);
      g.gain.linearRampToValueAtTime(0.14,ctx.currentTime+i*0.16+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.16+0.9);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+i*0.16);o.stop(ctx.currentTime+i*0.16+1);
    });
    setTimeout(()=>ctx.close&&ctx.close(),2200);
  }catch(e){}
}
function completeFocus(){
  const a=F_().active; if(!a)return;
  const mins=Math.max(1,Math.round(focusElapsed()/60));
  const s=finishFocus(Math.min(mins,a.plannedMin),true);
  chime();render();

function ensureV4(st){
  ensureV3(st);
  if(!st.nutrition||!st.nutrition.profile)st.nutrition=defaultNutrition();
  const n=st.nutrition;
  n.weights=n.weights||[]; n.targetHistory=n.targetHistory||[];
  n.whoop={...defaultNutrition().whoop,...(n.whoop||{})};
  n.profile={...defaultNutrition().profile,...(n.profile||{})};
  if(!n.weights.length)n.weights.push({date:todayKey(),kg:n.profile.weight});

  if(!st.focus||!Array.isArray(st.focus.sessions))st.focus=defaultFocus();
  const f=st.focus;
  f.settings={...defaultFocus().settings,...(f.settings||{})};
  f.categories=f.categories?.length?f.categories:defaultFocus().categories;
  f.trees=f.trees||[]; f.sessions=f.sessions||[];
  if(!st.settings.blockTypes.some(b=>b.id==="focusrun"))
    st.settings.blockTypes.push({id:"focusrun",name:"Fokus-Einheit",color:"#14a07a"});
  if(st.settings.dayStart===6)st.settings.dayStart=9;   // Outlook-style default window
  return st;
}

/* ---------- ticking ---------- */
let focusTimer=null;
function startFocusTicker(){
  if(focusTimer)clearInterval(focusTimer);
  focusTimer=setInterval(()=>{
    const a=F_()?.active; if(!a)return;
    const left=focusRemaining(),total=a.plannedMin*60;
    const done=clamp(1-left/total,0,1);
    const el=$("#fTime");
    if(el){
      el.textContent=fmtClock(Math.max(0,left));
      if(left<=0&&!a.notified){a.notified=true;chime();render();}
    }
    const ring=$("#fRing");
    if(ring){const c=2*Math.PI*48;ring.setAttribute("stroke-dashoffset",(c*(1-done)).toFixed(1));}
    const tree=$("#fTree");
    if(tree){const s=(0.22+0.78*Math.pow(done,0.7)).toFixed(3);
      tree.style.transform=`translate(100px,196px) scale(${s}) translate(-100px,-196px)`;
      tree.style.opacity=(0.45+0.55*done).toFixed(2);}
  },1000);
}
async function boot(){
  installManifest();
  await syncLoadCreds();
  try{const buf=await idbGet("state"); if(buf&&buf.schemaVersion)S=migrate(buf);}catch(e){}
  ensureV4(S); applyTheme();
  await restoreHandle();
  ensureV4(S);
  render(); startClock(); startFocusTicker(); loadWeather();
  if(syncOn()){setSyncState("idle");await syncPull();}
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener?.("change",()=>{if((S.settings.theme||"auto")==="auto")applyTheme();});
  }
  let rt=null;
  window.addEventListener("resize",()=>{
    clearTimeout(rt);
    rt=setTimeout(()=>{if(route.view==="calendar"&&calView!=="month")render();},250);
  });
}

document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);

  /* calendar */
  if(hit("[data-calwin]")){calWindowDlg();return;}
  const vb=hit("[data-vblk]");
  if(vb){go(vb.dataset.vblk==="focus"?"focus":"cleaning");return;}

  /* focus */
  const ft=hit("[data-ftab]"); if(ft){focusTab=ft.dataset.ftab;render();return;}
  const fd=hit("[data-fdur]"); if(fd){focusCustom=+fd.dataset.fdur;F_().lastMinutes=focusCustom;save();render();return;}
  if(hit("[data-fcustom]")){customDurDlg();return;}
  const fc=hit("[data-fcat]"); if(fc){F_().lastCategory=fc.dataset.fcat;save();render();return;}
  const fr=hit("[data-ftree]"); if(fr){F_().selectedTree=fr.dataset.ftree;save();render();return;}
  if(hit("[data-fsettings]")){focusSettingsDlg();return;}
  if(hit("[data-fstop]")){abandonDlg();return;}
  if(hit("[data-fdone]")){completeFocus();return;}
  if(hit("[data-fquick]")){
    startFocus(F_().lastMinutes||45,F_().lastCategory,null,"");
    go("focus");return;}
  if(hit("[data-fstart]")){
    const min=focusCustom??F_().lastMinutes??45;
    const taskId=$("[data-ftask]")?.value||null;
    const title=$("#fTitle")?.value?.trim()
      ||(taskId?S.tasks.find(t=>t.id===taskId)?.title:"")||"";
    startFocus(min,F_().lastCategory,taskId,title);return;}

  /* nutrition */
  const ng=hit("[data-ngoal]");
  if(ng){N_().goal=ng.dataset.ngoal;
    const r=RATES[N_().goal]||RATES.maintain;
    if(!r.some(x=>x.id===N_().rate))N_().rate=r[0].id;
    snapshotTarget();save();render();return;}
  const nr=hit("[data-nrate]"); if(nr){N_().rate=nr.dataset.nrate;snapshotTarget();save();render();return;}
  const nd=hit("[data-ndiet]");
  if(nd){N_().dietMode=nd.dataset.ndiet;
    if(nd.dataset.ndiet==="custom"&&!N_().customSplit)N_().customSplit={carb:0.6};
    save();render();return;}
  const nday=hit("[data-nday]"); if(nday){N_().dayType=nday.dataset.nday;save();render();return;}
  if(hit("[data-nweigh]")){weighInDlg();return;}
  if(hit("[data-nsaveweight]")){
    const v=+$("#wQuick")?.value;
    if(!v||v<25||v>350){toast("Bitte ein realistisches Gewicht eintragen.");return;}
    addWeight(+v.toFixed(1));render();toast("Ziel aktualisiert.");return;}
  if(hit("[data-nhistory]")){targetHistoryDlg();return;}
  if(hit("[data-nprofile]")){nutriProfileDlg();return;}
  if(hit("[data-nhow]")){S.settings.nutriHow=!S.settings.nutriHow;save();render();return;}
},false);

document.addEventListener("input",e=>{

  const live=(sel,txt)=>{const el=t.closest(".sliderrow")?.querySelector(sel);if(el)el.textContent=txt;};

    return;}

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("[data-nprot]")){N_().proteinPerKg=+t.value;N_().proteinOverride=null;snapshotTarget();save();render();return;}
  if(t.matches("[data-ncarb]")){
    const share=clamp(+t.value/100,0,1);
    if(N_().dietMode!=="custom"){N_().dietMode="custom";}
    N_().customSplit={carb:share};save();render();return;}
  if(t.matches("[data-nwweight]")){N_().whoop.weight=clamp(+t.value/100,0,1);save();render();return;}
  if(t.matches("[data-nfactor]")){N_().adjustFactor=clamp(+t.value/100,0,1);save();render();return;}
  if(t.matches("[data-nwhoop]")){N_().whoop.enabled=t.checked;save();render();return;}
  if(t.matches("[data-nauto]")){N_().autoAdjust=t.checked;save();render();return;}
  if(t.matches("[data-nintake]")){N_().intakeAvg=t.value?+t.value:null;save();render();return;}
  if(t.matches("[data-nw]")){
    const k=t.dataset.nw;N_().whoop[k]=t.value===""?null:+t.value;save();
    if(k!=="todayBurn")render();return;}
},false);

/* ============================================================
   COVER LIBRARY
   Drawn here, not fetched. Every cover is a few kilobytes of
   SVG, so the state stays small and the sync stays fast.

const svgURL=(inner,defs="")=>"data:image/svg+xml,"+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${inner}</svg>`);
const lg=(id,stops,x2=0,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${
  stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</linearGradient>`;
const rg=(id,stops,cx=.5,cy=.5,r=.7)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${
  stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</radialGradient>`;
const bg=id=>`<rect width="1600" height="600" fill="url(#${id})"/>`;
const hill=(d,f,o=1)=>`<path d="${d}" fill="${f}" opacity="${o}"/>`;

function coverHills(sky,cols,sun){
  const defs=lg("s",sky)+(sun?rg("sun",[[0,sun[0]],[1,sun[1]]],.72,.42,.36):"");
  let inner=bg("s");
  if(sun)inner+=`<circle cx="1150" cy="250" r="230" fill="url(#sun)"/><circle cx="1150" cy="250" r="78" fill="${sun[2]}"/>`;
  const paths=[
    "M0 400 C260 330 420 430 640 388 C880 342 1040 420 1600 352 L1600 600 L0 600 Z",
    "M0 452 C220 402 460 486 720 446 C980 406 1240 470 1600 424 L1600 600 L0 600 Z",
    "M0 512 C300 474 520 546 840 510 C1120 478 1340 528 1600 498 L1600 600 L0 600 Z"];
  cols.forEach((c,i)=>{inner+=hill(paths[i],c);});
  return svgURL(inner,defs);
}
function coverPeaks(sky,rock,snow){
  const defs=lg("s",sky);
  let inner=bg("s");
  inner+=`<path d="M0 600 L300 250 L470 420 L640 200 L900 600 Z" fill="${rock[0]}"/>`;
  inner+=`<path d="M640 200 L720 320 L660 330 L600 300 Z" fill="${snow}"/>`;
  inner+=`<path d="M300 250 L370 350 L320 356 L262 322 Z" fill="${snow}" opacity=".85"/>`;
  inner+=`<path d="M700 600 L1010 300 L1200 470 L1340 330 L1600 600 Z" fill="${rock[1]}"/>`;
  inner+=`<path d="M1010 300 L1078 396 L1020 404 L968 372 Z" fill="${snow}" opacity=".75"/>`;
  inner+=`<path d="M0 600 C300 520 620 566 960 522 C1240 486 1420 534 1600 508 L1600 600 Z" fill="${rock[2]}"/>`;
  return svgURL(inner,defs);
}
function coverForest(sky,cols){
  const defs=lg("s",sky);
  let inner=bg("s");
  const band=(y,c,s,n,o)=>{
    let p="";
    for(let i=0;i<n;i++){
      const x=(i+0.5)*(1600/n)+((i*97)%40)-20;
      const h=s*(0.8+((i*53)%40)/100);
      p+=`<path d="M${x} ${y-h} L${x+s*0.42} ${y} L${x-s*0.42} ${y} Z"/>`;
      p+=`<path d="M${x} ${y-h*1.34} L${x+s*0.30} ${y-h*0.45} L${x-s*0.30} ${y-h*0.45} Z"/>`;
    }
    return `<g fill="${c}" opacity="${o}">${p}</g>`;
  };
  inner+=`<path d="M0 430 C280 400 500 452 820 420 C1120 392 1360 434 1600 410 L1600 600 L0 600 Z" fill="${cols[0]}" opacity=".55"/>`;
  inner+=band(470,cols[1],110,14,.75)+band(540,cols[2],150,11,.9)+band(610,cols[3],200,8,1);
  return svgURL(inner,defs);
}
function coverWaves(sky,cols){
  const defs=lg("s",sky);
  let inner=bg("s");
  cols.forEach((c,i)=>{
    const y=330+i*62;
    inner+=`<path d="M0 ${y} C200 ${y-40} 360 ${y+40} 560 ${y} C760 ${y-40} 940 ${y+38} 1140 ${y}
      C1330 ${y-36} 1460 ${y+30} 1600 ${y-6} L1600 600 L0 600 Z" fill="${c}" opacity="${0.55+i*0.15}"/>`;
  });
  return svgURL(inner,defs);
}
function coverDunes(sky,cols){
  const defs=lg("s",sky)+rg("sun",[[0,"#ffe2b0"],[1,"rgba(255,226,176,0)"]],.28,.32,.4);
  let inner=bg("s")+`<circle cx="448" cy="192" r="240" fill="url(#sun)"/><circle cx="448" cy="192" r="66" fill="#ffd89a"/>`;
  cols.forEach((c,i)=>{
    const y=360+i*70;
    inner+=`<path d="M0 ${y+30} C320 ${y-60} 620 ${y+50} 980 ${y-10} C1260 ${y-56} 1420 ${y+16} 1600 ${y-24} L1600 600 L0 600 Z" fill="${c}"/>`;
  });
  return svgURL(inner,defs);
}
function coverAurora(base,bands){
  const defs=lg("s",base)+bands.map((b,i)=>lg("a"+i,[[0,b+"00"],[.4,b+"cc"],[1,b+"00"]],1,0)).join("");
  let inner=bg("s");
  bands.forEach((b,i)=>{
    const y=150+i*70;
    inner+=`<path d="M-100 ${y} C260 ${y-110} 560 ${y+90} 900 ${y-40} C1220 ${y-150} 1460 ${y+50} 1700 ${y-30}
      L1700 ${y+96} C1460 ${y+146} 1220 ${y+46} 900 ${y+60} C560 ${y+186} 260 ${y-10} -100 ${y+100} Z"
      fill="url(#a${i})" opacity=".7"/>`;
  });
  for(let i=0;i<60;i++){
    const x=(i*271)%1600,y=(i*163)%420,r=((i*37)%14)/10+0.6;
    inner+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${0.25+((i*17)%40)/120}"/>`;
  }
  inner+=`<path d="M0 486 C340 450 640 508 980 470 C1280 436 1420 486 1600 458 L1600 600 L0 600 Z" fill="#0d1a24"/>`;
  return svgURL(inner,defs);
}
function coverMesh(cols){
  const defs=cols.map((c,i)=>rg("m"+i,[[0,c+"e6"],[1,c+"00"]])).join("")+lg("s",[[0,"#f7faf8"],[1,"#eef3f0"]]);
  let inner=bg("s");
  const pos=[[.18,.22,.55],[.78,.18,.5],[.52,.78,.6],[.1,.82,.45],[.92,.7,.5]];
  cols.forEach((c,i)=>{const[p,q,r]=pos[i%pos.length];
    inner+=`<ellipse cx="${p*1600}" cy="${q*600}" rx="${r*820}" ry="${r*560}" fill="url(#m${i})"/>`;});
  return svgURL(inner,defs);
}
function coverTopo(base,line){
  const defs=lg("s",base);
  let inner=bg("s");
  for(let i=0;i<16;i++){
    const k=i*34, o=0.10+(i%4)*0.06;
    inner+=`<path d="M-60 ${120+k} C280 ${40+k} 520 ${210+k} 860 ${130+k} C1160 ${58+k} 1400 ${188+k} 1660 ${112+k}"
      stroke="${line}" stroke-width="${i%4===0?2.6:1.4}" fill="none" opacity="${o}"/>`;
  }
  return svgURL(inner,defs);
}
function coverRays(base,ray,dot){
  const defs=rg("s",[[0,base[0]],[1,base[1]]],.5,.62,.85);
  let inner=bg("s");
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2, x=800+Math.cos(a)*1500, y=380+Math.sin(a)*1500;
    inner+=`<path d="M800 380 L${x.toFixed(0)} ${y.toFixed(0)} L${(800+Math.cos(a+0.07)*1500).toFixed(0)} ${(380+Math.sin(a+0.07)*1500).toFixed(0)} Z"
      fill="${ray}" opacity="${i%2?0.05:0.1}"/>`;
  }
  inner+=`<circle cx="800" cy="380" r="150" fill="${dot}" opacity=".9"/>`;
  inner+=`<circle cx="800" cy="380" r="220" fill="none" stroke="${dot}" stroke-width="2" opacity=".35"/>`;
  inner+=`<circle cx="800" cy="380" r="300" fill="none" stroke="${dot}" stroke-width="2" opacity=".18"/>`;
  return svgURL(inner,defs);
}
function coverGrid(base,line,glow){
  const defs=lg("s",base)+rg("g",[[0,glow+"aa"],[1,glow+"00"]],.5,.3,.5);
  let inner=bg("s")+`<rect width="1600" height="600" fill="url(#g)"/>`;
  for(let i=0;i<=20;i++){
    const x=800+(i-10)*260;
    inner+=`<path d="M${x} 600 L${800+(i-10)*36} 300" stroke="${line}" stroke-width="1.6" opacity=".3"/>`;
  }
  for(let i=0;i<14;i++){
    const y=300+Math.pow(i/13,2.1)*300;
    inner+=`<path d="M0 ${y.toFixed(1)} L1600 ${y.toFixed(1)}" stroke="${line}" stroke-width="1.6" opacity="${(0.12+i*0.03).toFixed(2)}"/>`;
  }
  return svgURL(inner,defs);
}
function coverField(sky,cols){
  const defs=lg("s",sky);
  let inner=bg("s");
  inner+=`<circle cx="1230" cy="200" r="72" fill="#ffe6a8" opacity=".95"/>`;

  inner+=`<path d="M0 460 C280 430 560 486 880 456 C1180 428 1400 466 1600 446 L1600 600 L0 600 Z" fill="${cols[1]}"/>`;

const coverById=id=>COVERS.find(c=>c.id===id);
const _coverCache={};
function coverSrc(id){

/* ============================================================
   HERO COVERS — library, own upload, own URL, and a Notion-style
   vertical reposition.
   ============================================================ */
function heroVal(key){
  const h=S.settings.heroes?.[key];
  if(!h)return null;
  if(typeof h==="string")return{t:"u",src:h,pos:50};      // pre-v5 entries
  return{t:h.t||"u",id:h.id,src:h.src,pos:h.pos??50};
}
function heroSrc(key){
  const h=heroVal(key); if(!h)return null;
  return h.t==="b"?coverSrc(h.id):h.src;
}
function setHero(key,val){
  S.settings.heroes=S.settings.heroes||{};
  if(!val)delete S.settings.heroes[key]; else S.settings.heroes[key]=val;
  save();
}
let heroRepos=null;

function heroHTML(key,title,sub){
  const h=heroVal(key),src=heroSrc(key);
  const repos=heroRepos===key;
  return `<section class="hero ${src?"has-img":""} ${repos?"repos":""}" data-herokey="${key}">
    ${src?`<img class="hero-img" src="${src}" alt="" style="object-position:50% ${h.pos}%"
        onerror="this.closest('.hero').classList.add('broken')">`:""}
    ${src?`<div class="hero-scrim"></div>`:""}
    <div class="hero-broken">Dieses Bild ließ sich nicht laden. Prüfe den Link oder wähle ein anderes.</div>
    ${repos?`<div class="repos-bar">
        <span>${ic("image")}</span><span style="flex:1">Bild mit der Maus oder dem Finger nach oben und unten ziehen</span>
        <button class="btn sm" data-heroposdone>Fertig</button>
      </div>`:`
      <div class="hero-tools">
        <button class="btn sm" data-heropick="${key}">${ic("image")}<span>${src?"Ändern":"Titelbild"}</span></button>
        ${src?`<button class="btn sm" data-heropos="${key}">${ic("chevU")}<span>Position</span></button>`:""}
        ${src?`<button class="btn sm" data-heroDel="${key}" aria-label="Titelbild entfernen">${ic("trash")}</button>`:""}
      </div>`}
    <div class="hero-body"><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>

}

function heroPickDlg(key){
  const cur=heroVal(key);
  const groups=[...new Set(COVERS.map(c=>c.g))];
  let sel=cur?{...cur}:null;
  const tile=c=>`<button class="covertile ${sel?.t==="b"&&sel.id===c.id?"on":""}" data-cover="${c.id}" aria-label="${esc(c.n)}">

      </div>
      ${groups.map(g=>`<div class="sect-h" style="margin-bottom:10px"><h2 style="font-size:15px">${esc(g)}</h2></div>

        <div class="field"><label>Eigenes Foto</label>
          <button class="btn block" data-heroupload>${ic("upload")}<span>Vom Gerät wählen</span></button>
          <p class="meta" style="margin-top:7px;line-height:1.55">Wird als Bilddatei in deinen Daten gespeichert und ist damit auch auf dem iPhone da — macht die Datei aber deutlich größer.</p></div>
        <div class="field"><label>Bild-Link</label>
          <input class="inp" id="heroUrl" placeholder="https://images.unsplash.com/photo-…" value="${sel?.t==="u"&&!String(sel.src||"").startsWith("data:")?esc(sel.src):""}">
          <button class="btn sm ghost" style="margin-top:8px" data-herourl>Übernehmen</button>
          <p class="meta" style="margin-top:7px;line-height:1.55">Jede direkte Bildadresse funktioniert. Der Link wird gespeichert, nicht das Bild — bleibt klein, braucht aber Internet.</p></div>
      </div>`,
    footer:`${cur?`<button class="btn danger sm" data-heroclear aria-label="Entfernen">${ic("trash")}</button>`:""}
      <div class="sp"></div><button class="btn ghost" data-x>Abbrechen</button><button class="btn primary" data-ok>Übernehmen</button>`,
    onMount(o,close){
      const prev=o.querySelector("#heroPrev"),range=o.querySelector("#posRange"),pv=o.querySelector("#posVal");
      const draw=()=>{
        prev.classList.remove("broken");
        prev.innerHTML=(sel
          ?`<img src="${sel.t==="b"?coverSrc(sel.id):sel.src}" style="object-position:50% ${sel.pos}%"
             onerror="this.parentNode.classList.add('broken')">`
          :`<div class="nopreview">Noch kein Bild gewählt</div>`)
          +`<div class="prevbroken">Bild konnte nicht geladen werden</div>`;
        range.disabled=!sel; range.value=sel?.pos??50; pv.textContent=sel?.pos??50;
        o.querySelectorAll("[data-cover]").forEach(b=>
          b.classList.toggle("on",sel?.t==="b"&&sel.id===b.dataset.cover));
      };
      o.querySelectorAll("[data-cover]").forEach(b=>b.onclick=()=>{
        sel={t:"b",id:b.dataset.cover,pos:sel?.pos??50};draw();});
      range.oninput=()=>{if(!sel)return;sel.pos=+range.value;pv.textContent=range.value;
        const img=prev.querySelector("img"); if(img)img.style.objectPosition=`50% ${range.value}%`;};
      o.querySelector("[data-heroupload]").onclick=()=>pickImage(u=>{sel={t:"u",src:u,pos:sel?.pos??50};draw();},1800);
      o.querySelector("[data-herourl]").onclick=()=>{
        const v=o.querySelector("#heroUrl").value.trim();
        if(!/^https?:\/\//i.test(v)){toast("Bitte eine vollständige Adresse mit https:// einfügen.");return;}
        sel={t:"u",src:v,pos:sel?.pos??50};draw();};
      o.querySelector("[data-heroclear]")?.addEventListener("click",()=>{setHero(key,null);close();render();});
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-ok]").onclick=()=>{setHero(key,sel);close();render();};
      draw();
    }});
}

/* drag the hero image up and down, like Notion */
let heroDrag=null;
document.addEventListener("pointerdown",e=>{
  if(!heroRepos)return;
  if(!e.target||typeof e.target.closest!=="function")return;
  const hero=e.target.closest(".hero.repos"); if(!hero)return;
  if(e.target.closest(".repos-bar"))return;
  const h=heroVal(heroRepos); if(!h)return;
  e.preventDefault();
  heroDrag={key:heroRepos,startY:e.clientY,startPos:h.pos,h:hero.getBoundingClientRect().height,el:hero};
  hero.setPointerCapture?.(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  if(!heroDrag)return;
  const dy=e.clientY-heroDrag.startY;
  const pos=clamp(Math.round(heroDrag.startPos-(dy/Math.max(80,heroDrag.h))*120),0,100);
  const img=heroDrag.el.querySelector(".hero-img");
  if(img)img.style.objectPosition=`50% ${pos}%`;
  heroDrag.pos=pos;
});
document.addEventListener("pointerup",()=>{
  if(!heroDrag)return;
  if(heroDrag.pos!=null){
    const h=heroVal(heroDrag.key);
    if(h)setHero(heroDrag.key,{...h,pos:heroDrag.pos});
  }
  heroDrag=null;
});

/* ============================================================
   COURSES — modules, lessons, attachments
   ============================================================ */
function courseById(id){return S.growth.courses.find(c=>c.id===id);}
function ensureCourse(c){
  if(!Array.isArray(c.modules))c.modules=[];
  c.modules.forEach(m=>{if(!Array.isArray(m.lessons))m.lessons=[];
    m.lessons.forEach(l=>{if(!Array.isArray(l.files))l.files=[];});});
  return c;
}
function courseStats(c){
  ensureCourse(c);
  const lessons=c.modules.flatMap(m=>m.lessons);
  const done=lessons.filter(l=>l.done).length;
  const files=lessons.reduce((s,l)=>s+l.files.length,0);
  const bytes=lessons.reduce((s,l)=>s+l.files.reduce((a,f)=>a+(f.size||0),0),0);
  return{lessons:lessons.length,done,files,bytes,
    pct:lessons.length?done/lessons.length:(c.progress||0)/100};
}
const fmtBytes=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

function pickFile(cb,maxMB=8){
  const i=document.createElement("input");
  i.type="file";i.multiple=true;
  i.onchange=()=>{
    [...i.files].forEach(f=>{
      if(f.size>maxMB*1048576){toast(`${f.name} ist größer als ${maxMB} MB und wurde übersprungen.`);return;}
      const r=new FileReader();
      r.onload=()=>cb({id:uid(),name:f.name,mime:f.type||"application/octet-stream",size:f.size,data:r.result});
      r.readAsDataURL(f);
    });
  };
  i.click();
}
const _blobs={};
function fileURL(f){
  if(_blobs[f.id])return _blobs[f.id];
  try{
    const[m,b]=f.data.split(",");
    const mime=(m.match(/:(.*?);/)||[,f.mime])[1];
    const bin=atob(b),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return _blobs[f.id]=URL.createObjectURL(new Blob([u],{type:mime}));
  }catch(e){return f.data;}
}
function fileHTML(f){
  const isImg=/^image\//.test(f.mime);
  const isPdf=/pdf/.test(f.mime);
  const head=`<div class="fhead"><span class="fi">${ic(isImg?"image":isPdf?"note":"folder")}</span>
    <span class="fn">${esc(f.name)}</span><span class="meta">${fmtBytes(f.size)}</span>
    <a class="btn sm ghost" href="${fileURL(f)}" target="_blank" rel="noopener">Öffnen</a>
    <button class="iconbtn" data-filedel="${f.id}" aria-label="Datei entfernen">${ic("trash")}</button></div>`;
  if(isImg)return `<div class="fileitem">${head}<img class="fprev" src="${f.data}" alt="${esc(f.name)}"></div>`;
  if(isPdf)return `<div class="fileitem">${head}
    <iframe class="fpdf" src="${fileURL(f)}#toolbar=0&view=FitH" title="${esc(f.name)}" loading="lazy"></iframe></div>`;
  return `<div class="fileitem">${head}</div>`;
}

function syncCourseProgress(c){
  const st=courseStats(c);
  if(st.lessons){
    c.progress=Math.round(st.pct*100);
    if(c.progress===100)c.status="fertig";
    else if(c.progress>0&&c.status==="offen")c.status="laufend";
  }
}

function nextShoppingDate(){
  const d=berlinNow(),w=dowIdx(d);
  return w===0?todayKey():dkey(addDays(d,7-w));   // today if it is Monday, otherwise the next one
}
function ensureShoppingBlock(){
  let b=S.blocks.find(x=>x.title==="Einkaufen"&&x.recurrence&&(x.recurrence.days||[]).includes(0));
  if(!b){
    b={id:uid(),created:Date.now(),title:"Einkaufen",type:"personal",start:"20:00",end:"21:00",
      notes:"Wocheneinkauf",date:null,taskId:null,exceptions:{},
      recurrence:{freq:"weekly",days:[0],from:todayKey(),until:null}};
    S.blocks.push(b);
  }
  return b;
}
function shoppingTaskFor(due){
  return S.tasks.find(t=>t.status!=="done"&&t.due===due&&/^Einkaufen\b/.test(t.title));
}
function itemsOnList(){
  const t=shoppingTaskFor(nextShoppingDate());
  if(!t)return[];
  return (t.desc||"").split("\n").map(s=>s.replace(/^[-·•]\s*/,"").trim()).filter(Boolean);
}

/* capture phase: take over two actions the older handlers still own */
document.addEventListener("click",e=>{
  const co=e.target.closest("[data-course]");
  // the reorder controls sit inside the row and must not open the course
  if(co&&!e.target.closest("[data-cedit2],[data-cup],[data-cdn],[data-cgrip]")){
    e.stopPropagation();go("course",{id:co.dataset.course});return;
  }
},true);

document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);

  /* hero covers */
  const hp=hit("[data-heropick]"); if(hp){heroPickDlg(hp.dataset.heropick);return;}
  const hq=hit("[data-heropos]"); if(hq){heroRepos=hq.dataset.heropos;render();return;}
  if(hit("[data-heroposdone]")){heroRepos=null;render();return;}

  /* courses */
  if(hit("[data-gback]")){go("growth",{tab:"courses"});return;}
  const ce2=hit("[data-cedit2]"); if(ce2){e.stopPropagation();simpleDlg("courses",ce2.dataset.cedit2);return;}
  const cid=()=>route.params.id;
  if(hit("[data-modadd]")){moduleDlg(cid());return;}
  const mt=hit("[data-modtoggle]");
  if(mt&&!hit("[data-modedit]")&&!hit("[data-moddel]")){
    const m=courseById(cid())?.modules.find(x=>x.id===mt.dataset.modtoggle);
    if(m){m.open=m.open===false;save();render();}return;}
  const me=hit("[data-modedit]"); if(me){e.stopPropagation();moduleDlg(cid(),me.dataset.modedit);return;}
  const md=hit("[data-moddel]");
  if(md){e.stopPropagation();
    const c=courseById(cid()),m=c.modules.find(x=>x.id===md.dataset.moddel);
    confirmDlg("Bereich entfernen",`„${esc(m.title)}“ und ${m.lessons.length} Lektionen werden entfernt.`,"Entfernen",()=>{
      const i=c.modules.indexOf(m),copy=JSON.parse(JSON.stringify(m));
      c.modules.splice(i,1);syncCourseProgress(c);save();render();
      toast("Bereich entfernt.",()=>{c.modules.splice(i,0,copy);syncCourseProgress(c);save();render();});
    },true);return;}
  const la=hit("[data-lesadd]"); if(la){lessonDlg(cid(),la.dataset.lesadd);return;}
  const ld=hit("[data-lesdone]");
  if(ld){e.stopPropagation();
    const[mid,lid]=ld.dataset.lesdone.split("|");
    const c=courseById(cid()),m=c.modules.find(x=>x.id===mid),l=m?.lessons.find(x=>x.id===lid);
    if(l){l.done=!l.done;syncCourseProgress(c);save();render();}return;}
  const lt=hit("[data-lestoggle]");
  if(lt){const[mid,lid]=lt.dataset.lestoggle.split("|");
    const l=courseById(cid())?.modules.find(x=>x.id===mid)?.lessons.find(x=>x.id===lid);
    if(l){l.open=!l.open;save();render();}return;}
  const lr=hit("[data-lesrename]");
  if(lr){const[mid,lid]=lr.dataset.lesrename.split("|");lessonDlg(cid(),mid,lid);return;}
  const lf=hit("[data-lesfile]");
  if(lf){const[mid,lid]=lf.dataset.lesfile.split("|");
    const l=courseById(cid())?.modules.find(x=>x.id===mid)?.lessons.find(x=>x.id===lid);
    if(l)pickFile(f=>{l.files.push(f);save();render();toast(`${f.name} angehängt.`);});
    return;}
  const lx=hit("[data-lesdel]");
  if(lx){const[mid,lid]=lx.dataset.lesdel.split("|");
    const c=courseById(cid()),m=c.modules.find(x=>x.id===mid);
    const i=m.lessons.findIndex(x=>x.id===lid),copy=m.lessons[i];
    m.lessons.splice(i,1);syncCourseProgress(c);save();render();
    toast("Lektion entfernt.",()=>{m.lessons.splice(i,0,copy);syncCourseProgress(c);save();render();});
    return;}
  const fd=hit("[data-filedel]");
  if(fd){e.stopPropagation();
    const c=courseById(cid());
    c.modules.forEach(m=>m.lessons.forEach(l=>{
      const i=l.files.findIndex(f=>f.id===fd.dataset.filedel);
      if(i>=0){const copy=l.files[i];l.files.splice(i,1);save();render();
        toast("Datei entfernt.",()=>{l.files.splice(i,0,copy);save();render();});}
    }));return;}

  /* shopping */
  const sl=hit("[data-shop]"); if(sl){addToShoppingList([sl.dataset.shop]);return;}
  if(hit("[data-shopall]")){
    const low=C_().supplies.filter(s=>supplyStatus(s).k!=="ok").map(s=>s.name);
    if(!low.length){toast("Alles vorrätig.");return;}
    addToShoppingList(low);return;}
},false);

/* ============================================================

   A drawn scene behind the focus panel. Changes with the time
   of day, deterministic so it never jitters between renders.

function timeOfDay(h){
  const x=h??berlinNow().getHours();
  if(x>=5&&x<8)return"dawn";
  if(x>=8&&x<17)return"day";
  if(x>=17&&x<21)return"dusk";
  return"night";
}
const SKIES={
  dawn:{sky:[[0,"#ffe0bd"],[.42,"#ffbb96"],[1,"#e8a0ac"]],orb:"#fff3d4",orbGlow:"#ffd9a0",
    hills:["#cf94a4","#a3728f","#74537a"],pine:["#6a5182","#4d3a63"],
    fog:"rgba(255,242,232,.55)",spark:"#fff4d6",sparkN:0,starN:6,orbY:.46},
  day:{sky:[[0,"#d3ecf7"],[.45,"#aedbec"],[1,"#e4f2e8"]],orb:"#fffbe2",orbGlow:"#ffeeb0",
    hills:["#a9d6bb","#78bd99","#519f7c"],pine:["#4a9573","#347a5d"],
    fog:"rgba(255,255,255,.5)",spark:"#ffffff",sparkN:0,starN:0,orbY:.3},
  dusk:{sky:[[0,"#ffcf96"],[.4,"#f39a78"],[1,"#a76a92"]],orb:"#ffe7b4",orbGlow:"#ff9f6e",
    hills:["#93688c","#6d4c76","#48345e"],pine:["#3f2f53","#2b2140"],
    fog:"rgba(255,226,204,.42)",spark:"#ffd9a0",sparkN:9,starN:14,orbY:.58},
  night:{sky:[[0,"#15223a"],[.5,"#1f3050"],[1,"#2c4160"]],orb:"#eaf1ff",orbGlow:"#9fb6e0",
    hills:["#2c3d58","#223148","#18243a"],pine:["#142034","#0e1727"],
    fog:"rgba(176,200,232,.16)",spark:"#ffe9a8",sparkN:16,starN:52,orbY:.26}
};
const hsh=(i,m)=>Math.abs((i*2654435761)%m);

function pineBand(y,color,size,count,seed,opacity){
  let p="";
  for(let i=0;i<count;i++){
    const x=(i+0.5)*(1200/count)+hsh(i+seed,46)-23;
    const h=size*(0.72+hsh(i+seed*3,45)/100);
    const w=size*0.40;
    p+=`<path d="M${x.toFixed(0)} ${(y-h).toFixed(0)} L${(x+w).toFixed(0)} ${y} L${(x-w).toFixed(0)} ${y} Z"/>`;
    p+=`<path d="M${x.toFixed(0)} ${(y-h*1.36).toFixed(0)} L${(x+w*0.72).toFixed(0)} ${(y-h*0.46).toFixed(0)} L${(x-w*0.72).toFixed(0)} ${(y-h*0.46).toFixed(0)} Z"/>`;
  }
  return `<g fill="${color}" opacity="${opacity}">${p}</g>`;
}
function forestBackdrop(mood,strong){
  const P=SKIES[mood]||SKIES.day;
  const id="bd"+mood+(strong?"a":"b");
  let defs=`<linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1">${
    P.sky.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</linearGradient>
    <radialGradient id="glow${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="${P.orbGlow}" stop-opacity=".85"/>
      <stop offset="1" stop-color="${P.orbGlow}" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".62" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="1"/></linearGradient>
    <mask id="mask${id}"><rect width="1200" height="700" fill="url(#fade${id})"/></mask>`;

  const oy=700*P.orbY;
  let s=`<rect width="1200" height="700" fill="url(#sky${id})"/>`;

  // stars
  for(let i=0;i<P.starN;i++){
    const x=hsh(i+7,1180)+10,y=hsh(i+31,300)+12,r=(hsh(i+53,10)/10)*1.3+0.5;
    s+=`<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="#fff" opacity="${(0.25+hsh(i+11,50)/140).toFixed(2)}"/>`;
  }
  // sun or moon
  s+=`<circle cx="880" cy="${oy.toFixed(0)}" r="230" fill="url(#glow${id})"/>`;
  s+=`<circle cx="880" cy="${oy.toFixed(0)}" r="${mood==="night"?38:58}" fill="${P.orb}" opacity="${mood==="night"?.92:.95}"/>`;
  if(mood==="night")s+=`<circle cx="864" cy="${(oy-12).toFixed(0)}" r="34" fill="${P.sky[1][1]}" opacity=".9"/>`;

  // hills
  s+=`<path d="M0 392 C180 340 360 404 560 372 C760 340 940 392 1200 350 L1200 700 L0 700 Z" fill="${P.hills[0]}" opacity=".78"/>`;
  s+=pineBand(408,P.pine[0],52,22,5,.4);
  s+=`<path d="M0 452 C220 410 420 470 660 440 C880 412 1040 458 1200 430 L1200 700 L0 700 Z" fill="${P.hills[1]}" opacity=".9"/>`;
  s+=pineBand(474,P.pine[0],82,15,17,.6);
  s+=`<path d="M0 536 C240 500 460 560 720 528 C960 498 1080 540 1200 518 L1200 700 L0 700 Z" fill="${P.hills[2]}"/>`;
  s+=pineBand(566,P.pine[1],126,10,29,.85);

  // ground fog keeps the middle readable
  s+=`<ellipse cx="600" cy="500" rx="760" ry="86" fill="${P.fog}"/>`;
  s+=`<ellipse cx="300" cy="546" rx="420" ry="52" fill="${P.fog}" opacity=".7"/>`;
  s+=`<ellipse cx="950" cy="562" rx="380" ry="46" fill="${P.fog}" opacity=".6"/>`;

  // foreground bank with grass and two bushes
  s+=`<path d="M0 632 C200 606 420 646 700 622 C940 602 1080 630 1200 616 L1200 700 L0 700 Z" fill="${P.pine[1]}" opacity=".92"/>`;
  s+=`<ellipse cx="86" cy="640" rx="104" ry="46" fill="${P.pine[1]}"/>`;
  s+=`<ellipse cx="1128" cy="650" rx="118" ry="52" fill="${P.pine[1]}"/>`;
  let grass="";
  for(let i=0;i<72;i++){
    const x=hsh(i+3,1200),y=628+hsh(i+19,52),h=12+hsh(i+41,20);
    const d=(i%3)-1;
    grass+=`<path d="M${x} ${y} q${d*4} ${-h*0.6} ${d*8} ${-h}"/>`;
  }
  s+=`<g stroke="${P.pine[1]}" stroke-width="2.4" fill="none" opacity=".75" stroke-linecap="round">${grass}</g>`;

  // fireflies at dusk and night — never animated when the system asks for calm
  const calm=typeof window!=="undefined"&&window.matchMedia
    ?window.matchMedia("(prefers-reduced-motion: reduce)").matches:false;
  for(let i=0;i<P.sparkN;i++){
    const x=hsh(i+67,1140)+30,y=440+hsh(i+83,190),r=1.8+hsh(i+97,14)/10;

          begin="${(hsh(i+5,30)/10).toFixed(1)}s" repeatCount="indefinite"/>`}</circle>`;
  }
  s+=`<rect width="1200" height="700" fill="url(#fade${id})" opacity=".14"/>`;

  return `<div class="fbackdrop ${strong?"strong":""}" aria-hidden="true">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice"><defs>${defs}</defs>${s}</svg>
  </div>`;
}

/* ============================================================
   MEDIA OVERVIEW
   Everything embedded as image data travels with every sync.
   This makes that visible instead of letting it creep up.
   ============================================================ */
function mediaBreakdown(){
  const size=s=>s?new Blob([String(s)]).size:0;
  const rows=[];
  let heroes=0,heroCount=0,linked=0,builtin=0;
  Object.values(S.settings.heroes||{}).forEach(h=>{
    const v=typeof h==="string"?{t:"u",src:h}:h;
    if(v.t==="b"){builtin++;return;}
    if(String(v.src||"").startsWith("data:")){heroes+=size(v.src);heroCount++;}
    else linked++;
  });
  rows.push({k:"Titelbilder, eingebettet",n:heroCount,b:heroes});

  let rec=0,recN=0;
  S.recipes.forEach(r=>{if(String(r.img||"").startsWith("data:")){rec+=size(r.img);recN++;}});
  rows.push({k:"Rezeptfotos",n:recN,b:rec});

  let cov=0,covN=0;
  S.growth.books.forEach(b=>{if(String(b.cover||"").startsWith("data:")){cov+=size(b.cover);covN++;}});
  rows.push({k:"Buchcover",n:covN,b:cov});

  let files=0,fileN=0;
  (S.growth.courses||[]).forEach(c=>(c.modules||[]).forEach(m=>(m.lessons||[]).forEach(l=>
    (l.files||[]).forEach(f=>{files+=f.size||size(f.data);fileN++;}))));
  rows.push({k:"Kursdateien",n:fileN,b:files});

  const media=rows.reduce((s,r)=>s+r.b,0);
  const total=payloadSize();
  return{rows,media,total,text:total-media,builtin,linked};
}

const TASK_SORTS=[

  {id:"due",     n:"Fälligkeit",   get:t=>t.due?parseKey(t.due).getTime():Infinity, num:true},

  {id:"done",    n:"Erledigt am",  get:t=>t.completedAt||0,                  num:true}
];
const DUE_FILTERS=[["all","Alle"],["overdue","Überfällig"],["today","Heute"],
  ["week","Diese Woche"],["later","Später"],["none","Ohne Datum"]];

function taskViewDefaults(){
  return{view:"kanban",q:"",cat:"",prio:"",status:[],due:"all",tag:"",block:"all",
    sort:"created",dir:-1,open:false};
}
function TV(){
  if(!S.settings.taskView)S.settings.taskView={...taskViewDefaults()};
  else S.settings.taskView={...taskViewDefaults(),...S.settings.taskView};
  return S.settings.taskView;
}
function setTV(patch){ S.settings.taskView={...TV(),...patch}; save(); render(); }
function tvActiveCount(){
  const v=TV();
  return (v.cat?1:0)+(v.prio?1:0)+(v.status.length?1:0)+(v.due!=="all"?1:0)+(v.tag?1:0)+(v.block!=="all"?1:0);
}
function allTags(){
  const s=new Set();
  S.tasks.forEach(t=>(t.tags||[]).forEach(x=>s.add(x)));
  return [...s].sort((a,b)=>a.localeCompare(b,"de"));
}
function filteredTasks(){
  const v=TV(),q=v.q.trim().toLowerCase(),key=todayKey();
  const weekEnd=dkey(addDays(startOfWeek(berlinNow()),6));
  return S.tasks.filter(t=>{
    if(q&&!(t.title.toLowerCase().includes(q)||(t.desc||"").toLowerCase().includes(q)
      ||(t.tags||[]).some(x=>x.toLowerCase().includes(q))))return false;
    if(v.cat&&t.cat!==v.cat)return false;
    if(v.prio&&t.prio!==v.prio)return false;
    if(v.status.length&&!v.status.includes(t.status))return false;
    if(v.tag&&!(t.tags||[]).includes(v.tag))return false;
    if(v.block==="linked"&&!t.blockId)return false;
    if(v.block==="free"&&t.blockId)return false;
    if(v.due==="none"&&t.due)return false;
    if(v.due==="overdue"&&!(t.due&&t.due<key&&t.status!=="done"))return false;
    if(v.due==="today"&&t.due!==key)return false;
    if(v.due==="week"&&!(t.due&&t.due>=key&&t.due<=weekEnd))return false;
    if(v.due==="later"&&!(t.due&&t.due>weekEnd))return false;
    return true;
  });
}
function sortTasks(list){
  const v=TV(),s=TASK_SORTS.find(x=>x.id===v.sort)||TASK_SORTS[0];
  return [...list].sort((a,b)=>{
    const x=s.get(a),y=s.get(b);
    let r=s.num?(x-y):String(x).localeCompare(String(y),"de");
    if(!r)r=(b.created||0)-(a.created||0);
    return r*(v.dir||1);
  });
}
/** Lazily give every task in a column a position, so dragging can reorder. */
function ensureOrder(statusId){
  const col=S.tasks.filter(t=>t.status===statusId);
  if(!col.length||col.every(t=>typeof t.order==="number"))return false;
  col.sort((a,b)=>(a.order??Infinity)-(b.order??Infinity)
    ||prio(b.prio).rank-prio(a.prio).rank||(b.created||0)-(a.created||0))
    .forEach((t,i)=>{t.order=i;});
  return true;
}

function viewTasks(){

  if(changed)save();

  const total=S.tasks.length,done=S.tasks.filter(t=>t.status==="done").length;
  const pct=total?Math.round(done/total*100):0;

  let body="";
  if(v.view==="kanban"){
    body=`<div class="kb">${STATUSES.map(st=>{
      const items=colTasks(ts,st.id);
      const mins=items.reduce((s,t)=>s+(t.mins||0),0);
      return `<section class="kcol" data-col="${st.id}">
        <div class="kcol-h"><span class="dot" style="background:${st.color}"></span>

        ${rows.filter(t=>t.due&&t.due<todayKey()&&t.status!=="done").length
          ?` · <span style="color:var(--danger);font-weight:650">${rows.filter(t=>t.due&&t.due<todayKey()&&t.status!=="done").length} überfällig</span>`:""}
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th style="width:44px"></th>${th("title","Aufgabe")}
        ${th("cat","Bereich",'style="width:150px"')}${th("prio","Priorität",'style="width:112px"')}
        ${th("due","Fällig",'style="width:112px"')}${th("mins","Dauer",'style="width:84px"')}
        ${th("status","Status",'style="width:122px"')}</tr></thead>
        <tbody>${rows.map(t=>{
          const late=t.due&&t.due<todayKey()&&t.status!=="done",s=status(t.status);
          return `<tr data-task="${t.id}">
            <td><input type="checkbox" ${t.status==="done"?"checked":""} data-tdone="${t.id}" aria-label="Erledigt"></td>
            <td class="${t.status==="done"?"done-t":""}" style="font-weight:550">${esc(t.title)}
              ${(t.tags||[]).length?`<span class="meta" style="margin-left:7px">${(t.tags||[]).map(x=>"#"+esc(x)).join(" ")}</span>`:""}</td>
            <td>${catBadge(t.cat)||'<span class="meta">—</span>'}</td>
            <td>${prioPill(t.prio)}</td>

          </tr>`;}).join("")}</tbody></table></div>`
      :emptyHTML("tasks",tvActiveCount()||v.q?"Kein Treffer.":v.view==="done"?"Noch nichts abgehakt.":"Hier ist gerade nichts.",
        tvActiveCount()||v.q?`<button class="btn primary" data-tvreset>Filter zurücksetzen</button>`
          :`<button class="btn primary" data-q2="task">Aufgabe anlegen</button>`,

  }

    ${heroHTML("tasks","Aufgaben",`${total-done} offen · ${pct} % erledigt`)}

/* ---------- board: drag with a visible drop position ---------- */
function bindKanban(){
  let dragId=null,line=null;
  const clearLine=()=>{if(line&&line.parentNode)line.remove();line=null;};
  $$(".tcard").forEach(c=>{
    c.addEventListener("dragstart",e=>{
      dragId=c.dataset.task;c.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",dragId);}catch(err){}
    });
    c.addEventListener("dragend",()=>{
      c.classList.remove("dragging");dragId=null;clearLine();
      $$(".kcol").forEach(k=>k.classList.remove("over"));
    });
  });
  $$("[data-drop]").forEach(z=>{
    const col=z.closest(".kcol");
    const posFor=y=>{
      const cards=[...z.querySelectorAll(".tcard:not(.dragging)")];
      let i=cards.length;
      for(let k=0;k<cards.length;k++){
        const r=cards[k].getBoundingClientRect();
        if(y<r.top+r.height/2){i=k;break;}
      }
      return{i,cards};
    };
    z.addEventListener("dragover",e=>{
      e.preventDefault();col.classList.add("over");
      if(!line){line=document.createElement("div");line.className="dropline";}
      const{i,cards}=posFor(e.clientY);
      if(i>=cards.length)z.appendChild(line); else z.insertBefore(line,cards[i]);
    });
    z.addEventListener("dragleave",e=>{
      if(z.contains(e.relatedTarget))return;
      col.classList.remove("over");clearLine();
    });
    z.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("over");
      const id=dragId||(()=>{try{return e.dataTransfer.getData("text/plain");}catch(err){return null;}})();
      const{i}=posFor(e.clientY);
      clearLine();
      if(!id)return;
      const t=S.tasks.find(x=>x.id===id);if(!t)return;
      const to=z.dataset.drop;
      const wasStatus=t.status,wasOrder=t.order,wasDone=t.completedAt;
      const rest=S.tasks.filter(x=>x.status===to&&x.id!==id).sort((a,b)=>(a.order??1e9)-(b.order??1e9));
      rest.splice(clamp(i,0,rest.length),0,t);
      t.status=to;
      t.completedAt=to==="done"?(t.completedAt||Date.now()):null;
      rest.forEach((x,k)=>{x.order=k;});
      if(wasStatus!==to)ensureOrder(wasStatus);
      save();render();
      if(wasStatus!==to&&to==="done")
        toast("Erledigt.",()=>{t.status=wasStatus;t.order=wasOrder;t.completedAt=wasDone;save();render();});
    });
  });
  $$("[data-quick]").forEach(inp=>{
    inp.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||!inp.value.trim())return;
      const st=inp.dataset.quick;
      const min=Math.min(0,...S.tasks.filter(x=>x.status===st).map(x=>x.order??0));
      S.tasks.unshift({id:uid(),created:Date.now(),title:inp.value.trim(),desc:"",
        status:st,cat:TV().cat||"",prio:"medium",due:TV().due==="today"?todayKey():"",
        mins:0,tags:TV().tag?[TV().tag]:[],order:min-1,
        completedAt:st==="done"?Date.now():null});
      inp.value="";save();render();
    });
  });
  const tq=$("#tq");
  if(tq)tq.addEventListener("input",debounce(()=>{
    const p=tq.selectionStart;
    S.settings.taskView={...TV(),q:tq.value};save();render();
    const n=$("#tq");if(n){n.focus();n.setSelectionRange(p,p);}
  },260));
}

  const tv=hit("[data-tv]"); if(tv){setTV({view:tv.dataset.tv});return;}
  if(hit("[data-tvopen]")){setTV({open:!TV().open});return;}
  if(hit("[data-tvdir]")){setTV({dir:TV().dir===1?-1:1});return;}
  if(hit("[data-tvreset]")){
    const v=TV();S.settings.taskView={...taskViewDefaults(),view:v.view,sort:v.sort,dir:v.dir};
    save();render();return;}
  const tc=hit("[data-tvclear]");
  if(tc){const k=tc.dataset.tvclear;
    setTV({[k]:k==="status"?[]:(k==="due"||k==="block")?"all":""});return;}
  const ss=hit("[data-tvstatus]");
  if(ss){const id=ss.dataset.tvstatus,cur=TV().status;
    setTV({status:cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]});return;}
  const sd=hit("[data-tvdue]"); if(sd){setTV({due:sd.dataset.tvdue});return;}
  const sb=hit("[data-tvblock]"); if(sb){setTV({block:sb.dataset.tvblock});return;}
  const s2=hit("[data-tvsort2]");
  if(s2){const id=s2.dataset.tvsort2;
    setTV(TV().sort===id?{dir:TV().dir===1?-1:1}:{sort:id,dir:id==="title"||id==="cat"?1:-1});return;}
},false);

  if(t.matches("[data-tvsort]")){setTV({sort:t.value});return;}
  if(t.matches("[data-tvcat]")){setTV({cat:t.value});return;}
  if(t.matches("[data-tvprio]")){setTV({prio:t.value});return;}
  if(t.matches("[data-tvtag]")){setTV({tag:t.value});return;}
},false);

/* stable ids derived from the name, so the catalog can grow without breaking lists */
const shopSlug=n=>"i_"+n.toLowerCase().replace(/[^a-z0-9äöüß]+/g,"_").replace(/^_|_$/g,"");

const SHOP_INDEX={};
SHOP_CATS.forEach(c=>c.items.forEach(it=>{SHOP_INDEX[it.id]=it;}));
const catOf=id=>SHOP_CATS.find(c=>c.id===id)||SHOP_CATS[0];

/* ============================================================
   SHOPPING — engine and views
   Tap a tile to put it in the basket, tap again for ×2, ×3 …
   The minus on the tile counts back down.
   ============================================================ */
function defaultShop(){
  return{list:{},custom:[],history:{},open:{oft:true,vorrat:false,haushalt:false},
    q:"",lastDone:null,onlyList:false};
}
const SH=()=>S.shop;
function shopItem(id){
  return SHOP_INDEX[id]||(SH().custom||[]).find(c=>c.id===id)
    ||{id,n:id.replace(/^i_/,"").replace(/_/g," "),e:"🛒",cat:"custom"};
}
const shopEntries=()=>Object.entries(SH().list||{})
  .map(([id,v])=>({...v,id,item:shopItem(id)}))
  .sort((a,b)=>(a.done-b.done)||(a.at-b.at));
const shopQty=id=>SH().list?.[id]?.qty||0;
const shopOpen=()=>shopEntries().filter(e=>!e.done);
const shopTotal=()=>shopEntries().reduce((s,e)=>s+e.qty,0);

function shopAdd(id,n=1){
  const L=SH().list;
  if(!L[id])L[id]={qty:0,done:false,at:Date.now()};
  L[id].qty+=n;
  if(L[id].done&&n>0)L[id].done=false;
  save();
}
function shopSub(id){
  const L=SH().list;
  if(!L[id])return;
  L[id].qty-=1;
  if(L[id].qty<=0)delete L[id];
  save();
}
function shopRemove(id){ delete SH().list[id]; save(); }
function shopToggleDone(id){
  const e=SH().list[id]; if(!e)return;
  e.done=!e.done; save();
}
function shopFinish(){
  const H=SH().history;
  Object.keys(SH().list).forEach(id=>{H[id]=(H[id]||0)+1;});
  SH().list={}; SH().lastDone=new Date().toISOString();
  save();render();
  toast("Einkauf abgeschlossen. Die Liste ist wieder leer.");
}
function shopAddCustom(name,emoji,catId){
  const n=name.trim(); if(!n)return null;
  const id=shopSlug(n);
  if(!SHOP_INDEX[id]&&!SH().custom.some(c=>c.id===id))
    SH().custom.push({id,n,e:emoji||"🛒",cat:catId||"custom",custom:true});
  shopAdd(id);
  return id;
}
/** used by the supplies shortcut so there is only ever one shopping list */
function shopAddByName(name){
  const id=shopSlug(name);
  if(SHOP_INDEX[id]||SH().custom.some(c=>c.id===id))shopAdd(id);
  else shopAddCustom(name,"🛒","custom");
  return id;
}
function shopMatches(q){
  if(!q)return null;
  const s=q.trim().toLowerCase();
  const all=[...Object.values(SHOP_INDEX),...(SH().custom||[])];
  return all.filter(it=>it.n.toLowerCase().includes(s));
}

/* ---------- date helpers ---------- */
function bdNext(p,from){
  const base=from?parseKey(from):berlinNow();
  const y=base.getFullYear();
  let d=new Date(y,p.month-1,p.day);
  if(dkey(d)<dkey(base))d=new Date(y+1,p.month-1,p.day);
  return dkey(d);
}
const bdDaysAway=p=>daysBetween(todayKey(),bdNext(p));
function bdAge(p,key){
  if(!p.year)return null;
  const d=key?parseKey(key):parseKey(bdNext(p));
  return d.getFullYear()-p.year;
}
const birthdaysOn=key=>{
  const d=parseKey(key);
  return BD().filter(p=>p.day===d.getDate()&&p.month===d.getMonth()+1);
};
function bdUpcoming(n=6){
  return [...BD()].sort((a,b)=>bdDaysAway(a)-bdDaysAway(b)).slice(0,n);
}

/* ---------- holidays ---------- */
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
const _hdCache={};
function holidaysOfYear(y){
  if(_hdCache[y])return _hdCache[y];
  const E=easterSunday(y),off=n=>dkey(addDays(E,n));
  const fix=(d,m)=>dkey(new Date(y,m-1,d));
  // Buß- und Bettag: the Wednesday before 23 November
  let bb=new Date(y,10,22);
  while(bb.getDay()!==3)bb=addDays(bb,-1);
  const H=[
    {k:"neujahr",   n:"Neujahr",                    d:fix(1,1),   berlin:true},
    {k:"frauentag", n:"Internationaler Frauentag",  d:fix(8,3),   berlin:true, only:"Berlin"},
    {k:"karfreitag",n:"Karfreitag",                 d:off(-2),    berlin:true},
    {k:"ostermontag",n:"Ostermontag",               d:off(1),     berlin:true},
    {k:"maifeiertag",n:"Tag der Arbeit",            d:fix(1,5),   berlin:true},
    {k:"himmelfahrt",n:"Christi Himmelfahrt",       d:off(39),    berlin:true},
    {k:"pfingstmontag",n:"Pfingstmontag",           d:off(50),    berlin:true},
    {k:"einheit",   n:"Tag der Deutschen Einheit",  d:fix(3,10),  berlin:true},
    {k:"weihnacht1",n:"1. Weihnachtstag",           d:fix(25,12), berlin:true},
    {k:"weihnacht2",n:"2. Weihnachtstag",           d:fix(26,12), berlin:true},

    {k:"dreikoenig",n:"Heilige Drei Könige",        d:fix(6,1),   berlin:false, only:"BW, BY, ST"},
    {k:"ostersonntag",n:"Ostersonntag",             d:off(0),     berlin:false, only:"BB"},
    {k:"pfingstsonntag",n:"Pfingstsonntag",         d:off(49),    berlin:false, only:"BB"},
    {k:"fronleichnam",n:"Fronleichnam",             d:off(60),    berlin:false, only:"BW, BY, HE, NW, RP, SL"},
    {k:"himmelfahrtmaria",n:"Mariä Himmelfahrt",    d:fix(15,8),  berlin:false, only:"BY teilweise, SL"},
    {k:"weltkindertag",n:"Weltkindertag",           d:fix(20,9),  berlin:false, only:"TH"},
    {k:"reformation",n:"Reformationstag",           d:fix(31,10), berlin:false, only:"BB, HB, HH, MV, NI, SH, SN, ST, TH"},
    {k:"allerheiligen",n:"Allerheiligen",           d:fix(1,11),  berlin:false, only:"BW, BY, NW, RP, SL"},
    {k:"bussbettag",n:"Buß- und Bettag",            d:dkey(bb),   berlin:false, only:"SN"}
  ];
  return _hdCache[y]=H;
}
const holidaysOn=key=>{
  if(S.settings.showHolidays===false)return[];
  const y=parseKey(key).getFullYear();
  return holidaysOfYear(y).filter(h=>h.d===key
    &&(h.berlin||S.settings.showOtherHolidays!==false));
};
function holidaysUpcoming(n=4){
  const y=berlinNow().getFullYear();
  const all=[...holidaysOfYear(y),...holidaysOfYear(y+1)]
    .filter(h=>h.d>=todayKey()&&(h.berlin||S.settings.showOtherHolidays!==false));
  return all.sort((a,b)=>a.d.localeCompare(b.d)).slice(0,n);
}

/* ---------- all-day layer ---------- */
function allDayFor(key){
  const out=[];
  S.blocks.forEach(b=>{
    if(!b.allDay)return;
    const o=occursOn(b,key);
    if(o)out.push({...o,kind:"event",color:btype(o.type).color});
  });
  birthdaysOn(key).forEach(p=>{
    const age=bdAge(p,key);
    out.push({id:"__bd_"+p.id,kind:"birthday",personId:p.id,color:BD_COLOR,
      title:`🎂 ${p.name}${age!=null?` · ${age}`:""}`});
  });
  holidaysOn(key).forEach(h=>{
    out.push({id:"__hd_"+h.k,kind:"holiday",color:h.berlin?HD_BERLIN:HD_OTHER,
      berlin:h.berlin,only:h.only||"",title:h.n});
  });
  return out;
}

/* ============================================================
   CALENDAR — all-day layer
   All-day entries never occupy a time slot. They sit in a slim
   band under the weekday headers, the way Outlook does it.
   ============================================================ */
function occursOn(b,key){
  const ex=b.exceptions&&b.exceptions[key];
  if(ex&&ex.deleted)return null;
  let base=null;
  if(b.date){ if(b.date===key)base={...b}; }
  else if(b.recurrence){
    const r=b.recurrence,d=parseKey(key);
    if(r.from&&key<r.from)return null;
    if(r.until&&key>r.until)return null;
    if(r.freq==="daily")base={...b};
    else if(r.freq==="weekly"&&(r.days||[]).includes(dowIdx(d)))base={...b};
    else if(r.freq==="yearly"&&d.getDate()===r.day&&d.getMonth()+1===r.month)base={...b};
    else if(r.freq==="monthly"&&d.getDate()===r.day)base={...b};
  }
  if(!base)return null;
  if(ex)base={...base,...ex};
  return {...base,id:b.id,key,occKey:b.id+"@"+key,isException:!!ex,hasSeries:!b.date};
}
/** timed entries only — all-day lives in allDayFor() */
function blocksFor(key){
  const real=S.blocks.filter(b=>!b.allDay).map(b=>occursOn(b,key)).filter(Boolean);
  const C=S.cleaning;
  if(C&&C.enabled&&cleanSessionOn(key)){
    const mins=Math.max(60,Math.ceil(tasksForSession(key).reduce((s,t)=>s+(t.mins||0),0)/2/15)*15);
    const p=cleanProgress(key);
    real.push({id:"__clean",key,virtual:true,vkind:"clean",type:"cleaning",
      title:`Home Reset · ${p.done}/${p.total}`,start:C.schedule.time,
      end:hhmm(minutes(C.schedule.time)+mins),notes:"",exceptions:{}});
  }
  if(S.focus?.settings?.addToCalendar){
    focusOn(key).forEach(s=>{
      if(!s.start)return;
      real.push({id:"__focus_"+s.id,key,virtual:true,vkind:"focus",type:"focusrun",
        title:`🌳 ${fcat(s.category).n}${s.title?" · "+s.title:""}`,
        start:s.start,end:s.end||hhmm(minutes(s.start)+s.actualMin),notes:"",exceptions:{}});
    });
  }
  return real.sort((a,b)=>minutes(a.start)-minutes(b.start)||minutes(a.end)-minutes(b.end));
}

      let sel=[...days];
      const repBox=o.querySelector("#repDays"),untilBox=o.querySelector("#repUntil"),timeRow=o.querySelector("#timeRow");
      const syncRep=()=>{
        const f=g("freq").value;
        repBox.classList.toggle("hide",f!=="weekly");

        const f=g("freq").value;

          start:ad?"00:00":g("start").value,end:ad?"23:59":g("end").value,
          notes:g("notes").value.trim(),taskId:g("taskId").value||null};
        const mkRec=()=>f==="none"?null
          :f==="weekly"?{freq:"weekly",days:sel.sort(),from:dateVal,until:g("until").value||null}
          :{freq:"yearly",day:dt.getDate(),month:dt.getMonth()+1,from:null,until:g("until").value||null};

            date:f==="none"?dateVal:null,recurrence:mkRec(),exceptions:{}});
          save();close();render();return;
        }
        const applySeries=()=>{
          Object.assign(base,data);
          base.date=f==="none"?dateVal:null;
          base.recurrence=mkRec();
          if(f==="none")base.exceptions={};
          save();close();render();
        };
        const applyOne=()=>{
          base.exceptions=base.exceptions||{};
          base.exceptions[occ?occ.key:dateVal]={...data};
          save();close();render();
        };
        if(base.recurrence&&occ)seriesChoice("Änderung übernehmen für",applyOne,applySeries);
        else applySeries();
      };
      o.querySelector("[data-del]")?.addEventListener("click",()=>{
        const del=()=>{
          const i=S.blocks.indexOf(base),copy=JSON.parse(JSON.stringify(base));
          S.blocks.splice(i,1);save();close();render();
          toast("Eintrag gelöscht.",()=>{S.blocks.splice(i,0,copy);save();render();});
        };
        if(base.recurrence&&occ){
          seriesChoice("Löschen",()=>{
            base.exceptions=base.exceptions||{};
            base.exceptions[occ.key]={deleted:true};
            save();close();render();
            toast("Dieser Termin wurde entfernt.",()=>{delete base.exceptions[occ.key];save();render();});
          },del);
        }else del();
      });
      syncRep();
    }});
}

function ensureV10(st){
  ensureV5(st);
  if(!st.shop||typeof st.shop!=="object"||!st.shop.list)st.shop=defaultShop();
  st.shop.list=st.shop.list||{}; st.shop.custom=st.shop.custom||[];
  st.shop.history=st.shop.history||{}; st.shop.open=st.shop.open||{oft:true,vorrat:false,haushalt:false};
  if(!Array.isArray(st.birthdays)||!st.birthdays.length)st.birthdays=defaultBirthdays();
  st.birthdays.forEach(p=>{if(!Array.isArray(p.gifts))p.gifts=[];});
  if(st.settings.showHolidays===undefined)st.settings.showHolidays=true;
  if(st.settings.showOtherHolidays===undefined)st.settings.showOtherHolidays=true;
  st.blocks.forEach(b=>{if(b.allDay===undefined)b.allDay=false;});

}

/* supplies and the basket are one list */
function addToShoppingList(names){
  names.forEach(n=>shopAddByName(n));
  const due=nextShoppingDate(),blk=ensureShoppingBlock();
  let t=shoppingTaskFor(due);
  const have=t?itemsOnList():[];
  const merged=[...new Set([...have,...names])];
  const added=merged.length-have.length;
  const body=merged.map(n=>"· "+n).join("\n");
  if(t){t.desc=body;t.title=`Einkaufen (${merged.length})`;t.blockId=t.blockId||blk.id;}
  else{
    t={id:uid(),created:Date.now(),title:`Einkaufen (${merged.length})`,desc:body,
      status:"todo",cat:"cleaning",prio:"medium",due,mins:45,tags:["haushalt"],blockId:blk.id,completedAt:null};
    S.tasks.unshift(t);
  }
  save();render();
  const when=due===todayKey()?"heute":`Montag, ${fmtDate(due)}`;
  toast(added?`${added} auf die Einkaufsliste für ${when}.`:`Steht schon auf der Liste für ${when}.`,
    added?()=>{
      names.forEach(n=>{const id=shopSlug(n);if(SH().list[id])shopRemove(id);});
      const cur=shoppingTaskFor(due);
      if(cur){
        const rest=itemsOnList().filter(x=>!names.includes(x));
        if(!rest.length)S.tasks=S.tasks.filter(x=>x.id!==cur.id);
        else{cur.desc=rest.map(n=>"· "+n).join("\n");cur.title=`Einkaufen (${rest.length})`;}
      }
      save();render();
    }:null);
}
function basketToTask(){
  const names=shopOpen().map(e=>e.item.n);
  if(!names.length){toast("Der Korb ist leer.");return;}
  addToShoppingList(names);
}

  /* shopping */
  const sm=hit("[data-ssub]"); if(sm){e.stopPropagation();shopSub(sm.dataset.ssub);render();return;}
  const sa=hit("[data-sadd]"); if(sa){shopAdd(sa.dataset.sadd);render();return;}
  const sa2=hit("[data-sadd2]"); if(sa2){e.stopPropagation();shopAdd(sa2.dataset.sadd2);render();return;}

    const id=sd.dataset.sdel,copy={...SH().list[id]};
    shopRemove(id);render();
    toast(`${shopItem(id).n} entfernt.`,()=>{SH().list[id]=copy;save();render();});return;}
  const sdn=hit("[data-sdone]"); if(sdn){shopToggleDone(sdn.dataset.sdone);render();return;}
  const st=hit("[data-stier]"); if(st){const k=st.dataset.stier;
    SH().q="";SH().open[k]=!(SH().open[k]!==false&&SH().open[k]!==undefined?SH().open[k]
      :SHOP_TIERS.find(t=>t.id===k).open);save();render();return;}

  if(hit("[data-snewdlg]")){shopCustomDlg();return;}
  const sn=hit("[data-snew]"); if(sn){shopCustomDlg(sn.dataset.snew);return;}
  if(hit("[data-sfinish]")){
    const snap=JSON.parse(JSON.stringify(SH().list));
    confirmDlg("Einkauf abschließen","Die Liste wird geleert. Was drauf stand, merkt sich die App für die Vorschläge.",
      "Abschließen",()=>{shopFinish();toast("Liste geleert.",()=>{SH().list=snap;save();render();});});return;}
  if(hit("[data-stask]")){basketToTask();return;}

  /* birthdays */
  const bt=hit("[data-bdtoggle]");
  if(bt){const id=bt.dataset.bdtoggle;bdOpen[id]=!bdOpen[id];
    if(route.view!=="birthdays")go("birthdays");else render();
    const el=$(`[data-bd="${id}"]`);if(el&&bdOpen[id])el.scrollIntoView?.({block:"nearest"});return;}

  if(hit("[data-bdnew]")){bdDlg();return;}
  const be=hit("[data-bdedit]"); if(be){e.stopPropagation();bdDlg(be.dataset.bdedit);return;}
  const bx=hit("[data-bddel]");
  if(bx){e.stopPropagation();const p=BD().find(x=>x.id===bx.dataset.bddel);
    confirmDlg("Eintrag entfernen",`${esc(p.name)} wird aus der Liste entfernt.`,"Entfernen",()=>{
      const i=S.birthdays.indexOf(p),copy={...p};
      S.birthdays.splice(i,1);save();render();
      toast(`${copy.name} entfernt.`,()=>{S.birthdays.splice(i,0,copy);save();render();});},true);return;}
  const gt=hit("[data-gifttog]");
  if(gt){e.stopPropagation();const[pid,gid]=gt.dataset.gifttog.split("|");
    const g=BD().find(x=>x.id===pid)?.gifts.find(x=>x.id===gid);
    if(g){g.done=!g.done;bdOpen[pid]=true;save();render();}return;}
  const gd=hit("[data-giftdel]");

    const p=BD().find(x=>x.id===pid),i=p.gifts.findIndex(x=>x.id===gid),copy=p.gifts[i];

  const ga=hit("[data-giftadd]");

    if(el&&el.value.trim())addGift(ga.dataset.giftadd,el.value.trim());return;}
  const bta=hit("[data-bdtask]");
  if(bta){e.stopPropagation();
    const p=BD().find(x=>x.id===bta.dataset.bdtask);

  if(hit("[data-adhd]")){holidaySettingsDlg();return;}
  const ae=hit("[data-adev]"); if(ae){blockDlg(ae.dataset.adev,ae.dataset.adkey);return;}
  const ad=hit("[data-adday]");

/* ---------- timeline focus handling ---------- */
function bindJournal(){
  J_FIELDS.forEach(([id,key])=>{
    const el=$("#"+id);if(!el)return;
    el.addEventListener("input",debounce(()=>{journalFor(jDate)[key]=el.value;save();},420));
  });
  const tl=$("#jtl");
  if(!tl)return;
  const cards=$$(".jcard",tl);
  if(!cards.length)return;
  let raf=null;
  const mark=()=>{
    raf=null;
    const mid=tl.scrollLeft+tl.clientWidth/2;
    let best=0,bestD=Infinity;
    cards.forEach((c,i)=>{
      const cm=c.offsetLeft+c.offsetWidth/2;
      const d=Math.abs(cm-mid);
      if(d<bestD){bestD=d;best=i;}
    });
    jTlIndex=best;
    cards.forEach((c,i)=>c.classList.toggle("on",i===best));
  };
  tl.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(mark);},{passive:true});
  const want=jTlIndex;
  mark();
  // a fresh render starts scrolled to the left, so put the focus back where it was
  if(want>0&&want<cards.length)scrollCardIntoView(want,"auto");
}
function scrollCardIntoView(i,behavior){
  const tl=$("#jtl");if(!tl)return;
  const cards=$$(".jcard",tl);
  const c=cards[i];if(!c)return;
  jTlIndex=i;
  cards.forEach((x,k)=>x.classList.toggle("on",k===i));
  const left=c.offsetLeft+c.offsetWidth/2-tl.clientWidth/2;
  if(typeof tl.scrollTo==="function")tl.scrollTo({left,behavior:behavior||"smooth"});
  else tl.scrollLeft=left;
}

/* ---------- deleting an entry ---------- */
function journalDelete(date){
  const i=S.journal.findIndex(x=>x.date===date);
  if(i<0)return;
  const copy=JSON.parse(JSON.stringify(S.journal[i]));
  // remember the slot so the neighbouring entry slides into the same place
  const slot=jEntries().findIndex(x=>x.date===date);
  S.journal.splice(i,1);
  if(jDate===date&&jTab==="write")jDate=todayKey();
  const left=jEntries().length;
  jTlIndex=left?clamp(slot,0,left-1):0;
  save();render();
  toast(`Eintrag vom ${fmtDate(date)} gelöscht.`,()=>{
    S.journal.push(copy);
    S.journal.sort((a,b)=>b.date.localeCompare(a.date));
    jTlIndex=jEntries().findIndex(x=>x.date===date);
    save();render();});
}
/* ---------- swipe a card upwards to throw it away ---------- */
let jGesture=null, jGestureEnd=0;
function jTrashState(on,armed){
  const el=$("#jtrash");if(!el)return;
  el.classList.toggle("on",!!on);
  el.classList.toggle("armed",!!armed);
}
function bindTimelineGestures(){
  const tl=$("#jtl");if(!tl)return;
  $$(".jcard",tl).forEach(c=>{
    c.addEventListener("pointerdown",e=>{
      if(e.target.closest("[data-jdel]"))return;
      if(!c.classList.contains("on"))return;
      jGesture={c,x:e.clientX,y:e.clientY,dy:0,active:false,id:e.pointerId};
    });
    c.addEventListener("pointermove",e=>{
      if(!jGesture||jGesture.c!==c)return;
      const dx=e.clientX-jGesture.x, dy=e.clientY-jGesture.y;
      if(!jGesture.active){
        if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){jGesture=null;return;}
        if(dy<-14&&Math.abs(dy)>Math.abs(dx)*1.3){
          jGesture.active=true;
          c.setPointerCapture?.(e.pointerId);
          c.classList.add("lifting");
        }else return;
      }
      jGesture.dy=Math.min(0,dy);
      const armed=-jGesture.dy>110;
      c.style.transform=`translateY(${jGesture.dy}px) scale(${(1-Math.min(.07,-jGesture.dy/1600)).toFixed(3)})`;
      c.style.opacity=String(Math.max(.4,1+jGesture.dy/420));
      jTrashState(true,armed);
    });
    const finish=()=>{
      if(!jGesture||jGesture.c!==c)return;
      const armed=-jGesture.dy>110;
      const date=c.dataset.jcard;
      c.classList.remove("lifting");
      c.style.transform="";c.style.opacity="";
      jTrashState(false,false);
      const was=jGesture.active;
      jGesture=null;
      if(was)jGestureEnd=Date.now();
      if(armed)journalDelete(date);
    };
    c.addEventListener("pointerup",finish);
    c.addEventListener("pointercancel",finish);
  });
}
