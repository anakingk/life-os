  .jtl-pad{flex:0 0 11vw}
  .jc-d{font-size:34px}
  .jc-text{min-height:96px;-webkit-line-clamp:4}
  .jtl-nav{display:none}
  .jtl-stats{gap:16px}
  .cattiles{grid-template-columns:repeat(3,1fr)}
  .lgrid{grid-template-columns:1fr}
  .jdlg-s .meta{width:72px}
}

/* ===== home birthday card ===== */
.bdhome .bdh-row{display:flex;gap:14px;padding:4px 20px 18px;align-items:stretch}
.bdh-spot{
  flex:1 1 44%;min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;
  padding:18px 18px 16px;border-radius:var(--r-lg);text-align:left;overflow:hidden;
  background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 15%,var(--surface)),var(--surface) 72%);
  border:1px solid color-mix(in srgb,var(--rc) 20%,transparent);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.bdh-spot:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.bdh-spot.now{
  background:linear-gradient(145deg,color-mix(in srgb,#e8618a 22%,var(--surface)),
    color-mix(in srgb,#d99022 10%,var(--surface)) 78%);
  border-color:color-mix(in srgb,#e8618a 34%,transparent)}
.bdh-spot::after{
  content:"";position:absolute;right:-42px;top:-52px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--rc) 22%,transparent),transparent 68%);
  pointer-events:none}
.bdh-flag{
  position:relative;z-index:1;font-size:11px;font-weight:750;letter-spacing:.03em;
  padding:3px 9px;border-radius:var(--r-pill);background:var(--surface);color:#e8618a;
  box-shadow:var(--sh-xs)}
.bdh-flag.soft{color:var(--text-muted)}
.bdh-av{
  position:relative;z-index:1;width:50px;height:50px;border-radius:17px;margin-top:13px;
  display:grid;place-items:center;font-size:17px;font-weight:750;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(150deg,var(--rc),color-mix(in srgb,var(--rc) 62%,#2b1a24));
  box-shadow:0 4px 12px color-mix(in srgb,var(--rc) 34%,transparent)}
.bdh-name{position:relative;z-index:1;font-size:19px;font-weight:700;letter-spacing:-.028em;margin-top:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bdh-sub{position:relative;z-index:1;font-size:13px;color:var(--text-2);margin-top:2px}
.bdh-meta{position:relative;z-index:1;display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.bdh-rel{font-size:11.5px;font-weight:650;color:var(--rc);
  background:color-mix(in srgb,var(--rc) 13%,transparent);padding:3px 9px;border-radius:var(--r-pill)}
.bdh-gift{font-size:11.5px;font-weight:650;color:var(--text-2);
  background:var(--surface-3);padding:3px 9px;border-radius:var(--r-pill)}

.bdh-next{flex:1 1 56%;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.bdh-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-md);text-align:left;
  transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.bdh-item:hover{background:var(--surface-2);transform:translateX(2px)}
.bdh-i-main{flex:1;min-width:0}
.bdh-i-n{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdh-i-d{display:block;font-size:12px;color:var(--text-muted);margin-top:1px}
.bdh-i-p{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bdh-empty{padding:12px;font-size:13px;color:var(--text-muted)}
.bdh-add{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--r-md);
  font-size:13px;font-weight:600;color:var(--text-muted);border:1.5px dashed var(--line);
  transition:border-color var(--t) var(--ease),color var(--t) var(--ease),background var(--t) var(--ease)}
.bdh-add:hover{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-softer)}
.bdh-add svg{width:15px;height:15px}

@media(max-width:1280px){
  .bdh-row{flex-direction:column}
  .bdh-spot{flex:none}
}
@media(max-width:860px){
  .bdh-row{padding:4px 14px 14px}
  .bdh-av{width:44px;height:44px;border-radius:15px;font-size:15px}
  .bdh-name{font-size:17px}
}

/* ===== emoji picker ===== */
.emoedit{
  width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:var(--surface-3);border:1.5px solid transparent;
  transition:background var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.emoedit:hover{background:var(--primary-soft);border-color:var(--primary);transform:scale(1.06)}
.emoset{margin-bottom:14px}
.emoset-h{font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:7px}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emobtn{
  aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:20px;
  background:var(--surface-2);transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.emobtn:hover{background:var(--primary-soft);transform:scale(1.12)}
.emobtn.on{background:var(--primary);box-shadow:0 0 0 2px var(--primary-deep)}

/* ===== budget hero ===== */
.bhero{border-radius:var(--r-xl);overflow:hidden;position:relative;box-shadow:var(--sh-md);
  background:linear-gradient(150deg,#16a97f 0%,#128f8c 52%,#3d8fd8 100%)}
.bhero.tight{background:linear-gradient(150deg,#e0a03f 0%,#e07a4a 54%,#d9646e 100%)}
.bhero.over{background:linear-gradient(150deg,#dd5565 0%,#c4485f 52%,#8b4a86 100%)}
.bhero.none{background:linear-gradient(150deg,#6b7f96 0%,#4f6274 100%)}
.bhero-in{padding:26px 28px;color:#fff;position:relative;z-index:1}
.bhero-in p{margin:8px 0 0;font-size:14.5px;opacity:.9;max-width:62ch}
.bbig{font-size:50px;font-weight:750;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.bhero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-top:20px}
.bhero-grid div{background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:10px 12px}
.bhero-grid span{display:block;font-size:11.5px;opacity:.82}
.bhero-grid b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

.bbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--surface-3)}
.bbar i{display:block;height:100%;transition:width var(--t-slow) var(--ease)}
.blegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--text-2)}
.blegend span{display:flex;align-items:center;gap:6px}
.blegend i{width:10px;height:10px;border-radius:3px}
.blegend b{font-variant-numeric:tabular-nums}

.bline{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.bline:last-child{border-bottom:none}
.bline span{flex:1;color:var(--text-2)}
.bline b{font-variant-numeric:tabular-nums;font-weight:650}
.bline.total{border-top:2px solid var(--line);margin-top:4px;padding-top:13px;font-size:15.5px}
.bline.total b{font-size:19px;color:var(--primary-strong)}

.brec{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.brec-c{padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--rc) 11%,var(--surface));
  border:1px solid color-mix(in srgb,var(--rc) 22%,transparent)}
.brec-c span{display:block;font-size:12px;font-weight:650;color:var(--text-2)}
.brec-c b{display:block;font-size:22px;font-weight:750;color:var(--rc);font-variant-numeric:tabular-nums;margin-top:3px}

.bcand{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.bcand:last-of-type{border-bottom:none}
.bcand-sum{margin-top:12px;padding-top:12px;border-top:2px solid var(--line);font-size:14px;color:var(--text-2)}
.bcand-sum b{font-variant-numeric:tabular-nums;color:var(--text)}

.bup{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.bup:last-child{border-bottom:none}
.bup:hover{background:var(--surface-2)}
.bup-d{width:64px;font-size:12px;font-weight:650;color:var(--text-muted);font-variant-numeric:tabular-nums}
.bup b{font-variant-numeric:tabular-nums}

.wiout{background:var(--surface-2);border-radius:var(--r-md);padding:14px}
.wi-row{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:13.5px}
.wi-row span{flex:1;color:var(--text-2)}
.wi-row b{font-variant-numeric:tabular-nums;font-weight:650}
.wi-row.diff{border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.wi-row.diff.up b{color:var(--primary-strong)}
.wi-row.diff.down b{color:var(--danger)}

/* ===== expense rows ===== */
.bsum{font-size:13.5px;color:var(--text-muted);margin-bottom:12px}
.bsum b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.blist{display:grid;gap:8px}
.brow{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--sh-xs);
  transition:border-color var(--t) var(--ease),transform var(--t-fast) var(--ease),opacity var(--t) var(--ease)}
.brow:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.brow.off{opacity:.5}
.brow.dragging{opacity:.4}
.brow .bn{flex:1;min-width:0}
.brow .bt{font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:7px}
.bshare{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:var(--r-pill);
  background:var(--second-soft);color:var(--second)}
.bamt{text-align:right;min-width:112px}
.bamt .ba{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.bnext{width:86px;text-align:right}
.bstat{
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);
  font-size:12px;font-weight:650;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent);
  white-space:nowrap;transition:background var(--t) var(--ease)}
.bstat:hover{background:color-mix(in srgb,var(--sc) 24%,transparent)}

/* ===== yearly calendar ===== */
.ycal{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;align-items:end}
.ycell{display:flex;flex-direction:column;align-items:center;gap:5px}
.ycell .ym{font-size:11px;font-weight:650;color:var(--text-muted)}
.ycell .ybar{width:100%;height:76px;border-radius:6px;background:var(--surface-3);
  display:flex;align-items:flex-end;overflow:hidden}
.ycell .ybar i{width:100%;background:var(--warning);border-radius:6px;transition:height var(--t-slow) var(--ease)}
.ycell.has .ybar i{background:linear-gradient(180deg,var(--warning),color-mix(in srgb,var(--warning) 70%,#7a4a10))}
.ycell .yv{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}

/* ===== goals, debts, buckets ===== */
.goalcard2,.debtcard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:16px 18px;box-shadow:var(--sh-xs)}
.g-h{display:flex;align-items:center;gap:12px}
.g-h .bt{font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.g-pct{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--primary-strong)}
.g-bar{height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin:13px 0 11px}
.g-bar i{display:block;height:100%;border-radius:6px;background:var(--primary-grad);
  transition:width var(--t-slow) var(--ease)}
.g-f{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.bucketgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.bucket{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line-soft)}
.bucket .bn{flex:1;min-width:0}
.bucket .bt{font-size:14px;font-weight:620}
.bamtin{width:92px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;min-height:38px;padding:6px 9px}

.acct.closing{border-color:color-mix(in srgb,var(--warning) 35%,transparent)}
.acct.closed{opacity:.6}
.budhome .num{font-variant-numeric:tabular-nums}

@media(max-width:860px){
  .bhero-in{padding:20px}
  .bbig{font-size:38px}
  .brec{grid-template-columns:1fr}
  .ycal{grid-template-columns:repeat(6,1fr);gap:9px}
  .brow{flex-wrap:wrap;gap:9px}
  .brow .bnext{display:none}
  .bamt{min-width:0;text-align:left}
  .emogrid{grid-template-columns:repeat(6,1fr)}
  .bucketgrid{grid-template-columns:1fr}
}

/* ===== layout hardening: nothing may drift sideways ===== */
html{overflow-x:clip}
body{overflow-x:clip;width:100%;max-width:100%;position:relative;overscroll-behavior-y:none}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
#view,.page,.grid,.panel{max-width:100%;min-width:0}
.grid>*{min-width:0}
.panel-b,.panel-h{min-width:0}
.bt,.ti,.sname,.bd-n,.cc-t,.jc-text,.lt,.ls{overflow-wrap:anywhere}
.tbl{max-width:100%}

@media(max-width:860px){
  /* the bar is four slots plus the add button, everything else lives in the sheet */
  #view{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
  #topbar{padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
  #mobilenav{
    left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));
    padding:6px 7px;gap:3px;
  }
  #mobilenav button{min-height:54px;position:relative;border-radius:14px}
  #mobilenav button .l{font-size:10.5px}
  #mobilenav .nb{
    position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:750;
    display:grid;place-items:center}
  #mobilenav::before{
    content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:32px;height:3px;border-radius:2px;background:var(--line-strong);opacity:.6}

  /* touch targets */
  .btn,.iconbtn,.chip,.durbtn,.catchip,.seg button{min-height:42px}
  .iconbtn{min-width:42px}
  input[type=checkbox]{width:22px;height:22px}
  .inp,.sel,.ta{min-height:46px;font-size:16px}  /* 16px stops iOS from zooming in */
  .tbl td,.tbl th{padding:12px 10px}
  .stile{min-height:96px}
  .jday{min-height:38px}
  .cal-bar{gap:9px}
  .cal-bar .seg{width:100%;overflow-x:auto}
  .searchwrap{width:100%;max-width:none}

  /* wide things scroll inside themselves instead of pushing the page */
  .ycal{overflow-x:auto;grid-template-columns:repeat(12,minmax(46px,1fr))}
  .brec{grid-template-columns:1fr}
  .bhero-grid{grid-template-columns:1fr 1fr}
  .grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bdnext{grid-template-columns:1fr}
  .cattiles{grid-template-columns:repeat(3,1fr)}
}

/* ===== navigation sheet ===== */
#navsheet{position:fixed;inset:0;z-index:120;pointer-events:none}
#navsheet .ns-scrim{
  position:absolute;inset:0;background:rgba(12,22,19,.42);backdrop-filter:blur(3px);
  opacity:0;transition:opacity 260ms var(--ease)}
#navsheet .ns-panel{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -14px 48px rgba(12,26,20,.22);
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
  max-height:min(76dvh,620px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(102%);transition:transform 320ms cubic-bezier(.22,1,.36,1)}
#navsheet.on{pointer-events:auto}
#navsheet.on .ns-scrim{opacity:1}
#navsheet.on .ns-panel{transform:none}
.ns-grip{display:flex;justify-content:center;padding:11px 0 6px;position:sticky;top:0;
  background:var(--surface);z-index:2;cursor:grab}
.ns-grip span{width:40px;height:4px;border-radius:3px;background:var(--line-strong)}
.ns-group{margin-bottom:16px}
.ns-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);margin:6px 2px 9px}
.ns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.ns-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:15px 8px;border-radius:var(--r-md);background:var(--surface-2);position:relative;
  min-height:86px;transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.ns-item:active{transform:scale(.96)}
.ns-item.on{background:var(--primary-soft);color:var(--primary-deep)}
.ns-ic{display:flex;color:var(--text-2)}
.ns-item.on .ns-ic{color:var(--primary-deep)}
.ns-n{font-size:12px;font-weight:620;text-align:center;line-height:1.25}
.ns-ct{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--primary);color:#fff;font-size:10px;font-weight:750;display:grid;place-items:center}
@media(min-width:861px){#navsheet{display:none}}

/* ===== sports ===== */
.spsec{margin-bottom:26px}
.spsec-h{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.spsec-h .sps-n{font-size:15px;font-weight:700;letter-spacing:-.02em}
.sprow{
  display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sprow::-webkit-scrollbar{display:none}
.spcard{
  flex:0 0 268px;scroll-snap-align:start;position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-xl);
  padding:18px 18px 15px;box-shadow:var(--sh-sm);cursor:pointer;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.spcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tc)}
.spcard:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--tc)}
.spcard.closed,.spcard.none{opacity:.72}
.sp-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sp-ic{
  width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--tc);
  background:color-mix(in srgb,var(--tc) 13%,transparent)}
.sp-ic svg{width:26px;height:26px}
.sp-ic.big{width:58px;height:58px;border-radius:18px}
.sp-ic.big svg{width:32px;height:32px}
.sp-ic.sm{width:32px;height:32px;border-radius:11px}
.sp-ic.sm svg{width:18px;height:18px}
.sp-badge{
  margin-left:auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--r-pill);white-space:nowrap}

.spcard .sp-n{font-size:16.5px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.spcard .sp-t{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.spcard .sp-hours{font-size:13px;font-weight:600;color:var(--text-2);margin-top:10px}
.sp-warn{
  display:flex;align-items:flex-start;gap:7px;margin-top:10px;padding:7px 9px;border-radius:var(--r-sm);
  background:var(--danger-soft);color:var(--danger);font-size:11.5px;font-weight:600;line-height:1.4}
.sp-warn svg{width:14px;height:14px;flex:none;margin-top:1px}
.sp-quota{margin-top:12px}
.sp-quota .prog{margin-bottom:5px}
.sp-acts{display:flex;align-items:center;gap:7px;margin-top:14px}
.sp-acts .btn{flex:1}
.sp-acts .iconbtn{width:38px;height:38px;flex:none;color:var(--text-2)}
.sp-chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc);
  font-size:12px;font-weight:650;white-space:nowrap}
.sp-chip svg{width:15px;height:15px}

.spbars{display:flex;align-items:flex-end;gap:5px;height:82px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.spbars::-webkit-scrollbar{display:none}
.spbar{flex:1;min-width:16px;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.spbar i{width:100%;margin-top:auto;border-radius:5px;background:var(--surface-3);min-height:4px;
  transition:height var(--t-slow) var(--ease)}
.spbar i[style*="height: 0"]{background:var(--surface-3)}
.spbar:not(.today) i{background:color-mix(in srgb,var(--primary) 45%,transparent)}
.spbar.today i{background:var(--primary)}
.spbar span{font-size:9.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}

.spdlg .spd-h{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.spdlg .spd-h h2{font-size:23px;letter-spacing:-.03em;margin-top:3px}
.spd-addr{display:flex;align-items:center;gap:11px;margin-top:14px;padding:11px 13px;
  background:var(--surface-2);border-radius:var(--r-md);font-size:14px;flex-wrap:wrap}
.spd-sec{margin-top:20px}
.spd-sec h4{font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:8px}
.spd-sec p{margin:0;font-size:14px;line-height:1.7;color:var(--text-2)}
.sphours{display:grid;gap:3px}
.sph-row{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:var(--r-sm);font-size:13.5px}
.sph-row.now{background:var(--primary-softer);font-weight:650}
.sph-d{width:100px;color:var(--text-2)}
.sph-t{font-variant-numeric:tabular-nums}
.sph-block{margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:var(--r-pill);
  background:var(--danger-soft);color:var(--danger)}
.sphedit{display:grid;gap:6px}
.sphe-row{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center}
.sphe-row span{font-size:13px;color:var(--text-2)}

@media(max-width:860px){
  .spcard{flex:0 0 82vw;padding:16px}
  .sph-d{width:74px}
  .sphe-row{grid-template-columns:60px 1fr 1fr}
  .spd-addr{font-size:13px}
}

/* ===== recipes v17 ===== */
.rx-goal{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:14px 18px;margin-bottom:18px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-xs);cursor:pointer;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.rx-goal:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.rx-goal-m{display:flex;gap:16px;flex-wrap:wrap;flex:1}
.rx-goal-m span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);font-weight:600}
.rx-goal-m i{width:9px;height:9px;border-radius:50%}
.rx-goal>.meta{display:flex;align-items:center;gap:2px}
.rx-meals{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.rx-meals::-webkit-scrollbar{display:none}
.rx-meal{flex:none;padding:8px 14px;border-radius:var(--r-pill);background:var(--surface-3);font-size:13px;font-weight:620;
  color:var(--text-2);transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.rx-meal.on{background:var(--text);color:var(--bg)}

.rx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.rx-card{cursor:pointer;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-sm);
  transition:transform 280ms var(--ease),box-shadow 280ms var(--ease)}
.rx-card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg)}
.rx-card:active{transform:scale(.98)}
.rx-ph{position:relative;aspect-ratio:4/3.4;background:linear-gradient(150deg,var(--primary-soft),var(--second-soft));
  display:grid;place-items:center;overflow:hidden}
.rx-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 600ms var(--ease)}
.rx-card:hover .rx-ph img{transform:scale(1.05)}
.rx-ph-emoji{font-size:56px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}
.rx-ph-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:1}
.rx-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.88);color:#2a2a2a;backdrop-filter:blur(6px)}
.rx-fav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#d99022}
.rx-fav svg{width:16px;height:16px;fill:currentColor}
.rx-ph-bot{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;z-index:1;
  background:linear-gradient(180deg,transparent,rgba(10,14,12,.78))}
.rx-title{color:#fff;font-size:17px;font-weight:720;letter-spacing:-.02em;line-height:1.22;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.rx-sub{color:rgba(255,255,255,.86);font-size:12.5px;margin-top:4px;font-weight:550}

/* recipe page */
.rx-page{max-width:1080px}
.rx-top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rx-hero{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:250px;max-height:420px;aspect-ratio:16/8;
  display:grid;place-items:center;background:linear-gradient(150deg,var(--primary-soft),var(--second-soft));box-shadow:var(--sh-md)}
.rx-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rx-hero .rx-ph-emoji{font-size:84px;margin-bottom:60px}
.rx-hero-txt{position:absolute;left:0;right:0;bottom:0;padding:70px 26px 22px;background:linear-gradient(180deg,transparent,rgba(10,14,12,.8))}
.rx-hero-txt h1{color:#fff;font-size:32px;font-weight:750;letter-spacing:-.035em;line-height:1.1;margin:10px 0 0}
.rx-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rx-pills span{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;font-size:12.5px;font-weight:600}
.rx-pills svg{width:14px;height:14px}
.rx-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.rx-macros>div{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 14px;text-align:center}
.rx-macros b{display:block;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.rx-macros small{font-size:12px;margin-left:2px;color:var(--text-muted)}
.rx-macros span{font-size:11.5px;color:var(--text-muted);font-weight:600}
.rx-cookbtn{width:100%;margin:4px 0 18px;justify-content:center}
.rx-cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.rx-box{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sh-xs)}
.rx-box-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rx-box-h h2{font-size:17px;letter-spacing:-.02em}
.rx-serv{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:var(--r-pill);padding:2px}
.rx-serv span{font-size:13px;font-weight:700;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.rx-ings{list-style:none;margin:0;padding:0}
.rx-ing{display:flex;align-items:flex-start;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line-soft);
  font-size:15px;line-height:1.45;cursor:pointer;transition:opacity var(--t) var(--ease)}
.rx-ing:last-child{border-bottom:none}
.rx-ing b{font-variant-numeric:tabular-nums}
.rx-ing.done{opacity:.42}
.rx-ing.done span:last-child{text-decoration:line-through}
.rx-chk{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;
  margin-top:1px;transition:background var(--t) var(--ease),border-color var(--t) var(--ease)}
.rx-ing.done .rx-chk{background:var(--primary);border-color:var(--primary);color:#fff}
.rx-chk svg{width:14px;height:14px}
.rx-ing-h{font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:14px 4px 4px;list-style:none}
.rx-ing-h:first-child{padding-top:0}
.rx-steps{list-style:none;margin:0;padding:0;counter-reset:none}
.rx-step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft);font-size:15.5px;line-height:1.65}
.rx-step:last-child{border-bottom:none}
.rx-step>div{flex:1;min-width:0}
.rx-step p{margin:0 0 6px}.rx-step p:last-child{margin:0}
.rx-num{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:750;
  background:var(--primary-soft);color:var(--primary-deep);margin-top:1px}
.rx-sec{list-style:none;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:14px 0 2px}
.rx-sec:first-child{padding-top:0}
.rx-note{margin-top:18px;font-size:14px;line-height:1.65;color:var(--text-2)}
.rx-mobilebar{display:none}

/* editor */
.rx-edimg{aspect-ratio:16/7;border-radius:var(--r-lg);overflow:hidden;display:grid;place-items:center;position:relative;
  background:linear-gradient(150deg,var(--primary-soft),var(--second-soft))}
.rx-edimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rx-imgacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rx-ingta{min-height:150px;font-size:15px;line-height:1.6}
.rx-tb{display:flex;gap:4px;align-items:center;padding:5px;border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r-md) var(--r-md) 0 0;background:var(--surface-2);flex-wrap:wrap}
.rx-tb button{min-width:38px;height:36px;border-radius:9px;font-size:15px;font-weight:650;color:var(--text-2);
  transition:background var(--t) var(--ease)}
.rx-tb button:hover{background:var(--surface-3);color:var(--text)}
.rx-tbsep{width:1px;height:20px;background:var(--line);margin:0 3px}
.rte{min-height:190px;max-height:52vh;overflow-y:auto;padding:13px 15px;border:1px solid var(--line);
  border-radius:0 0 var(--r-md) var(--r-md);background:var(--surface);font-size:16px;line-height:1.65;outline:none;
  -webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.rte:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.rte:empty::before{content:attr(data-ph);color:var(--text-faint);pointer-events:none}
.rte h3,.rx-step h3{font-size:17px;margin:12px 0 4px}
.rte p{margin:0 0 8px}
.rte ol,.rte ul{margin:4px 0 10px;padding-left:24px}
.rte li{margin:3px 0}
.rx-more summary{cursor:pointer;font-size:13.5px;font-weight:650;color:var(--text-2);padding:6px 0}

/* cooking mode */
#cook{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#cook.on{display:flex;animation:ckIn 260ms var(--ease)}
@keyframes ckIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ck-top{display:flex;align-items:center;gap:10px;padding:12px 16px}
.ck-title{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-timer{padding:8px 14px;border-radius:var(--r-pill);background:var(--warning-soft);color:var(--warning);
  font-weight:750;font-variant-numeric:tabular-nums;font-size:15px}
.ck-timer.ring{background:var(--danger);color:#fff;animation:ckPulse 1s infinite}
@keyframes ckPulse{50%{transform:scale(1.06)}}
.ck-prog{display:flex;gap:4px;padding:0 16px}
.ck-prog i{flex:1;height:4px;border-radius:2px;background:var(--surface-3);transition:background var(--t) var(--ease)}
.ck-prog i.done{background:color-mix(in srgb,var(--primary) 55%,transparent)}
.ck-prog i.now{background:var(--primary)}
.ck-body{flex:1;min-height:0;display:flex;gap:20px;padding:20px 16px;overflow:hidden}
.ck-ings{width:320px;flex:none;overflow-y:auto;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-lg);padding:16px 18px}
.ck-ings h3{font-size:14px;margin:0 0 8px;color:var(--text-muted)}
.ck-ings ul{list-style:none;margin:0;padding:0}
.ck-ingbtn{display:none}
.ck-step{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;
  padding:10px 4vw;touch-action:pan-y}
.ck-count{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--primary-strong);margin-bottom:16px}
.ck-text{font-size:clamp(22px,3.1vw,34px);line-height:1.5;font-weight:560;letter-spacing:-.012em;overflow-wrap:anywhere}
.ck-text b{font-weight:780}
.ck-text p{margin:0 0 12px}
.ck-tbtn{align-self:flex-start;margin-top:24px}
.ck-nav{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;padding:12px 16px 16px}
.ck-nav .btn{justify-content:center;min-height:62px;font-size:17px}

@media(max-width:860px){
  .rx-grid{grid-template-columns:1fr 1fr;gap:11px}
  .rx-ph{aspect-ratio:4/4.6}
  .rx-title{font-size:15px}
  .rx-sub{font-size:11.5px}
  .rx-ph-emoji{font-size:44px}
  .rx-hero{aspect-ratio:auto;min-height:280px;border-radius:var(--r-lg)}
  .rx-hero-txt{padding:60px 18px 18px}
  .rx-hero-txt h1{font-size:26px}
  .rx-macros{grid-template-columns:repeat(4,1fr);gap:6px}
  .rx-macros>div{padding:10px 6px}
  .rx-macros b{font-size:17px}
  .rx-macros span{font-size:10px}
  .rx-cols{grid-template-columns:1fr}
  .rx-cookbtn{display:none}
  .rx-mobilebar{display:block;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40}
  .rx-mobilebar .btn{width:100%;justify-content:center;box-shadow:var(--sh-lg)}
  .rx-page{padding-bottom:80px}
  .ck-ings{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62vh;z-index:3;border-radius:var(--r-xl) var(--r-xl) 0 0;
    transform:translateY(105%);transition:transform 300ms cubic-bezier(.22,1,.36,1);box-shadow:0 -12px 40px rgba(0,0,0,.18)}
  .ck-ings.open{transform:none}
  .ck-ingbtn{display:inline-flex}
  .ck-body{position:relative;padding:16px 8px}
  .ck-step{padding:6px 12px}
  .ck-text{font-size:24px}
}
@media(max-width:420px){.rx-grid{grid-template-columns:1fr}.rx-ph{aspect-ratio:4/3}}

/* ===== routines v18 ===== */
.rt2-switch{display:none}
.rt2-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.rt2-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-xl);
  padding:18px 18px 12px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;
  transition:border-color 400ms var(--ease),box-shadow 400ms var(--ease)}
.rt2-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--rc);opacity:.85}
.rt2-card.complete{border-color:color-mix(in srgb,var(--rc) 40%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 18%,transparent),var(--sh-sm)}
.rt2-head{display:flex;align-items:center;gap:12px}
.rt2-emo{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:23px;
  background:color-mix(in srgb,var(--rc) 13%,transparent)}
.rt2-ttl{flex:1;min-width:0}
.rt2-name{font-size:17px;font-weight:720;letter-spacing:-.025em}
.rt2-meta{font-size:12.5px;color:var(--text-muted);margin-top:1px}
.rt2-count{font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.rt2-count b{font-size:24px;font-weight:760;color:var(--rc)}
.rt2-count span{font-size:13px;color:var(--text-faint);font-weight:650}
.rt2-bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:13px 0 7px}
.rt2-bar i{display:block;height:100%;border-radius:4px;background:var(--rc);transition:width 360ms var(--ease)}
.rt2-sub{font-size:12px;color:var(--text-muted);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:17px}
.rt2-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:5px 8px;margin-top:10px}
.rt2-item{display:flex;align-items:center;gap:9px;min-height:42px;padding:6px 9px;border-radius:12px;text-align:left;
  background:var(--surface-2);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background 200ms var(--ease)}
.rt2-item:hover{background:var(--surface-3)}
.rt2-item:active .rt2-chk{transform:scale(.88)}
.rt2-chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;
  color:#fff;transition:background 200ms var(--ease),border-color 200ms var(--ease),transform 120ms var(--ease)}
.rt2-chk svg{width:13px;height:13px;opacity:0;transition:opacity 160ms var(--ease)}
.rt2-item.done .rt2-chk{background:var(--rc);border-color:var(--rc)}
.rt2-item.done .rt2-chk svg{opacity:1}
.rt2-e{font-size:17px;width:22px;text-align:center;flex:none}
.rt2-n{flex:1;min-width:0;font-size:14px;font-weight:560;line-height:1.3;transition:color 200ms var(--ease)}
.rt2-item.done .rt2-n{color:var(--text-faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.rt2-d{font-size:11.5px;color:var(--text-faint);font-weight:650;font-variant-numeric:tabular-nums;flex:none}
.rt2-foot{display:flex;align-items:center;gap:6px;margin-top:10px}
/* edit dialog */
.rte-head{display:flex;align-items:flex-end;gap:12px}
.rte-emo{width:44px;height:44px;flex:none;border-radius:13px;font-size:21px;display:grid;place-items:center;
  background:var(--surface-2);border:1.5px dashed var(--line-strong);transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
.rte-emo:hover{border-color:var(--primary);background:var(--primary-softer)}
.rte-emo.big{width:58px;height:58px;font-size:28px;border-radius:17px}
.rte-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.rte-row.off{opacity:.5}
.rte-mv{display:flex;flex-direction:column;gap:1px}
.rte-mv .iconbtn{min-height:22px;height:22px;min-width:30px}
.rte-name{flex:1;min-width:0}
.rte-min{display:flex;align-items:center;gap:4px;width:88px;flex:none}
.rte-min .inp{text-align:center;padding:7px 4px}
.rte-min span{font-size:12px;color:var(--text-muted)}
.rte-act{display:flex;align-items:center}
.rte-sum{margin-top:14px;padding:11px 14px;border-radius:var(--r-md);background:var(--surface-2);font-size:13.5px;color:var(--text-2)}

/* ===== sortable ===== */
.sort-h{width:30px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;color:var(--text-faint);
  cursor:grab;touch-action:none;margin-right:2px}
.sort-h:hover,.sort-h:focus-visible{background:var(--surface-3);color:var(--text-2)}
.sort-h svg{width:16px;height:16px}
[data-sortid].sorting{opacity:.92;box-shadow:var(--sh-lg);transform:scale(1.02);z-index:5;position:relative}
.is-sorting{user-select:none;-webkit-user-select:none}
.bucket .sort-h{margin-right:0}

/* ===== calendar swipe ===== */
.grid-wrap{transition:transform 180ms var(--ease)}
.cal-in-r{animation:calInR 240ms var(--ease)}
.cal-in-l{animation:calInL 240ms var(--ease)}
@keyframes calInR{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes calInL{from{opacity:.4;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* ===== hobbies ===== */
.hob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.hob-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:18px;cursor:pointer;
  box-shadow:var(--sh-xs);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.hob-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.hob-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.hob-emo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;
  background:linear-gradient(150deg,var(--primary-soft),var(--second-soft))}
.hob-st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);color:var(--sc);
  background:color-mix(in srgb,var(--sc) 13%,transparent)}
.hob-n{font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.hob-goal{display:flex;align-items:flex-start;gap:6px;margin-top:10px;font-size:13px;color:var(--text-2)}
.hob-goal svg{width:15px;height:15px;flex:none;margin-top:1px}
.hob-foot{margin-top:10px;font-size:12.5px;color:var(--text-muted);min-height:16px}
.hob-idea{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.hob-idea span{flex:1}
.hob-idea.done span{color:var(--text-faint);text-decoration:line-through}

/* ===== travel ===== */
.trip-next{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:170px;margin-bottom:22px;cursor:pointer;
  background:linear-gradient(140deg,#3d9bd8,#14a07a 70%);box-shadow:var(--sh-md);display:flex;align-items:flex-end}
.trip-next-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trip-next-in{position:relative;z-index:1;padding:60px 22px 20px;width:100%;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(8,14,20,.66))}
.trip-next-in h2{font-size:26px;letter-spacing:-.03em;margin-top:6px}
.trip-next-in p{margin:4px 0 0;opacity:.9}
.trip-sec{margin-bottom:24px}
.trip-row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.trip-row::-webkit-scrollbar{display:none}
.trip-card{flex:0 0 240px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-xl);overflow:hidden;cursor:pointer;box-shadow:var(--sh-xs);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.trip-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.trip-ph{position:relative;height:120px;display:grid;place-items:center;background:linear-gradient(150deg,var(--info-soft),var(--primary-soft))}
.trip-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trip-emo{font-size:40px;position:relative}
.trip-ph img~.trip-emo{display:none}
.trip-cd{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.9);color:#1f2a24}
.trip-bd{padding:13px 15px 15px}
.trip-n{font-size:16px;font-weight:700;letter-spacing:-.02em}

/* ===== header, save indicator, storage note ===== */
#topbar>div:first-child{flex:1 1 auto;min-width:0}
.tb-title,.tb-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveInd.off,#saveInd.saved,#saveInd.saving{display:none!important}
.store-note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;margin-bottom:14px;border-radius:var(--r-md);
  background:var(--surface-2);font-size:13px;line-height:1.6;color:var(--text-2)}
.store-note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--success)}

@media(max-width:860px){
  .rt2-switch{display:flex;gap:6px;padding:4px;margin-bottom:10px;border-radius:var(--r-pill);background:var(--surface-3)}
  .rt2-switch button{flex:1;min-height:42px;border-radius:var(--r-pill);font-size:14px;font-weight:650;color:var(--text-2);
    display:flex;align-items:center;justify-content:center;gap:6px;transition:background 200ms var(--ease),color 200ms var(--ease)}
  .rt2-switch button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-xs)}
  .rt2-switch .c{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .rt2-grid{grid-template-columns:1fr}
  .rt2-wrap[data-show="morning"] .rt2-card[data-routine="evening"],
  .rt2-wrap[data-show="evening"] .rt2-card[data-routine="morning"]{display:none}
  .rt2-card{padding:15px 13px 10px}
  .rt2-list{grid-template-columns:1fr;gap:4px}
  .rt2-item{min-height:46px}
  .grid:has(.rt2-wrap)>:first-child{order:-2}
  .grid>.rt-home{order:-1}
  #topbar{gap:6px}
  .tb-clock{display:none}
  #btnNew span{display:none}
  .tb-title{font-size:18px}
  .tb-sub{font-size:12px}
  .hob-grid{grid-template-columns:1fr 1fr;gap:10px}
  .hob-card{padding:14px}
  .trip-card{flex:0 0 72vw}
  .rte-row{flex-wrap:wrap}
  .rte-name{flex:1 1 140px}
}
@media(max-width:420px){.hob-grid{grid-template-columns:1fr}}

/* ===== calendar stage 1 ===== */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:14px;align-items:start}
.cal-layout:has(.cal-lib.closed){grid-template-columns:minmax(0,1fr)}
.cal-main{min-width:0}
.cal-lib{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:12px;box-shadow:var(--sh-xs);max-height:calc(100dvh - 100px);overflow-y:auto}
.cal-lib.closed{display:none}
.cal-lib-h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:750;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:2px 2px 10px}
.cal-lib-list{display:grid;gap:6px}
.cal-lib-hint{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin:12px 2px 2px}
.lib-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;cursor:grab;user-select:none;
  background:color-mix(in srgb,var(--bcs) 24%,var(--surface));border-left:3px solid var(--bcs);
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t) var(--ease)}
.lib-chip:hover{transform:translateX(2px);box-shadow:var(--sh-sm)}
.lib-chip:active{cursor:grabbing}
.lib-chip.solid{background:var(--bcs);color:#f3f5f7;border-left-color:rgba(255,255,255,.35)}
.lc-ic{font-size:16px;width:20px;text-align:center}
.lc-n{flex:1;min-width:0;font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-d{font-size:11px;font-weight:650;opacity:.65;font-variant-numeric:tabular-nums}

/* event cards */
.blk.v2{background:color-mix(in srgb,var(--bcs) 30%,var(--surface));border:1px solid color-mix(in srgb,var(--bcs) 45%,transparent);
  border-left:3px solid var(--bcs);border-radius:9px;color:var(--text);padding:4px 7px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.blk.v2:hover{box-shadow:var(--sh-md);z-index:3}
.blk.v2.solid{background:var(--bcs);border-color:rgba(255,255,255,.14);border-left-color:rgba(255,255,255,.42);color:#eef1f4}
.blk.v2.solid .bm,.blk.v2.solid .b-note{color:rgba(238,241,244,.72)}
.blk.v2 .b-row{display:flex;align-items:center;gap:5px;min-width:0}
.blk.v2 .b-ic{font-size:13px;flex:none;line-height:1}
.blk.v2 .bt{font-size:12.5px;font-weight:680;line-height:1.25;min-width:0;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:inherit!important}
.blk.v2 .b-badge{font-size:11px;margin-left:auto;flex:none}
.blk.v2 .bm{font-size:11px;font-weight:600;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.blk.v2 .b-note{font-size:11px;color:var(--text-muted);margin-top:3px;line-height:1.35;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk.v2.md .bt{-webkit-line-clamp:1}
.blk.v2.xs{padding:1px 6px}
.blk.v2.xs .bt{-webkit-line-clamp:1;font-size:11.5px}
.blk.v2.xs .bm{display:none}
.blk.v2.grouped{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bcs) 30%,transparent)}
.blk.v2 .rz{height:9px}
.blk.v2 .rz::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;border-radius:2px;
  transform:translateX(-50%);background:currentColor;opacity:0;transition:opacity var(--t) var(--ease)}
.blk.v2:hover .rz::after{opacity:.35}
.blk.lifted{transform:scale(1.03);box-shadow:var(--sh-lg);z-index:6;opacity:.95}
.lib-ghost{position:absolute;left:3px;right:3px;border-radius:9px;pointer-events:none;z-index:5;
  border:2px dashed var(--bcs);background:color-mix(in srgb,var(--bcs) 18%,transparent);
  font-size:11.5px;font-weight:700;padding:4px 7px;color:var(--text)}

/* hover preview */
#calHover{position:fixed;z-index:160;width:250px;padding:12px 14px;border-radius:var(--r-md);pointer-events:none;
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--bcs);box-shadow:var(--sh-lg);
  animation:hovIn 140ms var(--ease)}
@keyframes hovIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ch-t{font-size:14px;font-weight:720;letter-spacing:-.015em}
.ch-m{font-size:12px;color:var(--text-muted);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.ch-r{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-top:1px solid var(--line-soft)}
.ch-r span{color:var(--text-muted)}
.ch-n{font-size:12px;color:var(--text-2);margin-top:8px;line-height:1.5}
.ch-h{font-size:10.5px;color:var(--text-faint);margin-top:8px}

/* conflicts, workday */
.cf-row{display:flex;align-items:center;gap:9px;padding:8px 10px;margin-top:6px;border-radius:10px;font-size:13.5px;
  background:color-mix(in srgb,var(--bcs) 18%,var(--surface));border-left:3px solid var(--bcs)}
.cf-row b{flex:1;min-width:0;font-weight:640}
.cf-row.sel{outline:2px solid color-mix(in srgb,var(--bcs) 60%,transparent)}
.wd-pop h3{font-size:20px;letter-spacing:-.025em;margin:4px 0 14px}
.wd-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wd-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:var(--r-lg);
  background:var(--surface-2);border:2px solid transparent;transition:border-color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.wd-opt span{font-size:28px}
.wd-opt b{font-size:14.5px}
.wd-opt small{font-size:11.5px;color:var(--text-muted)}
.wd-opt:hover{transform:translateY(-2px)}
.wd-opt.def{border-color:var(--primary);background:var(--primary-softer)}
.wd-list{margin-bottom:14px}
.wd-acts{display:grid;gap:8px}
.wd-acts .btn{justify-content:flex-start}
.wd-move{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2);font-size:13px}
.wd-move .inp{flex:1;min-width:140px}

/* placement sheet (shares the nav-sheet chrome) */
#calsheet{position:fixed;inset:0;z-index:125;pointer-events:none}
#calsheet .ns-scrim{position:absolute;inset:0;background:rgba(12,22,19,.42);opacity:0;transition:opacity 260ms var(--ease)}
#calsheet .ns-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -14px 48px rgba(12,26,20,.22);
  padding:0 16px calc(18px + env(safe-area-inset-bottom));max-height:min(82dvh,700px);overflow-y:auto;
  transform:translateY(102%);transition:transform 320ms cubic-bezier(.22,1,.36,1)}
#calsheet.on{pointer-events:auto}
#calsheet.on .ns-scrim{opacity:1}
#calsheet.on .ns-panel{transform:none}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.lib-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--r-md);min-height:84px;
  background:color-mix(in srgb,var(--bcs) 26%,var(--surface));border-bottom:3px solid var(--bcs)}
.lib-tile span{font-size:24px}
.lib-tile b{font-size:12px;font-weight:650;text-align:center;line-height:1.25}
.lib-tile.solid{background:var(--bcs);color:#eef1f4}
.ps-head{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--bcs) 22%,var(--surface));border-left:4px solid var(--bcs)}
.ps-ic{font-size:28px}
.ps-durs{display:flex;gap:6px;flex-wrap:wrap}

/* library editor */
.le-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.le-row.off{opacity:.5}
.le-row>.inp{flex:1;min-width:0}
.le-col{width:38px;height:34px;border:none;background:none;padding:0;cursor:pointer;flex:none}
.le-sw{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-muted);flex:none}

@media(max-width:860px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
  .cal-lib{display:none}
  .blk.v2 .bt{font-size:13px}
  .le-row{flex-wrap:wrap}
  .le-row>.inp{flex:1 1 150px}
  .wd-opts{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){#calHover,.blk.lifted{animation:none;transform:none}}

/* ================= CALENDAR 2.0 ================= */
.cal3{max-width:1680px}
.c3-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.c3-ttl{min-width:0;margin-right:6px}
.c3-kw{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.c3-ttl h1{font-size:24px;font-weight:750;letter-spacing:-.035em;line-height:1.15;margin:1px 0 0;white-space:nowrap}
.c3-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-pill);padding:3px}
.c3-nav .iconbtn{border-radius:var(--r-pill)}
.c3-tbtn{border-radius:var(--r-pill);font-weight:700}
.c3-tbtn.is{background:var(--primary-soft);color:var(--primary-deep)}
.c3-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.c3-tools .iconbtn.on{background:var(--primary-soft);color:var(--primary-deep)}
.c3-tools .iconbtn svg,.c3-head .ic{width:19px;height:19px}

.c3-body{display:grid;grid-template-columns:172px minmax(0,1fr) 272px;gap:12px;align-items:start}
.c3-body.no-today{grid-template-columns:172px minmax(0,1fr)}
.c3-main{min-width:0}
.c3-lbl{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:750;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-faint);margin:2px 2px 9px}
.c3-lib,.c3-today{position:sticky;top:72px;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;
  padding:13px;box-shadow:var(--sh-xs);max-height:calc(100dvh - 92px);overflow-y:auto;scrollbar-width:thin}
.c3-chips{display:grid;gap:5px}
.c3-chip{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;cursor:grab;user-select:none;-webkit-user-select:none;
  background:color-mix(in srgb,var(--bcs) 30%,var(--surface));border-left:3px solid var(--bcs);
  transition:transform 140ms var(--ease),box-shadow 140ms var(--ease)}
.c3-chip:hover{transform:translateX(3px);box-shadow:var(--sh-sm)}
.c3-chip .ic{width:15px;height:15px;flex:none;color:color-mix(in srgb,var(--bcs) 62%,#000)}
.c3-chip .cn{flex:1;min-width:0;font-size:12.5px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c3-chip .cd{font-size:10.5px;font-weight:650;opacity:.6;font-variant-numeric:tabular-nums}
.c3-chip.solid{background:var(--bcs);color:#eef1f4;border-left-color:rgba(255,255,255,.45)}
.c3-chip.solid .ic{color:#fff}
.c3-hint{font-size:11px;color:var(--text-faint);line-height:1.45;margin:10px 2px 0}
.c3-dtl{display:grid;gap:5px}
.c3-dt{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;background:var(--surface-2);font-size:12.5px;font-weight:620;text-align:left}
.c3-dt:hover{background:var(--surface-3)}
.c3-dt .ic{width:15px;height:15px;color:var(--text-muted)}
body.c3-dragging,body.c3-dragging *{cursor:grabbing!important;user-select:none}
.c3-float{position:fixed;left:0;top:0;z-index:300;pointer-events:none;display:flex;align-items:center;gap:7px;padding:8px 12px;
  border-radius:10px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--bcs) 45%,var(--surface));
  border-left:3px solid var(--bcs);box-shadow:var(--sh-lg);transform-origin:0 0}
.c3-float.solid{background:var(--bcs);color:#fff}
.c3-float .ic{width:15px;height:15px}

/* week grid */
.cal3 .grid-wrap{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;box-shadow:var(--sh-xs)}
.cal3 .grid-head{border-bottom:1px solid var(--line-soft);background:var(--surface)}
.cal3 .gh{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;cursor:pointer;border-right:none}
.cal3 .gh .dn{font-size:10.5px;font-weight:750;letter-spacing:.08em;color:var(--text-faint)}
.cal3 .gh .dd{font-size:14px;font-weight:720;padding:2px 9px;border-radius:var(--r-pill);font-variant-numeric:tabular-nums;box-shadow:none}
.cal3 .gh.today .dd{background:#d64545;color:#fff}
.cal3 .gh.today .dn{color:#d64545}
.cal3 .gh.free .dd{box-shadow:inset 0 0 0 1.5px #d64545}
.cal3 .gh .dh{font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.cal3 .gh.we .dn{opacity:.7}
.cal3 .gutter .hrow{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.cal3 .daycol{border-left:1px solid var(--line-soft)}
.cal3 .daycol.today{background:color-mix(in srgb,var(--primary) 4%,transparent)}
.cal3 .daycol.we{background:color-mix(in srgb,var(--text) 1.6%,transparent)}
.cal3 .slot{border-top:1px solid color-mix(in srgb,var(--line-soft) 70%,transparent)}
.cal3 .slot.off{background:color-mix(in srgb,var(--text) 2.4%,transparent)}
.cal3 .nowline{background:#d64545;height:2px}
.cal3 .nowline::before{background:#d64545}

/* the card */
.blk.v3{position:absolute;border:none;border-radius:8px;padding:5px 8px 5px 9px;overflow:hidden;color:var(--text);
  background:color-mix(in srgb,var(--bcs) 38%,var(--surface));
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--bcs) 88%,#000);
  transition:box-shadow 160ms var(--ease),transform 160ms var(--ease),filter 160ms var(--ease);cursor:pointer}
.blk.v3:hover{filter:brightness(1.03);box-shadow:inset 3px 0 0 color-mix(in srgb,var(--bcs) 88%,#000),0 6px 16px rgba(10,20,30,.14);z-index:4}
.blk.v3 .b3-h{display:flex;align-items:flex-start;gap:6px;min-width:0}
.blk.v3 .bico{width:14px;height:14px;flex:none;margin-top:1px;color:color-mix(in srgb,var(--bcs) 62%,#000)}
.blk.v3 .bt{flex:1;min-width:0;font-size:12.5px;font-weight:650;line-height:1.25;color:inherit!important;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk.v3 .bm{font-size:11px;font-weight:550;opacity:.72;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.v3 .b-note{font-size:11px;opacity:.72;margin-top:3px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk.v3 .b3-rep{position:absolute;right:6px;bottom:5px;opacity:.5}
.blk.v3 .b3-rep .ic{width:12px;height:12px}
.blk.v3 .b3-badge{position:absolute;right:6px;top:5px;opacity:.75}
.blk.v3 .b3-badge .ic{width:12px;height:12px}
.blk.v3.md .bt{-webkit-line-clamp:1}
.blk.v3.xs{padding:2px 7px 2px 8px}
.blk.v3.xs .b3-h{align-items:center}
.blk.v3.xs .bt{-webkit-line-clamp:1;font-size:11.5px}
.blk.v3.xs .bm{margin:0;font-size:10.5px}
.blk.v3.solid{background:var(--bcs);color:#eef1f4;box-shadow:inset 3px 0 0 rgba(255,255,255,.4)}
.blk.v3.solid .bico{color:#fff}
.blk.v3.virtual{opacity:.85;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bcs) 26%,var(--surface)) 0 8px,color-mix(in srgb,var(--bcs) 34%,var(--surface)) 8px 16px)}
.blk.v3.drag{z-index:20;box-shadow:0 14px 34px rgba(10,20,30,.28),inset 3px 0 0 var(--bcs);transform:scale(1.02);cursor:grabbing;opacity:.96}
.blk.v3 .rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk.v3 .rz::after{content:"";position:absolute;left:50%;bottom:2px;width:20px;height:3px;border-radius:2px;transform:translateX(-50%);
  background:currentColor;opacity:0;transition:opacity 140ms}
.blk.v3:hover .rz::after{opacity:.4}
[data-theme="dark"] .blk.v3:not(.solid){background:color-mix(in srgb,var(--bcs) 30%,var(--surface));box-shadow:inset 3px 0 0 var(--bcs)}
[data-theme="dark"] .blk.v3:not(.solid) .bico{color:color-mix(in srgb,var(--bcs) 75%,#fff)}
[data-theme="dark"] .c3-chip:not(.solid) .ic{color:color-mix(in srgb,var(--bcs) 75%,#fff)}
.lib-ghost{position:absolute;left:3px;right:3px;border-radius:8px;pointer-events:none;z-index:6;display:flex;align-items:flex-start;gap:6px;
  border:2px dashed var(--bcs);background:color-mix(in srgb,var(--bcs) 22%,transparent);font-size:11.5px;font-weight:700;padding:5px 8px;color:var(--text)}
.lib-ghost .ic{width:13px;height:13px}

/* mini month */
.c3-mini{position:relative;z-index:30;width:300px;margin:-6px 0 14px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:12px;box-shadow:var(--sh-lg);animation:hovIn 160ms var(--ease)}
.c3-mini-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.c3-mini-h .sel{flex:1;min-height:34px;padding:4px 8px;font-size:13px}
.c3-mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.c3-mini-dn{font-size:10px;font-weight:700;color:var(--text-faint);text-align:center;padding:3px 0}
.c3-mini-d{position:relative;height:34px;border-radius:9px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.c3-mini-d:hover{background:var(--surface-3)}
.c3-mini-d.out{opacity:.35}
.c3-mini-d.today{color:#d64545;font-weight:800}
.c3-mini-d.sel{background:var(--text);color:var(--bg)}
.c3-mini-d i{position:absolute;left:50%;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--primary);transform:translateX(-50%)}

/* today panel */
.c3-td{font-size:17px;font-weight:720;letter-spacing:-.02em;margin:-4px 2px 10px}
.c3-live{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;margin-bottom:8px;cursor:pointer;
  background:color-mix(in srgb,var(--bcs) 18%,var(--surface-2))}
.c3-live.on{box-shadow:0 0 0 1px color-mix(in srgb,var(--bcs) 50%,transparent),0 0 18px color-mix(in srgb,var(--bcs) 26%,transparent);animation:liveP 3.2s ease-in-out infinite}
@keyframes liveP{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--bcs) 50%,transparent),0 0 26px color-mix(in srgb,var(--bcs) 40%,transparent)}}
.c3-live .lv-ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--bcs);color:#fff}
.c3-live .lv-ic .ic{width:17px;height:17px}
.c3-live b{display:block;font-size:14px}
.c3-live small{display:block;font-size:12px;color:var(--text-muted)}
.c3-dayprog{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:0 2px 12px}
.c3-dayprog i{display:block;height:100%;background:var(--primary);border-radius:3px}
.c3-adl{display:grid;gap:4px;margin-bottom:8px}
.c3-agl{display:grid;gap:5px}
.c3-ag{display:grid;grid-template-columns:42px 3px 22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 8px;border-radius:11px;
  background:color-mix(in srgb,var(--bcs) 14%,var(--surface));cursor:pointer;transition:background 140ms}
.c3-ag:hover{background:color-mix(in srgb,var(--bcs) 24%,var(--surface))}
.c3-ag.past{opacity:.5}
.c3-ag .ag-t{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.c3-ag .ag-t small{display:block;font-size:10.5px;font-weight:550;color:var(--text-faint)}
.c3-ag .ag-bar{align-self:stretch;border-radius:2px;background:var(--bcs)}
.c3-ag .ag-ic .ic{width:16px;height:16px;color:color-mix(in srgb,var(--bcs) 62%,#000)}
[data-theme="dark"] .c3-ag .ag-ic .ic{color:color-mix(in srgb,var(--bcs) 75%,#fff)}
.c3-ag .ag-main{min-width:0}
.c3-ag .ag-main b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c3-ag .ag-main small{display:block;font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c3-ag .ag-rep .ic{width:13px;height:13px;opacity:.5}
.c3-free{font-size:11.5px;color:var(--text-faint);padding:2px 10px 2px 58px;font-variant-numeric:tabular-nums}
.c3-empty{display:grid;gap:10px;justify-items:start;padding:14px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--text-muted)}
.c3-empty.sm{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.c3-bud{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.c3-bud div{padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.c3-bud span{display:block;font-size:10.5px;font-weight:650;color:var(--text-faint)}
.c3-bud b{font-size:13.5px;font-variant-numeric:tabular-nums}
.c3-follow{margin-top:12px;font-size:12.5px;color:var(--text-muted)}
.c3-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;margin-bottom:14px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--primary) 12%,var(--surface)),var(--surface));border:1px solid var(--line-soft)}
.c3-banner b{display:block;font-size:14px}.c3-banner small{display:block;font-size:12.5px;color:var(--text-muted)}
.c3-banner>span .ic{width:20px;height:20px;color:var(--primary)}

/* month */
.c3-month{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;box-shadow:var(--sh-xs)}
.c3-mh{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line-soft)}
.c3-mh span{padding:9px;font-size:10.5px;font-weight:750;letter-spacing:.08em;color:var(--text-faint);text-align:center}
.c3-mg{display:grid;grid-template-columns:repeat(7,1fr)}
.c3-mc{min-height:118px;padding:6px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);cursor:pointer;
  display:flex;flex-direction:column;gap:3px;min-width:0;transition:background 140ms}
.c3-mc:hover{background:var(--surface-2)}
.c3-mc.out{opacity:.45}
.c3-mc.free{background:color-mix(in srgb,#d64545 4%,transparent)}
.c3-mc-h{display:flex;align-items:center;justify-content:space-between}
.c3-mc .dnum{font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:var(--r-pill);font-variant-numeric:tabular-nums}
.c3-mc.today .dnum{background:#d64545;color:#fff}
.c3-madd{opacity:0;min-height:24px;height:24px;width:24px;min-width:24px}
.c3-mc:hover .c3-madd{opacity:1}
.c3-mev{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px;font-size:11px;min-width:0;
  background:color-mix(in srgb,var(--bcs) 30%,var(--surface))}
.c3-mev .ic{width:11px;height:11px;flex:none}
.c3-mev span{font-variant-numeric:tabular-nums;opacity:.7;flex:none}
.c3-mev b{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c3-mev.solid{background:var(--bcs);color:#eef1f4}
.c3-more{font-size:10.5px;color:var(--text-faint);padding-left:4px}

/* bottom sheet list */
.c3-sh-h{padding:6px 2px 12px}.c3-sh-h b{display:block;font-size:17px}.c3-sh-h span{font-size:12.5px;color:var(--text-muted)}
.c3-sh-list{display:grid;gap:6px}
.c3-sh-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:var(--surface-2);text-align:left;min-height:56px}
.c3-sh-row:active{transform:scale(.99)}
.c3-sh-row .sw{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bcs) 40%,var(--surface));box-shadow:inset 3px 0 0 var(--bcs)}
.c3-sh-row .sw.solid{background:var(--bcs);color:#fff}
.c3-sh-row .sw .ic{width:17px;height:17px}
.c3-sh-row b{flex:1;font-size:14.5px}
.c3-sh-row>.ic{width:16px;height:16px;color:var(--text-faint)}
.ps-head .ps-ic .ic{width:24px;height:24px}
.ps-head.solid{background:var(--bcs);color:#fff}

/* icon picker, editor */
.ip-prev{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:0 auto;
  background:color-mix(in srgb,var(--bcs) 35%,var(--surface));box-shadow:inset 3px 0 0 var(--bcs)}
.ip-prev .ic{width:30px;height:30px}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:340px;overflow-y:auto}
.ip-i{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:11px;background:var(--surface-2)}
.ip-i:hover,.ip-i.on{background:var(--primary-soft);color:var(--primary-deep)}
.ip-i .ic{width:22px;height:22px}
.ip-i span{font-size:10.5px;text-align:center;line-height:1.2}
.le-ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bcs) 38%,var(--surface));box-shadow:inset 3px 0 0 var(--bcs)}
.le-ic.solid{background:var(--bcs);color:#fff}
.le-ic .ic{width:18px;height:18px}
.rte-emo.big .ic{width:26px;height:26px}

/* preview / templates / weekly / ics */
.pv-day{margin-bottom:12px}.pv-day h4{font-size:13px;margin:0 0 6px;color:var(--text-2)}
.pv-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);margin-bottom:4px;cursor:pointer}
.pv-row.dup{opacity:.55;cursor:default}
.pv-ic .ic{width:16px;height:16px}
.pv-l{flex:1;font-size:13.5px}
.pv-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--text-muted)}
.pv-tag.warn{background:var(--warning-soft);color:var(--warning)}
.dt-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.dt-row small{display:block}
.wp-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.wp-d{width:78px;font-size:13px}.wp-row .sel{flex:1}
.ics-warn{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warning-soft);font-size:13px;line-height:1.6;margin-bottom:12px}
.ics-warn .ic{width:16px;height:16px;flex:none;color:var(--warning);margin-top:2px}
.ics-feeds{display:grid;gap:6px}
.ics-f{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.ics-f i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ics-f small{display:block;font-size:11.5px;color:var(--text-muted);margin:3px 0 0 30px}
.ics-url{display:flex;align-items:center;gap:8px;margin:8px 0 0 30px}
.ics-url code{flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface);padding:5px 8px;border-radius:7px}

/* supplements */
.su-card .panel-t{display:flex;align-items:center;gap:7px}.su-card .panel-t .ic{width:17px;height:17px}
.su-cnt{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:var(--warning-soft);color:var(--warning)}
.su-cnt.ok{background:var(--success-soft);color:var(--success)}
.su-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px;text-align:left;touch-action:manipulation;
  transition:background 140ms}
.su-row:hover{background:var(--surface-2)}
.su-chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:#fff;
  transition:background 180ms,border-color 180ms}
.su-chk .ic{width:13px;height:13px;opacity:0}
.su-row.done .su-chk{background:var(--primary);border-color:var(--primary)}
.su-row.done .su-chk .ic{opacity:1}
.su-ic .ic{width:17px;height:17px;color:var(--text-muted)}
.su-n{flex:1;min-width:0}.su-n b{display:block;font-size:13.5px;font-weight:620}
.su-n small{display:block;font-size:11.5px;color:var(--text-muted)}
.su-row.done .su-n b{color:var(--text-faint);text-decoration:line-through}
.su-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.su-rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.su-rings span{display:block;font-size:12px;font-weight:700;margin-top:4px}
.su-rings small{display:block;font-size:10.5px;color:var(--text-faint)}
.su-rt{font-size:14px;font-weight:750;fill:var(--text)}
.su-streak{height:70px;display:flex;align-items:center;justify-content:center;gap:4px}
.su-streak .ic{width:20px;height:20px;color:var(--warning)}.su-streak b{font-size:24px}
.su-bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:16px}
.su-bars i{flex:1;border-radius:3px;background:var(--second);opacity:.8}
.su-bars i.none{background:var(--surface-3);opacity:1}
.su-list{display:grid;gap:6px}
.su-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line-soft)}
.su-item.paused{opacity:.55}
.su-ic.big{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2)}
.su-st{text-align:right}.su-st b{display:block;font-size:15px}.su-st small{font-size:11px;color:var(--text-muted)}

/* home live status */
.now2{flex:1;display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-radius:var(--r-xl);background:var(--surface);
  border:1px solid var(--line-soft);box-shadow:var(--sh-sm)}
.n2-top{display:flex;align-items:flex-start;gap:12px}
.n2-date{font-size:12.5px;font-weight:650;color:var(--text-muted)}
.n2-clock{font-size:44px;font-weight:760;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums}
.n2-pills{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.n2-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);font-size:12px;font-weight:700;cursor:pointer}
.n2-pill .ic{width:14px;height:14px}
.n2-pill.open{background:var(--warning-soft);color:var(--warning)}
.n2-pill.ok{background:var(--success-soft);color:var(--success)}
.n2-status{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;cursor:pointer;
  background:color-mix(in srgb,var(--nowc) 16%,var(--surface-2))}
.n2-status.live{box-shadow:0 0 0 1px color-mix(in srgb,var(--nowc) 45%,transparent),0 0 20px color-mix(in srgb,var(--nowc) 22%,transparent);animation:n2P 3.4s ease-in-out infinite}
@keyframes n2P{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--nowc) 55%,transparent),0 0 30px color-mix(in srgb,var(--nowc) 36%,transparent)}}
.n2-ic{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--nowc);color:#fff}
.n2-ic .ic{width:20px;height:20px}
.n2-tx{flex:1;min-width:0}.n2-tx b{display:block;font-size:16.5px;letter-spacing:-.02em}
.n2-tx small{display:block;font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.n2-dot{width:9px;height:9px;border-radius:50%;background:var(--nowc);box-shadow:0 0 0 4px color-mix(in srgb,var(--nowc) 25%,transparent)}
.n2-bar{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.n2-bar i{display:block;height:100%;background:var(--nowc)}
.n2-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--text-muted)}
.n2-foot .ic{width:13px;height:13px;vertical-align:-2px;margin:0 3px}
.n2-bud{margin-left:auto;font-variant-numeric:tabular-nums}

@media (max-width:1280px){
  .c3-body{grid-template-columns:168px minmax(0,1fr)}
  .c3-body .c3-today{grid-column:1/-1;position:static;max-height:none}
}
/* ================= MOBILE ================= */
@media (max-width:860px){
  .cal3{padding-bottom:150px}
  .c3-head{gap:8px;margin-bottom:10px}
  .c3-ttl{flex:1 1 100%;display:flex;align-items:baseline;justify-content:space-between}
  .c3-ttl h1{font-size:21px}
  .c3-tools{margin-left:0}
  .c3-tools .btn.primary span{display:none}
  .c3-tools [data-c3plan],.c3-tools [data-c3dtpl]{display:none}
  .c3-seg{flex:1}.c3-seg button{flex:1}
  .c3-mini{width:auto;margin:0 0 12px}
  .c3-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}

/* ============================================================
   2. PERSISTENCE  — File System Access API + IndexedDB buffer
   ============================================================ */
const DB={name:"life-os",store:"kv",_p:null};
function idb(){
  if(DB._p)return DB._p;
  if(typeof indexedDB==="undefined"){DB._p=Promise.reject(new Error("no indexedDB"));return DB._p;}
  DB._p=new Promise((res,rej)=>{
    const r=indexedDB.open(DB.name,1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(DB.store))d.createObjectStore(DB.store);};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return DB._p;
}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(DB.store,"readonly").objectStore(DB.store).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(DB.store,"readwrite").objectStore(DB.store).put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(DB.store,"readwrite").objectStore(DB.store).delete(k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}

async function verifyPerm(h,write=true){

  if(await h.queryPermission(o)==="granted")return true;
  if(await h.requestPermission(o)==="granted")return true;

}

async function restoreHandle(){
  if(!FS_SUPPORTED)return false;
  try{
    const h=await idbGet("handle");
    if(!h)return false;
    if(await h.queryPermission({mode:"readwrite"})==="granted"){
      fileHandle=h; setSave("saved","Verbunden · "+h.name);
      try{const t=await(await h.getFile()).text();const d=JSON.parse(t);
        if(d&&d.schemaVersion&&(!S.meta||new Date(d.meta?.updated||0)>=new Date(S.meta?.updated||0))){S=migrate(d);}
      }catch(e){}

    }

    pendingHandle=h; setSave("dirty","Datei bestätigen");

  }catch(e){return false;}

let pendingHandle=null;

      if(d&&d.schemaVersion){S=migrate(d);}

function migrate(d){
  if(!d||typeof d!=="object")return seedState();
  const base=seedState();
  // fill gaps without discarding anything the file already has
  const out={...base,...d};
  out.schemaVersion=SCHEMA_VERSION;
  out.settings={...base.settings,...(d.settings||{})};
  out.settings.heroes={...(d.settings?.heroes||{})};
  out.settings.categories=(d.settings?.categories?.length?d.settings.categories:base.settings.categories);
  out.settings.blockTypes=(d.settings?.blockTypes?.length?d.settings.blockTypes:base.settings.blockTypes);
  out.growth={...base.growth,...(d.growth||{})};
  out.routines={morning:{...base.routines.morning,...(d.routines?.morning||{})},
                evening:{...base.routines.evening,...(d.routines?.evening||{})}};
  out.meta={...base.meta,...(d.meta||{})};
  ["tasks","notes","journal","blocks","recipes","habits","favorites"].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  ["routineHistory","habitLog"].forEach(k=>{if(!out[k]||typeof out[k]!=="object")out[k]={};});
  if(d.cleaning)out.cleaning=d.cleaning;
  return ensureV2(out);
}

function pickImage(cb,maxW=1400){
  const i=document.createElement("input");
  i.type="file";i.accept="image/*";
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxW/img.width);
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.82));
      };
      img.onerror=()=>cb(rd.result);
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  i.click();
}

function currentBlock(){
  const n=berlinNow(),m=n.getHours()*60+n.getMinutes(),key=todayKey();
  const list=blocksFor(key);
  const now=list.find(b=>minutes(b.start)<=m&&minutes(b.end)>m);
  const next=list.find(b=>minutes(b.start)>m);
  return {now,next,m,list};
}
/** Lay out overlapping blocks into columns. */
function layout(list){
  const out=[];let cluster=[],clusterEnd=-1;
  const flush=()=>{
    if(!cluster.length)return;
    const cols=[];
    cluster.forEach(b=>{
      let ci=cols.findIndex(c=>minutes(c[c.length-1].end)<=minutes(b.start));
      if(ci<0){cols.push([b]);ci=cols.length-1;}else cols[ci].push(b);
      b._col=ci;
    });
    cluster.forEach(b=>{b._cols=cols.length;out.push(b);});
    cluster=[];
  };
  list.forEach(b=>{
    if(cluster.length&&minutes(b.start)>=clusterEnd){flush();clusterEnd=-1;}
    cluster.push(b);clusterEnd=Math.max(clusterEnd,minutes(b.end));
  });
  flush();
  return out;
}

function rStreak(rid){
  const total=rTotal(rid); if(!total)return 0;
  const need=Math.ceil(total*0.6);
  let n=0,d=berlinNow();
  for(let i=0;i<400;i++){
    const h=S.routineHistory[dkey(d)];
    const c=h&&h[rid]?Object.keys(h[rid]).length:0;
    if(c>=need)n++; else break;
    d=addDays(d,-1);
  }
  return n;
}

}

let calView="week";
let calAnchor=todayKey();
let HH=54; // px per hour

function calRange(){
  const a=parseKey(calAnchor);
  if(calView==="day")return[dkey(a)];
  if(calView==="week"){const s=startOfWeek(a);return Array.from({length:7},(_,i)=>dkey(addDays(s,i)));}
  const first=new Date(a.getFullYear(),a.getMonth(),1);
  const s=startOfWeek(first);
  return Array.from({length:42},(_,i)=>dkey(addDays(s,i)));
}
function calLabel(){
  const a=parseKey(calAnchor);
  if(calView==="day")return fmtDateLong(calAnchor);
  if(calView==="month")return `${MONL[a.getMonth()]} ${a.getFullYear()}`;
  const r=calRange();const s=parseKey(r[0]),e=parseKey(r[6]);
  return `${s.getDate()}. ${MONL[s.getMonth()].slice(0,3)} – ${e.getDate()}. ${MONL[e.getMonth()].slice(0,3)} ${e.getFullYear()}`;
}
function calShift(n){
  calScrollPos=null;
  const a=parseKey(calAnchor);
  if(calView==="day")calAnchor=dkey(addDays(a,n));
  else if(calView==="week")calAnchor=dkey(addDays(a,n*7));
  else {a.setMonth(a.getMonth()+n);calAnchor=dkey(a);}
  render();
}
