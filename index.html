/* ---- drag & drop / resize on the time grid ---- */
let drag=null;
let dragEndedAt=0;
function calPointerDown(e){
  const blkEl=e.target.closest(".blk");
  const rzEl=e.target.closest(".rz");
  if(!blkEl)return;
  const dayEl=blkEl.closest(".daycol");if(!dayEl)return;
  const id=blkEl.dataset.blk,dk=blkEl.dataset.dk;
  if(!id)return;
  const b=occursOn(S.blocks.find(x=>x.id===id),dk); if(!b)return;
  e.preventDefault();
  drag={
    id,dk,el:blkEl,mode:rzEl?"resize":"move",
    startY:e.clientY,startX:e.clientX,
    origStart:minutes(b.start),origEnd:minutes(b.end),
    moved:false,
    colW:dayEl.getBoundingClientRect().width,
    days:$$(".daycol").map(d=>({key:d.dataset.day,rect:d.getBoundingClientRect()}))
  };
  blkEl.classList.add("drag");
  blkEl.setPointerCapture?.(e.pointerId);
}

function calPointerUp(){
  if(!drag)return;
  const d=drag;drag=null;
  d.el.classList.remove("drag");d.el.style.opacity="";
  dragEndedAt=Date.now();
  if(!d.moved){ blockDlg(d.id,d.dk); return; }
  if(d.curStart==null){render();return;}
  const base=S.blocks.find(x=>x.id===d.id); if(!base){render();return;}
  const newStart=hhmm(d.curStart),newEnd=hhmm(d.curEnd);
  const targetDay=d.targetDay||d.dk;
  const commitOne=()=>{
    base.exceptions=base.exceptions||{};
    const cur=occursOn(base,d.dk)||{};
    if(targetDay!==d.dk){
      base.exceptions[d.dk]={deleted:true};
      S.blocks.push({id:uid(),created:Date.now(),title:cur.title,type:cur.type,notes:cur.notes||"",
        start:newStart,end:newEnd,date:targetDay,recurrence:null,exceptions:{},taskId:cur.taskId||null});
    } else {
      base.exceptions[d.dk]={...(base.exceptions[d.dk]||{}),start:newStart,end:newEnd};
    }
    save();render();
  };
  const commitAll=()=>{
    base.start=newStart;base.end=newEnd;
    if(base.recurrence&&targetDay!==d.dk){
      const from=dowIdx(parseKey(d.dk)),to=dowIdx(parseKey(targetDay));
      base.recurrence.days=(base.recurrence.days||[]).map(x=>x===from?to:x);
      base.recurrence.days=[...new Set(base.recurrence.days)].sort();
    }
    if(base.date)base.date=targetDay;
    save();render();
  };
  if(base.recurrence)seriesChoice("Verschieben",commitOne,commitAll);
  else commitAll();
}

function habitDone(h,key){return !!(S.habitLog[key]&&S.habitLog[key][h.id]);}

  if(S.habitLog[k][id])delete S.habitLog[k][id];else S.habitLog[k][id]=true;

function habitWeek(h){
  const s=startOfWeek(berlinNow());
  return Array.from({length:7},(_,i)=>{
    const k=dkey(addDays(s,i));
    return {k,done:habitDone(h,k),future:k>todayKey()};
  });

function applyImport(data,mode){
  const inc=migrate(data);
  if(mode==="replace"){ S=inc; }
  else{
    const mergeArr=(a,b,key="id")=>{
      const seen=new Set(a.map(x=>x[key]));
      return a.concat(b.filter(x=>!seen.has(x[key])));
    };
    S.tasks=mergeArr(S.tasks,inc.tasks); S.notes=mergeArr(S.notes,inc.notes);
    S.blocks=mergeArr(S.blocks,inc.blocks); S.recipes=mergeArr(S.recipes,inc.recipes);
    S.habits=mergeArr(S.habits,inc.habits);
    ["learnings","courses","books","podcasts","videos"].forEach(k=>{S.growth[k]=mergeArr(S.growth[k],inc.growth[k]||[]);});
    const jSeen=new Set(S.journal.map(j=>j.date));
    S.journal=S.journal.concat((inc.journal||[]).filter(j=>!jSeen.has(j.date))).sort((a,b)=>b.date.localeCompare(a.date));
    Object.entries(inc.routineHistory||{}).forEach(([k,v])=>{if(!S.routineHistory[k])S.routineHistory[k]=v;});
    Object.entries(inc.habitLog||{}).forEach(([k,v])=>{if(!S.habitLog[k])S.habitLog[k]=v;});
  }
  save();render();
}

    const el=e.target;
    if(el.matches('[tabindex="0"]')&&!el.matches("input,textarea,select,button,a")){
      e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}));return;

    e.preventDefault();openSearch();return;}
  if(e.key==="Escape"&&modalStack.length){modalStack[modalStack.length-1]();}
});

function effectiveTheme(){
  const t=S.settings.theme||"auto";
  if(t!=="auto")return t;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function applyTheme(){
  const t=effectiveTheme();
  document.documentElement.setAttribute("data-theme",t);
  const btn=$("#btnTheme");
  if(btn)btn.innerHTML=ic(t==="dark"?"sun":"moon");
}
function cycleTheme(){
  const order=["auto","light","dark"];
  const cur=S.settings.theme||"auto";
  S.settings.theme=order[(order.indexOf(cur)+1)%3];
  applyTheme();save();
  toast(`Darstellung: ${({auto:"automatisch",light:"hell",dark:"dunkel"})[S.settings.theme]}`);
  if(route.view==="settings")render();
}

   PWA — real manifest, injected at runtime. No service worker,
   so this is an installable shell, not an offline app.
   ============================================================ */
function installManifest(){
  try{
    const icon="data:image/svg+xml,"+encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1cb389"/><stop offset="1" stop-color="#6c7bd9"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#g)"/><path d="M256 108 404 256 256 404 108 256z" fill="#fff"/><path d="M256 176 336 256 256 336 176 256z" fill="#1cb389"/></svg>`);
    const mf={
      name:"Life OS",short_name:"Life OS",
      description:"Persönliches Betriebssystem für Tag, Aufgaben, Kalender, Haushalt und Wissen.",
      start_url:".",scope:".",display:"standalone",orientation:"portrait-primary",
      background_color:"#f5f7f5",theme_color:"#14a07a",lang:"de",
      icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]
    };
    const url=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
    const link=document.createElement("link");
    link.rel="manifest";link.href=url;
    document.head.appendChild(link);
  }catch(e){/* manifests need an http(s) origin; harmless when opened from a file */}
}
const IS_STANDALONE=()=>window.matchMedia?.("(display-mode: standalone)").matches||window.navigator.standalone===true;

function openSearch(){
  let cur=0;
  return modal({title:"",body:"",onMount(o,close){
    const mod=o.querySelector(".modal");
    mod.innerHTML=`<div style="display:flex;align-items:center;padding-left:20px">
        <span style="color:var(--text-faint)">${ic("search")}</span>
        <input class="srch-in" id="sq" placeholder="Alles durchsuchen …" autocomplete="off" aria-label="Suche">
      </div><div class="srch-res" id="sr"></div>`;
    const inp=mod.querySelector("#sq"),res=mod.querySelector("#sr");
    let items=[];
    const draw=()=>{
      items=searchAll(inp.value);
      if(!inp.value.trim()){
        res.innerHTML=`<div style="padding:18px 16px;font-size:13.5px;color:var(--text-muted);line-height:1.6">
          Durchsucht Aufgaben, Notizen, Journal, Rezepte, Learnings, Bücher, Haushalt und Zeitblöcke.</div>`;return;}
      if(!items.length){
        res.innerHTML=`<div style="padding:18px 16px;font-size:13.5px;color:var(--text-muted)">Nichts gefunden für „${esc(inp.value)}“.</div>`;return;}
      cur=clamp(cur,0,items.length-1);
      res.innerHTML=items.map((r,i)=>`<div class="sres ${i===cur?"cur":""}" data-i="${i}">
        <span class="e">${ic(r.e)}</span><span class="t">${esc(r.t)}</span><span class="k">${r.k}</span></div>`).join("");
      res.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{close();items[+el.dataset.i].go();});
    };
    inp.oninput=()=>{cur=0;draw();};
    inp.onkeydown=e=>{
      if(e.key==="ArrowDown"){e.preventDefault();cur=Math.min(cur+1,items.length-1);draw();res.querySelector(".cur")?.scrollIntoView({block:"nearest"});}
      else if(e.key==="ArrowUp"){e.preventDefault();cur=Math.max(cur-1,0);draw();res.querySelector(".cur")?.scrollIntoView({block:"nearest"});}
      else if(e.key==="Enter"&&items[cur]){close();items[cur].go();}
      else if(e.key==="Escape")close();
    };
    draw();setTimeout(()=>inp.focus(),40);
  }});
}

function renderNow(){
  const {now,next,m}=currentBlock();
  if(!now){
    return `<div class="now idle" id="nowBlock">
      <div class="now-k">Gerade</div>
      <div class="now-title" style="margin-top:12px;font-size:24px">Nichts geplant</div>
      <div class="now-note">Für diesen Moment steht nichts im Kalender.</div>
      <div class="now-next">${next
        ? `<span class="dot" style="background:${btype(next.type).color}"></span>
           <span>Als Nächstes <b>${esc(next.title)}</b> um ${next.start}</span>`
        : `<span>Der Rest des Tages ist frei.</span>`}</div>
    </div>`;
  }
  const c=btype(now.type).color;
  const total=minutes(now.end)-minutes(now.start);
  const done=clamp((m-minutes(now.start))/total,0,1);
  const left=minutes(now.end)-m;
  const leftTxt=left>=60?`${Math.floor(left/60)} h ${left%60?left%60+" min":""}`.trim():`${left} min`;
  return `<div class="now" id="nowBlock" style="--nowc:${c}">
    <div class="now-k">Gerade</div>
    <div class="now-time">${now.start} – ${now.end}</div>
    <div class="now-title">${esc(now.title)}</div>
    <div class="now-note">noch ${leftTxt}${now.notes?" · "+esc(now.notes):""}</div>
    <div class="now-bar"><i style="width:${(done*100).toFixed(1)}%"></i></div>
    <div class="now-next">${next
      ? `<span>Danach <b>${esc(next.title)}</b> · ${next.start}</span>`
      : `<span>Danach ist der Tag offen.</span>`}</div>
  </div>`;
}

function sparkHTML(vals,color,h=44){
  if(!vals.length)return"";
  const w=Math.max(vals.length*14,80),max=Math.max(1,...vals);
  const bw=w/vals.length;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    ${vals.map((v,i)=>{
      const bh=Math.max(2,v/max*(h-4));
      return `<rect x="${(i*bw+bw*0.18).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw*0.64).toFixed(1)}"
        height="${bh.toFixed(1)}" rx="${Math.min(3,bw*0.3).toFixed(1)}" fill="${color}" opacity="${v?1:.22}"/>`;}).join("")}
  </svg>`;
}
function viewInsights(){
  const days=Array.from({length:14},(_,i)=>dkey(addDays(berlinNow(),-13+i)));
  const mVals=days.map(k=>{const h=S.routineHistory[k];return h?Object.keys(h.morning||{}).length:0;});
  const eVals=days.map(k=>{const h=S.routineHistory[k];return h?Object.keys(h.evening||{}).length:0;});
  const tVals=days.map(k=>S.tasks.filter(t=>t.completedAt&&dkey(new Date(t.completedAt))===k).length);
  const jVals=days.map(k=>{const j=S.journal.find(x=>x.date===k);return j&&!isEmptyEntry(j)?(j.mood||3):0;});
  const hVals=days.map(k=>Object.keys(S.habitLog[k]||{}).length);

  const jAll=S.journal.filter(j=>!isEmptyEntry(j));
  const avg=f=>{const v=jAll.filter(x=>x[f]).slice(0,30);return v.length?(v.reduce((a,b)=>a+b[f],0)/v.length).toFixed(1):"–";};
  const doneTotal=S.tasks.filter(t=>t.status==="done").length;
  const sessions=[];let k=curSession();

    <div class="grid">

      <div class="c4">
        <div class="panel" style="height:100%">
          <div class="panel-b">
            <div class="eyebrow">Home Reset</div>
            <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">
              <span class="num" style="font-size:30px">${cAvg}%</span><span class="meta">Schnitt</span></div>
            <div style="margin-top:16px;display:grid;gap:9px">
              ${sessions.slice(0,5).map(s=>{const p=cleanProgress(s);
                return `<div style="display:flex;align-items:center;gap:10px">
                  <span class="meta" style="width:62px">${esc(fmtDate(s))}</span>

          <div class="panel-b stats">
            <div class="stat"><div class="v">${doneTotal}</div><div class="l">Aufgaben erledigt</div></div>
            <div class="stat"><div class="v">${jAll.length}</div><div class="l">Journal-Einträge</div></div>

   ============================================================ */
const C_=()=>S.cleaning;
const person=id=>C_().people.find(p=>p.id===id)||{id:"",name:"—",color:"#888"};
const zone=id=>C_().zones.find(z=>z.id===id)||{id:"",name:"—",emoji:"",ownerId:""};
const zoneOwner=t=>zone(t.zoneId).ownerId;

function cleanSessionOn(key){ return dowIdx(parseKey(key))===(C_()?.schedule?.weekday??5); }
function nextSessionKey(from){
  let d=parseKey(from||todayKey());
  for(let i=0;i<8;i++){ if(cleanSessionOn(dkey(d)))return dkey(d); d=addDays(d,1); }
  return todayKey();
}
function prevSessionKey(from){
  let d=addDays(parseKey(from||todayKey()),-1);
  for(let i=0;i<8;i++){ if(cleanSessionOn(dkey(d)))return dkey(d); d=addDays(d,-1); }
  return null;
}
const shiftSession=(key,dir)=>dkey(addDays(parseKey(key),7*dir));
let cleanDate=null, cleanTab="reset", cleanWho="";
const curSession=()=>cleanDate||(cleanDate=nextSessionKey());

/** Deep-clean tasks only run in the first session of a month. */
function cleanTaskDue(t,key){
  if(t.level==="deep")return parseKey(key).getDate()<=7;
  return true;
}
function cleanStatus(id,key){ return C_().log?.[key]?.[id]?.status||null; }
const cleanDone=(id,key)=>cleanStatus(id,key)==="done";
function cleanSet(id,key,status){
  const L=C_().log; if(!L[key])L[key]={};
  if(!status)delete L[key][id];
  else L[key][id]={status,at:Date.now()};
  save();
}
function cleanCycle(id,key){
  const cur=cleanStatus(id,key);
  cleanSet(id,key,cur==="done"?null:"done");
}
function flagReview(id,key){
  const R=C_().reviews; if(!R[key])R[key]={};
  if(R[key][id])delete R[key][id]; else R[key][id]=true;
  save();
}
const isFlagged=(id,key)=>!!C_().reviews?.[key]?.[id];

function tasksForSession(key,ownerId,level){
  return C_().tasks.filter(t=>cleanTaskDue(t,key)
    &&(!ownerId||zoneOwner(t)===ownerId)
    &&(!level||t.level===level));
}
function groupedForPerson(personId,key){
  const zones=C_().zones.filter(z=>z.ownerId===personId).sort((a,b)=>(a.order||0)-(b.order||0));
  return zones.map(z=>({zone:z,tasks:C_().tasks.filter(t=>t.zoneId===z.id&&cleanTaskDue(t,key))
    .sort((a,b)=>(a.level==="deep")-(b.level==="deep"))}))
    .filter(g=>g.tasks.length);
}
function cleanProgress(key,personId,level){
  const k=key||curSession();
  if(!C_()||!C_().enabled)return{done:0,total:0,pct:0,mins:0,minsTotal:0};
  const all=tasksForSession(k,personId,level);
  const done=all.filter(t=>cleanDone(t.id,k));
  return{done:done.length,total:all.length,pct:all.length?done.length/all.length:0,
    mins:all.filter(t=>!cleanDone(t.id,k)).reduce((s,t)=>s+(t.mins||0),0),
    minsTotal:all.reduce((s,t)=>s+(t.mins||0),0)};
}
const cleanOpenCount=()=>{const p=cleanProgress();return p.total-p.done;};

function balanceFor(key){
  const P=C_().people;
  const load=P.map(p=>({p,min:cleanProgress(key,p.id).minsTotal}));
  const max=Math.max(...load.map(l=>l.min),1),min=Math.min(...load.map(l=>l.min));
  const spread=(max-min)/max;
  return{load,spread,
    level:spread<=0.12?"good":spread<=0.28?"mid":"bad",
    label:spread<=0.12?"Ausgeglichen":spread<=0.28?"Leicht ungleich":"Sollte angepasst werden"};
}
function overdueTasks(){
  const out=[];const since=C_().firstRun||todayKey();
  let k=prevSessionKey(todayKey());
  // only the last two sessions, and only ones the household actually lived through
  for(let i=0;i<2&&k;i++){
    if(k<since)break;
    // a session nobody ever opened is not "missed", it simply never happened
    if(C_().log[k]||C_().sessions[k]){
      tasksForSession(k).forEach(t=>{
        const st=cleanStatus(t.id,k);
        if(st!=="done")out.push({task:t,key:k,status:st,catchUp:dkey(addDays(parseKey(k),1))});
      });
    }
    k=prevSessionKey(k);
  }
  return out;
}
/* ---- rotation: stable for four weeks, then offered ---- */
function rotationDue(){
  const R=C_().rotation||{};
  if(R.dismissedUntil&&todayKey()<R.dismissedUntil)return false;
  if(!R.lastRotated)return daysBetween(C_().firstRun||todayKey(),todayKey())>=28;
  return daysBetween(R.lastRotated,todayKey())>=28;
}
function rotateZones(){
  const P=C_().people;
  if(P.length<2)return;
  const ids=P.map(p=>p.id);
  C_().zones.forEach(z=>{
    const i=ids.indexOf(z.ownerId);
    z.ownerId=ids[(i+1)%ids.length];
  });
  C_().rotation={lastRotated:todayKey(),dismissedUntil:null};
  save();render();
  toast("Zuständigkeiten getauscht.",()=>{
    C_().zones.forEach(z=>{const i=ids.indexOf(z.ownerId);z.ownerId=ids[(i-1+ids.length)%ids.length];});
    C_().rotation.lastRotated=null;save();render();});
}
/* ---- session timer ---- */
function sessionTimer(key){ return C_().sessions?.[key]||null; }
function startSession(key){
  if(!C_().sessions)C_().sessions={};
  C_().sessions[key]={startedAt:Date.now(),endedAt:null};save();render();
}
function endSession(key){
  const s=sessionTimer(key); if(!s)return;
  s.endedAt=Date.now();save();render();
  const p=cleanProgress(key);
  toast(`Durchgang beendet · ${p.done} von ${p.total} erledigt.`);
}
function fmtDur(ms){
  const m=Math.floor(ms/60000),h=Math.floor(m/60);
  return h?`${h}:${String(m%60).padStart(2,"0")}`:`${m} min`;
}
/* ---- daily ten-minute reset ---- */
function dailyDone(personId,itemId,key){ return !!C_().dailyLog?.[key||todayKey()]?.[personId]?.[itemId]; }
function dailyToggle(personId,itemId){
  const k=todayKey(),L=C_().dailyLog;
  if(!L[k])L[k]={};
  if(!L[k][personId])L[k][personId]={};
  if(L[k][personId][itemId])delete L[k][personId][itemId]; else L[k][personId][itemId]=true;
  save();
}
function dailyPct(personId){
  const items=C_().daily.items;
  const done=items.filter(i=>dailyDone(personId,i.id)).length;
  return items.length?done/items.length:0;
}
/* ---- history and reliability ---- */
function pastSessions(n=12){
  const out=[];let k=prevSessionKey(todayKey());
  if(cleanSessionOn(todayKey()))out.push(todayKey());
  while(k&&out.length<n){out.push(k);k=prevSessionKey(k);}
  // never count sessions from before the household started using the app
  const since=C_().firstRun||"0000-00-00";
  return out.filter(x=>x>=since||C_().log[x]);
}
function reliability(personId,n=8){
  const sess=pastSessions(n).filter(k=>k<=todayKey());
  let done=0,total=0,mins=0,counted=0;
  sess.forEach(k=>{
    const p=cleanProgress(k,personId);
    if(!p.total)return;
    done+=p.done;total+=p.total;mins+=p.minsTotal-p.mins;counted++;
  });
  return{done,total,rate:total?done/total:0,avgMin:counted?Math.round(mins/counted):0,sessions:counted};
}
function statsRange(personId,fromKey){
  const sess=pastSessions(30).filter(k=>k>=fromKey&&k<=todayKey());
  let done=0,mins=0;
  sess.forEach(k=>{
    tasksForSession(k,personId).forEach(t=>{
      if(cleanDone(t.id,k)){done++;mins+=t.mins||0;}
    });
  });
  return{done,mins,sessions:sess.length};
}
/* ---- supplies ---- */
function supplyStatus(s){
  if(s.qty<=0)return{k:"buy",label:"Kaufen",color:"var(--danger)",soft:"var(--danger-soft)"};
  if(s.qty<=s.min)return{k:"low",label:"Wird knapp",color:"var(--warning)",soft:"var(--warning-soft)"};
  return{k:"ok",label:"Vorrätig",color:"var(--success)",soft:"var(--success-soft)"};
}
function supplyBump(id,d){
  const s=C_().supplies.find(x=>x.id===id); if(!s)return;
  s.qty=Math.max(0,(s.qty||0)+d);
  if(d>0)s.lastBought=todayKey();
  save();render();
}
/* ---- sparse suggestions ---- */
function microSuggestions(){
  const out=[],key=curSession(),d=daysBetween(todayKey(),key);
  if(d===1)out.push({ic:"clock",t:`Der Home Reset ist morgen um ${C_().schedule.time}.`});
  const low=C_().supplies.filter(s=>supplyStatus(s).k!=="ok");
  if(low.length)out.push({ic:"food",t:`${low.length} ${low.length===1?"Artikel geht":"Artikel gehen"} zur Neige: ${low.slice(0,3).map(s=>s.name).join(", ")}.`,go:"supplies"});
  const sponge=C_().supplies.find(s=>/schwamm/i.test(s.name));
  if(sponge&&sponge.lastBought&&daysBetween(sponge.lastBought,todayKey())>45)
    out.push({ic:"clean",t:"Die Küchenschwämme sind seit über sechs Wochen im Einsatz."});
  const filterTask=C_().tasks.find(t=>/sieb/i.test(t.title));
  const lived=pastSessions(8).filter(k=>k<=todayKey()&&(C_().log[k]||C_().sessions[k]));
  if(filterTask&&lived.length>=2&&!lived.some(k=>cleanDone(filterTask.id,k)))
    out.push({ic:"lightbulb",t:"Das Spülmaschinensieb wurde in den letzten Durchgängen nicht abgehakt.",guide:"spuelmaschine"});
  return out.slice(0,2);
}

function ensureV3(st){
  if(!st||typeof st!=="object")return st;
  st.settings=st.settings||{};
  if(!st.settings.theme)st.settings.theme="auto";
  if(!st.settings.logo)st.settings.logo="💠";
  const C=st.cleaning;
  if(!C||!Array.isArray(C.zones)||!Array.isArray(C.tasks)||!C.tasks.length||!C.tasks[0].zoneId)
    st.cleaning=defaultCleaning();
  const c=st.cleaning;
  c.log=c.log||{}; c.reviews=c.reviews||{}; c.sessions=c.sessions||{}; c.dailyLog=c.dailyLog||{};
  c.rotation=c.rotation||{lastRotated:null,dismissedUntil:null};
  c.supplies=c.supplies||defaultCleaning().supplies;
  c.daily=c.daily||defaultCleaning().daily;
  c.schedule=c.schedule||{weekday:5,time:"11:00"};
  if(!c.firstRun)c.firstRun=todayKey();
  if(!st.settings.blockTypes.some(b=>b.id==="cleaning"))
    st.settings.blockTypes.push({id:"cleaning",name:"Haushalt",color:"#3d9bd8"});
  if(!st.settings.categories.some(x=>x.id==="cleaning"))
    st.settings.categories.push({id:"cleaning",name:"Haushalt & Pflege",emoji:"🧽",color:"#3d9bd8"});
  return st;
}

/* ============================================================
   SYNC — private GitHub Gist as the shared store.
   No server, works in every browser including iOS Safari.
   The token lives in IndexedDB only and never enters the
   exported JSON, so backups can be shared without leaking it.
   ============================================================ */
const SYNC={
  token:null, gistId:null, file:"life-os-data.json",
  state:"off",          // off | idle | pulling | pushing | conflict | error
  lastPull:0, lastPush:0, baseRev:0, lastError:"",
  device:null, busy:false, pending:false
};
const SYNC_LABEL={off:"Sync aus",idle:"Synchronisiert",pulling:"Lädt …",pushing:"Überträgt …",
  conflict:"Konflikt",error:"Sync-Fehler"};

async function syncLoadCreds(){
  try{
    const c=await idbGet("sync");
    if(c&&c.token){SYNC.token=c.token;SYNC.gistId=c.gistId||null;SYNC.baseRev=c.baseRev||0;}
    let dev=await idbGet("device");
    if(!dev){dev=uid();await idbSet("device",dev);}
    SYNC.device=dev;
  }catch(e){SYNC.device=SYNC.device||uid();}
}
async function syncSaveCreds(){
  try{await idbSet("sync",{token:SYNC.token,gistId:SYNC.gistId,baseRev:SYNC.baseRev});}catch(e){}
}
async function syncForget(){
  SYNC.token=null;SYNC.gistId=null;SYNC.baseRev=0;SYNC.state="off";
  try{await idbDel("sync");}catch(e){}
  setSave(fileHandle?"saved":"off");
  render();
}
const syncOn=()=>!!(SYNC.token&&SYNC.gistId);

async function gh(path,opts={}){
  const r=await fetch("https://api.github.com"+path,{
    ...opts,
    headers:{
      "Authorization":"Bearer "+SYNC.token,
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28",
      ...(opts.body?{"Content-Type":"application/json"}:{})
    }
  });
  if(!r.ok){
    const txt=await r.text().catch(()=>"");
    const e=new Error(`GitHub ${r.status}: ${txt.slice(0,160)}`);
    e.status=r.status;throw e;
  }
  return r.json();
}
/** Strip anything that must never leave the device. */
function syncPayload(){
  const copy=JSON.parse(JSON.stringify(S));
  copy.meta={...copy.meta,rev:(copy.meta.rev||0),device:SYNC.device,updated:new Date().toISOString()};
  return copy;
}
function payloadSize(){
  try{return new Blob([JSON.stringify(S)]).size;}catch(e){return JSON.stringify(S).length;}
}

async function syncConnect(token){
  SYNC.token=token.trim();
  setSyncState("pulling");
  try{
    const me=await gh("/user");
    // reuse an existing Life OS gist if there is one
    const list=await gh("/gists?per_page=100");
    const found=list.find(g=>g.files&&g.files[SYNC.file]);
    if(found){
      SYNC.gistId=found.id;
      await syncSaveCreds();
      await syncPull(true);
      toast(`Verbunden als ${me.login}. Vorhandene Daten geladen.`);
    }else{
      const body={description:"Life OS – persönliche Daten",public:false,
        files:{[SYNC.file]:{content:JSON.stringify({...syncPayload(),meta:{...S.meta,rev:1}},null,2)}}};
      const g=await gh("/gists",{method:"POST",body:JSON.stringify(body)});
      SYNC.gistId=g.id;SYNC.baseRev=1;S.meta.rev=1;
      await syncSaveCreds();
      toast(`Verbunden als ${me.login}. Neuer privater Gist angelegt.`);
    }
    setSyncState("idle");render();
  }catch(e){
    SYNC.token=null;SYNC.lastError=e.message;setSyncState("error");
    toast(e.status===401?"Token wurde abgelehnt. Stimmt der Scope „gist“?":"Verbindung fehlgeschlagen: "+e.message);
    render();
  }
}

async function readRemote(){
  const g=await gh("/gists/"+SYNC.gistId);
  const f=g.files&&g.files[SYNC.file];
  if(!f)throw new Error("Datei im Gist nicht gefunden");
  let txt=f.content;
  if(f.truncated||txt==null){ txt=await (await fetch(f.raw_url)).text(); }
  return JSON.parse(txt);
}

async function syncPull(force){
  if(!syncOn())return false;
  setSyncState("pulling");
  try{
    const remote=await readRemote();
    const rRev=remote.meta?.rev||0;
    const localDirty=(S.meta?.rev||0)!==SYNC.baseRev||saveState==="dirty";
    if(force||rRev>SYNC.baseRev){
      if(localDirty&&!force&&rRev>SYNC.baseRev&&S.meta?.rev>SYNC.baseRev){
        openConflict(remote);return false;
      }
      S=migrate(remote);
      SYNC.baseRev=rRev;S.meta.rev=rRev;
      await syncSaveCreds();
      try{await idbSet("state",S);}catch(e){}
      SYNC.lastPull=Date.now();
      setSyncState("idle");render();
      return true;
    }
    SYNC.lastPull=Date.now();setSyncState("idle");
    return false;
  }catch(e){
    SYNC.lastError=e.message;setSyncState("error");return false;
  }
}

async function syncPush(){
  if(!syncOn())return;
  if(SYNC.busy){SYNC.pending=true;return;}
  SYNC.busy=true;setSyncState("pushing");
  try{
    const remote=await readRemote().catch(()=>null);
    const rRev=remote?.meta?.rev||0;
    if(rRev>SYNC.baseRev){
      SYNC.busy=false;openConflict(remote);return;
    }
    const next=rRev+1;
    S.meta.rev=next;
    const body={files:{[SYNC.file]:{content:JSON.stringify(syncPayload(),null,2)}}};
    await gh("/gists/"+SYNC.gistId,{method:"PATCH",body:JSON.stringify(body)});
    SYNC.baseRev=next;SYNC.lastPush=Date.now();
    await syncSaveCreds();
    setSyncState("idle");
  }catch(e){
    SYNC.lastError=e.message;setSyncState("error");
  }finally{
    SYNC.busy=false;
    if(SYNC.pending){SYNC.pending=false;setTimeout(syncPush,400);}
  }
}
const syncPushSoon=debounce(()=>{if(syncOn())syncPush();},2500);

/* ---------- conflict resolution ---------- */
function mergeStates(a,b){
  // a = local, b = remote. Records merge by id, newest wins where we can tell.
  const out=JSON.parse(JSON.stringify(b));
  const byId=(x,y)=>{
    const m=new Map();
    [...(y||[]),...(x||[])].forEach(r=>{
      const prev=m.get(r.id);
      if(!prev)m.set(r.id,r);
      else{
        const ta=r.completedAt||r.created||0, tb=prev.completedAt||prev.created||0;
        m.set(r.id, ta>=tb?r:prev);
      }
    });
    return [...m.values()];
  };
  ["tasks","notes","blocks","recipes","habits"].forEach(k=>{out[k]=byId(a[k],b[k]);});
  ["learnings","courses","books","podcasts","videos"].forEach(k=>{
    out.growth[k]=byId(a.growth?.[k],b.growth?.[k]);});
  // journal: one entry per day, keep the longer one
  const jm=new Map();
  [...(b.journal||[]),...(a.journal||[])].forEach(j=>{
    const p=jm.get(j.date);
    const len=o=>JSON.stringify(o).length;
    if(!p||len(j)>len(p))jm.set(j.date,j);
  });
  out.journal=[...jm.values()].sort((x,y)=>y.date.localeCompare(x.date));
  // tick logs: union, because two devices ticking different boxes should both count
  const unionLog=(x,y,depth)=>{
    const o={...(y||{})};
    Object.entries(x||{}).forEach(([k,v])=>{
      o[k]=depth>1&&o[k]&&typeof v==="object"?unionLog(v,o[k],depth-1):{...(o[k]||{}),...v};
    });
    return o;
  };
  out.routineHistory=unionLog(a.routineHistory,b.routineHistory,2);
  out.habitLog=unionLog(a.habitLog,b.habitLog,1);
  if(a.cleaning&&b.cleaning){
    out.cleaning.log=unionLog(a.cleaning.log,b.cleaning.log,1);
    out.cleaning.reviews=unionLog(a.cleaning.reviews||{},b.cleaning.reviews||{},1);
    out.cleaning.tasks=byId(a.cleaning.tasks,b.cleaning.tasks);
    out.cleaning.supplies=byId(a.cleaning.supplies,b.cleaning.supplies);
  }
  return out;
}
function openConflict(remote){
  setSyncState("conflict");
  const local=S;
  const count=st=>({Aufgaben:st.tasks?.length||0,Notizen:st.notes?.length||0,
    Journal:st.journal?.length||0,Zeitblöcke:st.blocks?.length||0});
  const l=count(local),r=count(remote);
  const when=x=>x.meta?.updated?new Date(x.meta.updated).toLocaleString("de-DE"):"unbekannt";
  modal({title:"Beide Seiten haben sich geändert",size:"",
    body:`<p style="margin:0 0 16px;font-size:14px;color:var(--text-2);line-height:1.65">
        Dieses Gerät und die Cloud wurden seit dem letzten Abgleich beide bearbeitet.
        Nichts wurde bisher überschrieben — du entscheidest.</p>
      <div class="row2" style="margin-bottom:18px">
        <div class="stat"><div class="l">Dieses Gerät</div>
          <div class="meta" style="margin-top:6px">${when(local)}</div>
          ${Object.entries(l).map(([k,v])=>`<div class="meta">${k}: <b>${v}</b></div>`).join("")}</div>
        <div class="stat"><div class="l">Cloud</div>
          <div class="meta" style="margin-top:6px">${when(remote)}</div>
          ${Object.entries(r).map(([k,v])=>`<div class="meta">${k}: <b>${v}</b></div>`).join("")}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="qitem" data-res="merge"><span class="e">${ic("link")}</span>
          <span><span class="n">Zusammenführen</span><br><span class="d">Einträge aus beiden Seiten behalten, Häkchen vereinen</span></span></button>
        <button class="qitem" data-res="local"><span class="e">${ic("upload")}</span>
          <span><span class="n">Dieses Gerät gewinnt</span><br><span class="d">Die Cloud wird überschrieben</span></span></button>
        <button class="qitem" data-res="remote"><span class="e">${ic("download")}</span>
          <span><span class="n">Cloud gewinnt</span><br><span class="d">Lokale Änderungen dieses Geräts gehen verloren</span></span></button>
      </div>`,
    onMount(o,close){
      o.querySelectorAll("[data-res]").forEach(b=>b.onclick=async()=>{
        const mode=b.dataset.res;close();
        if(mode==="merge")S=migrate(mergeStates(local,remote));
        else if(mode==="remote")S=migrate(remote);
        SYNC.baseRev=remote.meta?.rev||0;
        S.meta.rev=SYNC.baseRev;
        await syncSaveCreds();
        render();
        await syncPush();
        toast(mode==="merge"?"Zusammengeführt und hochgeladen."
          :mode==="local"?"Cloud überschrieben.":"Cloud-Version übernommen.");
      });
    }});
}

  S.growth.courses.forEach(c=>{if(hit(c.title))out.push({e:"monitor",t:c.title,k:"Kurs",go:()=>go("growth",{tab:"courses"})});});
  S.growth.podcasts.forEach(p=>{if(hit(p.podcast)||hit(p.episode))out.push({e:"headphones",t:p.episode||p.podcast,k:"Podcast",go:()=>go("growth",{tab:"podcasts"})});});

function calPointerMove(e){
  if(!drag)return;
  const dy=e.clientY-drag.startY,dx=e.clientX-drag.startX;
  if(Math.abs(dy)>3||Math.abs(dx)>3)drag.moved=true;
  if(!drag.moved)return;
  const snap=S.settings.snap||15;
  const dm=Math.round(dy/HH*60/snap)*snap;
  let s=drag.origStart,en=drag.origEnd;
  if(drag.mode==="move"){
    const len=en-s;
    s=clamp(drag.origStart+dm,0,24*60-len);en=s+len;
  }else{
    en=clamp(drag.origEnd+dm,s+snap,24*60);
  }
  drag.curStart=s;drag.curEnd=en;
  drag.el.style.top=(s/60*HH)+"px";
  drag.el.style.height=Math.max((en-s)/60*HH-3,14)+"px";
  drag.el.querySelector(".bm").textContent=`${hhmm(s)} – ${hhmm(en)}`;
  if(drag.mode==="move"&&drag.days.length>1){
    const hit=drag.days.find(d=>e.clientX>=d.rect.left&&e.clientX<=d.rect.right);
    if(hit&&hit.key!==drag.dk){drag.targetDay=hit.key;drag.el.style.opacity=".72";}
    else{drag.targetDay=null;drag.el.style.opacity="";}
  }
}

/* ============================================================
   NUTRITION — personal energy target engine
   Everything here is an estimate that gets calibrated against
   the real weight trend. Nothing is presented as measured.
   ============================================================ */
function defaultNutrition(){
  return {
    profile:{sex:"m",age:30,height:178,weight:75,bodyFat:null,
      occupation:"sitting",steps:8000,trainingFreq:4,trainingType:"mixed",trainingMin:75},
    whoop:{enabled:false,avgBurn:2700,avgStrain:12,todayBurn:null,todayStrain:null,todayTrainingMin:null,weight:0.35},
    goal:"maintain", rate:"moderate",
    proteinPerKg:1.8, proteinOverride:null,
    dietMode:"highcarb", carbShare:0.72, customSplit:null,
    autoAdjust:false, adjustFactor:0.5, dayType:"normal",
    intakeAvg:null,
    weights:[], targetHistory:[], lastCalc:null
  };
}
const N_=()=>S.nutrition;

const OCCUPATION={sitting:{n:"Überwiegend sitzend",f:0.15},light:{n:"Leicht aktiv",f:0.25},
  standing:{n:"Viel stehend",f:0.35},physical:{n:"Körperlich arbeitend",f:0.50}};
const TRAIN_TYPE={strength:{n:"Kraft",k:0.090},mixed:{n:"Gemischt",k:0.112},
  cardio:{n:"Ausdauer",k:0.140},hiit:{n:"HIIT / Intervall",k:0.160}};
const RATES={
  lose:[{id:"conservative",n:"Konservativ",pct:0.10},{id:"moderate",n:"Moderat",pct:0.18},{id:"aggressive",n:"Ambitioniert",pct:0.25}],
  gain:[{id:"conservative",n:"Konservativ",pct:0.07},{id:"moderate",n:"Moderat",pct:0.14}],
  maintain:[{id:"moderate",n:"Erhalt",pct:0}]
};
const DIET_MODES={highcarb:{n:"High Carb",carb:0.72},balanced:{n:"Ausgewogen",carb:0.58},
  lowcarb:{n:"Low Carb",carb:0.30},custom:{n:"Eigene",carb:null}};
const DAY_TYPES=[{id:"rest",n:"Ruhetag",f:-0.08},{id:"normal",n:"Normal",f:0},
  {id:"active",n:"Aktiv",f:0.08},{id:"veryactive",n:"Sehr aktiv",f:0.15}];
const KCAL_PER_KG=7700; // classic approximation for body-mass change

/* ---------- resting energy ---------- */
function restingEnergy(){
  const p=N_().profile;
  if(p.bodyFat&&p.bodyFat>3&&p.bodyFat<60){
    const lbm=p.weight*(1-p.bodyFat/100);
    return{kcal:Math.round(370+21.6*lbm),method:"Katch-McArdle",note:"nutzt deinen Körperfettanteil"};
  }
  const base=10*p.weight+6.25*p.height-5*p.age;
  return{kcal:Math.round(base+(p.sex==="m"?5:-161)),method:"Mifflin-St Jeor",note:"Standardformel ohne Körperfettwert"};
}
function energyBreakdown(){
  const p=N_().profile,w=N_().whoop;
  const rmr=restingEnergy();
  const neat=Math.round(rmr.kcal*(OCCUPATION[p.occupation]?.f??0.15));
  const steps=Math.round((p.steps||0)*0.045*(p.weight/70));
  const t=TRAIN_TYPE[p.trainingType]||TRAIN_TYPE.mixed;
  const exercise=Math.round((p.trainingFreq||0)*(p.trainingMin||0)*t.k*p.weight/7);
  const sub=rmr.kcal+neat+steps+exercise;
  const tef=Math.round(sub*0.10);
  const modelled=sub+tef;
  let blended=modelled,whoopUsed=false;
  if(w.enabled&&w.avgBurn>800){
    const k=clamp(w.weight??0.35,0,1);
    blended=Math.round(modelled*(1-k)+(w.avgBurn*1.10)*k);
    whoopUsed=true;
  }
  return{rmr,neat,steps,exercise,tef,modelled,blended:Math.round(blended),whoopUsed};
}
/* ---------- weight trend ---------- */
function sortedWeights(){ return [...(N_().weights||[])].sort((a,b)=>a.date.localeCompare(b.date)); }
function avgWindow(days,offset=0){
  const w=sortedWeights();if(!w.length)return null;
  const end=addDays(berlinNow(),-offset), start=addDays(end,-(days-1));
  const sel=w.filter(x=>x.date>=dkey(start)&&x.date<=dkey(end));
  if(!sel.length)return null;
  return sel.reduce((s,x)=>s+x.kg,0)/sel.length;
}
function weightTrend(){
  const a=avgWindow(7,0), b=avgWindow(7,7);
  const w=sortedWeights();
  const latest=w.length?w[w.length-1]:null;
  if(a==null||b==null)return{avg7:a,prev7:b,deltaWeek:null,latest,points:w.length};
  return{avg7:a,prev7:b,deltaWeek:a-b,latest,points:w.length};
}
/** Real-world calibration: what the scale says the maintenance actually is. */
function calibratedMaintenance(){
  const est=energyBreakdown().blended;
  const tr=weightTrend(),intake=N_().intakeAvg;
  if(!intake||tr.deltaWeek==null||tr.points<6)return{kcal:est,calibrated:false,est};
  const implied=Math.round(intake-(tr.deltaWeek*KCAL_PER_KG/7));
  // trust the scale, but not blindly: cap the correction at 20%
  const capped=clamp(implied,est*0.8,est*1.2);
  return{kcal:Math.round(est*0.4+capped*0.6),calibrated:true,est,implied};
}
function goalDelta(maintenance){
  const g=N_().goal;
  if(g==="maintain")return 0;
  const r=(RATES[g]||[]).find(x=>x.id===N_().rate)||RATES[g][0];
  return Math.round(maintenance*r.pct*(g==="lose"?-1:1));
}
function dayFactor(){
  const d=DAY_TYPES.find(x=>x.id===N_().dayType)||DAY_TYPES[1];
  return d.f;
}
function activityAdjust(){
  const w=N_().whoop;
  if(!N_().autoAdjust||!w.enabled||w.todayBurn==null||!w.avgBurn)return 0;
  const raw=(w.todayBurn-w.avgBurn)*clamp(N_().adjustFactor??0.5,0,1);
  return Math.round(clamp(raw,-400,400));
}
function targets(){
  const cal=calibratedMaintenance();
  const maintenance=cal.kcal;
  const delta=goalDelta(maintenance);
  const base=maintenance+delta;
  const floor=Math.round(restingEnergy().kcal*1.05);
  const weekly=Math.max(base,floor);
  const today=Math.max(Math.round(weekly*(1+dayFactor()))+activityAdjust(),floor);
  const p=N_().profile;
  const proteinG=N_().proteinOverride??Math.round((N_().proteinPerKg||1.8)*p.weight);
  const mk=kcal=>{
    const pk=Math.min(proteinG*4,kcal*0.6);
    const rest=Math.max(0,kcal-pk);
    let share=N_().dietMode==="custom"?(N_().customSplit?.carb??0.6):(DIET_MODES[N_().dietMode]?.carb??0.6);
    share=clamp(share,0,1);
    const carbG=Math.round(rest*share/4), fatG=Math.round(rest*(1-share)/9);
    const total=Math.max(1,carbG*4+proteinG*4+fatG*9);
    return{kcal,carbG,proteinG,fatG,
      carbPct:Math.round(carbG*4/total*100),proteinPct:Math.round(proteinG*4/total*100),
      fatPct:100-Math.round(carbG*4/total*100)-Math.round(proteinG*4/total*100)};
  };
  return{maintenance,delta,weekly,today,floor,belowFloor:base<floor,
    macros:mk(today),weeklyMacros:mk(weekly),calibrated:cal.calibrated,
    perKg:+(proteinG/p.weight).toFixed(2)};
}
function expectedRate(){
  const t=targets();
  const perDay=t.weekly-t.maintenance;
  return +(perDay*7/KCAL_PER_KG).toFixed(2); // kg per week
}
/* ---------- adjustment engine ---------- */
function adjustmentAdvice(){
  const tr=weightTrend();
  if(tr.points<6||tr.deltaWeek==null)
    return{k:"ok",t:"Noch zu wenig Daten",d:"Trage etwa zwei Wochen lang regelmäßig dein Gewicht ein, dann kann hier eine belastbare Aussage stehen."};
  const want=expectedRate(), got=tr.deltaWeek;
  const diff=got-want;
  const tol=Math.max(0.15,Math.abs(want)*0.5);
  if(Math.abs(diff)<=tol)
    return{k:"ok",t:"Sieht stimmig aus",d:`Dein Trend liegt bei ${got>0?"+":""}${got.toFixed(2).replace(".",",")} kg pro Woche, angepeilt sind ${want>0?"+":""}${want.toFixed(2).replace(".",",")}. Das aktuelle Ziel scheint zu funktionieren.`};
  if(Math.abs(diff)<=tol*2.2)
    return{k:"warn",t:"Kleine Anpassung denkbar",d:`Dein Trend (${got>0?"+":""}${got.toFixed(2).replace(".",",")} kg/Woche) weicht etwas vom Ziel (${want>0?"+":""}${want.toFixed(2).replace(".",",")}) ab. Eine Änderung von 100 bis 150 kcal wäre ein sinnvoller nächster Schritt — nicht mehr.`};
  return{k:"review",t:"Nochmal anschauen",d:`Der Trend (${got>0?"+":""}${got.toFixed(2).replace(".",",")} kg/Woche) läuft deutlich am Ziel (${want>0?"+":""}${want.toFixed(2).replace(".",",")}) vorbei. Bevor du das Kalorienziel änderst: stimmt die geschätzte Zufuhr, hat sich Training oder Alltagsbewegung verändert, ist die Waage konsistent?`};
}

function snapshotTarget(){
  const t=targets(),today=todayKey();
  const H=N_().targetHistory;
  const last=H[0];
  if(last&&last.date===today){Object.assign(last,{weight:N_().profile.weight,goal:N_().goal,kcal:t.weekly,
    c:t.weeklyMacros.carbG,p:t.weeklyMacros.proteinG,f:t.weeklyMacros.fatG});return;}
  if(last&&Math.abs(last.kcal-t.weekly)<25&&last.goal===N_().goal)return;
  H.unshift({date:today,weight:N_().profile.weight,goal:N_().goal,kcal:t.weekly,
    c:t.weeklyMacros.carbG,p:t.weeklyMacros.proteinG,f:t.weeklyMacros.fatG});
  if(H.length>60)H.length=60;
}
function addWeight(kg,date){
  const d=date||todayKey();
  const W=N_().weights;
  const i=W.findIndex(x=>x.date===d);
  if(i>=0)W[i].kg=kg; else W.push({date:d,kg});
  N_().profile.weight=kg;
  N_().lastCalc=new Date().toISOString();
  snapshotTarget();save();
}

function weightSparkHTML(){
  const w=sortedWeights().slice(-42);
  if(w.length<2)return `<p class="meta">Noch zu wenige Einträge für eine Kurve.</p>`;
  const vals=w.map(x=>x.kg),min=Math.min(...vals),max=Math.max(...vals);
  const span=Math.max(0.6,max-min),W=300,H=58;
  const pt=(v,i)=>[(i/(w.length-1))*W,H-4-((v-min)/span)*(H-10)];
  const d=vals.map((v,i)=>{const[x,y]=pt(v,i);return `${i?"L":"M"}${x.toFixed(1)} ${y.toFixed(1)}`;}).join(" ");
  const area=`${d} L${W} ${H} L0 ${H} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="color-mix(in srgb, var(--primary) 14%, transparent)"/>
    <path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <div style="display:flex;justify-content:space-between"><span class="meta">${esc(fmtDate(w[0].date))} · ${kgFmt(min)} kg</span>

}

const F_=()=>S.focus;
const fcat=id=>F_().categories.find(c=>c.id===id)||{id:"",n:"Ohne",e:"·",c:"var(--text-muted)"};
const fSessions=()=>F_().sessions||[];
const totalFocusMin=()=>fSessions().reduce((s,x)=>s+(x.actualMin||0),0);
function treeUnlocked(t){
  const done=fSessions().filter(s=>s.completed).length;
  const hrs=totalFocusMin()/60;
  if(t.unlock.sessions&&done<t.unlock.sessions)return false;
  if(t.unlock.hours&&hrs<t.unlock.hours)return false;
  return true;
}
function focusOn(dateKey){ return fSessions().filter(s=>s.date===dateKey); }
function focusMinutes(list){ return list.reduce((s,x)=>s+(x.actualMin||0),0); }
function focusStreak(){
  if(!F_().settings.streakEnabled)return 0;
  let n=0,d=berlinNow();
  if(!focusOn(dkey(d)).some(s=>s.completed))d=addDays(d,-1);
  for(let i=0;i<400;i++){
    if(focusOn(dkey(d)).some(s=>s.completed))n++; else break;
    d=addDays(d,-1);
  }
  return n;
}
function bestStreak(){
  const days=[...new Set(fSessions().filter(s=>s.completed).map(s=>s.date))].sort();
  let best=0,run=0,prev=null;
  days.forEach(d=>{
    run=(prev&&daysBetween(prev,d)===1)?run+1:1;
    best=Math.max(best,run);prev=d;
  });
  return best;
}
function focusRange(kind){
  const t=berlinNow();
  if(kind==="today")return fSessions().filter(s=>s.date===todayKey());
  if(kind==="week"){const a=dkey(startOfWeek(t));return fSessions().filter(s=>s.date>=a);}
  if(kind==="month"){const a=dkey(new Date(t.getFullYear(),t.getMonth(),1));return fSessions().filter(s=>s.date>=a);}
  return fSessions();
}
const fmtMin=m=>{const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`;};
const fmtClock=sec=>{const m=Math.floor(Math.abs(sec)/60),s=Math.abs(sec)%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;};

/* ---------- session lifecycle ---------- */
function focusElapsed(){
  const a=F_().active; if(!a)return 0;
  return Math.floor((Date.now()-a.startedAt)/1000);
}
function focusRemaining(){
  const a=F_().active; if(!a)return 0;
  return a.plannedMin*60-focusElapsed();
}
function startFocus(min,catId,taskId,title){
  F_().active={startedAt:Date.now(),plannedMin:min,category:catId,taskId:taskId||null,
    tree:F_().selectedTree,title:title||"",notified:false};
  F_().lastCategory=catId;F_().lastMinutes=min;
  save();render();
}
function finishFocus(actualMin,completed){
  const a=F_().active; if(!a)return null;
  const s={id:uid(),date:dkey(new Date(a.startedAt)),
    start:hhmm(new Date(a.startedAt).getHours()*60+new Date(a.startedAt).getMinutes()),
    end:hhmm(new Date().getHours()*60+new Date().getMinutes()),
    plannedMin:a.plannedMin,actualMin:Math.max(1,Math.round(actualMin)),
    category:a.category,taskId:a.taskId||null,tree:a.tree,completed:!!completed,
    title:a.title||"",notes:""};
  F_().sessions.unshift(s);
  if(completed)F_().trees.unshift({id:uid(),type:a.tree,createdAt:Date.now(),sessionId:s.id,
    category:a.category,season:seasonOf(new Date())});
  F_().active=null;save();
  return s;
}
function seasonOf(d){const m=d.getMonth();return m<2||m===11?"winter":m<5?"spring":m<8?"summer":"autumn";}
function chime(){
  if(!F_().settings.soundEnabled)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=new C();
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+i*0.16);
      g.gain.linearRampToValueAtTime(0.14,ctx.currentTime+i*0.16+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.16+0.9);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+i*0.16);o.stop(ctx.currentTime+i*0.16+1);
    });
    setTimeout(()=>ctx.close&&ctx.close(),2200);
  }catch(e){}
}
function completeFocus(){
  const a=F_().active; if(!a)return;
  const mins=Math.max(1,Math.round(focusElapsed()/60));
  const s=finishFocus(Math.min(mins,a.plannedMin),true);
  chime();render();
  completionDlg(s);
}

        <button class="qitem" data-ab="resume"><span class="e">${ic("play")}</span>

function focusStatsHTML(){
  const ranges=[["today","Heute"],["week","Diese Woche"],["month","Dieser Monat"],["all","Gesamt"]];
  const cards=ranges.map(([k,n])=>{
    const l=focusRange(k),m=focusMinutes(l),done=l.filter(s=>s.completed).length;
    return `<div class="stat"><div class="v">${m>=60?(m/60).toFixed(1)+" h":m+" min"}</div>
      <div class="l">${n} · ${done} ${done===1?"Einheit":"Einheiten"}</div></div>`;}).join("");
  const all=fSessions();
  const avg=all.length?Math.round(focusMinutes(all)/all.length):0;
  const longest=all.reduce((m,s)=>Math.max(m,s.actualMin||0),0);
  const byCat={};
  all.forEach(s=>{byCat[s.category]=(byCat[s.category]||0)+(s.actualMin||0);});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=Math.max(1,...cats.map(c=>c[1]));
  const days=Array.from({length:14},(_,i)=>dkey(addDays(berlinNow(),-13+i)));
  const dayVals=days.map(d=>focusMinutes(focusOn(d)));
  const wk=focusMinutes(focusRange("week")),wkGoal=F_().settings.weeklyGoalMin;

  return `<div class="grid">
    <div class="c12"><div class="stats">${cards}</div></div>
    <div class="c8">
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-h"><span class="panel-t">Letzte 14 Tage</span>
          <span class="meta" style="margin-left:auto">Tagesziel ${F_().settings.dailyGoalMin} min</span></div>
        <div class="panel-b">${sparkHTML(dayVals,"var(--primary)")}
          <div style="display:flex;justify-content:space-between;margin-top:6px">
            <span class="meta">${esc(fmtDate(days[0]))}</span><span class="meta">heute</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-h"><span class="panel-t">Nach Thema</span></div>
        <div class="panel-b">
          ${cats.length?cats.map(([id,m])=>{const c=fcat(id);
            return `<div class="catbar"><span class="cn">${c.e} ${esc(c.n)}</span>
              <span class="cb"><i style="width:${m/maxCat*100}%;background:${c.c}"></i></span>
              <span class="ct">${fmtMin(m)}</span></div>`;}).join("")
            :`<p class="meta">Noch keine Einheiten.</p>`}
        </div>
      </div>
    </div>
    <div class="c4">
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-h"><span class="panel-t">Wochenziel</span></div>
        <div class="panel-b" style="display:flex;gap:18px;align-items:center">
          ${ringHTML(clamp(wk/Math.max(1,wkGoal),0,1),"var(--primary)",84,8,
            `<span style="font-size:18px">${Math.round(wk/Math.max(1,wkGoal)*100)}%</span>`)}
          <div>
            <div class="num" style="font-size:21px">${fmtMin(wk)}</div>
            <div class="meta">von ${fmtMin(wkGoal)}</div>
            <p class="meta" style="margin-top:8px;line-height:1.6">Ein Richtwert, kein Soll. Eine ruhige Woche ist keine verlorene Woche.</p>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-h"><span class="panel-t">Kennzahlen</span></div>
        <div class="panel-b">
          ${[["Einheiten gesamt",all.length],["Abgeschlossen",all.filter(s=>s.completed).length],
             ["Schnitt je Einheit",fmtMin(avg)],["Längste Einheit",fmtMin(longest)],
             ...(F_().settings.streakEnabled?[["Aktuelle Serie",focusStreak()+" Tage"],["Beste Serie",bestStreak()+" Tage"]]:[])]
            .map(([k,v])=>`<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)">

function ensureV4(st){
  ensureV3(st);
  if(!st.nutrition||!st.nutrition.profile)st.nutrition=defaultNutrition();
  const n=st.nutrition;
  n.weights=n.weights||[]; n.targetHistory=n.targetHistory||[];
  n.whoop={...defaultNutrition().whoop,...(n.whoop||{})};
  n.profile={...defaultNutrition().profile,...(n.profile||{})};
  if(!n.weights.length)n.weights.push({date:todayKey(),kg:n.profile.weight});

  if(!st.focus||!Array.isArray(st.focus.sessions))st.focus=defaultFocus();
  const f=st.focus;
  f.settings={...defaultFocus().settings,...(f.settings||{})};
  f.categories=f.categories?.length?f.categories:defaultFocus().categories;
  f.trees=f.trees||[]; f.sessions=f.sessions||[];
  if(!st.settings.blockTypes.some(b=>b.id==="focusrun"))
    st.settings.blockTypes.push({id:"focusrun",name:"Fokus-Einheit",color:"#14a07a"});
  if(st.settings.dayStart===6)st.settings.dayStart=9;   // Outlook-style default window
  return st;
}

/* ---------- ticking ---------- */
let focusTimer=null;
function startFocusTicker(){
  if(focusTimer)clearInterval(focusTimer);
  focusTimer=setInterval(()=>{
    const a=F_()?.active; if(!a)return;
    const left=focusRemaining(),total=a.plannedMin*60;
    const done=clamp(1-left/total,0,1);
    const el=$("#fTime");
    if(el){
      el.textContent=fmtClock(Math.max(0,left));
      if(left<=0&&!a.notified){a.notified=true;chime();render();}
    }
    const ring=$("#fRing");
    if(ring){const c=2*Math.PI*48;ring.setAttribute("stroke-dashoffset",(c*(1-done)).toFixed(1));}
    const tree=$("#fTree");
    if(tree){const s=(0.22+0.78*Math.pow(done,0.7)).toFixed(3);
      tree.style.transform=`translate(100px,196px) scale(${s}) translate(-100px,-196px)`;
      tree.style.opacity=(0.45+0.55*done).toFixed(2);}
  },1000);
}

  });
}

    go("focus");return;}

    const min=focusCustom??F_().lastMinutes??45;

      ||(taskId?S.tasks.find(t=>t.id===taskId)?.title:"")||"";

  const ng=hit("[data-ngoal]");
  if(ng){N_().goal=ng.dataset.ngoal;
    const r=RATES[N_().goal]||RATES.maintain;
    if(!r.some(x=>x.id===N_().rate))N_().rate=r[0].id;

  const nr=hit("[data-nrate]"); if(nr){N_().rate=nr.dataset.nrate;snapshotTarget();save();render();return;}

    if(nd.dataset.ndiet==="custom"&&!N_().customSplit)N_().customSplit={carb:0.6};

    addWeight(+v.toFixed(1));render();toast("Ziel aktualisiert.");return;}

  if(hit("[data-nprofile]")){nutriProfileDlg();return;}

/* ============================================================
   COVER LIBRARY
   Drawn here, not fetched. Every cover is a few kilobytes of
   SVG, so the state stays small and the sync stays fast.
   ============================================================ */
const svgURL=(inner,defs="")=>"data:image/svg+xml,"+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${inner}</svg>`);
const lg=(id,stops,x2=0,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${
  stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</linearGradient>`;
const rg=(id,stops,cx=.5,cy=.5,r=.7)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${
  stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</radialGradient>`;
const bg=id=>`<rect width="1600" height="600" fill="url(#${id})"/>`;
const hill=(d,f,o=1)=>`<path d="${d}" fill="${f}" opacity="${o}"/>`;

function coverHills(sky,cols,sun){
  const defs=lg("s",sky)+(sun?rg("sun",[[0,sun[0]],[1,sun[1]]],.72,.42,.36):"");
  let inner=bg("s");
  if(sun)inner+=`<circle cx="1150" cy="250" r="230" fill="url(#sun)"/><circle cx="1150" cy="250" r="78" fill="${sun[2]}"/>`;
  const paths=[
    "M0 400 C260 330 420 430 640 388 C880 342 1040 420 1600 352 L1600 600 L0 600 Z",
    "M0 452 C220 402 460 486 720 446 C980 406 1240 470 1600 424 L1600 600 L0 600 Z",
    "M0 512 C300 474 520 546 840 510 C1120 478 1340 528 1600 498 L1600 600 L0 600 Z"];
  cols.forEach((c,i)=>{inner+=hill(paths[i],c);});
  return svgURL(inner,defs);
}
function coverPeaks(sky,rock,snow){
  const defs=lg("s",sky);
  let inner=bg("s");
  inner+=`<path d="M0 600 L300 250 L470 420 L640 200 L900 600 Z" fill="${rock[0]}"/>`;
  inner+=`<path d="M640 200 L720 320 L660 330 L600 300 Z" fill="${snow}"/>`;
  inner+=`<path d="M300 250 L370 350 L320 356 L262 322 Z" fill="${snow}" opacity=".85"/>`;
  inner+=`<path d="M700 600 L1010 300 L1200 470 L1340 330 L1600 600 Z" fill="${rock[1]}"/>`;
  inner+=`<path d="M1010 300 L1078 396 L1020 404 L968 372 Z" fill="${snow}" opacity=".75"/>`;
  inner+=`<path d="M0 600 C300 520 620 566 960 522 C1240 486 1420 534 1600 508 L1600 600 Z" fill="${rock[2]}"/>`;
  return svgURL(inner,defs);
}
function coverForest(sky,cols){
  const defs=lg("s",sky);
  let inner=bg("s");
  const band=(y,c,s,n,o)=>{
    let p="";
    for(let i=0;i<n;i++){
      const x=(i+0.5)*(1600/n)+((i*97)%40)-20;
      const h=s*(0.8+((i*53)%40)/100);
      p+=`<path d="M${x} ${y-h} L${x+s*0.42} ${y} L${x-s*0.42} ${y} Z"/>`;
      p+=`<path d="M${x} ${y-h*1.34} L${x+s*0.30} ${y-h*0.45} L${x-s*0.30} ${y-h*0.45} Z"/>`;
    }
    return `<g fill="${c}" opacity="${o}">${p}</g>`;
  };
  inner+=`<path d="M0 430 C280 400 500 452 820 420 C1120 392 1360 434 1600 410 L1600 600 L0 600 Z" fill="${cols[0]}" opacity=".55"/>`;
  inner+=band(470,cols[1],110,14,.75)+band(540,cols[2],150,11,.9)+band(610,cols[3],200,8,1);
  return svgURL(inner,defs);
}
function coverWaves(sky,cols){
  const defs=lg("s",sky);
  let inner=bg("s");
  cols.forEach((c,i)=>{
    const y=330+i*62;
    inner+=`<path d="M0 ${y} C200 ${y-40} 360 ${y+40} 560 ${y} C760 ${y-40} 940 ${y+38} 1140 ${y}
      C1330 ${y-36} 1460 ${y+30} 1600 ${y-6} L1600 600 L0 600 Z" fill="${c}" opacity="${0.55+i*0.15}"/>`;
  });
  return svgURL(inner,defs);
}
function coverDunes(sky,cols){
  const defs=lg("s",sky)+rg("sun",[[0,"#ffe2b0"],[1,"rgba(255,226,176,0)"]],.28,.32,.4);
  let inner=bg("s")+`<circle cx="448" cy="192" r="240" fill="url(#sun)"/><circle cx="448" cy="192" r="66" fill="#ffd89a"/>`;
  cols.forEach((c,i)=>{
    const y=360+i*70;
    inner+=`<path d="M0 ${y+30} C320 ${y-60} 620 ${y+50} 980 ${y-10} C1260 ${y-56} 1420 ${y+16} 1600 ${y-24} L1600 600 L0 600 Z" fill="${c}"/>`;
  });
  return svgURL(inner,defs);
}
function coverAurora(base,bands){
  const defs=lg("s",base)+bands.map((b,i)=>lg("a"+i,[[0,b+"00"],[.4,b+"cc"],[1,b+"00"]],1,0)).join("");
  let inner=bg("s");
  bands.forEach((b,i)=>{
    const y=150+i*70;

      L1700 ${y+96} C1460 ${y+146} 1220 ${y+46} 900 ${y+60} C560 ${y+186} 260 ${y-10} -100 ${y+100} Z"
      fill="url(#a${i})" opacity=".7"/>`;
  });
  for(let i=0;i<60;i++){
    const x=(i*271)%1600,y=(i*163)%420,r=((i*37)%14)/10+0.6;
    inner+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${0.25+((i*17)%40)/120}"/>`;
  }
  inner+=`<path d="M0 486 C340 450 640 508 980 470 C1280 436 1420 486 1600 458 L1600 600 L0 600 Z" fill="#0d1a24"/>`;
  return svgURL(inner,defs);
}
function coverMesh(cols){
  const defs=cols.map((c,i)=>rg("m"+i,[[0,c+"e6"],[1,c+"00"]])).join("")+lg("s",[[0,"#f7faf8"],[1,"#eef3f0"]]);
  let inner=bg("s");
  const pos=[[.18,.22,.55],[.78,.18,.5],[.52,.78,.6],[.1,.82,.45],[.92,.7,.5]];

function coverTopo(base,line){
  const defs=lg("s",base);
  let inner=bg("s");
  for(let i=0;i<16;i++){
    const k=i*34, o=0.10+(i%4)*0.06;
    inner+=`<path d="M-60 ${120+k} C280 ${40+k} 520 ${210+k} 860 ${130+k} C1160 ${58+k} 1400 ${188+k} 1660 ${112+k}"
      stroke="${line}" stroke-width="${i%4===0?2.6:1.4}" fill="none" opacity="${o}"/>`;
  }
  return svgURL(inner,defs);
}
function coverRays(base,ray,dot){
  const defs=rg("s",[[0,base[0]],[1,base[1]]],.5,.62,.85);
  let inner=bg("s");
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2, x=800+Math.cos(a)*1500, y=380+Math.sin(a)*1500;
    inner+=`<path d="M800 380 L${x.toFixed(0)} ${y.toFixed(0)} L${(800+Math.cos(a+0.07)*1500).toFixed(0)} ${(380+Math.sin(a+0.07)*1500).toFixed(0)} Z"
      fill="${ray}" opacity="${i%2?0.05:0.1}"/>`;
  }
  inner+=`<circle cx="800" cy="380" r="150" fill="${dot}" opacity=".9"/>`;
  inner+=`<circle cx="800" cy="380" r="220" fill="none" stroke="${dot}" stroke-width="2" opacity=".35"/>`;
  inner+=`<circle cx="800" cy="380" r="300" fill="none" stroke="${dot}" stroke-width="2" opacity=".18"/>`;
  return svgURL(inner,defs);
}
function coverGrid(base,line,glow){
  const defs=lg("s",base)+rg("g",[[0,glow+"aa"],[1,glow+"00"]],.5,.3,.5);
  let inner=bg("s")+`<rect width="1600" height="600" fill="url(#g)"/>`;
  for(let i=0;i<=20;i++){
    const x=800+(i-10)*260;
    inner+=`<path d="M${x} 600 L${800+(i-10)*36} 300" stroke="${line}" stroke-width="1.6" opacity=".3"/>`;
  }
  for(let i=0;i<14;i++){
    const y=300+Math.pow(i/13,2.1)*300;
    inner+=`<path d="M0 ${y.toFixed(1)} L1600 ${y.toFixed(1)}" stroke="${line}" stroke-width="1.6" opacity="${(0.12+i*0.03).toFixed(2)}"/>`;
  }
  return svgURL(inner,defs);
}
function coverField(sky,cols){
  const defs=lg("s",sky);
  let inner=bg("s");
  inner+=`<circle cx="1230" cy="200" r="72" fill="#ffe6a8" opacity=".95"/>`;
  inner+=`<path d="M0 392 C300 356 560 420 900 386 C1200 356 1400 402 1600 378 L1600 600 L0 600 Z" fill="${cols[0]}"/>`;
  inner+=`<path d="M0 460 C280 430 560 486 880 456 C1180 428 1400 466 1600 446 L1600 600 L0 600 Z" fill="${cols[1]}"/>`;
  let s="";
  for(let i=0;i<170;i++){
    const x=(i*211)%1620, y=470+((i*67)%120), h=18+((i*43)%26);
    s+=`<path d="M${x} ${y} q${((i%5)-2)*4} ${-h*0.6} ${((i%5)-2)*7} ${-h}" stroke="${cols[2]}" stroke-width="2.4" fill="none" opacity=".55"/>`;
  }
  return svgURL(inner+s,defs);
}
function coverArcs(base,cols){
  const defs=lg("s",base);
  let inner=bg("s");
  cols.forEach((c,i)=>{
    const r=220+i*130;
    inner+=`<path d="M${800-r} 600 A${r} ${r} 0 0 1 ${800+r} 600 Z" fill="${c}" opacity="${0.85-i*0.13}"/>`;
  });
  return svgURL(inner,defs);
}

/* ============================================================
   HERO COVERS — library, own upload, own URL, and a Notion-style
   vertical reposition.
   ============================================================ */
function heroVal(key){
  const h=S.settings.heroes?.[key];
  if(!h)return null;
  if(typeof h==="string")return{t:"u",src:h,pos:50};      // pre-v5 entries
  return{t:h.t||"u",id:h.id,src:h.src,pos:h.pos??50};
}
function heroSrc(key){
  const h=heroVal(key); if(!h)return null;
  return h.t==="b"?coverSrc(h.id):h.src;
}
function setHero(key,val){
  S.settings.heroes=S.settings.heroes||{};
  if(!val)delete S.settings.heroes[key]; else S.settings.heroes[key]=val;
  save();
}
let heroRepos=null;

function heroHTML(key,title,sub){
  const h=heroVal(key),src=heroSrc(key);
  const repos=heroRepos===key;
  return `<section class="hero ${src?"has-img":""} ${repos?"repos":""}" data-herokey="${key}">
    ${src?`<img class="hero-img" src="${src}" alt="" style="object-position:50% ${h.pos}%"
        onerror="this.closest('.hero').classList.add('broken')">`:""}
    ${src?`<div class="hero-scrim"></div>`:""}
    <div class="hero-broken">Dieses Bild ließ sich nicht laden. Prüfe den Link oder wähle ein anderes.</div>
    ${repos?`<div class="repos-bar">
        <span>${ic("image")}</span><span style="flex:1">Bild mit der Maus oder dem Finger nach oben und unten ziehen</span>
        <button class="btn sm" data-heroposdone>Fertig</button>
      </div>`:`
      <div class="hero-tools">
        <button class="btn sm" data-heropick="${key}">${ic("image")}<span>${src?"Ändern":"Titelbild"}</span></button>
        ${src?`<button class="btn sm" data-heropos="${key}">${ic("chevU")}<span>Position</span></button>`:""}
        ${src?`<button class="btn sm" data-heroDel="${key}" aria-label="Titelbild entfernen">${ic("trash")}</button>`:""}
      </div>`}
    <div class="hero-body"><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>
  </section>`;
}

function heroPickDlg(key){
  const cur=heroVal(key);
  const groups=[...new Set(COVERS.map(c=>c.g))];
  let sel=cur?{...cur}:null;
  const tile=c=>`<button class="covertile ${sel?.t==="b"&&sel.id===c.id?"on":""}" data-cover="${c.id}" aria-label="${esc(c.n)}">
      <img src="${coverSrc(c.id)}" alt="" loading="lazy"><span class="cn">${esc(c.n)}</span></button>`;
  modal({title:"Titelbild",size:"wide",
    body:`<div id="heroPrev" class="heroprev">
        ${sel?`<img src="${sel.t==="b"?coverSrc(sel.id):sel.src}" style="object-position:50% ${sel.pos}%"
           onerror="this.parentNode.classList.add('broken')">`:`<div class="nopreview">Noch kein Bild gewählt</div>`}
        <div class="prevbroken">Bild konnte nicht geladen werden</div>
      </div>
      <div class="field" style="margin:14px 0 20px">
        <label>Vertikale Position · <span id="posVal">${sel?.pos??50}</span> %</label>
        <input type="range" min="0" max="100" step="1" value="${sel?.pos??50}" id="posRange" ${sel?"":"disabled"}>
      </div>
      ${groups.map(g=>`<div class="sect-h" style="margin-bottom:10px"><h2 style="font-size:15px">${esc(g)}</h2></div>
        <div class="covergrid" style="margin-bottom:20px">${COVERS.filter(c=>c.g===g).map(tile).join("")}</div>`).join("")}
      <hr class="hr">
      <div class="row2">
        <div class="field"><label>Eigenes Foto</label>
          <button class="btn block" data-heroupload>${ic("upload")}<span>Vom Gerät wählen</span></button>
          <p class="meta" style="margin-top:7px;line-height:1.55">Wird als Bilddatei in deinen Daten gespeichert und ist damit auch auf dem iPhone da — macht die Datei aber deutlich größer.</p></div>
        <div class="field"><label>Bild-Link</label>
          <input class="inp" id="heroUrl" placeholder="https://images.unsplash.com/photo-…" value="${sel?.t==="u"&&!String(sel.src||"").startsWith("data:")?esc(sel.src):""}">
          <button class="btn sm ghost" style="margin-top:8px" data-herourl>Übernehmen</button>
          <p class="meta" style="margin-top:7px;line-height:1.55">Jede direkte Bildadresse funktioniert. Der Link wird gespeichert, nicht das Bild — bleibt klein, braucht aber Internet.</p></div>
      </div>`,
    footer:`${cur?`<button class="btn danger sm" data-heroclear aria-label="Entfernen">${ic("trash")}</button>`:""}
      <div class="sp"></div><button class="btn ghost" data-x>Abbrechen</button><button class="btn primary" data-ok>Übernehmen</button>`,
    onMount(o,close){
      const prev=o.querySelector("#heroPrev"),range=o.querySelector("#posRange"),pv=o.querySelector("#posVal");
      const draw=()=>{
        prev.classList.remove("broken");
        prev.innerHTML=(sel
          ?`<img src="${sel.t==="b"?coverSrc(sel.id):sel.src}" style="object-position:50% ${sel.pos}%"
             onerror="this.parentNode.classList.add('broken')">`
          :`<div class="nopreview">Noch kein Bild gewählt</div>`)
          +`<div class="prevbroken">Bild konnte nicht geladen werden</div>`;
        range.disabled=!sel; range.value=sel?.pos??50; pv.textContent=sel?.pos??50;
        o.querySelectorAll("[data-cover]").forEach(b=>
          b.classList.toggle("on",sel?.t==="b"&&sel.id===b.dataset.cover));
      };
      o.querySelectorAll("[data-cover]").forEach(b=>b.onclick=()=>{
        sel={t:"b",id:b.dataset.cover,pos:sel?.pos??50};draw();});
      range.oninput=()=>{if(!sel)return;sel.pos=+range.value;pv.textContent=range.value;
        const img=prev.querySelector("img"); if(img)img.style.objectPosition=`50% ${range.value}%`;};
      o.querySelector("[data-heroupload]").onclick=()=>pickImage(u=>{sel={t:"u",src:u,pos:sel?.pos??50};draw();},1800);
      o.querySelector("[data-herourl]").onclick=()=>{
        const v=o.querySelector("#heroUrl").value.trim();
        if(!/^https?:\/\//i.test(v)){toast("Bitte eine vollständige Adresse mit https:// einfügen.");return;}
        sel={t:"u",src:v,pos:sel?.pos??50};draw();};
      o.querySelector("[data-heroclear]")?.addEventListener("click",()=>{setHero(key,null);close();render();});
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-ok]").onclick=()=>{setHero(key,sel);close();render();};
      draw();
    }});
}

/* drag the hero image up and down, like Notion */
let heroDrag=null;
document.addEventListener("pointerdown",e=>{
  if(!heroRepos)return;
  if(!e.target||typeof e.target.closest!=="function")return;
  const hero=e.target.closest(".hero.repos"); if(!hero)return;
  if(e.target.closest(".repos-bar"))return;
  const h=heroVal(heroRepos); if(!h)return;
  e.preventDefault();
  heroDrag={key:heroRepos,startY:e.clientY,startPos:h.pos,h:hero.getBoundingClientRect().height,el:hero};
  hero.setPointerCapture?.(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  if(!heroDrag)return;
  const dy=e.clientY-heroDrag.startY;
  const pos=clamp(Math.round(heroDrag.startPos-(dy/Math.max(80,heroDrag.h))*120),0,100);
  const img=heroDrag.el.querySelector(".hero-img");
  if(img)img.style.objectPosition=`50% ${pos}%`;
  heroDrag.pos=pos;
});
document.addEventListener("pointerup",()=>{
  if(!heroDrag)return;
  if(heroDrag.pos!=null){
    const h=heroVal(heroDrag.key);
    if(h)setHero(heroDrag.key,{...h,pos:heroDrag.pos});
  }
  heroDrag=null;
});

const treeScale=g=>+(0.24+0.76*Math.pow(clamp(g,0,1),0.7)).toFixed(3);
const treeTransform=g=>`translate(100 196) scale(${treeScale(g)}) translate(-100 -196)`;

function treeSVG(id,growth=1,extra=""){
  const g=clamp(growth,0,1);
  return `<svg viewBox="0 0 200 210" ${extra}>
    <ellipse cx="100" cy="197" rx="${(22+42*g).toFixed(1)}" ry="${(5+6*g).toFixed(1)}"

       style="transition:transform 900ms var(--ease),opacity 900ms var(--ease);opacity:${(0.5+0.5*g).toFixed(2)}">
      ${treeArt(id)}

}

/* ============================================================
   COURSES — modules, lessons, attachments
   ============================================================ */
function courseById(id){return S.growth.courses.find(c=>c.id===id);}
function ensureCourse(c){
  if(!Array.isArray(c.modules))c.modules=[];
  c.modules.forEach(m=>{if(!Array.isArray(m.lessons))m.lessons=[];
    m.lessons.forEach(l=>{if(!Array.isArray(l.files))l.files=[];});});
  return c;
}
function courseStats(c){
  ensureCourse(c);
  const lessons=c.modules.flatMap(m=>m.lessons);
  const done=lessons.filter(l=>l.done).length;
  const files=lessons.reduce((s,l)=>s+l.files.length,0);
  const bytes=lessons.reduce((s,l)=>s+l.files.reduce((a,f)=>a+(f.size||0),0),0);
  return{lessons:lessons.length,done,files,bytes,
    pct:lessons.length?done/lessons.length:(c.progress||0)/100};
}
const fmtBytes=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

function pickFile(cb,maxMB=8){
  const i=document.createElement("input");
  i.type="file";i.multiple=true;
  i.onchange=()=>{
    [...i.files].forEach(f=>{
      if(f.size>maxMB*1048576){toast(`${f.name} ist größer als ${maxMB} MB und wurde übersprungen.`);return;}
      const r=new FileReader();
      r.onload=()=>cb({id:uid(),name:f.name,mime:f.type||"application/octet-stream",size:f.size,data:r.result});
      r.readAsDataURL(f);
    });
  };
  i.click();
}
const _blobs={};
function fileURL(f){
  if(_blobs[f.id])return _blobs[f.id];
  try{
    const[m,b]=f.data.split(",");
    const mime=(m.match(/:(.*?);/)||[,f.mime])[1];
    const bin=atob(b),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return _blobs[f.id]=URL.createObjectURL(new Blob([u],{type:mime}));
  }catch(e){return f.data;}
}
function fileHTML(f){
  const isImg=/^image\//.test(f.mime);
  const isPdf=/pdf/.test(f.mime);
  const head=`<div class="fhead"><span class="fi">${ic(isImg?"image":isPdf?"note":"folder")}</span>
    <span class="fn">${esc(f.name)}</span><span class="meta">${fmtBytes(f.size)}</span>
    <a class="btn sm ghost" href="${fileURL(f)}" target="_blank" rel="noopener">Öffnen</a>
    <button class="iconbtn" data-filedel="${f.id}" aria-label="Datei entfernen">${ic("trash")}</button></div>`;
  if(isImg)return `<div class="fileitem">${head}<img class="fprev" src="${f.data}" alt="${esc(f.name)}"></div>`;
  if(isPdf)return `<div class="fileitem">${head}
    <iframe class="fpdf" src="${fileURL(f)}#toolbar=0&view=FitH" title="${esc(f.name)}" loading="lazy"></iframe></div>`;
  return `<div class="fileitem">${head}</div>`;
}

function moduleDlg(courseId,modId){
  const c=courseById(courseId);if(!c)return;
  const m=modId?c.modules.find(x=>x.id===modId):null;
  modal({title:m?"Bereich bearbeiten":"Neuer Bereich",size:"slim",
    body:`<div class="field"><label>Titel</label>
        <input class="inp" name="title" value="${esc(m?.title||"")}" placeholder="z. B. Master your Time" autofocus></div>
      <div class="field" style="margin-bottom:0"><label>Kurzbeschreibung, optional</label>
        <textarea class="ta" name="notes" style="min-height:70px">${esc(m?.notes||"")}</textarea></div>`,
    footer:`<div class="sp"></div><button class="btn ghost" data-x>Abbrechen</button>
      <button class="btn primary" data-ok>${m?"Speichern":"Anlegen"}</button>`,
    onMount(o,close){
      const g=n=>o.querySelector(`[name=${n}]`);
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-ok]").onclick=()=>{
        const title=g("title").value.trim();if(!title){g("title").focus();return;}
        if(m)Object.assign(m,{title,notes:g("notes").value.trim()});
        else c.modules.push({id:uid(),title,notes:g("notes").value.trim(),open:true,lessons:[]});
        save();close();render();};
    }});
}
function lessonDlg(courseId,modId,lesId){
  const c=courseById(courseId);if(!c)return;
  const m=c.modules.find(x=>x.id===modId);if(!m)return;
  const l=lesId?m.lessons.find(x=>x.id===lesId):null;
  modal({title:l?"Lektion umbenennen":"Neue Lektion",size:"slim",
    body:`<div class="field" style="margin-bottom:0"><label>Titel</label>
      <input class="inp" name="title" value="${esc(l?.title||"")}" placeholder="z. B. Zeitblöcke richtig setzen" autofocus></div>`,
    footer:`<div class="sp"></div><button class="btn ghost" data-x>Abbrechen</button>
      <button class="btn primary" data-ok>${l?"Speichern":"Anlegen"}</button>`,
    onMount(o,close){
      const g=o.querySelector("[name=title]");
      const ok=()=>{const title=g.value.trim();if(!title){g.focus();return;}
        if(l)l.title=title;
        else m.lessons.push({id:uid(),title,done:false,open:true,notes:"",files:[]});
        save();close();render();};
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-ok]").onclick=ok;
      g.onkeydown=e=>{if(e.key==="Enter")ok();};
    }});
}
function syncCourseProgress(c){
  const st=courseStats(c);
  if(st.lessons){
    c.progress=Math.round(st.pct*100);
    if(c.progress===100)c.status="fertig";
    else if(c.progress>0&&c.status==="offen")c.status="laufend";
  }
}

function nextShoppingDate(){
  const d=berlinNow(),w=dowIdx(d);
  return w===0?todayKey():dkey(addDays(d,7-w));   // today if it is Monday, otherwise the next one
}
function ensureShoppingBlock(){
  let b=S.blocks.find(x=>x.title==="Einkaufen"&&x.recurrence&&(x.recurrence.days||[]).includes(0));
  if(!b){
    b={id:uid(),created:Date.now(),title:"Einkaufen",type:"personal",start:"20:00",end:"21:00",
      notes:"Wocheneinkauf",date:null,taskId:null,exceptions:{},
      recurrence:{freq:"weekly",days:[0],from:todayKey(),until:null}};
    S.blocks.push(b);
  }
  return b;
}
function shoppingTaskFor(due){
  return S.tasks.find(t=>t.status!=="done"&&t.due===due&&/^Einkaufen\b/.test(t.title));
}
function itemsOnList(){
  const t=shoppingTaskFor(nextShoppingDate());
  if(!t)return[];
  return (t.desc||"").split("\n").map(s=>s.replace(/^[-·•]\s*/,"").trim()).filter(Boolean);
}

function ensureV5(st){
  ensureV4(st);
  const H=st.settings.heroes||{};
  Object.keys(H).forEach(k=>{ if(typeof H[k]==="string")H[k]={t:"u",src:H[k],pos:50}; });
  st.settings.heroes=H;
  (st.growth?.courses||[]).forEach(ensureCourse);
  return st;
}

function bindCourse(){
  const c=courseById(route.params.id);if(!c)return;
  const n=$("#courseNotes");
  if(n)n.addEventListener("input",debounce(()=>{c.notes=n.value;save();},420));
  $$("[data-lesnote]").forEach(el=>el.addEventListener("input",debounce(()=>{
    const[mid,lid]=el.dataset.lesnote.split("|");
    const m=c.modules.find(x=>x.id===mid);const l=m?.lessons.find(x=>x.id===lid);
    if(l){l.notes=el.value;save();}
  },420)));
}

/* capture phase: take over two actions the older handlers still own */
document.addEventListener("click",e=>{
  const co=e.target.closest("[data-course]");
  // the reorder controls sit inside the row and must not open the course
  if(co&&!e.target.closest("[data-cedit2],[data-cup],[data-cdn],[data-cgrip]")){
    e.stopPropagation();go("course",{id:co.dataset.course});return;
  }
},true);

document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);

  /* hero covers */
  const hp=hit("[data-heropick]"); if(hp){heroPickDlg(hp.dataset.heropick);return;}
  const hq=hit("[data-heropos]"); if(hq){heroRepos=hq.dataset.heropos;render();return;}
  if(hit("[data-heroposdone]")){heroRepos=null;render();return;}

  /* courses */
  if(hit("[data-gback]")){go("growth",{tab:"courses"});return;}
  const ce2=hit("[data-cedit2]"); if(ce2){e.stopPropagation();simpleDlg("courses",ce2.dataset.cedit2);return;}
  const cid=()=>route.params.id;
  if(hit("[data-modadd]")){moduleDlg(cid());return;}
  const mt=hit("[data-modtoggle]");
  if(mt&&!hit("[data-modedit]")&&!hit("[data-moddel]")){
    const m=courseById(cid())?.modules.find(x=>x.id===mt.dataset.modtoggle);
    if(m){m.open=m.open===false;save();render();}return;}
  const me=hit("[data-modedit]"); if(me){e.stopPropagation();moduleDlg(cid(),me.dataset.modedit);return;}
  const md=hit("[data-moddel]");
  if(md){e.stopPropagation();
    const c=courseById(cid()),m=c.modules.find(x=>x.id===md.dataset.moddel);
    confirmDlg("Bereich entfernen",`„${esc(m.title)}“ und ${m.lessons.length} Lektionen werden entfernt.`,"Entfernen",()=>{
      const i=c.modules.indexOf(m),copy=JSON.parse(JSON.stringify(m));
      c.modules.splice(i,1);syncCourseProgress(c);save();render();
      toast("Bereich entfernt.",()=>{c.modules.splice(i,0,copy);syncCourseProgress(c);save();render();});
    },true);return;}
  const la=hit("[data-lesadd]"); if(la){lessonDlg(cid(),la.dataset.lesadd);return;}
  const ld=hit("[data-lesdone]");
  if(ld){e.stopPropagation();
    const[mid,lid]=ld.dataset.lesdone.split("|");
    const c=courseById(cid()),m=c.modules.find(x=>x.id===mid),l=m?.lessons.find(x=>x.id===lid);
    if(l){l.done=!l.done;syncCourseProgress(c);save();render();}return;}
  const lt=hit("[data-lestoggle]");
  if(lt){const[mid,lid]=lt.dataset.lestoggle.split("|");
    const l=courseById(cid())?.modules.find(x=>x.id===mid)?.lessons.find(x=>x.id===lid);
    if(l){l.open=!l.open;save();render();}return;}
  const lr=hit("[data-lesrename]");
  if(lr){const[mid,lid]=lr.dataset.lesrename.split("|");lessonDlg(cid(),mid,lid);return;}
  const lf=hit("[data-lesfile]");
  if(lf){const[mid,lid]=lf.dataset.lesfile.split("|");
    const l=courseById(cid())?.modules.find(x=>x.id===mid)?.lessons.find(x=>x.id===lid);
    if(l)pickFile(f=>{l.files.push(f);save();render();toast(`${f.name} angehängt.`);});
    return;}
  const lx=hit("[data-lesdel]");
  if(lx){const[mid,lid]=lx.dataset.lesdel.split("|");
    const c=courseById(cid()),m=c.modules.find(x=>x.id===mid);
    const i=m.lessons.findIndex(x=>x.id===lid),copy=m.lessons[i];
    m.lessons.splice(i,1);syncCourseProgress(c);save();render();
    toast("Lektion entfernt.",()=>{m.lessons.splice(i,0,copy);syncCourseProgress(c);save();render();});
    return;}
  const fd=hit("[data-filedel]");
  if(fd){e.stopPropagation();
    const c=courseById(cid());
    c.modules.forEach(m=>m.lessons.forEach(l=>{
      const i=l.files.findIndex(f=>f.id===fd.dataset.filedel);
      if(i>=0){const copy=l.files[i];l.files.splice(i,1);save();render();
        toast("Datei entfernt.",()=>{l.files.splice(i,0,copy);save();render();});}
    }));return;}

  /* shopping */
  const sl=hit("[data-shop]"); if(sl){addToShoppingList([sl.dataset.shop]);return;}
  if(hit("[data-shopall]")){
    const low=C_().supplies.filter(s=>supplyStatus(s).k!=="ok").map(s=>s.name);
    if(!low.length){toast("Alles vorrätig.");return;}
    addToShoppingList(low);return;}
},false);

/* ============================================================
   FOREST BACKDROP
   A drawn scene behind the focus panel. Changes with the time
   of day, deterministic so it never jitters between renders.
   ============================================================ */
function timeOfDay(h){
  const x=h??berlinNow().getHours();
  if(x>=5&&x<8)return"dawn";
  if(x>=8&&x<17)return"day";
  if(x>=17&&x<21)return"dusk";
  return"night";
}

    fog:"rgba(255,226,204,.42)",spark:"#ffd9a0",sparkN:9,starN:14,orbY:.58},
  night:{sky:[[0,"#15223a"],[.5,"#1f3050"],[1,"#2c4160"]],orb:"#eaf1ff",orbGlow:"#9fb6e0",
    hills:["#2c3d58","#223148","#18243a"],pine:["#142034","#0e1727"],
    fog:"rgba(176,200,232,.16)",spark:"#ffe9a8",sparkN:16,starN:52,orbY:.26}
