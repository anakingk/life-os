const hsh=(i,m)=>Math.abs((i*2654435761)%m);

function pineBand(y,color,size,count,seed,opacity){
  let p="";
  for(let i=0;i<count;i++){
    const x=(i+0.5)*(1200/count)+hsh(i+seed,46)-23;
    const h=size*(0.72+hsh(i+seed*3,45)/100);
    const w=size*0.40;
    p+=`<path d="M${x.toFixed(0)} ${(y-h).toFixed(0)} L${(x+w).toFixed(0)} ${y} L${(x-w).toFixed(0)} ${y} Z"/>`;
    p+=`<path d="M${x.toFixed(0)} ${(y-h*1.36).toFixed(0)} L${(x+w*0.72).toFixed(0)} ${(y-h*0.46).toFixed(0)} L${(x-w*0.72).toFixed(0)} ${(y-h*0.46).toFixed(0)} Z"/>`;
  }
  return `<g fill="${color}" opacity="${opacity}">${p}</g>`;
}
function forestBackdrop(mood,strong){
  const P=SKIES[mood]||SKIES.day;
  const id="bd"+mood+(strong?"a":"b");
  let defs=`<linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1">${
    P.sky.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join("")}</linearGradient>
    <radialGradient id="glow${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="${P.orbGlow}" stop-opacity=".85"/>
      <stop offset="1" stop-color="${P.orbGlow}" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".62" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="1"/></linearGradient>
    <mask id="mask${id}"><rect width="1200" height="700" fill="url(#fade${id})"/></mask>`;

  const oy=700*P.orbY;
  let s=`<rect width="1200" height="700" fill="url(#sky${id})"/>`;

  // stars
  for(let i=0;i<P.starN;i++){
    const x=hsh(i+7,1180)+10,y=hsh(i+31,300)+12,r=(hsh(i+53,10)/10)*1.3+0.5;
    s+=`<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="#fff" opacity="${(0.25+hsh(i+11,50)/140).toFixed(2)}"/>`;
  }
  // sun or moon
  s+=`<circle cx="880" cy="${oy.toFixed(0)}" r="230" fill="url(#glow${id})"/>`;
  s+=`<circle cx="880" cy="${oy.toFixed(0)}" r="${mood==="night"?38:58}" fill="${P.orb}" opacity="${mood==="night"?.92:.95}"/>`;
  if(mood==="night")s+=`<circle cx="864" cy="${(oy-12).toFixed(0)}" r="34" fill="${P.sky[1][1]}" opacity=".9"/>`;

  // hills
  s+=`<path d="M0 392 C180 340 360 404 560 372 C760 340 940 392 1200 350 L1200 700 L0 700 Z" fill="${P.hills[0]}" opacity=".78"/>`;
  s+=pineBand(408,P.pine[0],52,22,5,.4);
  s+=`<path d="M0 452 C220 410 420 470 660 440 C880 412 1040 458 1200 430 L1200 700 L0 700 Z" fill="${P.hills[1]}" opacity=".9"/>`;
  s+=pineBand(474,P.pine[0],82,15,17,.6);
  s+=`<path d="M0 536 C240 500 460 560 720 528 C960 498 1080 540 1200 518 L1200 700 L0 700 Z" fill="${P.hills[2]}"/>`;
  s+=pineBand(566,P.pine[1],126,10,29,.85);

  // ground fog keeps the middle readable
  s+=`<ellipse cx="600" cy="500" rx="760" ry="86" fill="${P.fog}"/>`;
  s+=`<ellipse cx="300" cy="546" rx="420" ry="52" fill="${P.fog}" opacity=".7"/>`;
  s+=`<ellipse cx="950" cy="562" rx="380" ry="46" fill="${P.fog}" opacity=".6"/>`;

  // foreground bank with grass and two bushes
  s+=`<path d="M0 632 C200 606 420 646 700 622 C940 602 1080 630 1200 616 L1200 700 L0 700 Z" fill="${P.pine[1]}" opacity=".92"/>`;
  s+=`<ellipse cx="86" cy="640" rx="104" ry="46" fill="${P.pine[1]}"/>`;
  s+=`<ellipse cx="1128" cy="650" rx="118" ry="52" fill="${P.pine[1]}"/>`;
  let grass="";
  for(let i=0;i<72;i++){
    const x=hsh(i+3,1200),y=628+hsh(i+19,52),h=12+hsh(i+41,20);
    const d=(i%3)-1;
    grass+=`<path d="M${x} ${y} q${d*4} ${-h*0.6} ${d*8} ${-h}"/>`;
  }
  s+=`<g stroke="${P.pine[1]}" stroke-width="2.4" fill="none" opacity=".75" stroke-linecap="round">${grass}</g>`;

  // fireflies at dusk and night — never animated when the system asks for calm
  const calm=typeof window!=="undefined"&&window.matchMedia
    ?window.matchMedia("(prefers-reduced-motion: reduce)").matches:false;
  for(let i=0;i<P.sparkN;i++){
    const x=hsh(i+67,1140)+30,y=440+hsh(i+83,190),r=1.8+hsh(i+97,14)/10;
    s+=`<circle cx="${x}" cy="${y}" r="${(r*3.4).toFixed(1)}" fill="${P.spark}" opacity=".13"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${P.spark}" opacity=".8">${calm?"":
        `<animate attributeName="opacity" values="0.8;0.18;0.8" dur="${(2.6+hsh(i+13,28)/10).toFixed(1)}s"
          begin="${(hsh(i+5,30)/10).toFixed(1)}s" repeatCount="indefinite"/>`}</circle>`;
  }
  s+=`<rect width="1200" height="700" fill="url(#fade${id})" opacity=".14"/>`;

  return `<div class="fbackdrop ${strong?"strong":""}" aria-hidden="true">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice"><defs>${defs}</defs>${s}</svg>
  </div>`;
}

function mediaBreakdown(){
  const size=s=>s?new Blob([String(s)]).size:0;
  const rows=[];
  let heroes=0,heroCount=0,linked=0,builtin=0;
  Object.values(S.settings.heroes||{}).forEach(h=>{
    const v=typeof h==="string"?{t:"u",src:h}:h;
    if(v.t==="b"){builtin++;return;}
    if(String(v.src||"").startsWith("data:")){heroes+=size(v.src);heroCount++;}
    else linked++;
  });
  rows.push({k:"Titelbilder, eingebettet",n:heroCount,b:heroes});

  let rec=0,recN=0;
  S.recipes.forEach(r=>{if(String(r.img||"").startsWith("data:")){rec+=size(r.img);recN++;}});
  rows.push({k:"Rezeptfotos",n:recN,b:rec});

  let cov=0,covN=0;
  S.growth.books.forEach(b=>{if(String(b.cover||"").startsWith("data:")){cov+=size(b.cover);covN++;}});
  rows.push({k:"Buchcover",n:covN,b:cov});

  let files=0,fileN=0;
  (S.growth.courses||[]).forEach(c=>(c.modules||[]).forEach(m=>(m.lessons||[]).forEach(l=>
    (l.files||[]).forEach(f=>{files+=f.size||size(f.data);fileN++;}))));
  rows.push({k:"Kursdateien",n:fileN,b:files});

  const media=rows.reduce((s,r)=>s+r.b,0);
  const total=payloadSize();
  return{rows,media,total,text:total-media,builtin,linked};
}

const TASK_SORTS=[
  {id:"created", n:"Angelegt",     get:t=>t.created||0,                     num:true},
  {id:"due",     n:"Fälligkeit",   get:t=>t.due?parseKey(t.due).getTime():Infinity, num:true},
  {id:"prio",    n:"Priorität",    get:t=>prio(t.prio).rank,                 num:true},

  {id:"mins",    n:"Dauer",        get:t=>t.mins||0,                         num:true},
  {id:"cat",     n:"Bereich",      get:t=>cat(t.cat).name.toLowerCase(),     num:false},
  {id:"status",  n:"Status",       get:t=>STATUSES.findIndex(s=>s.id===t.status), num:true},
  {id:"done",    n:"Erledigt am",  get:t=>t.completedAt||0,                  num:true}
];
const DUE_FILTERS=[["all","Alle"],["overdue","Überfällig"],["today","Heute"],
  ["week","Diese Woche"],["later","Später"],["none","Ohne Datum"]];

function taskViewDefaults(){
  return{view:"kanban",q:"",cat:"",prio:"",status:[],due:"all",tag:"",block:"all",
    sort:"created",dir:-1,open:false};
}
function TV(){
  if(!S.settings.taskView)S.settings.taskView={...taskViewDefaults()};
  else S.settings.taskView={...taskViewDefaults(),...S.settings.taskView};
  return S.settings.taskView;
}
function setTV(patch){ S.settings.taskView={...TV(),...patch}; save(); render(); }
function tvActiveCount(){
  const v=TV();
  return (v.cat?1:0)+(v.prio?1:0)+(v.status.length?1:0)+(v.due!=="all"?1:0)+(v.tag?1:0)+(v.block!=="all"?1:0);
}
function allTags(){
  const s=new Set();
  S.tasks.forEach(t=>(t.tags||[]).forEach(x=>s.add(x)));
  return [...s].sort((a,b)=>a.localeCompare(b,"de"));
}
function filteredTasks(){
  const v=TV(),q=v.q.trim().toLowerCase(),key=todayKey();
  const weekEnd=dkey(addDays(startOfWeek(berlinNow()),6));
  return S.tasks.filter(t=>{
    if(q&&!(t.title.toLowerCase().includes(q)||(t.desc||"").toLowerCase().includes(q)
      ||(t.tags||[]).some(x=>x.toLowerCase().includes(q))))return false;
    if(v.cat&&t.cat!==v.cat)return false;
    if(v.prio&&t.prio!==v.prio)return false;
    if(v.status.length&&!v.status.includes(t.status))return false;
    if(v.tag&&!(t.tags||[]).includes(v.tag))return false;
    if(v.block==="linked"&&!t.blockId)return false;
    if(v.block==="free"&&t.blockId)return false;
    if(v.due==="none"&&t.due)return false;
    if(v.due==="overdue"&&!(t.due&&t.due<key&&t.status!=="done"))return false;
    if(v.due==="today"&&t.due!==key)return false;
    if(v.due==="week"&&!(t.due&&t.due>=key&&t.due<=weekEnd))return false;
    if(v.due==="later"&&!(t.due&&t.due>weekEnd))return false;
    return true;
  });
}
function sortTasks(list){
  const v=TV(),s=TASK_SORTS.find(x=>x.id===v.sort)||TASK_SORTS[0];
  return [...list].sort((a,b)=>{
    const x=s.get(a),y=s.get(b);
    let r=s.num?(x-y):String(x).localeCompare(String(y),"de");
    if(!r)r=(b.created||0)-(a.created||0);
    return r*(v.dir||1);
  });
}
/** Lazily give every task in a column a position, so dragging can reorder. */
function ensureOrder(statusId){
  const col=S.tasks.filter(t=>t.status===statusId);
  if(!col.length||col.every(t=>typeof t.order==="number"))return false;
  col.sort((a,b)=>(a.order??Infinity)-(b.order??Infinity)
    ||prio(b.prio).rank-prio(a.prio).rank||(b.created||0)-(a.created||0))
    .forEach((t,i)=>{t.order=i;});
  return true;
}

function viewTasks(){
  const v=TV();
  let changed=false;
  STATUSES.forEach(s=>{if(ensureOrder(s.id))changed=true;});
  if(changed)save();

  const ts=filteredTasks();
  const total=S.tasks.length,done=S.tasks.filter(t=>t.status==="done").length;
  const pct=total?Math.round(done/total*100):0;

  let body="";
  if(v.view==="kanban"){
    body=`<div class="kb">${STATUSES.map(st=>{
      const items=colTasks(ts,st.id);
      const mins=items.reduce((s,t)=>s+(t.mins||0),0);
      return `<section class="kcol" data-col="${st.id}">
        <div class="kcol-h"><span class="dot" style="background:${st.color}"></span>
          <span class="nm">${st.name}</span><span class="count">${items.length}</span>

      </section>`;}).join("")}</div>`;
  } else {
    let rows=ts;
    if(v.view==="today"){const k=todayKey();rows=ts.filter(t=>t.status!=="done"&&t.due&&t.due<=k);}
    else if(v.view==="done")rows=ts.filter(t=>t.status==="done");
    else if(!v.status.length)rows=ts.filter(t=>t.status!=="done");
    rows=sortTasks(rows);
    const mins=rows.reduce((s,t)=>s+(t.mins||0),0);
    const th=(id,label,style="")=>`<th ${style} class="sortable ${v.sort===id?"on":""}" data-tvsort2="${id}">

        <b>${rows.length}</b> von ${total} Aufgaben${mins?` · geschätzt ${mins>=60?(mins/60).toFixed(1)+" h":mins+" min"}`:""}
        ${rows.filter(t=>t.due&&t.due<todayKey()&&t.status!=="done").length
          ?` · <span style="color:var(--danger);font-weight:650">${rows.filter(t=>t.due&&t.due<todayKey()&&t.status!=="done").length} überfällig</span>`:""}
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th style="width:44px"></th>${th("title","Aufgabe")}
        ${th("cat","Bereich",'style="width:150px"')}${th("prio","Priorität",'style="width:112px"')}
        ${th("due","Fällig",'style="width:112px"')}${th("mins","Dauer",'style="width:84px"')}
        ${th("status","Status",'style="width:122px"')}</tr></thead>
        <tbody>${rows.map(t=>{
          const late=t.due&&t.due<todayKey()&&t.status!=="done",s=status(t.status);
          return `<tr data-task="${t.id}">
            <td><input type="checkbox" ${t.status==="done"?"checked":""} data-tdone="${t.id}" aria-label="Erledigt"></td>
            <td class="${t.status==="done"?"done-t":""}" style="font-weight:550">${esc(t.title)}
              ${(t.tags||[]).length?`<span class="meta" style="margin-left:7px">${(t.tags||[]).map(x=>"#"+esc(x)).join(" ")}</span>`:""}</td>
            <td>${catBadge(t.cat)||'<span class="meta">—</span>'}</td>
            <td>${prioPill(t.prio)}</td>
            <td>${t.due?pillDue(t.due,late):'<span class="meta">—</span>'}</td>
            <td><span class="meta">${t.mins?t.mins+" min":"—"}</span></td>
            <td><span class="badge" style="background:${s.color}1a;color:${s.color}">${s.name}</span></td>
          </tr>`;}).join("")}</tbody></table></div>`
      :emptyHTML("tasks",tvActiveCount()||v.q?"Kein Treffer.":v.view==="done"?"Noch nichts abgehakt.":"Hier ist gerade nichts.",
        tvActiveCount()||v.q?`<button class="btn primary" data-tvreset>Filter zurücksetzen</button>`
          :`<button class="btn primary" data-q2="task">Aufgabe anlegen</button>`,
        tvActiveCount()||v.q?"Mit diesen Filtern passt keine Aufgabe.":"");
  }
  return `<div class="page page-wide">
    ${heroHTML("tasks","Aufgaben",`${total-done} offen · ${pct} % erledigt`)}

}

/* ---------- board: drag with a visible drop position ---------- */
function bindKanban(){
  let dragId=null,line=null;
  const clearLine=()=>{if(line&&line.parentNode)line.remove();line=null;};
  $$(".tcard").forEach(c=>{
    c.addEventListener("dragstart",e=>{
      dragId=c.dataset.task;c.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",dragId);}catch(err){}
    });
    c.addEventListener("dragend",()=>{
      c.classList.remove("dragging");dragId=null;clearLine();
      $$(".kcol").forEach(k=>k.classList.remove("over"));
    });
  });
  $$("[data-drop]").forEach(z=>{
    const col=z.closest(".kcol");
    const posFor=y=>{
      const cards=[...z.querySelectorAll(".tcard:not(.dragging)")];
      let i=cards.length;
      for(let k=0;k<cards.length;k++){
        const r=cards[k].getBoundingClientRect();
        if(y<r.top+r.height/2){i=k;break;}
      }
      return{i,cards};
    };
    z.addEventListener("dragover",e=>{
      e.preventDefault();col.classList.add("over");
      if(!line){line=document.createElement("div");line.className="dropline";}
      const{i,cards}=posFor(e.clientY);
      if(i>=cards.length)z.appendChild(line); else z.insertBefore(line,cards[i]);
    });
    z.addEventListener("dragleave",e=>{
      if(z.contains(e.relatedTarget))return;
      col.classList.remove("over");clearLine();
    });
    z.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("over");
      const id=dragId||(()=>{try{return e.dataTransfer.getData("text/plain");}catch(err){return null;}})();
      const{i}=posFor(e.clientY);
      clearLine();
      if(!id)return;
      const t=S.tasks.find(x=>x.id===id);if(!t)return;
      const to=z.dataset.drop;
      const wasStatus=t.status,wasOrder=t.order,wasDone=t.completedAt;
      const rest=S.tasks.filter(x=>x.status===to&&x.id!==id).sort((a,b)=>(a.order??1e9)-(b.order??1e9));
      rest.splice(clamp(i,0,rest.length),0,t);
      t.status=to;
      t.completedAt=to==="done"?(t.completedAt||Date.now()):null;
      rest.forEach((x,k)=>{x.order=k;});
      if(wasStatus!==to)ensureOrder(wasStatus);
      save();render();
      if(wasStatus!==to&&to==="done")
        toast("Erledigt.",()=>{t.status=wasStatus;t.order=wasOrder;t.completedAt=wasDone;save();render();});
    });
  });
  $$("[data-quick]").forEach(inp=>{
    inp.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||!inp.value.trim())return;
      const st=inp.dataset.quick;
      const min=Math.min(0,...S.tasks.filter(x=>x.status===st).map(x=>x.order??0));
      S.tasks.unshift({id:uid(),created:Date.now(),title:inp.value.trim(),desc:"",
        status:st,cat:TV().cat||"",prio:"medium",due:TV().due==="today"?todayKey():"",
        mins:0,tags:TV().tag?[TV().tag]:[],order:min-1,
        completedAt:st==="done"?Date.now():null});
      inp.value="";save();render();
    });
  });
  const tq=$("#tq");
  if(tq)tq.addEventListener("input",debounce(()=>{
    const p=tq.selectionStart;
    S.settings.taskView={...TV(),q:tq.value};save();render();
    const n=$("#tq");if(n){n.focus();n.setSelectionRange(p,p);}
  },260));
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);
  const tv=hit("[data-tv]"); if(tv){setTV({view:tv.dataset.tv});return;}
  if(hit("[data-tvopen]")){setTV({open:!TV().open});return;}
  if(hit("[data-tvdir]")){setTV({dir:TV().dir===1?-1:1});return;}
  if(hit("[data-tvreset]")){
    const v=TV();S.settings.taskView={...taskViewDefaults(),view:v.view,sort:v.sort,dir:v.dir};
    save();render();return;}
  const tc=hit("[data-tvclear]");
  if(tc){const k=tc.dataset.tvclear;
    setTV({[k]:k==="status"?[]:(k==="due"||k==="block")?"all":""});return;}
  const ss=hit("[data-tvstatus]");
  if(ss){const id=ss.dataset.tvstatus,cur=TV().status;
    setTV({status:cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]});return;}
  const sd=hit("[data-tvdue]"); if(sd){setTV({due:sd.dataset.tvdue});return;}
  const sb=hit("[data-tvblock]"); if(sb){setTV({block:sb.dataset.tvblock});return;}
  const s2=hit("[data-tvsort2]");
  if(s2){const id=s2.dataset.tvsort2;
    setTV(TV().sort===id?{dir:TV().dir===1?-1:1}:{sort:id,dir:id==="title"||id==="cat"?1:-1});return;}
},false);

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("[data-tvsort]")){setTV({sort:t.value});return;}
  if(t.matches("[data-tvcat]")){setTV({cat:t.value});return;}
  if(t.matches("[data-tvprio]")){setTV({prio:t.value});return;}
  if(t.matches("[data-tvtag]")){setTV({tag:t.value});return;}
},false);

boot();

SHOP_CATS.forEach(c=>c.items.forEach(it=>{SHOP_INDEX[it.id]=it;}));
const catOf=id=>SHOP_CATS.find(c=>c.id===id)||SHOP_CATS[0];

/* ============================================================
   SHOPPING — engine and views
   Tap a tile to put it in the basket, tap again for ×2, ×3 …
   The minus on the tile counts back down.
   ============================================================ */
function defaultShop(){
  return{list:{},custom:[],history:{},open:{oft:true,vorrat:false,haushalt:false},
    q:"",lastDone:null,onlyList:false};
}
const SH=()=>S.shop;
function shopItem(id){
  return SHOP_INDEX[id]||(SH().custom||[]).find(c=>c.id===id)
    ||{id,n:id.replace(/^i_/,"").replace(/_/g," "),e:"🛒",cat:"custom"};
}
const shopEntries=()=>Object.entries(SH().list||{})
  .map(([id,v])=>({...v,id,item:shopItem(id)}))
  .sort((a,b)=>(a.done-b.done)||(a.at-b.at));
const shopQty=id=>SH().list?.[id]?.qty||0;
const shopOpen=()=>shopEntries().filter(e=>!e.done);
const shopTotal=()=>shopEntries().reduce((s,e)=>s+e.qty,0);

function shopAdd(id,n=1){
  const L=SH().list;
  if(!L[id])L[id]={qty:0,done:false,at:Date.now()};
  L[id].qty+=n;
  if(L[id].done&&n>0)L[id].done=false;
  save();
}
function shopSub(id){
  const L=SH().list;
  if(!L[id])return;
  L[id].qty-=1;
  if(L[id].qty<=0)delete L[id];
  save();
}
function shopRemove(id){ delete SH().list[id]; save(); }
function shopToggleDone(id){
  const e=SH().list[id]; if(!e)return;
  e.done=!e.done; save();
}
function shopFinish(){
  const H=SH().history;
  Object.keys(SH().list).forEach(id=>{H[id]=(H[id]||0)+1;});
  SH().list={}; SH().lastDone=new Date().toISOString();
  save();render();
  toast("Einkauf abgeschlossen. Die Liste ist wieder leer.");
}
function shopAddCustom(name,emoji,catId){
  const n=name.trim(); if(!n)return null;
  const id=shopSlug(n);
  if(!SHOP_INDEX[id]&&!SH().custom.some(c=>c.id===id))
    SH().custom.push({id,n,e:emoji||"🛒",cat:catId||"custom",custom:true});
  shopAdd(id);
  return id;
}
/** used by the supplies shortcut so there is only ever one shopping list */
function shopAddByName(name){
  const id=shopSlug(name);
  if(SHOP_INDEX[id]||SH().custom.some(c=>c.id===id))shopAdd(id);
  else shopAddCustom(name,"🛒","custom");
  return id;
}
function shopMatches(q){
  if(!q)return null;
  const s=q.trim().toLowerCase();
  const all=[...Object.values(SHOP_INDEX),...(SH().custom||[])];
  return all.filter(it=>it.n.toLowerCase().includes(s));
}

/* ---------- tiles ---------- */
function shopTile(it){
  const q=shopQty(it.id),c=catOf(it.cat);
  const col=it.cat==="custom"?"var(--second)":c.c;
  return `<button class="stile ${q?"on":""}" data-sadd="${it.id}" style="--tc:${col}"
      aria-label="${esc(it.n)}${q?` (${q} auf der Liste)`:""}">
    <span class="sic">${it.e}</span>
    <span class="sn">${esc(it.n)}</span>
    ${q?`<span class="sq">${q>1?"×"+q:"✓"}</span>
        <span class="sminus" data-ssub="${it.id}" role="button" tabindex="-1" aria-label="Weniger">−</span>`:""}
  </button>`;
}

/* ============================================================
   BIRTHDAYS + HOLIDAYS
   Both are derived all-day entries — nothing is written into
   the calendar twice, and nothing blocks a time slot.
   ============================================================ */
const BD_COLOR="#e8618a";        // birthdays
const HD_BERLIN="#d64545";       // days off in Berlin
const HD_OTHER="#c08f96";        // holidays elsewhere, clearly secondary
const REL=[
  {id:"ich",     n:"Ich",       e:"⭐️", c:"#d99022"},
  {id:"partner", n:"Partnerin", e:"💗", c:"#e8618a"},
  {id:"familie", n:"Familie",   e:"🏡", c:"#14a07a"},
  {id:"freunde", n:"Freunde",   e:"🫂", c:"#6c7bd9"},
  {id:"arbeit",  n:"Arbeit",    e:"💼", c:"#3d9bd8"},
  {id:"sonstige",n:"Sonstige",  e:"🎈", c:"#7c8b85"}
];
const rel=id=>REL.find(r=>r.id===id)||REL[5];

function defaultBirthdays(){
  const d=berlinNow();
  return[{id:uid(),name:"Beispielperson",day:d.getDate(),month:d.getMonth()+1,year:1995,rel:"sonstige",
    note:"Beispieleintrag zum Ausprobieren — kann gelöscht werden",gifts:[],created:Date.now()}];
}
const BD=()=>S.birthdays||[];

/* ---------- date helpers ---------- */
function bdNext(p,from){
  const base=from?parseKey(from):berlinNow();
  const y=base.getFullYear();
  let d=new Date(y,p.month-1,p.day);
  if(dkey(d)<dkey(base))d=new Date(y+1,p.month-1,p.day);
  return dkey(d);
}
const bdDaysAway=p=>daysBetween(todayKey(),bdNext(p));
function bdAge(p,key){
  if(!p.year)return null;
  const d=key?parseKey(key):parseKey(bdNext(p));
  return d.getFullYear()-p.year;
}
const birthdaysOn=key=>{
  const d=parseKey(key);
  return BD().filter(p=>p.day===d.getDate()&&p.month===d.getMonth()+1);
};
function bdUpcoming(n=6){
  return [...BD()].sort((a,b)=>bdDaysAway(a)-bdDaysAway(b)).slice(0,n);
}

/* ---------- holidays ---------- */
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
const _hdCache={};
function holidaysOfYear(y){
  if(_hdCache[y])return _hdCache[y];
  const E=easterSunday(y),off=n=>dkey(addDays(E,n));
  const fix=(d,m)=>dkey(new Date(y,m-1,d));
  // Buß- und Bettag: the Wednesday before 23 November
  let bb=new Date(y,10,22);
  while(bb.getDay()!==3)bb=addDays(bb,-1);
  const H=[
    {k:"neujahr",   n:"Neujahr",                    d:fix(1,1),   berlin:true},
    {k:"frauentag", n:"Internationaler Frauentag",  d:fix(8,3),   berlin:true, only:"Berlin"},
    {k:"karfreitag",n:"Karfreitag",                 d:off(-2),    berlin:true},
    {k:"ostermontag",n:"Ostermontag",               d:off(1),     berlin:true},
    {k:"maifeiertag",n:"Tag der Arbeit",            d:fix(1,5),   berlin:true},
    {k:"himmelfahrt",n:"Christi Himmelfahrt",       d:off(39),    berlin:true},
    {k:"pfingstmontag",n:"Pfingstmontag",           d:off(50),    berlin:true},
    {k:"einheit",   n:"Tag der Deutschen Einheit",  d:fix(3,10),  berlin:true},
    {k:"weihnacht1",n:"1. Weihnachtstag",           d:fix(25,12), berlin:true},
    {k:"weihnacht2",n:"2. Weihnachtstag",           d:fix(26,12), berlin:true},

    {k:"dreikoenig",n:"Heilige Drei Könige",        d:fix(6,1),   berlin:false, only:"BW, BY, ST"},
    {k:"ostersonntag",n:"Ostersonntag",             d:off(0),     berlin:false, only:"BB"},
    {k:"pfingstsonntag",n:"Pfingstsonntag",         d:off(49),    berlin:false, only:"BB"},
    {k:"fronleichnam",n:"Fronleichnam",             d:off(60),    berlin:false, only:"BW, BY, HE, NW, RP, SL"},
    {k:"himmelfahrtmaria",n:"Mariä Himmelfahrt",    d:fix(15,8),  berlin:false, only:"BY teilweise, SL"},
    {k:"weltkindertag",n:"Weltkindertag",           d:fix(20,9),  berlin:false, only:"TH"},
    {k:"reformation",n:"Reformationstag",           d:fix(31,10), berlin:false, only:"BB, HB, HH, MV, NI, SH, SN, ST, TH"},
    {k:"allerheiligen",n:"Allerheiligen",           d:fix(1,11),  berlin:false, only:"BW, BY, NW, RP, SL"},
    {k:"bussbettag",n:"Buß- und Bettag",            d:dkey(bb),   berlin:false, only:"SN"}
  ];
  return _hdCache[y]=H;
}
const holidaysOn=key=>{
  if(S.settings.showHolidays===false)return[];
  const y=parseKey(key).getFullYear();
  return holidaysOfYear(y).filter(h=>h.d===key
    &&(h.berlin||S.settings.showOtherHolidays!==false));
};
function holidaysUpcoming(n=4){
  const y=berlinNow().getFullYear();
  const all=[...holidaysOfYear(y),...holidaysOfYear(y+1)]
    .filter(h=>h.d>=todayKey()&&(h.berlin||S.settings.showOtherHolidays!==false));
  return all.sort((a,b)=>a.d.localeCompare(b.d)).slice(0,n);
}

/* ---------- all-day layer ---------- */
function allDayFor(key){
  const out=[];
  S.blocks.forEach(b=>{
    if(!b.allDay)return;
    const o=occursOn(b,key);
    if(o)out.push({...o,kind:"event",color:btype(o.type).color});
  });
  birthdaysOn(key).forEach(p=>{
    const age=bdAge(p,key);
    out.push({id:"__bd_"+p.id,kind:"birthday",personId:p.id,color:BD_COLOR,
      title:`🎂 ${p.name}${age!=null?` · ${age}`:""}`});
  });
  holidaysOn(key).forEach(h=>{
    out.push({id:"__hd_"+h.k,kind:"holiday",color:h.berlin?HD_BERLIN:HD_OTHER,
      berlin:h.berlin,only:h.only||"",title:h.n});
  });
  return out;
}

  const upcoming=[...list].sort((a,b)=>bdDaysAway(a)-bdDaysAway(b));
  const next3=upcoming.filter(p=>bdDaysAway(p)>0).slice(0,3);
  const byMonth={};
  list.forEach(p=>{(byMonth[p.month]=byMonth[p.month]||[]).push(p);});
  const counts={};REL.forEach(r=>counts[r.id]=BD().filter(p=>p.rel===r.id).length);
  const hd=holidaysUpcoming(3);

  return `<div class="page">
    ${heroHTML("birthdays","Geburtstage",`${BD().length} Menschen · nächster ${upcoming.length?relDay(bdNext(upcoming[0])):"—"}`)}

/* ============================================================
   CALENDAR — all-day layer
   All-day entries never occupy a time slot. They sit in a slim
   band under the weekday headers, the way Outlook does it.
   ============================================================ */
function occursOn(b,key){
  const ex=b.exceptions&&b.exceptions[key];
  if(ex&&ex.deleted)return null;
  let base=null;
  if(b.date){ if(b.date===key)base={...b}; }
  else if(b.recurrence){
    const r=b.recurrence,d=parseKey(key);
    if(r.from&&key<r.from)return null;
    if(r.until&&key>r.until)return null;
    if(r.freq==="daily")base={...b};
    else if(r.freq==="weekly"&&(r.days||[]).includes(dowIdx(d)))base={...b};
    else if(r.freq==="yearly"&&d.getDate()===r.day&&d.getMonth()+1===r.month)base={...b};
    else if(r.freq==="monthly"&&d.getDate()===r.day)base={...b};
  }
  if(!base)return null;
  if(ex)base={...base,...ex};
  return {...base,id:b.id,key,occKey:b.id+"@"+key,isException:!!ex,hasSeries:!b.date};
}
/** timed entries only — all-day lives in allDayFor() */
function blocksFor(key){
  const real=S.blocks.filter(b=>!b.allDay).map(b=>occursOn(b,key)).filter(Boolean);
  const C=S.cleaning;
  if(C&&C.enabled&&cleanSessionOn(key)){
    const mins=Math.max(60,Math.ceil(tasksForSession(key).reduce((s,t)=>s+(t.mins||0),0)/2/15)*15);
    const p=cleanProgress(key);
    real.push({id:"__clean",key,virtual:true,vkind:"clean",type:"cleaning",
      title:`Home Reset · ${p.done}/${p.total}`,start:C.schedule.time,
      end:hhmm(minutes(C.schedule.time)+mins),notes:"",exceptions:{}});
  }
  if(S.focus?.settings?.addToCalendar){
    focusOn(key).forEach(s=>{
      if(!s.start)return;
      real.push({id:"__focus_"+s.id,key,virtual:true,vkind:"focus",type:"focusrun",
        title:`🌳 ${fcat(s.category).n}${s.title?" · "+s.title:""}`,
        start:s.start,end:s.end||hhmm(minutes(s.start)+s.actualMin),notes:"",exceptions:{}});
    });
  }
  return real.sort((a,b)=>minutes(a.start)-minutes(b.start)||minutes(a.end)-minutes(b.end));
}

      const g=n=>o.querySelector(`[name=${n}]`);
      let sel=[...days];
      const repBox=o.querySelector("#repDays"),untilBox=o.querySelector("#repUntil"),timeRow=o.querySelector("#timeRow");
      const syncRep=()=>{
        const f=g("freq").value;
        repBox.classList.toggle("hide",f!=="weekly");
        untilBox.classList.toggle("hide",f==="none");
        if(f==="weekly"&&!sel.length){
          const i=dowIdx(parseKey(g("date").value||todayKey()));
          sel=[i];o.querySelector(`[data-rd="${i}"]`)?.classList.add("on");
        }
      };
      o.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{
        const i=+b.dataset.rd;
        sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i];
        b.classList.toggle("on");
      });
      g("freq").onchange=syncRep;
      g("allday").onchange=()=>{timeRow.style.display=g("allday").checked?"none":"";};
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-ok]").onclick=()=>{
        const title=g("title").value.trim();if(!title){g("title").focus();return;}
        const ad=g("allday").checked;
        if(!ad&&minutes(g("end").value)<=minutes(g("start").value)){toast("Das Ende muss nach dem Start liegen.");return;}
        const dateVal=g("date").value||todayKey();
        const dt=parseKey(dateVal);
        const f=g("freq").value;
        const data={title,type:g("type").value,allDay:ad,
          start:ad?"00:00":g("start").value,end:ad?"23:59":g("end").value,
          notes:g("notes").value.trim(),taskId:g("taskId").value||null};
        const mkRec=()=>f==="none"?null
          :f==="weekly"?{freq:"weekly",days:sel.sort(),from:dateVal,until:g("until").value||null}
          :{freq:"yearly",day:dt.getDate(),month:dt.getMonth()+1,from:null,until:g("until").value||null};

        if(!base){
          S.blocks.push({id:uid(),created:Date.now(),...data,
            date:f==="none"?dateVal:null,recurrence:mkRec(),exceptions:{}});
          save();close();render();return;
        }
        const applySeries=()=>{
          Object.assign(base,data);
          base.date=f==="none"?dateVal:null;
          base.recurrence=mkRec();
          if(f==="none")base.exceptions={};
          save();close();render();
        };
        const applyOne=()=>{
          base.exceptions=base.exceptions||{};
          base.exceptions[occ?occ.key:dateVal]={...data};
          save();close();render();
        };
        if(base.recurrence&&occ)seriesChoice("Änderung übernehmen für",applyOne,applySeries);
        else applySeries();
      };
      o.querySelector("[data-del]")?.addEventListener("click",()=>{
        const del=()=>{
          const i=S.blocks.indexOf(base),copy=JSON.parse(JSON.stringify(base));
          S.blocks.splice(i,1);save();close();render();
          toast("Eintrag gelöscht.",()=>{S.blocks.splice(i,0,copy);save();render();});
        };
        if(base.recurrence&&occ){
          seriesChoice("Löschen",()=>{
            base.exceptions=base.exceptions||{};
            base.exceptions[occ.key]={deleted:true};
            save();close();render();
            toast("Dieser Termin wurde entfernt.",()=>{delete base.exceptions[occ.key];save();render();});
          },del);
        }else del();
      });
      syncRep();
    }});
}

function ensureV10(st){
  ensureV5(st);
  if(!st.shop||typeof st.shop!=="object"||!st.shop.list)st.shop=defaultShop();
  st.shop.list=st.shop.list||{}; st.shop.custom=st.shop.custom||[];
  st.shop.history=st.shop.history||{}; st.shop.open=st.shop.open||{oft:true,vorrat:false,haushalt:false};
  if(!Array.isArray(st.birthdays)||!st.birthdays.length)st.birthdays=defaultBirthdays();
  st.birthdays.forEach(p=>{if(!Array.isArray(p.gifts))p.gifts=[];});
  if(st.settings.showHolidays===undefined)st.settings.showHolidays=true;
  if(st.settings.showOtherHolidays===undefined)st.settings.showOtherHolidays=true;
  st.blocks.forEach(b=>{if(b.allDay===undefined)b.allDay=false;});
  if(!st.settings.blockTypes.some(b=>b.id==="event"))
    st.settings.blockTypes.push({id:"event",name:"Ganztägig",color:"#8b6bd0"});
  return st;
}

/* supplies and the basket are one list */
function addToShoppingList(names){
  names.forEach(n=>shopAddByName(n));
  const due=nextShoppingDate(),blk=ensureShoppingBlock();
  let t=shoppingTaskFor(due);
  const have=t?itemsOnList():[];
  const merged=[...new Set([...have,...names])];
  const added=merged.length-have.length;
  const body=merged.map(n=>"· "+n).join("\n");
  if(t){t.desc=body;t.title=`Einkaufen (${merged.length})`;t.blockId=t.blockId||blk.id;}
  else{
    t={id:uid(),created:Date.now(),title:`Einkaufen (${merged.length})`,desc:body,
      status:"todo",cat:"cleaning",prio:"medium",due,mins:45,tags:["haushalt"],blockId:blk.id,completedAt:null};
    S.tasks.unshift(t);
  }
  save();render();
  const when=due===todayKey()?"heute":`Montag, ${fmtDate(due)}`;
  toast(added?`${added} auf die Einkaufsliste für ${when}.`:`Steht schon auf der Liste für ${when}.`,
    added?()=>{
      names.forEach(n=>{const id=shopSlug(n);if(SH().list[id])shopRemove(id);});
      const cur=shoppingTaskFor(due);
      if(cur){
        const rest=itemsOnList().filter(x=>!names.includes(x));
        if(!rest.length)S.tasks=S.tasks.filter(x=>x.id!==cur.id);
        else{cur.desc=rest.map(n=>"· "+n).join("\n");cur.title=`Einkaufen (${rest.length})`;}
      }
      save();render();
    }:null);
}
function basketToTask(){
  const names=shopOpen().map(e=>e.item.n);
  if(!names.length){toast("Der Korb ist leer.");return;}
  addToShoppingList(names);
}

document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);

  /* shopping */
  const sm=hit("[data-ssub]"); if(sm){e.stopPropagation();shopSub(sm.dataset.ssub);render();return;}
  const sa=hit("[data-sadd]"); if(sa){shopAdd(sa.dataset.sadd);render();return;}
  const sa2=hit("[data-sadd2]"); if(sa2){e.stopPropagation();shopAdd(sa2.dataset.sadd2);render();return;}
  const sd=hit("[data-sdel]"); if(sd){e.stopPropagation();
    const id=sd.dataset.sdel,copy={...SH().list[id]};
    shopRemove(id);render();
    toast(`${shopItem(id).n} entfernt.`,()=>{SH().list[id]=copy;save();render();});return;}
  const sdn=hit("[data-sdone]"); if(sdn){shopToggleDone(sdn.dataset.sdone);render();return;}
  const st=hit("[data-stier]"); if(st){const k=st.dataset.stier;

  if(hit("[data-snewdlg]")){shopCustomDlg();return;}

  if(hit("[data-sfinish]")){

  const bt=hit("[data-bdtoggle]");

  const gt=hit("[data-gifttog]");
  if(gt){e.stopPropagation();const[pid,gid]=gt.dataset.gifttog.split("|");
    const g=BD().find(x=>x.id===pid)?.gifts.find(x=>x.id===gid);
    if(g){g.done=!g.done;bdOpen[pid]=true;save();render();}return;}
  const gd=hit("[data-giftdel]");

    const p=BD().find(x=>x.id===pid),i=p.gifts.findIndex(x=>x.id===gid),copy=p.gifts[i];

  const ga=hit("[data-giftadd]");

  const bta=hit("[data-bdtask]");
  if(bta){e.stopPropagation();

  /* all-day chips in the calendar */
  const ab=hit("[data-adbd]"); if(ab){bdOpen[ab.dataset.adbd]=true;go("birthdays");return;}
  if(hit("[data-adhd]")){holidaySettingsDlg();return;}
  const ae=hit("[data-adev]"); if(ae){blockDlg(ae.dataset.adev,ae.dataset.adkey);return;}
  const ad=hit("[data-adday]");
  if(ad&&!hit(".adchip")){blockDlg(null,ad.dataset.adday,{start:"00:00",end:"23:59"});return;}

/* ---------- timeline focus handling ---------- */
function bindJournal(){
  J_FIELDS.forEach(([id,key])=>{
    const el=$("#"+id);if(!el)return;
    el.addEventListener("input",debounce(()=>{journalFor(jDate)[key]=el.value;save();},420));
  });
  const tl=$("#jtl");
  if(!tl)return;
  const cards=$$(".jcard",tl);
  if(!cards.length)return;
  let raf=null;
  const mark=()=>{
    raf=null;
    const mid=tl.scrollLeft+tl.clientWidth/2;
    let best=0,bestD=Infinity;
    cards.forEach((c,i)=>{
      const cm=c.offsetLeft+c.offsetWidth/2;
      const d=Math.abs(cm-mid);
      if(d<bestD){bestD=d;best=i;}
    });
    jTlIndex=best;
    cards.forEach((c,i)=>c.classList.toggle("on",i===best));
  };
  tl.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(mark);},{passive:true});
  const want=jTlIndex;
  mark();
  // a fresh render starts scrolled to the left, so put the focus back where it was
  if(want>0&&want<cards.length)scrollCardIntoView(want,"auto");
}
function scrollCardIntoView(i,behavior){
  const tl=$("#jtl");if(!tl)return;
  const cards=$$(".jcard",tl);
  const c=cards[i];if(!c)return;
  jTlIndex=i;
  cards.forEach((x,k)=>x.classList.toggle("on",k===i));
  const left=c.offsetLeft+c.offsetWidth/2-tl.clientWidth/2;
  if(typeof tl.scrollTo==="function")tl.scrollTo({left,behavior:behavior||"smooth"});
  else tl.scrollLeft=left;
}

/* ---------- deleting an entry ---------- */
function journalDelete(date){
  const i=S.journal.findIndex(x=>x.date===date);
  if(i<0)return;
  const copy=JSON.parse(JSON.stringify(S.journal[i]));
  // remember the slot so the neighbouring entry slides into the same place
  const slot=jEntries().findIndex(x=>x.date===date);
  S.journal.splice(i,1);
  if(jDate===date&&jTab==="write")jDate=todayKey();
  const left=jEntries().length;
  jTlIndex=left?clamp(slot,0,left-1):0;
  save();render();
  toast(`Eintrag vom ${fmtDate(date)} gelöscht.`,()=>{
    S.journal.push(copy);
    S.journal.sort((a,b)=>b.date.localeCompare(a.date));
    jTlIndex=jEntries().findIndex(x=>x.date===date);
    save();render();});
}
/* ---------- swipe a card upwards to throw it away ---------- */
let jGesture=null, jGestureEnd=0;
function jTrashState(on,armed){
  const el=$("#jtrash");if(!el)return;
  el.classList.toggle("on",!!on);
  el.classList.toggle("armed",!!armed);
}
function bindTimelineGestures(){
  const tl=$("#jtl");if(!tl)return;
  $$(".jcard",tl).forEach(c=>{
    c.addEventListener("pointerdown",e=>{
      if(e.target.closest("[data-jdel]"))return;
      if(!c.classList.contains("on"))return;
      jGesture={c,x:e.clientX,y:e.clientY,dy:0,active:false,id:e.pointerId};
    });
    c.addEventListener("pointermove",e=>{
      if(!jGesture||jGesture.c!==c)return;
      const dx=e.clientX-jGesture.x, dy=e.clientY-jGesture.y;
      if(!jGesture.active){
        if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){jGesture=null;return;}
        if(dy<-14&&Math.abs(dy)>Math.abs(dx)*1.3){
          jGesture.active=true;
          c.setPointerCapture?.(e.pointerId);
          c.classList.add("lifting");
        }else return;
      }
      jGesture.dy=Math.min(0,dy);
      const armed=-jGesture.dy>110;
      c.style.transform=`translateY(${jGesture.dy}px) scale(${(1-Math.min(.07,-jGesture.dy/1600)).toFixed(3)})`;
      c.style.opacity=String(Math.max(.4,1+jGesture.dy/420));
      jTrashState(true,armed);
    });
    const finish=()=>{
      if(!jGesture||jGesture.c!==c)return;
      const armed=-jGesture.dy>110;
      const date=c.dataset.jcard;
      c.classList.remove("lifting");
      c.style.transform="";c.style.opacity="";
      jTrashState(false,false);
      const was=jGesture.active;
      jGesture=null;
      if(was)jGestureEnd=Date.now();
      if(armed)journalDelete(date);
    };
    c.addEventListener("pointerup",finish);
    c.addEventListener("pointercancel",finish);
  });
}

/* ---------- course ordering ---------- */
function ensureCourseOrder(){
  const cs=S.growth.courses;
  if(!cs.length||cs.every(c=>typeof c.order==="number"))return false;
  // keep the order the list already had, so nothing jumps around on first open
  cs.forEach((c,i)=>{if(typeof c.order!=="number")c.order=i;});
  save();return true;
}
const coursesOrdered=()=>[...S.growth.courses].sort((a,b)=>(a.order??1e9)-(b.order??1e9));
function moveCourse(id,dir){
  const list=coursesOrdered();
  const i=list.findIndex(c=>c.id===id);
  const j=i+dir;
  if(i<0||j<0||j>=list.length)return;
  list.splice(j,0,list.splice(i,1)[0]);
  list.forEach((c,k)=>{c.order=k;});
  save();render();
}
function placeCourse(id,index){
  const list=coursesOrdered();
  const i=list.findIndex(c=>c.id===id);
  if(i<0)return;
  const [c]=list.splice(i,1);
  list.splice(clamp(index,0,list.length),0,c);
  list.forEach((x,k)=>{x.order=k;});
  save();render();
}
function bindCourses(){
  const wrap=$("#courseList");if(!wrap)return;
  let dragId=null,line=null;
  const clearLine=()=>{if(line&&line.parentNode)line.remove();line=null;};
  $$(".courserow",wrap).forEach(row=>{
    row.addEventListener("dragstart",e=>{
      dragId=row.dataset.course;row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",dragId);}catch(err){}
    });
    row.addEventListener("dragend",()=>{row.classList.remove("dragging");dragId=null;clearLine();});
  });
  const posFor=y=>{
    const rows=[...wrap.querySelectorAll(".courserow:not(.dragging)")];
    let i=rows.length;
    for(let k=0;k<rows.length;k++){
      const r=rows[k].getBoundingClientRect();
      if(y<r.top+r.height/2){i=k;break;}
    }
    return{i,rows};
  };
  wrap.addEventListener("dragover",e=>{
    e.preventDefault();
    if(!line){line=document.createElement("div");line.className="dropline";}
    const{i,rows}=posFor(e.clientY);
    if(i>=rows.length)wrap.appendChild(line);else wrap.insertBefore(line,rows[i]);
  });
  wrap.addEventListener("dragleave",e=>{if(!wrap.contains(e.relatedTarget))clearLine();});
  wrap.addEventListener("drop",e=>{
    e.preventDefault();
    const id=dragId||(()=>{try{return e.dataTransfer.getData("text/plain");}catch(err){return null;}})();
    const{i}=posFor(e.clientY);
    clearLine();
    if(id)placeCourse(id,i);
  });
}

/* ============================================================
   BUDGET — engine
   Every figure below is derived. Nothing is stored twice and
   no amount is subtracted in two places.
   ============================================================ */
const BU=()=>S.budget;
const eur=(v,d=2)=>Number(v||0).toLocaleString("de-DE",{style:"currency",currency:"EUR",
  minimumFractionDigits:d,maximumFractionDigits:d});
const eur0=v=>eur(v,0);

/** what the entry really costs you, after a shared split */
const effective=e=>(+e.amount||0)*((e.share==null?100:e.share)/100);
const monthlyOf=e=>effective(e)/bMonths(e);
const yearlyOf=e=>effective(e)*12/bMonths(e);
const counts=e=>bStatus(e.status).counts;

const bExpenses=()=>[...(BU().expenses||[])].sort((a,b)=>(a.order??1e9)-(b.order??1e9));
const bMonthlyItems=()=>bExpenses().filter(e=>!isReserve(e));
const bReserveItems=()=>bExpenses().filter(e=>isReserve(e));

function budgetCalc(){
  const B=BU();
  const income=(B.income||[]).filter(i=>i.active!==false)
    .reduce((s,i)=>s+(+i.net||0)*(i.freq==="yearly"?1/12:i.freq==="weekly"?4.345:1),0);

  const monthly=bMonthlyItems().filter(counts);
  const fixed=monthly.filter(e=>e.kind!=="variable").reduce((s,e)=>s+monthlyOf(e),0);
  const variable=monthly.filter(e=>e.kind==="variable").reduce((s,e)=>s+monthlyOf(e),0);

  const reserveItems=bReserveItems().filter(counts);
  const annualTotal=reserveItems.reduce((s,e)=>s+yearlyOf(e),0);
  const reserve=annualTotal/12;

  const debtPayment=(B.debts||[]).filter(d=>(+d.remaining||0)>0)
    .reduce((s,d)=>s+Math.max(+d.payment||0,+d.minPayment||0),0);
  const savings=(B.goals||[]).reduce((s,g)=>s+(+g.monthly||0),0);

  const committed=fixed+variable+reserve;
  const available=income-committed;
  const free=available-debtPayment-savings;

  const allocated=(B.buckets||[]).reduce((s,b)=>s+(+b.amount||0),0);
  return{income,fixed,variable,reserve,annualTotal,debtPayment,savings,committed,available,free,
    allocated,unallocated:free-allocated,reserveItems,monthlyCount:monthly.length};
}
/** what the plan would look like with one entry flipped to another status */
function budgetWith(changes){
  const B=BU();
  const snap=(B.expenses||[]).map(e=>e.status);
  const goals=(B.goals||[]).map(g=>g.monthly);
  const debts=(B.debts||[]).map(d=>d.payment);
  Object.entries(changes.status||{}).forEach(([id,st])=>{
    const e=B.expenses.find(x=>x.id===id); if(e)e.status=st;});
  if(changes.savingsDelta)B.goals.forEach((g,i)=>{if(i===0)g.monthly=(+g.monthly||0)+changes.savingsDelta;});
  if(changes.debtDelta&&B.debts.length)B.debts[0].payment=(+B.debts[0].payment||0)+changes.debtDelta;
  const out=budgetCalc();
  B.expenses.forEach((e,i)=>{e.status=snap[i];});
  B.goals.forEach((g,i)=>{g.monthly=goals[i];});
  B.debts.forEach((d,i)=>{d.payment=debts[i];});
  return out;
}
const SAVE_MODES=[
  {id:"conservative",n:"Vorsichtig",pct:.15,d:"Kleine Rate, viel Spielraum"},
  {id:"balanced",    n:"Ausgewogen",pct:.28,d:"Mittelweg aus Sparen und Leben"},
  {id:"aggressive",  n:"Ambitioniert",pct:.45,d:"Viel zurücklegen, wenig Puffer"}
];
const PRIOS_B=[
  {id:"debt",   n:"Schulden zuerst", debt:.7,  save:.3},
  {id:"balance",n:"Ausgewogen",      debt:.5,  save:.5},
  {id:"save",   n:"Sparen zuerst",   debt:.3,  save:.7}
];
function budgetRecommendation(){
  const c=budgetCalc();
  const mode=SAVE_MODES.find(m=>m.id===BU().settings.savingsMode)||SAVE_MODES[1];
  const pr=PRIOS_B.find(p=>p.id===BU().settings.priority)||PRIOS_B[0];
  const pool=Math.max(0,c.available);
  const total=pool*mode.pct;
  const minDebt=(BU().debts||[]).reduce((s,d)=>s+(+d.minPayment||0),0);
  const hasDebt=(BU().debts||[]).some(d=>(+d.remaining||0)>0);
  let debt=hasDebt?Math.max(minDebt,total*pr.debt):0;
  let save=hasDebt?total*pr.save:total;
  if(debt+save>pool){const k=pool/(debt+save||1);debt*=k;save*=k;}
  return{mode,pr,pool,savings:save,debt,free:pool-save-debt,total:save+debt};
}
function budgetHealth(){
  const c=budgetCalc();
  if(c.income<=0)return{k:"none",n:"Kein Einkommen hinterlegt",
    d:"Trage dein monatliches Netto ein, dann rechnet der Rest von selbst."};
  const ratio=c.free/c.income;
  if(c.free<0)return{k:"over",n:"Über dem Rahmen",
    d:`Deine Planung liegt ${eur(Math.abs(c.free))} über dem, was reinkommt. Sieh dir die optionalen Posten an oder passe Sparrate und Tilgung an.`};
  if(ratio<0.08)return{k:"tight",n:"Eng",
    d:`Nach allem bleiben ${eur(c.free)}. Das reicht, lässt aber wenig Luft für Unerwartetes.`};
  return{k:"ok",n:"Stabil",
    d:`Nach Fixkosten, Rücklage, Tilgung und Sparen bleiben ${eur(c.free)} für dich.`};
}
/** transparent score: five parts, each worth 20 */
function moneyScore(){
  const c=budgetCalc(),parts=[];
  parts.push({n:"Einnahmen decken den Plan",v:c.free>=0?20:Math.max(0,20+c.free/Math.max(1,c.income)*40),
    d:c.free>=0?"Der Plan geht auf.":"Die Planung liegt über dem Einkommen."});
  const rate=c.income?c.savings/c.income:0;
  parts.push({n:"Sparquote",v:clamp(rate/0.15,0,1)*20,d:`${(rate*100).toFixed(1)} % vom Netto`});
  parts.push({n:"Rücklage gedeckt",v:c.annualTotal>0?20:10,
    d:c.annualTotal>0?`${eur(c.reserve)} pro Monat für ${eur(c.annualTotal)} im Jahr`:"Keine Jahreszahlungen hinterlegt"});
  const debts=BU().debts||[];
  const orig=debts.reduce((s,d)=>s+(+d.original||0),0);
  const rest=debts.reduce((s,d)=>s+(+d.remaining||0),0);
  parts.push({n:"Schuldenabbau",v:!debts.length?20:clamp(orig?(orig-rest)/orig:0,0,1)*20,
    d:!debts.length?"Keine Schulden erfasst":`${eur(orig-rest)} von ${eur(orig)} getilgt`});
  const em=(BU().goals||[]).find(g=>g.type==="emergency");
  const cov=em&&em.target?clamp((+em.current||0)/em.target,0,1):0;
  parts.push({n:"Notgroschen",v:cov*20,d:em?`${Math.round(cov*100)} % von ${eur(em.target)}`:"Kein Notgroschen angelegt"});
  const total=Math.round(parts.reduce((s,p)=>s+p.v,0));
  return{total:clamp(total,0,100),parts};
}
/* ---------- upcoming payments ---------- */

function upcomingPayments(n=6){
  const out=[];
  bExpenses().filter(counts).forEach(e=>{
    let d=e.next;
    if(!d){
      if(bMonths(e)<=1){
        const t=berlinNow();
        d=dkey(new Date(t.getFullYear(),t.getMonth()+1,1));
      }else return;
    }
    // roll a past date forward by the payment period
    while(d&&d<todayKey()){
      const p=parseKey(d);
      p.setMonth(p.getMonth()+Math.max(1,Math.round(bMonths(e))));
      d=dkey(p);
    }
    out.push({e,date:d,amount:effective(e)});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n);
}
function yearMap(){
  const months=Array.from({length:12},()=>0);
  bReserveItems().filter(counts).forEach(e=>{
    const per=Math.max(1,Math.round(bMonths(e)));
    let start=e.next?parseKey(e.next).getMonth():0;
    for(let m=start;m<12+start;m+=per){months[m%12]+=effective(e);}
  });
  return months;
}
/* ---------- cancellation candidates ---------- */
function cancelCandidates(){
  const dis=BU().settings.dismissed||[];
  return bExpenses().filter(e=>counts(e)&&!dis.includes(e.id)
    &&(e.kind==="subscription"||e.kind==="optional")
    &&effective(e)>0
    &&["fun","gaming","software","leisure"].includes(e.cat))
    .sort((a,b)=>monthlyOf(b)-monthlyOf(a));
}
/* ---------- debt plan ---------- */
function debtOrdered(){
  const st=BU().settings.debtStrategy;
  const d=(BU().debts||[]).filter(x=>(+x.remaining||0)>0);
  if(st==="avalanche")return [...d].sort((a,b)=>(+b.rate||0)-(+a.rate||0));
  return [...d].sort((a,b)=>(+a.remaining||0)-(+b.remaining||0));
}
function debtPlan(extra){
  const list=debtOrdered().map(d=>({...d}));
  if(!list.length)return{months:0,date:null,interest:0,rows:[]};
  const budget=list.reduce((s,d)=>s+Math.max(+d.payment||0,+d.minPayment||0),0)+(extra||0);
  if(budget<=0)return{months:Infinity,date:null,interest:0,rows:list};
  let months=0,interest=0;
  const work=list.map(d=>({...d,bal:+d.remaining||0}));
  while(work.some(d=>d.bal>0.01)&&months<600){
    months++;
    let pool=budget;
    work.forEach(d=>{
      if(d.bal<=0)return;
      const i=d.bal*((+d.rate||0)/100)/12;
      d.bal+=i;interest+=i;
    });
    work.forEach(d=>{
      if(d.bal<=0||pool<=0)return;
      const min=Math.min(d.bal,Math.max(+d.minPayment||0,0),pool);
      d.bal-=min;pool-=min;
    });
    for(const d of work){
      if(pool<=0)break;
      if(d.bal<=0)continue;
      const pay=Math.min(d.bal,pool);
      d.bal-=pay;pool-=pay;
    }
  }
  const end=addDays(berlinNow(),0);
  end.setMonth(end.getMonth()+months);
  return{months,date:dkey(end),interest,rows:work,budget};
}
/* ---------- monthly snapshot ---------- */
function snapshotBudget(){
  const k=todayKey().slice(0,7),c=budgetCalc();
  BU().history[k]={income:c.income,fixed:c.fixed,variable:c.variable,reserve:c.reserve,
    savings:c.savings,debt:c.debtPayment,free:c.free,at:new Date().toISOString()};
  save();
}

let bTab="dash", bFilter={q:"",cat:"",status:"",kind:"",freq:""}, bSort="custom", bDir=1;

function bFilterCount(){return Object.values(bFilter).filter(v=>v).length;}
function bApplyFilter(list){
  const f=bFilter,q=f.q.trim().toLowerCase();
  let out=list.filter(e=>
    (!q||e.name.toLowerCase().includes(q)||(e.notes||"").toLowerCase().includes(q))&&
    (!f.cat||e.cat===f.cat)&&(!f.status||e.status===f.status)&&
    (!f.kind||e.kind===f.kind)&&
    (!f.freq||(f.freq==="reserve"?isReserve(e):!isReserve(e))));
  if(bSort!=="custom"){
    const g={name:e=>e.name.toLowerCase(),amount:e=>effective(e),cat:e=>bCat(e.cat).n,
      monthly:e=>monthlyOf(e),yearly:e=>yearlyOf(e),status:e=>B_STATUS.findIndex(s=>s.id===e.status),
      next:e=>e.next||"9999"}[bSort];
    out=[...out].sort((a,b)=>{const x=g(a),y=g(b);
      return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"de"))*bDir;});
  }
  return out;
}

function bindBudget(){
  const q=$("#bq");
  if(q)q.addEventListener("input",debounce(()=>{
    const p=q.selectionStart;bFilter.q=q.value;render();
    const n=$("#bq");if(n){n.focus();n.setSelectionRange(p,p);}
  },240));
  $$("[data-bbamt]").forEach(el=>el.addEventListener("change",()=>{
    const b=BU().buckets.find(x=>x.id===el.dataset.bbamt);
    if(b){b.amount=+el.value||0;save();render();}
  }));
  const sel=$("#wiSel");
  if(sel)sel.addEventListener("change",()=>{
    const e=BU().expenses.find(x=>x.id===sel.value);
    if(!e){wiState=null;}
    else{
      const to=counts(e)?"cancelled":"active";
      wiState={label:`${e.emoji} ${e.name} ${to==="active"?"aktiv":"aus"}`,changes:{status:{[e.id]:to}}};
    }
    const out=$("#wiOut");if(out)out.innerHTML=whatIfHTML(wiState);
  });
  /* drag to reorder the expense list */
  const wrap=$("#bList");
  if(!wrap)return;
  let dragId=null,line=null;
  const clearLine=()=>{if(line&&line.parentNode)line.remove();line=null;};
  $$(".brow[draggable]",wrap).forEach(row=>{
    row.addEventListener("dragstart",e=>{dragId=row.dataset.bexp;row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId);}catch(x){}});
    row.addEventListener("dragend",()=>{row.classList.remove("dragging");dragId=null;clearLine();});
  });
  const posFor=y=>{
    const rows=[...wrap.querySelectorAll(".brow:not(.dragging)")];
    let i=rows.length;
    for(let k=0;k<rows.length;k++){const r=rows[k].getBoundingClientRect();
      if(y<r.top+r.height/2){i=k;break;}}
    return{i,rows};
  };
  wrap.addEventListener("dragover",e=>{
    e.preventDefault();
    if(!line){line=document.createElement("div");line.className="dropline";}
    const{i,rows}=posFor(e.clientY);
    if(i>=rows.length)wrap.appendChild(line);else wrap.insertBefore(line,rows[i]);
  });
  wrap.addEventListener("dragleave",e=>{if(!wrap.contains(e.relatedTarget))clearLine();});
  wrap.addEventListener("drop",e=>{
    e.preventDefault();
    const id=dragId||(()=>{try{return e.dataTransfer.getData("text/plain");}catch(x){return null;}})();
    const{i}=posFor(e.clientY);clearLine();
    if(!id)return;
    const visible=(bTab==="yearly"?bReserveItems():bMonthlyItems()).map(x=>x.id);
    const all=bExpenses();
    const moving=all.find(x=>x.id===id);if(!moving)return;
    const target=visible[clamp(i,0,visible.length-1)];
    const rest=all.filter(x=>x.id!==id);
    const at=target?rest.findIndex(x=>x.id===target):rest.length;
    rest.splice(at<0?rest.length:at,0,moving);
    rest.forEach((x,k)=>{x.order=k;});
    save();render();
  });
}

  const bpr=hit("[data-bprio]"); if(bpr){BU().settings.priority=bpr.dataset.bprio;save();render();return;}
  if(hit("[data-bapply]")){

    const gs=B.goals,ds=B.debts.filter(d=>+d.remaining>0);
    const before=JSON.stringify({g:gs.map(g=>g.monthly),d:B.debts.map(d=>d.payment)});
    if(gs.length){
      const cur=gs.reduce((s,g)=>s+(+g.monthly||0),0);
      gs.forEach(g=>{g.monthly=Math.round(cur>0?(+g.monthly||0)/cur*rec.savings:rec.savings/gs.length);});
    }
    if(ds.length){
      const cur=ds.reduce((s,d)=>s+Math.max(+d.payment||0,+d.minPayment||0),0);
      ds.forEach(d=>{d.payment=Math.round(cur>0?Math.max(+d.payment||0,+d.minPayment||0)/cur*rec.debt:rec.debt/ds.length);});
    }
    save();render();
    toast("Empfehlung übernommen.",()=>{
      const p=JSON.parse(before);
      B.goals.forEach((g,i)=>{g.monthly=p.g[i];});
      B.debts.forEach((d,i)=>{d.payment=p.d[i];});
      save();render();});
    return;}

  const wi=hit("[data-wi]");
  if(wi){
    const k=wi.dataset.wi;
    wiState=k==="save100"?{label:"100 € mehr sparen",changes:{savingsDelta:100}}
      :k==="debt100"?{label:"100 € mehr tilgen",changes:{debtDelta:100}}:null;

    const sel=$("#wiSel");if(sel&&!wiState)sel.value="";

  const ga=hit("[data-bgoaladd]"); if(ga){e.stopPropagation();bGoalAddDlg(ga.dataset.bgoaladd);return;}
  if(hit("[data-bbucketnew]")){bBucketDlg();return;}

  if(bbd){e.stopPropagation();
    const B=BU(),i=B.buckets.findIndex(x=>x.id===bbd.dataset.bbdel),copy=B.buckets[i];
    B.buckets.splice(i,1);save();render();
    toast("Topf entfernt.",()=>{B.buckets.splice(i,0,copy);save();render();});return;}

  if(hit("[data-bdebtnew]")){bDebtDlg();return;}
  const de=hit("[data-bdebtedit]"); if(de){e.stopPropagation();bDebtDlg(de.dataset.bdebtedit);return;}
  const dp=hit("[data-bdebtpay]"); if(dp){e.stopPropagation();bDebtPayDlg(dp.dataset.bdebtpay);return;}
  const ds=hit("[data-bdstrat]"); if(ds){BU().settings.debtStrategy=ds.dataset.bdstrat;save();render();return;}

  if(hit("[data-bacctnew]")){bAcctDlg();return;}
  const ae=hit("[data-bacctedit]"); if(ae){e.stopPropagation();bAcctDlg(ae.dataset.bacctedit);return;}
  if(hit("[data-bsnap]")){snapshotBudget();render();toast("Monat festgehalten.");return;}

  const bcl=hit("[data-bclear]"); if(bcl){bFilter[bcl.dataset.bclear]="";save();render();return;}

/* ---------- scroll lock that keeps the position ---------- */
let lockY=0,locks=0;
function lockScroll(on){
  if(on){
    if(locks++===0){lockY=window.scrollY||0;document.body.classList.add("locked");
      document.body.style.top=`-${lockY}px`;}
  }else{
    if(locks>0&&--locks===0){document.body.classList.remove("locked");
      document.body.style.top="";window.scrollTo(0,lockY);}

}

(function(){

  document.addEventListener("pointerdown",start,{passive:true});
  document.addEventListener("pointermove",move,{passive:true});

  document.addEventListener("pointercancel",end,{passive:true});

/* ============================================================
   DATA SAFETY
   One canonical state: the global S.
   Read by every view, written only through save(), initialised
   by ensureV14(). Defaults are merged into missing fields, they
   never replace data that is already there.
   ============================================================ */
const REQUIRED_ARRAYS=["tasks","blocks","notes","recipes","journal","habits","birthdays"];

function validateState(st){
  const bad=[];
  if(!st||typeof st!=="object")return["Zustand ist kein Objekt"];
  REQUIRED_ARRAYS.forEach(k=>{if(!Array.isArray(st[k]))bad.push(`${k} fehlt oder ist kein Array`);});
  if(!st.settings||typeof st.settings!=="object")bad.push("settings fehlt");
  if(!st.growth||!Array.isArray(st.growth.learnings))bad.push("growth unvollständig");
  if(!st.budget||!Array.isArray(st.budget.expenses))bad.push("budget unvollständig");
  if(!st.shop||typeof st.shop.list!=="object")bad.push("shop unvollständig");
  (st.tasks||[]).forEach((t,i)=>{if(!t||!t.id)bad.push(`Aufgabe ${i} ohne id`);});
  (st.blocks||[]).forEach((b,i)=>{
    if(!b||!b.id){bad.push(`Kalendereintrag ${i} ohne id`);return;}
    if(!b.date&&!b.recurrence)bad.push(`Kalendereintrag ${b.id} ohne Datum und ohne Serie`);
  });
  (st.birthdays||[]).forEach((p,i)=>{
    if(!p||!p.id)bad.push(`Geburtstag ${i} ohne id`);
    else if(!(p.day>=1&&p.day<=31&&p.month>=1&&p.month<=12))bad.push(`Geburtstag ${p.name||i} hat ein ungültiges Datum`);
  });
  return bad;
}
/** fills gaps, never throws away what is there */

/* ---------- the last state we know was fine ---------- */
let lastGood=null,lastGoodAt=0;
async function keepBackup(){
  const now=Date.now();
  if(now-lastGoodAt<60000)return;
  lastGoodAt=now;
  try{
    lastGood=JSON.parse(JSON.stringify(S));
    await idbSet("state_backup",{at:now,schemaVersion:SCHEMA_VERSION,state:lastGood});
  }catch(e){}
}
async function restoreBackup(){
  try{
    const b=await idbGet("state_backup");
    if(!b||!b.state){toast("Keine Sicherung gefunden.");return;}
    const probs=validateState(b.state);
    if(probs.length){toast("Die Sicherung ist unvollständig — nicht eingespielt.");return;}
    const before=JSON.parse(JSON.stringify(S));
    S=repairState(b.state);
    save();render();
    toast(`Sicherung vom ${new Date(b.at).toLocaleString("de-DE")} eingespielt.`,
      ()=>{S=before;save();render();});
  }catch(e){toast("Sicherung konnte nicht gelesen werden.");}
}
/* ---------- the one write path ---------- */
function save(){
  let probs=[];
  try{probs=validateState(S);}catch(e){probs=["Zustand nicht lesbar"];}
  if(probs.length){
    try{repairState(S);}catch(e){
      setSave("error");
      toast("Speichern fehlgeschlagen — die letzte gültige Fassung bleibt erhalten.");
      return;
    }
    let after=[];
    try{after=validateState(S);}catch(e){after=["Zustand nicht lesbar"];}
    if(after.length){
      setSave("error");
      console.warn("Zustand nicht reparierbar:",after);
      toast("Speichern fehlgeschlagen — die letzte gültige Fassung bleibt erhalten.");
      return;
    }
  }
  S.schemaVersion=SCHEMA_VERSION;
  S.meta=S.meta||{};
  S.meta.updated=Date.now();
  if(fileHandle)setSave("dirty");
  flush();
  keepBackup();
  syncPushSoon();
}
/* ---------- export / import ---------- */
function exportPayload(){
  const out=JSON.parse(JSON.stringify(S));
  delete out._sync;
  if(out.settings)delete out.settings.githubToken;
  out.schemaVersion=SCHEMA_VERSION;
  out.exportedAt=new Date().toISOString();
  out.exportedBy=navigator.userAgent.slice(0,90);
  return out;
}
function exportJSON(){
  const data=exportPayload();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`life-os-${todayKey()}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`Sicherung mit ${data.tasks.length} Aufgaben und ${data.blocks.length} Terminen gespeichert.`);
}

function importDlg(file){
  if(file&&typeof file.text==="function"||file instanceof Blob){

   REMINDERS
   What is actually possible here, and nothing more:
   the app can raise a system notification while it is open.
   Real push while the app is closed needs a service worker

function defaultNotify(){

    cleaning:true,focus:true,budget:true},fired:{},day:""};
}
const NF=()=>{
  if(!S.settings.notify)S.settings.notify={...defaultNotify()};
  else S.settings.notify={...defaultNotify(),...S.settings.notify,
    cats:{...defaultNotify().cats,...(S.settings.notify.cats||{})}};

const isStandalone=()=>window.matchMedia?.("(display-mode: standalone)")?.matches
  ||window.navigator.standalone===true;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)
  ||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

/** honest capability check — no guessing, no pretending */
function notifyCapability(){
  if(typeof Notification==="undefined"){
    return isIOS()&&!isStandalone()
      ? {k:"install",n:"Zum Home-Bildschirm hinzufügen",
         d:"Safari auf dem iPhone erlaubt Benachrichtigungen erst, wenn die App über „Teilen → Zum Home-Bildschirm“ installiert ist. Danach hier erneut nachsehen."}
      : {k:"none",n:"Nicht verfügbar",
         d:"Dieser Browser kennt keine Benachrichtigungen. Die Erinnerungen erscheinen stattdessen in der App."};
  }
  if(Notification.permission==="denied")
    return{k:"denied",n:"Vom System blockiert",
      d:"Du hast Benachrichtigungen für diese Seite abgelehnt. Das lässt sich nur in den Browser- oder Systemeinstellungen wieder ändern."};
  if(Notification.permission!=="granted")
    return{k:"ask",n:"Erlaubnis nötig",d:"Einmal bestätigen, danach erscheinen Erinnerungen als Systemmeldung."};

async function notifyAsk(){
  if(typeof Notification==="undefined")return;
  try{
    const r=await Notification.requestPermission();
    if(r==="granted"){NF().on=true;save();notifyFire("Erinnerungen sind aktiv.","Du bekommst ab jetzt Hinweise, solange Life OS geöffnet ist.","test");}
    render();

}
function notifyFire(title,body,id){
  const n=NF();
  if(n.fired[id])return false;
  n.fired[id]=Date.now();
  save();
  try{
    if(typeof Notification!=="undefined"&&Notification.permission==="granted")
      new Notification(title,{body,tag:id,icon:coverSrc("jade")});
    else toast(`${title} — ${body}`);
  }catch(e){toast(`${title} — ${body}`);}
  return true;
}
/** everything that could fire in the next few minutes, with a stable id per day */
function dueReminders(){
  const n=NF(),out=[],key=todayKey(),now=berlinNow();
  const mins=now.getHours()*60+now.getMinutes();
  const within=(target,lead)=>target-mins<=lead&&target-mins>=-1;

  if(n.cats.tasks){
    const due=S.tasks.filter(t=>t.status!=="done"&&t.due&&t.due<=key);
    if(due.length&&mins>=8*60&&mins<=9*60)
      out.push({id:`tasks:${key}`,title:`${due.length} Aufgabe${due.length===1?"":"n"} fällig`,
        body:due.slice(0,3).map(t=>t.title).join(" · ")});
  }
  if(n.cats.calendar){
    blocksFor(key).forEach(b=>{
      if(b.virtual)return;
      const st=minutes(b.start);
      if(within(st,n.lead))
        out.push({id:`cal:${b.id}:${key}`,title:b.title,
          body:st-mins<=0?"beginnt jetzt":`beginnt in ${st-mins} Minuten`});
    });
  }
  ["morning","evening"].forEach(r=>{
    if(!n.cats[r])return;
    const t=S.settings.routines?.[r]?.time;
    if(!t)return;
    if(within(minutes(t),5))
      out.push({id:`${r}:${key}`,title:r==="morning"?"Morgenroutine":"Abendroutine",
        body:`Geplant für ${t} Uhr.`});
  });
  if(n.cats.cleaning&&S.cleaning?.enabled&&cleanSessionOn(key)){
    const t=S.cleaning.schedule?.time;
    if(t&&within(minutes(t),n.lead)){
      const p=cleanProgress(key);
      out.push({id:`clean:${key}`,title:"Home Reset",body:`${p.total} Aufgaben stehen an, ${t} Uhr.`});
    }
  }
  if(n.cats.focus){
    const a=S.focus?.active;
    if(a&&focusRemaining()<=0)
      out.push({id:`focus:${a.id}`,title:"Fokuseinheit beendet",body:"Dein Baum ist gewachsen."});
  }
  if(n.cats.budget){
    upcomingPayments(6).forEach(u=>{
      const d=daysBetween(key,u.date);
      if(d===3)out.push({id:`bud:${u.e.id}:${u.date}`,title:`${u.e.emoji} ${u.e.name}`,
        body:`${eur(u.amount)} werden in drei Tagen fällig.`});
    });
  }
  return out;
}
let notifyTimer=null;
function notifyStart(){
  if(notifyTimer)clearInterval(notifyTimer);
  const tick=()=>{
    const n=NF();
    if(n.day!==todayKey()){n.day=todayKey();n.fired={};save();}
    if(!n.on)return;
    dueReminders().forEach(r=>notifyFire(r.title,r.body,r.id));
  };
  tick();
  notifyTimer=setInterval(tick,60000);
}

/* ---------- opening state ---------- */
function spToday(p,d){
  const day=dowIdx(d||berlinNow());
  return (p.hours||[])[day]||null;
}
function spBlocksToday(p,d){
  const day=dowIdx(d||berlinNow());
  return (p.blocks||[]).filter(b=>b.d===day);
}
function spStatus(p){
  const now=berlinNow(),m=now.getHours()*60+now.getMinutes();
  const h=spToday(p);
  if(!h)return{k:"none",t:p.hoursNote?"Zeiten auf Anfrage":"Heute geschlossen"};
  const o=minutes(h.o),c=minutes(h.c);
  const blocked=spBlocksToday(p).find(b=>m>=minutes(b.from)&&m<minutes(b.to));
  if(blocked)return{k:"blocked",t:`Gesperrt bis ${blocked.to}`,note:blocked.label};
  if(m<o)return{k:"soon",t:`Öffnet ${h.o}`};
  if(m>=c)return{k:"closed",t:"Geschlossen"};
  const left=c-m;
  const nextBlock=spBlocksToday(p).find(b=>minutes(b.from)>m);
  if(nextBlock&&minutes(nextBlock.from)-m<=120)
    return{k:"open",t:`Offen bis ${nextBlock.from}`,note:nextBlock.label};
  return{k:"open",t:left<=60?`Noch ${left} min`:`Offen bis ${h.c}`};
}

const spMonthKey=k=>(k||todayKey()).slice(0,7);

  const mk=monthKey||spMonthKey();
  return spCheckins().filter(c=>c.placeId===p.id&&c.date.slice(0,7)===mk).length;

function spUsedToday(p){return spCheckins().filter(c=>c.placeId===p.id&&c.date===todayKey()).length;}
function spCheckIn(id,date){
  const p=spById(id);if(!p)return;
  const d=date||todayKey();
  SP().checkins.push({id:uid(),placeId:id,date:d,at:Date.now()});

    const i=SP().checkins.findIndex(c=>c.placeId===id&&c.date===d);
    if(i>=0)SP().checkins.splice(i,1);save();render();});
}
function spRecentBars(n=14){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const k=dkey(addDays(berlinNow(),-i));
    out.push({k,v:spCheckins().filter(c=>c.date===k).length});
  }

}

function copyText(txt,label){
  const done=()=>toast(`${label||"Text"} kopiert.`);
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallback());
  else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(e){toast("Kopieren hat nicht geklappt.");}
    ta.remove();
  }
}

/* ---------- text: markdown-lite in, clean HTML out ---------- */
function mdInline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/__(.+?)__/g,"<b>$1</b>")
    .replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,!?:;]|$)/g,"$1<i>$2</i>");
}
function mdLite(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");
  let out="",list=null;
  const close=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const raw of lines){
    const l=raw.trim();let m;
    if(!l){close();continue;}
    if((m=l.match(/^#{1,6}\s+(.*)$/))){close();out+=`<h3>${mdInline(m[1].replace(/:\s*$/,""))}</h3>`;continue;}
    if((m=l.match(/^\*\*([^*]+)\*\*:?$/))){close();out+=`<h3>${mdInline(m[1].replace(/:\s*$/,""))}</h3>`;continue;}
    if((m=l.match(/^(\d+)[.)]\s+(.*)$/))){if(list!=="ol"){close();out+="<ol>";list="ol";}out+=`<li>${mdInline(m[2])}</li>`;continue;}
    if((m=l.match(/^[-*•–]\s+(.*)$/))){if(list!=="ul"){close();out+="<ul>";list="ul";}out+=`<li>${mdInline(m[1])}</li>`;continue;}
    close();out+=`<p>${mdInline(l)}</p>`;
  }
  close();
  return out;
}
const RX_OK={B:1,I:1,U:1,H3:1,H4:1,P:1,BR:1,UL:1,OL:1,LI:1};
const RX_DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,svg:1,SVG:1,IMG:1,VIDEO:1,AUDIO:1,LINK:1,META:1};
/** whitelist sanitizer: keeps structure and emphasis, strips every attribute */
function sanitizeRich(html){
  const doc=new DOMParser().parseFromString(`<div>${html||""}</div>`,"text/html");
  const root=doc.body.firstElementChild;
  const clean=node=>{
    [...node.childNodes].forEach(ch=>{
      if(ch.nodeType===3)return;
      if(ch.nodeType!==1){ch.remove();return;}
      let tag=ch.tagName.toUpperCase();
      if(RX_DROP[tag]){ch.remove();return;}
      const st=(ch.getAttribute("style")||"").toLowerCase();
      if(tag==="STRONG")tag="B";
      if(tag==="EM")tag="I";
      if(tag==="H1"||tag==="H2")tag="H3";
      if(tag==="H5"||tag==="H6")tag="H4";
      if(tag==="DIV")tag="P";
      if(tag==="SPAN"&&/font-weight:\s*(bold|[6-9]00)/.test(st))tag="B";
      if(!RX_OK[tag]){
        clean(ch);
        while(ch.firstChild)ch.parentNode.insertBefore(ch.firstChild,ch);
        ch.remove();return;
      }
      const n=doc.createElement(tag);
      while(ch.firstChild)n.appendChild(ch.firstChild);
      ch.replaceWith(n);clean(n);
    });
  };
  clean(root);
  // a P may not hold block elements — lift them out
  root.querySelectorAll("p").forEach(p=>{
    if(p.querySelector("p,ul,ol,h3,h4")){while(p.firstChild)p.parentNode.insertBefore(p.firstChild,p);p.remove();}
  });
  root.querySelectorAll("p,li,h3,h4").forEach(e=>{if(!e.textContent.trim()&&!e.querySelector("br"))e.remove();});
  return root.innerHTML.replace(/(<br>\s*){3,}/g,"<br><br>").trim();
}
const rxStepsHTML=r=>r.stepsHtml?sanitizeRich(r.stepsHtml):mdLite(r.steps||"");

/** the steps as separate cards for cooking mode */
function rxSteps(r){
  const html=rxStepsHTML(r);
  const doc=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");
  const root=doc.body.firstElementChild;
  const steps=[];let section="";
  const walk=node=>{
    [...node.children].forEach(el=>{
      const t=el.tagName;
      if(t==="H3"||t==="H4"){section=el.textContent.trim();return;}
      if(t==="OL"||t==="UL"){
        [...el.children].forEach(li=>{if(li.textContent.trim())steps.push({html:li.innerHTML,section});});return;}
      if(el.textContent.trim())steps.push({html:el.innerHTML,section});
    });
  };
  walk(root);
  if(!steps.length&&root.textContent.trim())
    root.innerHTML.split(/<br\s*\/?>/i).map(s=>s.trim()).filter(Boolean)
      .forEach(h=>steps.push({html:h,section:""}));
  return steps;
}
/* ---------- ingredients: one per line, "Für die Sauce:" becomes a heading ---------- */
const FRAC={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3};
function rxParseIng(text){
  return String(text||"").replace(/\r/g,"").split("\n").map(raw=>{
    let l=raw.trim().replace(/^[-*•–]\s+/,"").replace(/\*\*/g,"").trim();
    if(!l)return null;
    if(/:$/.test(l)&&l.length<46)return{head:true,text:l.replace(/:$/,"")};
    const m=l.match(/^(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?|\d+\/\d+|[½¼¾⅓⅔])\s*(.*)$/);
    if(!m)return{text:l,qty:null};
    let q=m[1];
    if(/[-–]/.test(q))return{text:l,qty:null};      // ranges stay as written
    let v=FRAC[q]!=null?FRAC[q]:q.includes("/")?(()=>{const[a,b]=q.split("/").map(Number);return b?a/b:null;})()
      :parseFloat(q.replace(",","."));
    return{text:m[2],qty:v};
  }).filter(Boolean);
}
function rxFmtQty(v){
  if(v==null)return"";
  const r=Math.round(v*100)/100;
  if(Math.abs(r-0.5)<.001)return"½";if(Math.abs(r-0.25)<.001)return"¼";if(Math.abs(r-0.75)<.001)return"¾";
  return String(r).replace(".",",");
}

function rxCompress(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,1100/img.width);
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.74));
    };
    img.onerror=()=>cb(null);
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- cooking mode ---------- */
let cook=null,wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&"wakeLock" in navigator){wakeLock=await navigator.wakeLock.request("screen");}
    else if(!on&&wakeLock){await wakeLock.release();wakeLock=null;}
  }catch(e){wakeLock=null;}
}
document.addEventListener("visibilitychange",()=>{if(cook&&document.visibilityState==="visible")keepAwake(true);});
function cookOpen(id){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  const steps=rxSteps(r);if(!steps.length)return;
  cook={id,i:0,steps,timer:null};
  let el=$("#cook");
  if(!el){el=document.createElement("div");el.id="cook";document.body.appendChild(el);}
  el.classList.add("on");
  lockScroll(true);keepAwake(true);
  paintCook();
}
function cookClose(){
  if(!cook)return;
  if(cook.timer?.h)clearInterval(cook.timer.h);
  cook=null;
  $("#cook")?.classList.remove("on");
  lockScroll(false);keepAwake(false);
}
const rxTimerIn=html=>{
  const t=String(html).replace(/<[^>]+>/g," ");
  const m=t.match(/(\d+)\s*(?:[-–]\s*(\d+)\s*)?(Minuten|Minute|Min\.?|min)\b/i);
  if(m)return +(m[2]||m[1]);
  const h=t.match(/(\d+(?:[.,]\d+)?)\s*(Stunden|Stunde|Std\.?)\b/i);
  return h?Math.round(parseFloat(h[1].replace(",","."))*60):null;
};
function paintCook(){
  if(!cook)return;
  const r=S.recipes.find(x=>x.id===cook.id),s=cook.steps[cook.i],last=cook.i===cook.steps.length-1;
  const f=rxFactor(r),ings=rxParseIng(r.ingredients),checked=rxChecked[r.id]||{};
  const mins=rxTimerIn(s.html);
  let n=0;
  const T=cook.timer;
  $("#cook").innerHTML=`
    <div class="ck-top">
      <button class="iconbtn" data-ckclose aria-label="Kochmodus beenden">${ic("x")}</button>
      <div class="ck-title">${esc(r.title)}</div>
      ${T?`<button class="ck-timer ${T.left<=0?"ring":""}" data-cktimerstop>⏱ ${T.left>0?fmtClock(T.left):"Fertig!"}</button>`:""}
      <button class="btn sm ghost ck-ingbtn" data-ckings>${ic("list")}<span>Zutaten</span></button>
    </div>
    <div class="ck-prog">${cook.steps.map((_,k)=>`<i class="${k<cook.i?"done":k===cook.i?"now":""}"></i>`).join("")}</div>
    <div class="ck-body">
      <aside class="ck-ings ${cook.showIngs?"open":""}">
        <h3>Zutaten${r.servings?` · ${rxServ[r.id]||r.servings} Port.`:""}</h3>
        <ul>${ings.map(i=>{
          if(i.head)return `<li class="rx-ing-h">${esc(i.text)}</li>`;
          const k=n++;
          return `<li class="rx-ing ${checked[k]?"done":""}" data-rxing="${k}" role="button" tabindex="0">
            <span class="rx-chk">${checked[k]?ic("check"):""}</span>
            <span>${i.qty!=null?`<b>${rxFmtQty(i.qty*f)}</b> `:""}${esc(i.text)}</span></li>`;}).join("")}</ul>
      </aside>
      <main class="ck-step" data-ckswipe>
        <div class="ck-count">Schritt ${cook.i+1} von ${cook.steps.length}${s.section?` · ${esc(s.section)}`:""}</div>
        <div class="ck-text">${s.html}</div>
        ${mins&&!T?`<button class="btn ck-tbtn" data-cktimer="${mins}">⏱ Timer ${mins} min starten</button>`:""}
      </main>
    </div>
    <div class="ck-nav">
      <button class="btn lg" data-cknav="-1" ${cook.i===0?"disabled":""}>${ic("chevL")}<span>Zurück</span></button>
      <button class="btn primary lg" data-cknav="1">${last?`${ic("check")}<span>Fertig</span>`:`<span>Weiter</span>${ic("chevR")}`}</button>
    </div>`;
}
function cookGo(d){
  if(!cook)return;
  const n=cook.i+d;
  if(n>=cook.steps.length){const t=S.recipes.find(x=>x.id===cook.id)?.title;cookClose();toast(`Guten Appetit${t?` — ${t}`:""}! 🍽️`);return;}
  cook.i=clamp(n,0,cook.steps.length-1);paintCook();
}
function cookTimer(mins){
  if(!cook)return;
  const end=Date.now()+mins*60000;
  cook.timer={end,left:mins*60,h:setInterval(()=>{
    if(!cook?.timer)return;
    cook.timer.left=Math.round((end-Date.now())/1000);
    if(cook.timer.left<=0&&!cook.timer.rang){cook.timer.rang=true;try{chime();}catch(e){}
      try{navigator.vibrate?.([300,150,300]);}catch(e){}toast("⏱ Timer abgelaufen.");}
    const b=$(".ck-timer");if(b){b.textContent=`⏱ ${cook.timer.left>0?fmtClock(cook.timer.left):"Fertig!"}`;
      b.classList.toggle("ring",cook.timer.left<=0);}
  },1000)};
  paintCook();
}

function rxCmd(c){
  if(c==="h3"){
    const sel=window.getSelection(),node=sel&&sel.anchorNode;
    const el=node&&(node.nodeType===1?node:node.parentElement);
    const inH=el&&el.closest&&el.closest("h3");
    document.execCommand("formatBlock",false,inH?"<p>":"<h3>");
    return;
  }
  document.execCommand(c,false,null);
}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);
  if(cook){
    if(hit("[data-ckclose]")){cookClose();return;}
    const nv=hit("[data-cknav]");if(nv){cookGo(+nv.dataset.cknav);return;}
    if(hit("[data-ckings]")){cook.showIngs=!cook.showIngs;paintCook();return;}
    const tm=hit("[data-cktimer]");if(tm){cookTimer(+tm.dataset.cktimer);return;}
    if(hit("[data-cktimerstop]")){clearInterval(cook.timer.h);cook.timer=null;paintCook();return;}
  }
  const ing=hit("[data-rxing]");
  if(ing){const id=cook?cook.id:route.params.id;
    const k=+ing.dataset.rxing;rxChecked[id]=rxChecked[id]||{};
    rxChecked[id][k]=!rxChecked[id][k];
    if(cook)paintCook();else render();return;}
  if(hit("[data-rxnew]")){recipeDlg();return;}
  const ed=hit("[data-rxedit]");if(ed){recipeDlg(ed.dataset.rxedit);return;}
  const fv=hit("[data-rxfav]");if(fv){const r=S.recipes.find(x=>x.id===fv.dataset.rxfav);
    if(r){r.fav=!r.fav;save();render();}return;}
  const ck=hit("[data-rxcook]");if(ck&&!ck.disabled){cookOpen(ck.dataset.rxcook);return;}
  const sv=hit("[data-rxserv]");
  if(sv){const r=S.recipes.find(x=>x.id===route.params.id);if(!r)return;
    const cur=rxServ[r.id]||+r.servings||1;rxServ[r.id]=clamp(cur+ +sv.dataset.rxserv,1,40);render();return;}
  const ml=hit("[data-rxmeal]");if(ml){foodMeal=ml.dataset.rxmeal;render();return;}
},true);
document.addEventListener("keydown",e=>{
  if(!cook)return;
  if(e.key==="Escape"){cookClose();}
  else if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();cookGo(1);}
  else if(e.key==="ArrowLeft"){cookGo(-1);}
});
(function(){
  let sx=null,sy=null;
  document.addEventListener("pointerdown",e=>{if(cook&&e.target.closest("[data-ckswipe]")){sx=e.clientX;sy=e.clientY;}},{passive:true});
  document.addEventListener("pointerup",e=>{
    if(sx==null||!cook)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)cookGo(dx<0?1:-1);
  },{passive:true});
})();
