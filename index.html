  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  animation:dl 160ms var(--ease);
}
@keyframes dl{from{opacity:0;transform:scaleX(.9)}to{opacity:1;transform:none}}

@media(max-width:860px){
  .searchwrap{max-width:none;min-width:0;width:100%;order:-1}
  .sortwrap{flex:1}
  .sortwrap .sel{width:100%}
  .fgrid{grid-template-columns:1fr;gap:15px}
  .filterpanel{padding:15px}
}

/* ===== shopping ===== */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.stile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:13px 8px 11px;border-radius:var(--r-md);background:var(--surface);
  border:1.5px solid var(--line-soft);box-shadow:var(--sh-xs);min-height:98px;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease),background var(--t) var(--ease);
}
.stile:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--line-strong)}
.stile:active{transform:translateY(-1px) scale(.97)}
.stile .sic{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb, var(--tc) 14%, transparent);
  transition:background var(--t) var(--ease),transform var(--t) var(--ease);
}
.stile .sn{font-size:11.5px;font-weight:600;line-height:1.25;text-align:center;color:var(--text-2)}
.stile.on{border-color:var(--tc);background:color-mix(in srgb, var(--tc) 7%, var(--surface))}
.stile.on .sic{background:var(--tc);transform:scale(1.04)}
.stile.on .sn{color:var(--text)}
.stile .sq{
  position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;
  background:var(--tc);color:#fff;font-size:12px;font-weight:750;display:grid;place-items:center;
  box-shadow:var(--sh-sm);animation:pop 220ms var(--ease);
}
.stile .sminus{
  position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line-strong);color:var(--text-2);
  font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:var(--sh-xs);
}
.stile .sminus:hover{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.tier{margin-bottom:16px}
.tier-h{
  display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);transition:background var(--t) var(--ease)}
.tier-h:hover{background:var(--surface-2)}
.tier.open .tier-h{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:transparent}
.tier-h .tchev{color:var(--text-faint);display:flex;width:20px}
.tier-h .tn{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.02em}
.tier-h .td{display:block;font-size:12.5px;color:var(--text-muted);margin-top:1px}
.tier-h .count{margin-left:auto}
.tier-b{
  background:var(--surface);border:1px solid var(--line-soft);border-top:none;
  border-radius:0 0 var(--r-lg) var(--r-lg);padding:6px 16px 18px;
}
.scat-block{margin-top:14px}
.scat-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.scat-h .se{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb, var(--tc) 15%, transparent)}
.scat-h .sname{font-size:13.5px;font-weight:650}

.basket .srow{
  display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line-soft);
  cursor:pointer;transition:opacity var(--t) var(--ease)}
.basket .srow:last-child{border-bottom:none}
.basket .sicon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  background:color-mix(in srgb, var(--tc) 14%, transparent);flex:none}
.basket .sname{flex:1;font-size:14.5px;font-weight:550}
.basket .scat{width:132px;text-align:right}
.basket .srow.done{opacity:.45}
.basket .srow.done .sname{text-decoration:line-through}
.minitile{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;position:relative;
  background:color-mix(in srgb, var(--tc) 15%, transparent)}
.minitile b{position:absolute;bottom:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;
  background:var(--tc);color:#fff;font-size:10px;font-weight:750;display:grid;place-items:center}
.minitile.more{background:var(--surface-3);font-size:12px;font-weight:700;color:var(--text-muted)}

/* ===== all-day band ===== */
.allday{display:grid;border-bottom:1px solid var(--line);background:var(--surface-2);min-height:34px}
.adlabel{
  display:flex;align-items:center;justify-content:flex-end;padding:6px 10px;
  font-size:11px;font-weight:650;color:var(--text-faint);border-right:1px solid var(--line-soft)}
.adcell{padding:5px 4px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line-soft);min-width:0}
.adcell:last-child{border-right:none}
.adchip{
  display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;width:100%;
  font-size:11.5px;font-weight:600;text-align:left;line-height:1.35;
  background:color-mix(in srgb, var(--ac) 16%, transparent);color:var(--ac);
  border-left:3px solid var(--ac);
  transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.adchip:hover{background:color-mix(in srgb, var(--ac) 26%, transparent);transform:translateX(1px)}
.adchip .addot{width:5px;height:5px;border-radius:50%;background:var(--ac);flex:none}
.adchip .adt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adchip.holiday{font-weight:680}
.adchip.mini{padding:2px 6px;font-size:10.5px;margin-top:3px}
.gh.free .dd{box-shadow:inset 0 0 0 2px color-mix(in srgb,#d64545 55%,transparent)}
.mcell.free{background:color-mix(in srgb,#d64545 5%,transparent)}
.allday-switch{
  padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft)}

/* ===== birthdays ===== */
.bdbanner{
  display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r-lg);
  margin-bottom:18px;cursor:pointer;border:1px solid transparent;
  background:linear-gradient(120deg,color-mix(in srgb,#e8618a 16%,var(--surface)),color-mix(in srgb,#d99022 12%,var(--surface)));
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.bdbanner:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.bdbanner .bb-ic{font-size:30px}
.bdbanner .bb-t{font-size:16px;font-weight:680;letter-spacing:-.022em}
.bdbanner .bb-s{font-size:13.5px;color:var(--text-2);margin-top:2px}
.bdbanner.now{box-shadow:0 0 0 1px color-mix(in srgb,#e8618a 30%,transparent),var(--sh-sm)}
.panel.bdglow{box-shadow:0 0 0 1px color-mix(in srgb,#e8618a 32%,transparent),var(--sh-md)}

.bdtoday{position:relative;overflow:hidden;border-radius:var(--r-xl);margin-bottom:20px;
  background:linear-gradient(140deg,#e8618a 0%,#d9557e 46%,#8b5fd0 100%);box-shadow:var(--sh-md)}
.bdtoday-in{position:relative;z-index:1;padding:26px 28px;color:#fff}
.bdtoday-in h2{font-size:26px;font-weight:720;letter-spacing:-.03em;margin-top:8px;line-height:1.15}
.bdtoday-in p{margin:8px 0 0;font-size:14.5px;opacity:.9}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti span{
  position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;background:var(--c);opacity:.75;
  animation:fall 4.2s linear infinite;animation-delay:var(--d)}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(240px) rotate(420deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}}

.bdnext{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.bdnext-c{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);text-align:left;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.bdnext-c:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.bdnext-c .nn{font-size:15px;font-weight:650;margin-top:8px}
.bdnext-c .nd{font-size:12.5px;color:var(--text-muted)}
.bdnext-c .na{font-size:12px;font-weight:650;color:var(--rc);margin-top:5px}

.bd-av{
  width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;
  font-size:14px;font-weight:720;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(150deg,var(--rc,#e8618a),color-mix(in srgb,var(--rc,#e8618a) 62%,#2b1a24))}
.bd-av.sm{width:32px;height:32px;border-radius:11px;font-size:11.5px}

.bdmonth{margin-bottom:22px}
.bdmonth-h{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.bdmonth-h span:first-child{font-size:14px;font-weight:700;letter-spacing:-.015em}
.bdline{flex:1;height:1px;background:var(--line)}

.bdcard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);margin-bottom:10px;overflow:hidden;
  transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.bdcard:hover{box-shadow:var(--sh-sm);border-color:var(--line-strong)}
.bdcard.today{border-color:color-mix(in srgb,#e8618a 45%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,#e8618a 22%,transparent),var(--sh-sm)}
.bd-h{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;width:100%;text-align:left;
  transition:background var(--t) var(--ease)}
.bd-h:hover{background:var(--surface-2)}
.bd-main{flex:1;min-width:0}
.bd-n{font-size:15px;font-weight:650;letter-spacing:-.018em}
.bd-today{font-size:11.5px;font-weight:700;color:#e8618a;margin-left:5px}
.bd-s{font-size:12.5px;color:var(--text-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-rel{font-size:12px;font-weight:600;color:var(--rc);padding:3px 10px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--rc) 12%,transparent);white-space:nowrap}
.bd-away{font-size:12.5px;font-weight:650;color:var(--text-faint);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.bd-away.soon{color:var(--warning)}
.bd-away.now{color:#e8618a}
.bd-chev{color:var(--text-faint);display:flex}
.bd-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows 280ms var(--ease)}
.bdcard.open .bd-b{grid-template-rows:1fr}
.bd-inner{overflow:hidden;min-height:0}
.bdcard.open .bd-inner{padding:2px 16px 16px}
.bd-note{margin:0 0 13px;font-size:13.5px;color:var(--text-2);line-height:1.6}
.bd-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.bd-fv{font-size:14.5px;font-weight:650;margin-top:2px}

.giftbox{background:var(--surface-2);border-radius:var(--r-md);padding:14px 15px}
.gift-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650;margin-bottom:8px}
.giftrow{display:flex;align-items:center;gap:11px;padding:6px 0}
.giftrow .gt{flex:1;font-size:13.5px}
.giftrow.done .gt{color:var(--text-faint);text-decoration:line-through}
.giftadd{display:flex;gap:8px;margin-top:10px}
.giftadd .inp{flex:1}

.hdrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.hdrow:last-child{border-bottom:none}
.hddot{width:9px;height:9px;border-radius:50%;flex:none}
.hdn{font-size:14px;font-weight:600}

@media(max-width:860px){
  .sgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .stile{min-height:88px;padding:11px 5px 9px}
  .stile .sic{width:38px;height:38px;font-size:19px}
  .stile .sn{font-size:10.5px}
  .basket .scat{display:none}
  .adlabel{font-size:0;padding:6px 4px}
  .adlabel::after{content:"⏱";font-size:12px}
  .bd-rel{display:none}
  .bdtoday-in{padding:20px}
  .bdtoday-in h2{font-size:21px}
  .tier-b{padding:4px 11px 14px}
}

/* ===== journal calendar ===== */
/* the base rule is a grid; with two children the dot created a second row,
   so cells with an entry grew taller than cells without. Flex + absolute dot. */
.jday{
  display:flex;align-items:center;justify-content:center;position:relative;
  aspect-ratio:1;min-width:0;padding:0;overflow:hidden;
  transition:background var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.jday .jd-n{line-height:1;font-variant-numeric:tabular-nums}
.jday .jd-dot{
  position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--md,var(--primary))}
.jday.out{opacity:.34}
.jday.future{opacity:.5}
.jday.has{background:color-mix(in srgb,var(--md,var(--primary)) 16%,transparent);color:var(--text);font-weight:700}
.jday.today{box-shadow:inset 0 0 0 2px var(--primary)}
.jday.sel{background:var(--primary);color:#fff;font-weight:750}
.jday.sel .jd-dot{background:rgba(255,255,255,.85)}
.jday.sel.today{box-shadow:inset 0 0 0 2px var(--primary-deep)}

/* ===== journal timeline ===== */
.jtl-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.jtl-stats{display:flex;gap:22px}
.jtl-wrap{position:relative}
.jtl{
  display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:26px 0 30px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.jtl::-webkit-scrollbar{display:none}
.jtl-pad{flex:0 0 calc(50% - 150px);min-width:8px}
.jcard{
  flex:0 0 300px;scroll-snap-align:center;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:20px 22px;
  box-shadow:var(--sh-sm);cursor:pointer;position:relative;overflow:hidden;
  transform:scale(.9);opacity:.55;
  transition:transform 420ms var(--ease),opacity 420ms var(--ease),box-shadow 420ms var(--ease);
}
.jcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--mc)}
.jcard.on{transform:scale(1);opacity:1;box-shadow:var(--sh-lg)}
.jcard:active{transform:scale(.98)}
.jc-top{display:flex;align-items:flex-start;gap:12px}
.jc-date{display:flex;flex-direction:column;line-height:1}
.jc-d{font-size:40px;font-weight:760;letter-spacing:-.05em}
.jc-m{font-size:12.5px;font-weight:650;color:var(--text-muted);margin-top:4px}
.jc-day{font-size:13px;font-weight:600;color:var(--mc);margin-top:10px}
.jc-text{
  margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--text-2);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;min-height:112px}
.jc-foot{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)}
.jc-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc)}
.jc-rel{font-size:11.5px;color:var(--text-faint);font-weight:600}
.jtl-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface-glass);backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:var(--sh-md);color:var(--text-2);
  transition:transform var(--t) var(--ease),background var(--t) var(--ease)}
.jtl-nav:hover{background:var(--surface);transform:translateY(-50%) scale(1.08)}
.jtl-nav.left{left:-6px}
.jtl-nav.right{right:-6px}
.jrail{
  display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding:4px 2px 8px;
  justify-content:center;scrollbar-width:none}
.jrail::-webkit-scrollbar{display:none}
.jrail-y{display:flex;flex-direction:column;gap:5px;flex:none}
.jrail-y .ry-l{font-size:11px;font-weight:750;color:var(--text-faint);letter-spacing:.03em;padding-left:2px}
.jrail-y .ry-m{display:flex;gap:5px}
.jrail-m{
  padding:6px 10px;border-radius:var(--r-sm);background:var(--surface-3);
  font-size:12px;font-weight:650;color:var(--text-2);
  transition:background var(--t) var(--ease),color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.jrail-m:hover{background:var(--primary-soft);color:var(--primary-deep);transform:translateY(-2px)}

/* delete affordances on the timeline */
.jc-del{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--text-faint);opacity:0;pointer-events:none;
  transition:opacity var(--t) var(--ease),background var(--t) var(--ease),color var(--t) var(--ease)}
.jcard.on .jc-del{opacity:1;pointer-events:auto}
.jc-del:hover{background:var(--danger-soft);color:var(--danger)}
.jcard{touch-action:pan-x}
.jcard.lifting{transition:none;z-index:4;box-shadow:var(--sh-xl)}
.jtrash{
  display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;
  height:0;overflow:hidden;opacity:0;border-radius:var(--r-lg);
  font-size:13.5px;font-weight:650;color:var(--text-muted);background:var(--surface-3);
  transition:height var(--t) var(--ease),opacity var(--t) var(--ease),background var(--t) var(--ease),color var(--t) var(--ease)}
.jtrash.on{height:52px;opacity:1}
.jtrash.armed{background:var(--danger-soft);color:var(--danger)}
.jtrash.armed span:first-child{transform:scale(1.12)}
.jtrash span:first-child{display:flex;transition:transform var(--t) var(--ease)}

/* draggable course list */
.courserow{position:relative}
.courserow.dragging{opacity:.4}
.cgrip{
  width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;
  color:var(--text-faint);cursor:grab}
.cgrip:hover{background:var(--surface-3);color:var(--text-2)}
.cgrip:active{cursor:grabbing}

/* journal detail overlay */
.jdlg-h{display:flex;align-items:center;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.jdlg-h h2{font-size:23px;letter-spacing:-.03em;margin-top:4px}
.jdlg-scales{display:grid;gap:10px;margin:16px 0}
.jdlg-s{display:flex;align-items:center;gap:12px}
.jdlg-s .meta{width:96px}
.jdlg-s .bar{flex:1;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.jdlg-s .bar i{display:block;height:100%;border-radius:5px;background:var(--pc)}
.jdlg-s .v{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.jdlg-sec{margin-top:18px}
.jdlg-sec h4{font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.jdlg-sec p{margin:0;font-size:14.5px;line-height:1.7;color:var(--text);white-space:pre-wrap}

/* ===== growth ===== */
.gseg{flex-wrap:wrap}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcat{margin-bottom:14px}
.gcat-h{
  display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  box-shadow:var(--sh-xs);transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.gcat-h:hover{background:var(--surface-2)}
.gcat.open .gcat-h{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:transparent}
.gc-chev{color:var(--text-faint);display:flex}
.gc-e{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb,var(--tc) 15%,transparent)}
.gc-n{font-size:15px;font-weight:650;letter-spacing:-.018em;flex:1}
.gcat-b{background:var(--surface);border:1px solid var(--line-soft);border-top:none;
  border-radius:0 0 var(--r-lg) var(--r-lg);padding:14px 16px 18px}

.contcard{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line-soft);text-align:left;width:100%;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),background var(--t) var(--ease)}
.contcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md);background:var(--surface)}
.cc-ic{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc)}
.cc-main{flex:1;min-width:0}
.cc-t{display:block;font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-s{display:block;font-size:12.5px;color:var(--text-muted);margin-top:1px}

.shelf{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}

.guideteaser{

@media(max-width:860px){

/* ===== home birthday card ===== */
.bdhome .bdh-row{display:flex;gap:14px;padding:4px 20px 18px;align-items:stretch}
.bdh-spot{
  flex:1 1 44%;min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;
  padding:18px 18px 16px;border-radius:var(--r-lg);text-align:left;overflow:hidden;
  background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 15%,var(--surface)),var(--surface) 72%);
  border:1px solid color-mix(in srgb,var(--rc) 20%,transparent);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.bdh-spot:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.bdh-spot.now{
  background:linear-gradient(145deg,color-mix(in srgb,#e8618a 22%,var(--surface)),
    color-mix(in srgb,#d99022 10%,var(--surface)) 78%);
  border-color:color-mix(in srgb,#e8618a 34%,transparent)}
.bdh-spot::after{
  content:"";position:absolute;right:-42px;top:-52px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--rc) 22%,transparent),transparent 68%);

.bdh-flag{
  position:relative;z-index:1;font-size:11px;font-weight:750;letter-spacing:.03em;
  padding:3px 9px;border-radius:var(--r-pill);background:var(--surface);color:#e8618a;
  box-shadow:var(--sh-xs)}

.bdh-av{
  position:relative;z-index:1;width:50px;height:50px;border-radius:17px;margin-top:13px;
  display:grid;place-items:center;font-size:17px;font-weight:750;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(150deg,var(--rc),color-mix(in srgb,var(--rc) 62%,#2b1a24));
  box-shadow:0 4px 12px color-mix(in srgb,var(--rc) 34%,transparent)}
.bdh-name{position:relative;z-index:1;font-size:19px;font-weight:700;letter-spacing:-.028em;margin-top:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bdh-sub{position:relative;z-index:1;font-size:13px;color:var(--text-2);margin-top:2px}
.bdh-meta{position:relative;z-index:1;display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.bdh-rel{font-size:11.5px;font-weight:650;color:var(--rc);
  background:color-mix(in srgb,var(--rc) 13%,transparent);padding:3px 9px;border-radius:var(--r-pill)}
.bdh-gift{font-size:11.5px;font-weight:650;color:var(--text-2);
  background:var(--surface-3);padding:3px 9px;border-radius:var(--r-pill)}

.bdh-next{flex:1 1 56%;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.bdh-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-md);text-align:left;
  transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.bdh-item:hover{background:var(--surface-2);transform:translateX(2px)}
.bdh-i-main{flex:1;min-width:0}
.bdh-i-n{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdh-i-d{display:block;font-size:12px;color:var(--text-muted);margin-top:1px}
.bdh-i-p{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bdh-empty{padding:12px;font-size:13px;color:var(--text-muted)}
.bdh-add{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--r-md);
  font-size:13px;font-weight:600;color:var(--text-muted);border:1.5px dashed var(--line);
  transition:border-color var(--t) var(--ease),color var(--t) var(--ease),background var(--t) var(--ease)}
.bdh-add:hover{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-softer)}
.bdh-add svg{width:15px;height:15px}

@media(max-width:1280px){
  .bdh-row{flex-direction:column}
  .bdh-spot{flex:none}
}
@media(max-width:860px){
  .bdh-row{padding:4px 14px 14px}
  .bdh-av{width:44px;height:44px;border-radius:15px;font-size:15px}

}

/* ===== emoji picker ===== */
.emoedit{
  width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:var(--surface-3);border:1.5px solid transparent;
  transition:background var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.emoedit:hover{background:var(--primary-soft);border-color:var(--primary);transform:scale(1.06)}
.emoset{margin-bottom:14px}
.emoset-h{font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:7px}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emobtn{
  aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:20px;
  background:var(--surface-2);transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.emobtn:hover{background:var(--primary-soft);transform:scale(1.12)}
.emobtn.on{background:var(--primary);box-shadow:0 0 0 2px var(--primary-deep)}

/* ===== budget hero ===== */
.bhero{border-radius:var(--r-xl);overflow:hidden;position:relative;box-shadow:var(--sh-md);
  background:linear-gradient(150deg,#16a97f 0%,#128f8c 52%,#3d8fd8 100%)}
.bhero.tight{background:linear-gradient(150deg,#e0a03f 0%,#e07a4a 54%,#d9646e 100%)}
.bhero.over{background:linear-gradient(150deg,#dd5565 0%,#c4485f 52%,#8b4a86 100%)}
.bhero.none{background:linear-gradient(150deg,#6b7f96 0%,#4f6274 100%)}
.bhero-in{padding:26px 28px;color:#fff;position:relative;z-index:1}
.bhero-in p{margin:8px 0 0;font-size:14.5px;opacity:.9;max-width:62ch}
.bbig{font-size:50px;font-weight:750;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.bhero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-top:20px}
.bhero-grid div{background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:10px 12px}
.bhero-grid span{display:block;font-size:11.5px;opacity:.82}
.bhero-grid b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

.bbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--surface-3)}
.bbar i{display:block;height:100%;transition:width var(--t-slow) var(--ease)}
.blegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--text-2)}
.blegend span{display:flex;align-items:center;gap:6px}
.blegend i{width:10px;height:10px;border-radius:3px}
.blegend b{font-variant-numeric:tabular-nums}

.bline{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.bline:last-child{border-bottom:none}
.bline span{flex:1;color:var(--text-2)}
.bline b{font-variant-numeric:tabular-nums;font-weight:650}
.bline.total{border-top:2px solid var(--line);margin-top:4px;padding-top:13px;font-size:15.5px}
.bline.total b{font-size:19px;color:var(--primary-strong)}

.brec{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.brec-c{padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--rc) 11%,var(--surface));
  border:1px solid color-mix(in srgb,var(--rc) 22%,transparent)}
.brec-c span{display:block;font-size:12px;font-weight:650;color:var(--text-2)}
.brec-c b{display:block;font-size:22px;font-weight:750;color:var(--rc);font-variant-numeric:tabular-nums;margin-top:3px}

.bcand{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.bcand:last-of-type{border-bottom:none}
.bcand-sum{margin-top:12px;padding-top:12px;border-top:2px solid var(--line);font-size:14px;color:var(--text-2)}
.bcand-sum b{font-variant-numeric:tabular-nums;color:var(--text)}

.bup{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.bup:last-child{border-bottom:none}
.bup:hover{background:var(--surface-2)}
.bup-d{width:64px;font-size:12px;font-weight:650;color:var(--text-muted);font-variant-numeric:tabular-nums}
.bup b{font-variant-numeric:tabular-nums}

.wiout{background:var(--surface-2);border-radius:var(--r-md);padding:14px}
.wi-row{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:13.5px}
.wi-row span{flex:1;color:var(--text-2)}
.wi-row b{font-variant-numeric:tabular-nums;font-weight:650}
.wi-row.diff{border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.wi-row.diff.up b{color:var(--primary-strong)}
.wi-row.diff.down b{color:var(--danger)}

/* ===== expense rows ===== */
.bsum{font-size:13.5px;color:var(--text-muted);margin-bottom:12px}
.bsum b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.blist{display:grid;gap:8px}
.brow{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--sh-xs);
  transition:border-color var(--t) var(--ease),transform var(--t-fast) var(--ease),opacity var(--t) var(--ease)}
.brow:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.brow.off{opacity:.5}
.brow.dragging{opacity:.4}
.brow .bn{flex:1;min-width:0}
.brow .bt{font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:7px}
.bshare{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:var(--r-pill);
  background:var(--second-soft);color:var(--second)}
.bamt{text-align:right;min-width:112px}
.bamt .ba{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.bnext{width:86px;text-align:right}
.bstat{
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);
  font-size:12px;font-weight:650;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent);
  white-space:nowrap;transition:background var(--t) var(--ease)}
.bstat:hover{background:color-mix(in srgb,var(--sc) 24%,transparent)}

/* ===== yearly calendar ===== */
.ycal{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;align-items:end}
.ycell{display:flex;flex-direction:column;align-items:center;gap:5px}
.ycell .ym{font-size:11px;font-weight:650;color:var(--text-muted)}
.ycell .ybar{width:100%;height:76px;border-radius:6px;background:var(--surface-3);
  display:flex;align-items:flex-end;overflow:hidden}
.ycell .ybar i{width:100%;background:var(--warning);border-radius:6px;transition:height var(--t-slow) var(--ease)}
.ycell.has .ybar i{background:linear-gradient(180deg,var(--warning),color-mix(in srgb,var(--warning) 70%,#7a4a10))}
.ycell .yv{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}

/* ===== goals, debts, buckets ===== */
.goalcard2,.debtcard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:16px 18px;box-shadow:var(--sh-xs)}
.g-h{display:flex;align-items:center;gap:12px}
.g-h .bt{font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.g-pct{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--primary-strong)}
.g-bar{height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin:13px 0 11px}
.g-bar i{display:block;height:100%;border-radius:6px;background:var(--primary-grad);
  transition:width var(--t-slow) var(--ease)}
.g-f{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.bucketgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.bucket{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line-soft)}
.bucket .bn{flex:1;min-width:0}
.bucket .bt{font-size:14px;font-weight:620}
.bamtin{width:92px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;min-height:38px;padding:6px 9px}

.acct.closing{border-color:color-mix(in srgb,var(--warning) 35%,transparent)}
.acct.closed{opacity:.6}
.budhome .num{font-variant-numeric:tabular-nums}

@media(max-width:860px){
  .bhero-in{padding:20px}
  .bbig{font-size:38px}
  .brec{grid-template-columns:1fr}
  .ycal{grid-template-columns:repeat(6,1fr);gap:9px}
  .brow{flex-wrap:wrap;gap:9px}
  .brow .bnext{display:none}
  .bamt{min-width:0;text-align:left}
  .emogrid{grid-template-columns:repeat(6,1fr)}
  .bucketgrid{grid-template-columns:1fr}
}

/* ===== layout hardening: nothing may drift sideways ===== */
html{overflow-x:clip}
body{overflow-x:clip;width:100%;max-width:100%;position:relative;overscroll-behavior-y:none}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
#view,.page,.grid,.panel{max-width:100%;min-width:0}
.grid>*{min-width:0}
.panel-b,.panel-h{min-width:0}
.bt,.ti,.sname,.bd-n,.cc-t,.jc-text,.lt,.ls{overflow-wrap:anywhere}
.tbl{max-width:100%}

@media(max-width:860px){
  /* the bar is four slots plus the add button, everything else lives in the sheet */
  #view{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
  #topbar{padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
  #mobilenav{
    left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));
    padding:6px 7px;gap:3px;
  }
  #mobilenav button{min-height:54px;position:relative;border-radius:14px}
  #mobilenav button .l{font-size:10.5px}
  #mobilenav .nb{
    position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:750;
    display:grid;place-items:center}
  #mobilenav::before{
    content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:32px;height:3px;border-radius:2px;background:var(--line-strong);opacity:.6}

  /* touch targets */
  .btn,.iconbtn,.chip,.durbtn,.catchip,.seg button{min-height:42px}
  .iconbtn{min-width:42px}
  input[type=checkbox]{width:22px;height:22px}
  .inp,.sel,.ta{min-height:46px;font-size:16px}  /* 16px stops iOS from zooming in */
  .tbl td,.tbl th{padding:12px 10px}
  .stile{min-height:96px}
  .jday{min-height:38px}
  .cal-bar{gap:9px}
  .cal-bar .seg{width:100%;overflow-x:auto}
  .searchwrap{width:100%;max-width:none}

  /* wide things scroll inside themselves instead of pushing the page */
  .ycal{overflow-x:auto;grid-template-columns:repeat(12,minmax(46px,1fr))}
  .brec{grid-template-columns:1fr}
  .bhero-grid{grid-template-columns:1fr 1fr}
  .grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bdnext{grid-template-columns:1fr}
  .cattiles{grid-template-columns:repeat(3,1fr)}
}

/* ===== navigation sheet ===== */
#navsheet{position:fixed;inset:0;z-index:120;pointer-events:none}
#navsheet .ns-scrim{
  position:absolute;inset:0;background:rgba(12,22,19,.42);backdrop-filter:blur(3px);
  opacity:0;transition:opacity 260ms var(--ease)}
#navsheet .ns-panel{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -14px 48px rgba(12,26,20,.22);
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
  max-height:min(76dvh,620px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(102%);transition:transform 320ms cubic-bezier(.22,1,.36,1)}
#navsheet.on{pointer-events:auto}
#navsheet.on .ns-scrim{opacity:1}
#navsheet.on .ns-panel{transform:none}
.ns-grip{display:flex;justify-content:center;padding:11px 0 6px;position:sticky;top:0;
  background:var(--surface);z-index:2;cursor:grab}
.ns-grip span{width:40px;height:4px;border-radius:3px;background:var(--line-strong)}
.ns-group{margin-bottom:16px}
.ns-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;

.ns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.ns-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:15px 8px;border-radius:var(--r-md);background:var(--surface-2);position:relative;
  min-height:86px;transition:background var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.ns-item:active{transform:scale(.96)}
.ns-item.on{background:var(--primary-soft);color:var(--primary-deep)}
.ns-ic{display:flex;color:var(--text-2)}
.ns-item.on .ns-ic{color:var(--primary-deep)}
.ns-n{font-size:12px;font-weight:620;text-align:center;line-height:1.25}
.ns-ct{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--primary);color:#fff;font-size:10px;font-weight:750;display:grid;place-items:center}
@media(min-width:861px){#navsheet{display:none}}

const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fmtDate=k=>{if(!k)return"";const d=parseKey(k);return `${d.getDate()}. ${MONL[d.getMonth()].slice(0,3)}`;};
const fmtDateLong=k=>{if(!k)return"";const d=parseKey(k);return `${DAYL[(d.getDay()+6)%7]}, ${d.getDate()}. ${MONL[d.getMonth()]} ${d.getFullYear()}`;};
const dowIdx=d=>(d.getDay()+6)%7; // 0 = Monday
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
function relDay(k){
  const d=daysBetween(todayKey(),k);

/* ============================================================
   2. PERSISTENCE  — File System Access API + IndexedDB buffer
   ============================================================ */
const DB={name:"life-os",store:"kv",_p:null};
function idb(){
  if(DB._p)return DB._p;
  if(typeof indexedDB==="undefined"){DB._p=Promise.reject(new Error("no indexedDB"));return DB._p;}
  DB._p=new Promise((res,rej)=>{
    const r=indexedDB.open(DB.name,1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(DB.store))d.createObjectStore(DB.store);};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return DB._p;
}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(DB.store,"readonly").objectStore(DB.store).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(DB.store,"readwrite").objectStore(DB.store).put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(DB.store,"readwrite").objectStore(DB.store).delete(k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}

const FS_SUPPORTED = typeof window.showSaveFilePicker==="function";
let fileHandle=null;
let saveState="off";

function setSave(st,txt){
  saveState=st;
  const el=$("#saveInd");if(!el)return;
  el.className=st;
  $("#saveTxt").textContent=txt||({saving:"Speichert…",saved:"Gespeichert",dirty:"Nicht gespeichert",off:"Nur auf diesem Gerät",err:"Fehler beim Speichern"}[st]||st);
}
async function verifyPerm(h,write=true){
  const o={mode:write?"readwrite":"read"};
  if(await h.queryPermission(o)==="granted")return true;
  if(await h.requestPermission(o)==="granted")return true;
  return false;
}
async function writeFile(){
  if(!fileHandle)return false;
  try{
    const w=await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    await w.close();
    return true;
  }catch(e){console.warn("write failed",e);return false;}
}
async function persistNow(){
  S.meta.updated=new Date().toISOString();
  try{await idbSet("state",S);}catch(e){console.warn("idb buffer failed",e);}
  if(fileHandle){
    setSave("saving");
    const ok=await writeFile();
    setSave(ok?"saved":"err",ok?("Gespeichert · "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})):"Datei nicht erreichbar");
  }else{
    setSave("off");
  }
}
const flush=debounce(persistNow,700);

async function connectFile(){
  if(!FS_SUPPORTED){toast("Dieser Browser kann keine Datei direkt beschreiben. Nutze Export/Import.");return;}
  try{
    const h=await window.showSaveFilePicker({
      suggestedName:"life-os.json",
      types:[{description:"Life OS Daten",accept:{"application/json":[".json"]}}]
    });
    fileHandle=h; await idbSet("handle",h);
    await writeFile(); setSave("saved","Verbunden · "+h.name);
    toast("Datei verbunden. Änderungen werden ab jetzt automatisch gespeichert.");
    render();
  }catch(e){ if(e.name!=="AbortError")toast("Verbindung abgebrochen."); }
}
async function openExistingFile(){
  if(!FS_SUPPORTED){const f=$("#importFile"); if(f)f.click(); else {go("settings");toast("Import findest du unter Einstellungen \u203a Daten.");} return;}
  try{
    const [h]=await window.showOpenFilePicker({types:[{description:"Life OS Daten",accept:{"application/json":[".json"]}}]});
    if(!await verifyPerm(h))return;
    const txt=await(await h.getFile()).text();
    const data=JSON.parse(txt);
    applyImport(data,"replace");
    fileHandle=h; await idbSet("handle",h);
    setSave("saved","Verbunden · "+h.name);
    toast("Datei geladen und verbunden.");
  }catch(e){ if(e.name!=="AbortError")toast("Datei konnte nicht gelesen werden."); }
}
async function disconnectFile(){
  fileHandle=null; await idbDel("handle"); setSave("off");
  toast("Datei getrennt. Daten bleiben lokal in diesem Browser.");
  render();
}
async function restoreHandle(){
  if(!FS_SUPPORTED)return false;
  try{
    const h=await idbGet("handle");
    if(!h)return false;
    if(await h.queryPermission({mode:"readwrite"})==="granted"){
      fileHandle=h; setSave("saved","Verbunden · "+h.name);
      try{const t=await(await h.getFile()).text();const d=JSON.parse(t);
        if(d&&d.schemaVersion&&(!S.meta||new Date(d.meta?.updated||0)>=new Date(S.meta?.updated||0))){S=migrate(d);}
      }catch(e){}
      return true;
    }
    // permission needs a user gesture — show the reconnect prompt
    pendingHandle=h; setSave("dirty","Datei bestätigen");
    return false;
  }catch(e){return false;}
}
let pendingHandle=null;
async function reconnectPending(){
  if(!pendingHandle)return;
  if(await verifyPerm(pendingHandle)){
    fileHandle=pendingHandle; pendingHandle=null;
    try{const t=await(await fileHandle.getFile()).text();const d=JSON.parse(t);
      if(d&&d.schemaVersion){S=migrate(d);}
    }catch(e){}
    setSave("saved","Verbunden · "+fileHandle.name);
    toast("Datei wieder verbunden.");
    render();
  }
}

function migrate(d){
  if(!d||typeof d!=="object")return seedState();
  const base=seedState();
  // fill gaps without discarding anything the file already has
  const out={...base,...d};
  out.schemaVersion=SCHEMA_VERSION;
  out.settings={...base.settings,...(d.settings||{})};
  out.settings.heroes={...(d.settings?.heroes||{})};
  out.settings.categories=(d.settings?.categories?.length?d.settings.categories:base.settings.categories);
  out.settings.blockTypes=(d.settings?.blockTypes?.length?d.settings.blockTypes:base.settings.blockTypes);
  out.growth={...base.growth,...(d.growth||{})};
  out.routines={morning:{...base.routines.morning,...(d.routines?.morning||{})},
                evening:{...base.routines.evening,...(d.routines?.evening||{})}};
  out.meta={...base.meta,...(d.meta||{})};
  ["tasks","notes","journal","blocks","recipes","habits","favorites"].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  ["routineHistory","habitLog"].forEach(k=>{if(!out[k]||typeof out[k]!=="object")out[k]={};});
  if(d.cleaning)out.cleaning=d.cleaning;
  return ensureV2(out);
}

/* ---- image picker (stored as data URL in the JSON) ---- */
function pickImage(cb,maxW=1400){
  const i=document.createElement("input");
  i.type="file";i.accept="image/*";
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxW/img.width);
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.82));
      };
      img.onerror=()=>cb(rd.result);
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  i.click();
}

   4. CALENDAR ENGINE — recurrence rules → occurrences
   ============================================================ */

function currentBlock(){
  const n=berlinNow(),m=n.getHours()*60+n.getMinutes(),key=todayKey();
  const list=blocksFor(key);
  const now=list.find(b=>minutes(b.start)<=m&&minutes(b.end)>m);
  const next=list.find(b=>minutes(b.start)>m);
  return {now,next,m,list};
}
/** Lay out overlapping blocks into columns. */
function layout(list){
  const out=[];let cluster=[],clusterEnd=-1;
  const flush=()=>{
    if(!cluster.length)return;
    const cols=[];
    cluster.forEach(b=>{
      let ci=cols.findIndex(c=>minutes(c[c.length-1].end)<=minutes(b.start));
      if(ci<0){cols.push([b]);ci=cols.length-1;}else cols[ci].push(b);
      b._col=ci;
    });
    cluster.forEach(b=>{b._cols=cols.length;out.push(b);});
    cluster=[];
  };
  list.forEach(b=>{
    if(cluster.length&&minutes(b.start)>=clusterEnd){flush();clusterEnd=-1;}
    cluster.push(b);clusterEnd=Math.max(clusterEnd,minutes(b.end));
  });
  flush();
  return out;
}

  h[rid][itemId]=!h[rid][itemId];

function rStreak(rid){
  const total=rTotal(rid); if(!total)return 0;
  const need=Math.ceil(total*0.6);
  let n=0,d=berlinNow();
  for(let i=0;i<400;i++){
    const h=S.routineHistory[dkey(d)];
    const c=h&&h[rid]?Object.keys(h[rid]).length:0;
    if(c>=need)n++; else break;
    d=addDays(d,-1);
  }
  return n;
}

/* ---- drag & drop / resize on the time grid ---- */
let drag=null;
let dragEndedAt=0;
function calPointerDown(e){
  const blkEl=e.target.closest(".blk");
  const rzEl=e.target.closest(".rz");
  if(!blkEl)return;
  const dayEl=blkEl.closest(".daycol");if(!dayEl)return;
  const id=blkEl.dataset.blk,dk=blkEl.dataset.dk;
  if(!id)return;
  const b=occursOn(S.blocks.find(x=>x.id===id),dk); if(!b)return;
  e.preventDefault();
  drag={
    id,dk,el:blkEl,mode:rzEl?"resize":"move",
    startY:e.clientY,startX:e.clientX,
    origStart:minutes(b.start),origEnd:minutes(b.end),
    moved:false,
    colW:dayEl.getBoundingClientRect().width,
    days:$$(".daycol").map(d=>({key:d.dataset.day,rect:d.getBoundingClientRect()}))
  };
  blkEl.classList.add("drag");
  blkEl.setPointerCapture?.(e.pointerId);
}

function calPointerUp(){
  if(!drag)return;
  const d=drag;drag=null;
  d.el.classList.remove("drag");d.el.style.opacity="";
  dragEndedAt=Date.now();
  if(!d.moved){ blockDlg(d.id,d.dk); return; }
  if(d.curStart==null){render();return;}
  const base=S.blocks.find(x=>x.id===d.id); if(!base){render();return;}
  const newStart=hhmm(d.curStart),newEnd=hhmm(d.curEnd);
  const targetDay=d.targetDay||d.dk;
  const commitOne=()=>{
    base.exceptions=base.exceptions||{};
    const cur=occursOn(base,d.dk)||{};
    if(targetDay!==d.dk){
      base.exceptions[d.dk]={deleted:true};
      S.blocks.push({id:uid(),created:Date.now(),title:cur.title,type:cur.type,notes:cur.notes||"",
        start:newStart,end:newEnd,date:targetDay,recurrence:null,exceptions:{},taskId:cur.taskId||null});
    } else {
      base.exceptions[d.dk]={...(base.exceptions[d.dk]||{}),start:newStart,end:newEnd};
    }
    save();render();
  };
  const commitAll=()=>{
    base.start=newStart;base.end=newEnd;
    if(base.recurrence&&targetDay!==d.dk){
      const from=dowIdx(parseKey(d.dk)),to=dowIdx(parseKey(targetDay));
      base.recurrence.days=(base.recurrence.days||[]).map(x=>x===from?to:x);
      base.recurrence.days=[...new Set(base.recurrence.days)].sort();
    }
    if(base.date)base.date=targetDay;
    save();render();
  };
  if(base.recurrence)seriesChoice("Verschieben",commitOne,commitAll);
  else commitAll();
}

        const title=n.title||n.content.split("\n")[0].slice(0,70);
        close();
        if(k==="task"){S.tasks.unshift({id:uid(),created:Date.now(),title,desc:n.content,status:"todo",cat:n.cat,prio:"medium",due:"",mins:0,tags:n.tags||[]});if(!keep)drop();save();go("tasks");}
        if(k==="learn"){S.growth.learnings.unshift({id:uid(),created:Date.now(),title,cat:n.cat,summary:"",body:n.content,source:"Eigene Notiz",status:"aktiv",tags:n.tags||[]});if(!keep)drop();save();go("growth",{tab:"learnings"});}
        if(k==="journal"){const j=journalFor(todayKey());j.free=(j.free?j.free+"\n\n":"")+n.content;if(!keep)drop();save();go("journal");}
        if(k==="block"){if(!keep)drop();save();blockDlg(null,todayKey(),{start:"09:00",end:"10:00"});}
        toast("Notiz umgewandelt.");
      });
    }});
}

   ============================================================ */
function habitDone(h,key){return !!(S.habitLog[key]&&S.habitLog[key][h.id]);}
function habitToggle(id){
  const k=todayKey();
  if(!S.habitLog[k])S.habitLog[k]={};
  if(S.habitLog[k][id])delete S.habitLog[k][id];else S.habitLog[k][id]=true;
  save();render();
}
function habitWeek(h){
  const s=startOfWeek(berlinNow());
  return Array.from({length:7},(_,i)=>{
    const k=dkey(addDays(s,i));
    return {k,done:habitDone(h,k),future:k>todayKey()};
  });
}

function habitDlg(id){
  const h=id?S.habits.find(x=>x.id===id):null;
  const d=h||{name:"",emoji:"◇",color:"#59c97f",freq:"daily",goal:1,active:true};
  modal({title:h?"Habit":"Neuer Habit",size:"slim",
    body:`<div class="field"><label>Name</label><input class="inp" name="name" value="${esc(d.name)}" autofocus></div>
      <div class="row2">
        <div class="field"><label>Icon</label><input class="inp" name="emoji" value="${esc(d.emoji)}" style="text-align:center"></div>
        <div class="field"><label>Farbe</label><input type="color" name="color" value="${d.color}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Rhythmus</label>${selHTML("freq",[{v:"daily",n:"Täglich"},{v:"weekly",n:"Pro Woche"}],d.freq)}</div>
        <div class="field"><label>Ziel</label><input class="inp" type="number" name="goal" min="1" max="7" value="${d.goal}"></div>
      </div>`,
    footer:`${h?`<button class="btn danger sm" data-del>Löschen</button>`:""}<div class="sp"></div>
      <button class="btn ghost" data-x>Abbrechen</button><button class="btn primary" data-ok>${h?"Speichern":"Anlegen"}</button>`,
    onMount(o,close){
      const g=k=>o.querySelector(`[name=${k}]`);
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-ok]").onclick=()=>{

        const obj={name,emoji:g("emoji").value.trim(),color:g("color").value,freq:g("freq").value,goal:+g("goal").value||1,active:true};
        if(h)Object.assign(h,obj);else S.habits.push({id:uid(),...obj});
        save();close();render();

        const i=S.habits.indexOf(h),copy={...h};
        S.habits.splice(i,1);save();close();render();

   ============================================================ */

function applyImport(data,mode){
  const inc=migrate(data);
  if(mode==="replace"){ S=inc; }
  else{
    const mergeArr=(a,b,key="id")=>{
      const seen=new Set(a.map(x=>x[key]));
      return a.concat(b.filter(x=>!seen.has(x[key])));
    };
    S.tasks=mergeArr(S.tasks,inc.tasks); S.notes=mergeArr(S.notes,inc.notes);
    S.blocks=mergeArr(S.blocks,inc.blocks); S.recipes=mergeArr(S.recipes,inc.recipes);
    S.habits=mergeArr(S.habits,inc.habits);
    ["learnings","courses","books","podcasts","videos"].forEach(k=>{S.growth[k]=mergeArr(S.growth[k],inc.growth[k]||[]);});
    const jSeen=new Set(S.journal.map(j=>j.date));
    S.journal=S.journal.concat((inc.journal||[]).filter(j=>!jSeen.has(j.date))).sort((a,b)=>b.date.localeCompare(a.date));
    Object.entries(inc.routineHistory||{}).forEach(([k,v])=>{if(!S.routineHistory[k])S.routineHistory[k]=v;});
    Object.entries(inc.habitLog||{}).forEach(([k,v])=>{if(!S.habitLog[k])S.habitLog[k]=v;});
  }
  save();render();
}

/* keyboard: Cmd/Ctrl+K and Escape only — nothing that would block copy & paste */
document.addEventListener("keydown",e=>{
  // Enter or Space on a focusable card behaves like a click
  if((e.key==="Enter"||e.key===" ")&&e.target!==document.body){
    const el=e.target;
    if(el.matches('[tabindex="0"]')&&!el.matches("input,textarea,select,button,a")){
      e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}));return;
    }
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"&&S.settings.cmdk){
    e.preventDefault();openSearch();return;}
  if(e.key==="Escape"&&modalStack.length){modalStack[modalStack.length-1]();}
});

function effectiveTheme(){
  const t=S.settings.theme||"auto";
  if(t!=="auto")return t;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function applyTheme(){
  const t=effectiveTheme();
  document.documentElement.setAttribute("data-theme",t);
  const btn=$("#btnTheme");
  if(btn)btn.innerHTML=ic(t==="dark"?"sun":"moon");
}
function cycleTheme(){
  const order=["auto","light","dark"];
  const cur=S.settings.theme||"auto";
  S.settings.theme=order[(order.indexOf(cur)+1)%3];
  applyTheme();save();
  toast(`Darstellung: ${({auto:"automatisch",light:"hell",dark:"dunkel"})[S.settings.theme]}`);
  if(route.view==="settings")render();
}

/* ============================================================
   PWA — real manifest, injected at runtime. No service worker,
   so this is an installable shell, not an offline app.
   ============================================================ */
function installManifest(){
  try{
    const icon="data:image/svg+xml,"+encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1cb389"/><stop offset="1" stop-color="#6c7bd9"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#g)"/><path d="M256 108 404 256 256 404 108 256z" fill="#fff"/><path d="M256 176 336 256 256 336 176 256z" fill="#1cb389"/></svg>`);
    const mf={
      name:"Life OS",short_name:"Life OS",
      description:"Persönliches Betriebssystem für Tag, Aufgaben, Kalender, Haushalt und Wissen.",
      start_url:".",scope:".",display:"standalone",orientation:"portrait-primary",
      background_color:"#f5f7f5",theme_color:"#14a07a",lang:"de",
      icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]
    };
    const url=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
    const link=document.createElement("link");
    link.rel="manifest";link.href=url;
    document.head.appendChild(link);
  }catch(e){/* manifests need an http(s) origin; harmless when opened from a file */}
}
const IS_STANDALONE=()=>window.matchMedia?.("(display-mode: standalone)").matches||window.navigator.standalone===true;

function openSearch(){
  let cur=0;
  return modal({title:"",body:"",onMount(o,close){
    const mod=o.querySelector(".modal");
    mod.innerHTML=`<div style="display:flex;align-items:center;padding-left:20px">
        <span style="color:var(--text-faint)">${ic("search")}</span>
        <input class="srch-in" id="sq" placeholder="Alles durchsuchen …" autocomplete="off" aria-label="Suche">
      </div><div class="srch-res" id="sr"></div>`;
    const inp=mod.querySelector("#sq"),res=mod.querySelector("#sr");
    let items=[];
    const draw=()=>{
      items=searchAll(inp.value);
      if(!inp.value.trim()){
        res.innerHTML=`<div style="padding:18px 16px;font-size:13.5px;color:var(--text-muted);line-height:1.6">
          Durchsucht Aufgaben, Notizen, Journal, Rezepte, Learnings, Bücher, Haushalt und Zeitblöcke.</div>`;return;}
      if(!items.length){
        res.innerHTML=`<div style="padding:18px 16px;font-size:13.5px;color:var(--text-muted)">Nichts gefunden für „${esc(inp.value)}“.</div>`;return;}
      cur=clamp(cur,0,items.length-1);
      res.innerHTML=items.map((r,i)=>`<div class="sres ${i===cur?"cur":""}" data-i="${i}">
        <span class="e">${ic(r.e)}</span><span class="t">${esc(r.t)}</span><span class="k">${r.k}</span></div>`).join("");
      res.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{close();items[+el.dataset.i].go();});
    };
    inp.oninput=()=>{cur=0;draw();};
    inp.onkeydown=e=>{
      if(e.key==="ArrowDown"){e.preventDefault();cur=Math.min(cur+1,items.length-1);draw();res.querySelector(".cur")?.scrollIntoView({block:"nearest"});}
      else if(e.key==="ArrowUp"){e.preventDefault();cur=Math.max(cur-1,0);draw();res.querySelector(".cur")?.scrollIntoView({block:"nearest"});}
      else if(e.key==="Enter"&&items[cur]){close();items[cur].go();}
      else if(e.key==="Escape")close();
    };
    draw();setTimeout(()=>inp.focus(),40);
  }});
}

function renderNow(){
  const {now,next,m}=currentBlock();
  if(!now){
    return `<div class="now idle" id="nowBlock">
      <div class="now-k">Gerade</div>
      <div class="now-title" style="margin-top:12px;font-size:24px">Nichts geplant</div>

      <div class="now-next">${next
        ? `<span class="dot" style="background:${btype(next.type).color}"></span>
           <span>Als Nächstes <b>${esc(next.title)}</b> um ${next.start}</span>`
        : `<span>Der Rest des Tages ist frei.</span>`}</div>
    </div>`;
  }
  const c=btype(now.type).color;
  const total=minutes(now.end)-minutes(now.start);
  const done=clamp((m-minutes(now.start))/total,0,1);
  const left=minutes(now.end)-m;
  const leftTxt=left>=60?`${Math.floor(left/60)} h ${left%60?left%60+" min":""}`.trim():`${left} min`;
  return `<div class="now" id="nowBlock" style="--nowc:${c}">
    <div class="now-k">Gerade</div>
    <div class="now-time">${now.start} – ${now.end}</div>

    <div class="now-note">noch ${leftTxt}${now.notes?" · "+esc(now.notes):""}</div>
    <div class="now-bar"><i style="width:${(done*100).toFixed(1)}%"></i></div>
    <div class="now-next">${next
      ? `<span>Danach <b>${esc(next.title)}</b> · ${next.start}</span>`
      : `<span>Danach ist der Tag offen.</span>`}</div>
  </div>`;
}

function sparkHTML(vals,color,h=44){
  if(!vals.length)return"";
  const w=Math.max(vals.length*14,80),max=Math.max(1,...vals);
  const bw=w/vals.length;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    ${vals.map((v,i)=>{
      const bh=Math.max(2,v/max*(h-4));
      return `<rect x="${(i*bw+bw*0.18).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw*0.64).toFixed(1)}"
        height="${bh.toFixed(1)}" rx="${Math.min(3,bw*0.3).toFixed(1)}" fill="${color}" opacity="${v?1:.22}"/>`;}).join("")}
  </svg>`;
}
function viewInsights(){
  const days=Array.from({length:14},(_,i)=>dkey(addDays(berlinNow(),-13+i)));

  const eVals=days.map(k=>{const h=S.routineHistory[k];return h?Object.keys(h.evening||{}).length:0;});
  const tVals=days.map(k=>S.tasks.filter(t=>t.completedAt&&dkey(new Date(t.completedAt))===k).length);
  const jVals=days.map(k=>{const j=S.journal.find(x=>x.date===k);return j&&!isEmptyEntry(j)?(j.mood||3):0;});
  const hVals=days.map(k=>Object.keys(S.habitLog[k]||{}).length);

  const jAll=S.journal.filter(j=>!isEmptyEntry(j));
  const avg=f=>{const v=jAll.filter(x=>x[f]).slice(0,30);return v.length?(v.reduce((a,b)=>a+b[f],0)/v.length).toFixed(1):"–";};
  const doneTotal=S.tasks.filter(t=>t.status==="done").length;
  const sessions=[];let k=curSession();
  for(let i=0;i<10;i++){if(k<=todayKey())sessions.push(k);k=shiftSession(k,-1);}

  const card=(title,val,sub,vals,color)=>`

      <div class="c4">${card("Morgenroutine",`${rStreak("morning")}`,"Tage in Folge",mVals,"var(--coral)")}</div>

document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);
  if(hit('[data-act="toggle-theme"]')){cycleTheme();return;}

  const ts=hit("[data-themeset]");
  if(ts){S.settings.theme=ts.dataset.themeset;applyTheme();save();render();return;}

  if(hit("[data-cleanblk]")){go("cleaning");return;}
  if(hit("[data-cleanon]")){S.cleaning.enabled=true;save();render();return;}
},false);

/* ============================================================
   HOME RESET — engine
   ============================================================ */
const C_=()=>S.cleaning;
const person=id=>C_().people.find(p=>p.id===id)||{id:"",name:"—",color:"#888"};
const zone=id=>C_().zones.find(z=>z.id===id)||{id:"",name:"—",emoji:"",ownerId:""};
const zoneOwner=t=>zone(t.zoneId).ownerId;

function cleanSessionOn(key){ return dowIdx(parseKey(key))===(C_()?.schedule?.weekday??5); }
function nextSessionKey(from){
  let d=parseKey(from||todayKey());
  for(let i=0;i<8;i++){ if(cleanSessionOn(dkey(d)))return dkey(d); d=addDays(d,1); }
  return todayKey();
}
function prevSessionKey(from){
  let d=addDays(parseKey(from||todayKey()),-1);
  for(let i=0;i<8;i++){ if(cleanSessionOn(dkey(d)))return dkey(d); d=addDays(d,-1); }
  return null;
}
const shiftSession=(key,dir)=>dkey(addDays(parseKey(key),7*dir));
let cleanDate=null, cleanTab="reset", cleanWho="";
const curSession=()=>cleanDate||(cleanDate=nextSessionKey());

/** Deep-clean tasks only run in the first session of a month. */
function cleanTaskDue(t,key){
  if(t.level==="deep")return parseKey(key).getDate()<=7;
  return true;
}
function cleanStatus(id,key){ return C_().log?.[key]?.[id]?.status||null; }
const cleanDone=(id,key)=>cleanStatus(id,key)==="done";
function cleanSet(id,key,status){
  const L=C_().log; if(!L[key])L[key]={};
  if(!status)delete L[key][id];
  else L[key][id]={status,at:Date.now()};
  save();
}
function cleanCycle(id,key){
  const cur=cleanStatus(id,key);
  cleanSet(id,key,cur==="done"?null:"done");
}
function flagReview(id,key){
  const R=C_().reviews; if(!R[key])R[key]={};
  if(R[key][id])delete R[key][id]; else R[key][id]=true;
  save();
}
const isFlagged=(id,key)=>!!C_().reviews?.[key]?.[id];

function tasksForSession(key,ownerId,level){
  return C_().tasks.filter(t=>cleanTaskDue(t,key)
    &&(!ownerId||zoneOwner(t)===ownerId)
    &&(!level||t.level===level));
}
function groupedForPerson(personId,key){
  const zones=C_().zones.filter(z=>z.ownerId===personId).sort((a,b)=>(a.order||0)-(b.order||0));
  return zones.map(z=>({zone:z,tasks:C_().tasks.filter(t=>t.zoneId===z.id&&cleanTaskDue(t,key))
    .sort((a,b)=>(a.level==="deep")-(b.level==="deep"))}))
    .filter(g=>g.tasks.length);
}
function cleanProgress(key,personId,level){
  const k=key||curSession();
  if(!C_()||!C_().enabled)return{done:0,total:0,pct:0,mins:0,minsTotal:0};
  const all=tasksForSession(k,personId,level);
  const done=all.filter(t=>cleanDone(t.id,k));
  return{done:done.length,total:all.length,pct:all.length?done.length/all.length:0,
    mins:all.filter(t=>!cleanDone(t.id,k)).reduce((s,t)=>s+(t.mins||0),0),
    minsTotal:all.reduce((s,t)=>s+(t.mins||0),0)};
}
const cleanOpenCount=()=>{const p=cleanProgress();return p.total-p.done;};

function balanceFor(key){
  const P=C_().people;
  const load=P.map(p=>({p,min:cleanProgress(key,p.id).minsTotal}));
  const max=Math.max(...load.map(l=>l.min),1),min=Math.min(...load.map(l=>l.min));
  const spread=(max-min)/max;
  return{load,spread,
    level:spread<=0.12?"good":spread<=0.28?"mid":"bad",
    label:spread<=0.12?"Ausgeglichen":spread<=0.28?"Leicht ungleich":"Sollte angepasst werden"};
}
function overdueTasks(){
  const out=[];const since=C_().firstRun||todayKey();
  let k=prevSessionKey(todayKey());
  // only the last two sessions, and only ones the household actually lived through
  for(let i=0;i<2&&k;i++){
    if(k<since)break;
    // a session nobody ever opened is not "missed", it simply never happened
    if(C_().log[k]||C_().sessions[k]){
      tasksForSession(k).forEach(t=>{
        const st=cleanStatus(t.id,k);
        if(st!=="done")out.push({task:t,key:k,status:st,catchUp:dkey(addDays(parseKey(k),1))});
      });
    }
    k=prevSessionKey(k);
  }
  return out;
}
/* ---- rotation: stable for four weeks, then offered ---- */
function rotationDue(){
  const R=C_().rotation||{};
  if(R.dismissedUntil&&todayKey()<R.dismissedUntil)return false;
  if(!R.lastRotated)return daysBetween(C_().firstRun||todayKey(),todayKey())>=28;
  return daysBetween(R.lastRotated,todayKey())>=28;
}
function rotateZones(){
  const P=C_().people;
  if(P.length<2)return;
  const ids=P.map(p=>p.id);
  C_().zones.forEach(z=>{
    const i=ids.indexOf(z.ownerId);
    z.ownerId=ids[(i+1)%ids.length];
  });
  C_().rotation={lastRotated:todayKey(),dismissedUntil:null};
  save();render();
  toast("Zuständigkeiten getauscht.",()=>{
    C_().zones.forEach(z=>{const i=ids.indexOf(z.ownerId);z.ownerId=ids[(i-1+ids.length)%ids.length];});
    C_().rotation.lastRotated=null;save();render();});
}
/* ---- session timer ---- */
function sessionTimer(key){ return C_().sessions?.[key]||null; }
function startSession(key){
  if(!C_().sessions)C_().sessions={};
  C_().sessions[key]={startedAt:Date.now(),endedAt:null};save();render();
}
function endSession(key){
  const s=sessionTimer(key); if(!s)return;
  s.endedAt=Date.now();save();render();
  const p=cleanProgress(key);
  toast(`Durchgang beendet · ${p.done} von ${p.total} erledigt.`);
}
function fmtDur(ms){
  const m=Math.floor(ms/60000),h=Math.floor(m/60);
  return h?`${h}:${String(m%60).padStart(2,"0")}`:`${m} min`;
}
/* ---- daily ten-minute reset ---- */
function dailyDone(personId,itemId,key){ return !!C_().dailyLog?.[key||todayKey()]?.[personId]?.[itemId]; }
function dailyToggle(personId,itemId){
  const k=todayKey(),L=C_().dailyLog;
  if(!L[k])L[k]={};
  if(!L[k][personId])L[k][personId]={};
  if(L[k][personId][itemId])delete L[k][personId][itemId]; else L[k][personId][itemId]=true;
  save();
}
function dailyPct(personId){
  const items=C_().daily.items;
  const done=items.filter(i=>dailyDone(personId,i.id)).length;
  return items.length?done/items.length:0;
}
/* ---- history and reliability ---- */
function pastSessions(n=12){
  const out=[];let k=prevSessionKey(todayKey());
  if(cleanSessionOn(todayKey()))out.push(todayKey());
  while(k&&out.length<n){out.push(k);k=prevSessionKey(k);}
  // never count sessions from before the household started using the app
  const since=C_().firstRun||"0000-00-00";
  return out.filter(x=>x>=since||C_().log[x]);
}
function reliability(personId,n=8){
  const sess=pastSessions(n).filter(k=>k<=todayKey());
  let done=0,total=0,mins=0,counted=0;
  sess.forEach(k=>{
    const p=cleanProgress(k,personId);
    if(!p.total)return;
    done+=p.done;total+=p.total;mins+=p.minsTotal-p.mins;counted++;
  });
  return{done,total,rate:total?done/total:0,avgMin:counted?Math.round(mins/counted):0,sessions:counted};
}
function statsRange(personId,fromKey){
  const sess=pastSessions(30).filter(k=>k>=fromKey&&k<=todayKey());
  let done=0,mins=0;
  sess.forEach(k=>{
    tasksForSession(k,personId).forEach(t=>{
      if(cleanDone(t.id,k)){done++;mins+=t.mins||0;}
    });
  });
  return{done,mins,sessions:sess.length};
}
/* ---- supplies ---- */
function supplyStatus(s){
  if(s.qty<=0)return{k:"buy",label:"Kaufen",color:"var(--danger)",soft:"var(--danger-soft)"};
  if(s.qty<=s.min)return{k:"low",label:"Wird knapp",color:"var(--warning)",soft:"var(--warning-soft)"};
  return{k:"ok",label:"Vorrätig",color:"var(--success)",soft:"var(--success-soft)"};
}
function supplyBump(id,d){
  const s=C_().supplies.find(x=>x.id===id); if(!s)return;
  s.qty=Math.max(0,(s.qty||0)+d);
  if(d>0)s.lastBought=todayKey();
  save();render();
}
/* ---- sparse suggestions ---- */
function microSuggestions(){
  const out=[],key=curSession(),d=daysBetween(todayKey(),key);
  if(d===1)out.push({ic:"clock",t:`Der Home Reset ist morgen um ${C_().schedule.time}.`});
  const low=C_().supplies.filter(s=>supplyStatus(s).k!=="ok");
  if(low.length)out.push({ic:"food",t:`${low.length} ${low.length===1?"Artikel geht":"Artikel gehen"} zur Neige: ${low.slice(0,3).map(s=>s.name).join(", ")}.`,go:"supplies"});
  const sponge=C_().supplies.find(s=>/schwamm/i.test(s.name));
  if(sponge&&sponge.lastBought&&daysBetween(sponge.lastBought,todayKey())>45)
    out.push({ic:"clean",t:"Die Küchenschwämme sind seit über sechs Wochen im Einsatz."});
  const filterTask=C_().tasks.find(t=>/sieb/i.test(t.title));
  const lived=pastSessions(8).filter(k=>k<=todayKey()&&(C_().log[k]||C_().sessions[k]));
  if(filterTask&&lived.length>=2&&!lived.some(k=>cleanDone(filterTask.id,k)))
    out.push({ic:"lightbulb",t:"Das Spülmaschinensieb wurde in den letzten Durchgängen nicht abgehakt.",guide:"spuelmaschine"});
  return out.slice(0,2);
}

function ensureV3(st){
  if(!st||typeof st!=="object")return st;
  st.settings=st.settings||{};
  if(!st.settings.theme)st.settings.theme="auto";
  if(!st.settings.logo)st.settings.logo="💠";
  const C=st.cleaning;
  if(!C||!Array.isArray(C.zones)||!Array.isArray(C.tasks)||!C.tasks.length||!C.tasks[0].zoneId)
    st.cleaning=defaultCleaning();
  const c=st.cleaning;
  c.log=c.log||{}; c.reviews=c.reviews||{}; c.sessions=c.sessions||{}; c.dailyLog=c.dailyLog||{};
  c.rotation=c.rotation||{lastRotated:null,dismissedUntil:null};
  c.supplies=c.supplies||defaultCleaning().supplies;
  c.daily=c.daily||defaultCleaning().daily;
  c.schedule=c.schedule||{weekday:5,time:"11:00"};
  if(!c.firstRun)c.firstRun=todayKey();

    st.settings.blockTypes.push({id:"cleaning",name:"Haushalt",color:"#3d9bd8"});

    st.settings.categories.push({id:"cleaning",name:"Haushalt & Pflege",emoji:"🧽",color:"#3d9bd8"});
  return st;
}

/* ============================================================
   SYNC — private GitHub Gist as the shared store.
   No server, works in every browser including iOS Safari.
   The token lives in IndexedDB only and never enters the
   exported JSON, so backups can be shared without leaking it.
   ============================================================ */
const SYNC={
  token:null, gistId:null, file:"life-os-data.json",
  state:"off",          // off | idle | pulling | pushing | conflict | error
  lastPull:0, lastPush:0, baseRev:0, lastError:"",
  device:null, busy:false, pending:false
};
const SYNC_LABEL={off:"Sync aus",idle:"Synchronisiert",pulling:"Lädt …",pushing:"Überträgt …",
  conflict:"Konflikt",error:"Sync-Fehler"};

async function syncLoadCreds(){
  try{
    const c=await idbGet("sync");
    if(c&&c.token){SYNC.token=c.token;SYNC.gistId=c.gistId||null;SYNC.baseRev=c.baseRev||0;}
    let dev=await idbGet("device");
    if(!dev){dev=uid();await idbSet("device",dev);}
    SYNC.device=dev;
  }catch(e){SYNC.device=SYNC.device||uid();}
}
async function syncSaveCreds(){
  try{await idbSet("sync",{token:SYNC.token,gistId:SYNC.gistId,baseRev:SYNC.baseRev});}catch(e){}
}
async function syncForget(){
  SYNC.token=null;SYNC.gistId=null;SYNC.baseRev=0;SYNC.state="off";
  try{await idbDel("sync");}catch(e){}
  setSave(fileHandle?"saved":"off");
  render();
}
const syncOn=()=>!!(SYNC.token&&SYNC.gistId);

async function gh(path,opts={}){
  const r=await fetch("https://api.github.com"+path,{
    ...opts,
    headers:{
      "Authorization":"Bearer "+SYNC.token,
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28",
      ...(opts.body?{"Content-Type":"application/json"}:{})
    }
  });
  if(!r.ok){
    const txt=await r.text().catch(()=>"");
    const e=new Error(`GitHub ${r.status}: ${txt.slice(0,160)}`);
    e.status=r.status;throw e;
  }
  return r.json();
}
/** Strip anything that must never leave the device. */
function syncPayload(){
  const copy=JSON.parse(JSON.stringify(S));
  copy.meta={...copy.meta,rev:(copy.meta.rev||0),device:SYNC.device,updated:new Date().toISOString()};
  return copy;
}
function payloadSize(){
  try{return new Blob([JSON.stringify(S)]).size;}catch(e){return JSON.stringify(S).length;}
}

async function syncConnect(token){
  SYNC.token=token.trim();
  setSyncState("pulling");
  try{
    const me=await gh("/user");
    // reuse an existing Life OS gist if there is one
    const list=await gh("/gists?per_page=100");
    const found=list.find(g=>g.files&&g.files[SYNC.file]);
    if(found){
      SYNC.gistId=found.id;
      await syncSaveCreds();
      await syncPull(true);
      toast(`Verbunden als ${me.login}. Vorhandene Daten geladen.`);
    }else{
      const body={description:"Life OS – persönliche Daten",public:false,
        files:{[SYNC.file]:{content:JSON.stringify({...syncPayload(),meta:{...S.meta,rev:1}},null,2)}}};
      const g=await gh("/gists",{method:"POST",body:JSON.stringify(body)});
      SYNC.gistId=g.id;SYNC.baseRev=1;S.meta.rev=1;
      await syncSaveCreds();
      toast(`Verbunden als ${me.login}. Neuer privater Gist angelegt.`);
    }
    setSyncState("idle");render();
  }catch(e){
    SYNC.token=null;SYNC.lastError=e.message;setSyncState("error");
    toast(e.status===401?"Token wurde abgelehnt. Stimmt der Scope „gist“?":"Verbindung fehlgeschlagen: "+e.message);
    render();
  }
}

async function readRemote(){
  const g=await gh("/gists/"+SYNC.gistId);
  const f=g.files&&g.files[SYNC.file];
  if(!f)throw new Error("Datei im Gist nicht gefunden");
  let txt=f.content;
  if(f.truncated||txt==null){ txt=await (await fetch(f.raw_url)).text(); }
  return JSON.parse(txt);
}

async function syncPull(force){
  if(!syncOn())return false;
  setSyncState("pulling");
  try{
    const remote=await readRemote();
    const rRev=remote.meta?.rev||0;
    const localDirty=(S.meta?.rev||0)!==SYNC.baseRev||saveState==="dirty";
    if(force||rRev>SYNC.baseRev){
      if(localDirty&&!force&&rRev>SYNC.baseRev&&S.meta?.rev>SYNC.baseRev){
        openConflict(remote);return false;
      }
      S=migrate(remote);
      SYNC.baseRev=rRev;S.meta.rev=rRev;
      await syncSaveCreds();
      try{await idbSet("state",S);}catch(e){}
      SYNC.lastPull=Date.now();
      setSyncState("idle");render();
      return true;
    }
    SYNC.lastPull=Date.now();setSyncState("idle");
    return false;
  }catch(e){
    SYNC.lastError=e.message;setSyncState("error");return false;
  }
}

async function syncPush(){
  if(!syncOn())return;
  if(SYNC.busy){SYNC.pending=true;return;}
  SYNC.busy=true;setSyncState("pushing");
  try{
    const remote=await readRemote().catch(()=>null);
    const rRev=remote?.meta?.rev||0;
    if(rRev>SYNC.baseRev){
      SYNC.busy=false;openConflict(remote);return;
    }
    const next=rRev+1;
    S.meta.rev=next;
    const body={files:{[SYNC.file]:{content:JSON.stringify(syncPayload(),null,2)}}};
    await gh("/gists/"+SYNC.gistId,{method:"PATCH",body:JSON.stringify(body)});
    SYNC.baseRev=next;SYNC.lastPush=Date.now();
    await syncSaveCreds();
    setSyncState("idle");
  }catch(e){
    SYNC.lastError=e.message;setSyncState("error");
  }finally{
    SYNC.busy=false;
    if(SYNC.pending){SYNC.pending=false;setTimeout(syncPush,400);}
  }
}
const syncPushSoon=debounce(()=>{if(syncOn())syncPush();},2500);

function setSyncState(s){
  SYNC.state=s;
  const el=$("#syncPill");
  if(el){
    el.className="syncpill "+s;
    el.querySelector("span:last-child").textContent=SYNC_LABEL[s]||s;
  }
  if(route.view==="settings"&&(s==="idle"||s==="error")){
    const box=$("#syncBox"); if(box)box.outerHTML=syncPanelHTML();
  }
}

/* ---------- conflict resolution ---------- */
function mergeStates(a,b){
  // a = local, b = remote. Records merge by id, newest wins where we can tell.
  const out=JSON.parse(JSON.stringify(b));
  const byId=(x,y)=>{
    const m=new Map();
    [...(y||[]),...(x||[])].forEach(r=>{
      const prev=m.get(r.id);
      if(!prev)m.set(r.id,r);
      else{
        const ta=r.completedAt||r.created||0, tb=prev.completedAt||prev.created||0;
        m.set(r.id, ta>=tb?r:prev);
      }
    });
    return [...m.values()];
  };
  ["tasks","notes","blocks","recipes","habits"].forEach(k=>{out[k]=byId(a[k],b[k]);});
  ["learnings","courses","books","podcasts","videos"].forEach(k=>{
    out.growth[k]=byId(a.growth?.[k],b.growth?.[k]);});
  // journal: one entry per day, keep the longer one
  const jm=new Map();
  [...(b.journal||[]),...(a.journal||[])].forEach(j=>{
    const p=jm.get(j.date);
    const len=o=>JSON.stringify(o).length;
    if(!p||len(j)>len(p))jm.set(j.date,j);
  });
  out.journal=[...jm.values()].sort((x,y)=>y.date.localeCompare(x.date));
  // tick logs: union, because two devices ticking different boxes should both count
  const unionLog=(x,y,depth)=>{
    const o={...(y||{})};
    Object.entries(x||{}).forEach(([k,v])=>{
      o[k]=depth>1&&o[k]&&typeof v==="object"?unionLog(v,o[k],depth-1):{...(o[k]||{}),...v};
    });
    return o;
  };
  out.routineHistory=unionLog(a.routineHistory,b.routineHistory,2);
  out.habitLog=unionLog(a.habitLog,b.habitLog,1);
  if(a.cleaning&&b.cleaning){
    out.cleaning.log=unionLog(a.cleaning.log,b.cleaning.log,1);
    out.cleaning.reviews=unionLog(a.cleaning.reviews||{},b.cleaning.reviews||{},1);
    out.cleaning.tasks=byId(a.cleaning.tasks,b.cleaning.tasks);
    out.cleaning.supplies=byId(a.cleaning.supplies,b.cleaning.supplies);
  }
  return out;
}

        <div class="stat"><div class="l">Cloud</div>
          <div class="meta" style="margin-top:6px">${when(remote)}</div>

      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="qitem" data-res="merge"><span class="e">${ic("link")}</span>
          <span><span class="n">Zusammenführen</span><br><span class="d">Einträge aus beiden Seiten behalten, Häkchen vereinen</span></span></button>
        <button class="qitem" data-res="local"><span class="e">${ic("upload")}</span>
          <span><span class="n">Dieses Gerät gewinnt</span><br><span class="d">Die Cloud wird überschrieben</span></span></button>
        <button class="qitem" data-res="remote"><span class="e">${ic("download")}</span>
          <span><span class="n">Cloud gewinnt</span><br><span class="d">Lokale Änderungen dieses Geräts gehen verloren</span></span></button>
      </div>`,
    onMount(o,close){
      o.querySelectorAll("[data-res]").forEach(b=>b.onclick=async()=>{
        const mode=b.dataset.res;close();
        if(mode==="merge")S=migrate(mergeStates(local,remote));
        else if(mode==="remote")S=migrate(remote);
        SYNC.baseRev=remote.meta?.rev||0;
        S.meta.rev=SYNC.baseRev;
        await syncSaveCreds();
        render();
        await syncPush();
        toast(mode==="merge"?"Zusammengeführt und hochgeladen."
          :mode==="local"?"Cloud überschrieben.":"Cloud-Version übernommen.");
      });
    }});
}

function searchAll(q){
  q=q.trim().toLowerCase(); if(!q)return[];
  const out=[];const hit=s=>String(s||"").toLowerCase().includes(q);
  S.tasks.forEach(t=>{if(hit(t.title)||hit(t.desc))out.push({e:"tasks",t:t.title,k:"Aufgabe",go:()=>{go("tasks");taskDlg(t.id);}});});
  S.notes.forEach(n=>{if(hit(n.title)||hit(n.content))out.push({e:"note",t:n.title||n.content.slice(0,50),k:"Notiz",go:()=>{go("notes");noteDlg(n.id);}});});
  S.journal.forEach(j=>{if(hit([j.free,j.gratitude,j.good,j.hard,j.learned].join(" ")))
    out.push({e:"journal",t:fmtDateLong(j.date),k:"Journal",go:()=>go("journal",{date:j.date})});});
  S.recipes.forEach(r=>{if(hit(r.title)||hit(r.ingredients))out.push({e:"food",t:r.title,k:"Rezept",go:()=>{go("food");recipeView(r.id);}});});
  S.growth.learnings.forEach(l=>{if(hit(l.title)||hit(l.summary)||hit(l.body))out.push({e:"growth",t:l.title,k:"Learning",go:()=>{go("growth",{tab:"learnings"});learningView(l.id);}});});
  S.growth.books.forEach(b=>{if(hit(b.title)||hit(b.author))out.push({e:"book",t:b.title,k:"Buch",go:()=>{go("growth",{tab:"books"});bookDlg(b.id);}});});
  S.growth.courses.forEach(c=>{if(hit(c.title))out.push({e:"monitor",t:c.title,k:"Kurs",go:()=>go("growth",{tab:"courses"})});});
