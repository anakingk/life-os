/* ================= ROUTINES ================= */
let rtShow=berlinNow().getHours()<14?"morning":"evening";
function rtStats(rid){
  const R=S.routines[rid],h=(rHist(todayKey())[rid])||{};
  const items=R.items.filter(i=>i.active);
  const done=items.filter(i=>h[i.id]);
  const withD=items.filter(i=>+i.duration>0);
  const total=withD.reduce((s,i)=>s+ +i.duration,0);
  const doneMin=done.filter(i=>+i.duration>0).reduce((s,i)=>s+ +i.duration,0);
  return{R,h,items,n:items.length,done:done.length,total,doneMin,open:total-doneMin,missing:items.length-withD.length};
}
function rtSubText(s){
  if(!s.n)return"Noch keine Schritte";
  if(s.done===s.n)return"Komplett für heute ✓";
  if(!s.total)return`${s.n-s.done} offen · Dauer im Bearbeiten-Dialog eintragen`;
  return`${s.doneMin} Min. erledigt · ${s.open} Min. offen${s.missing?` · ${s.missing} ohne Dauer`:""}`;
}

    <div class="rt2-head">

/** update one card in place — no re-render, so nothing moves */
function rtPaint(rid){
  const card=document.querySelector(`.rt2-card[data-routine="${rid}"]`);if(!card)return;
  const s=rtStats(rid);
  card.querySelector("[data-rtdone]").textContent=s.done;
  card.querySelector("[data-rtbar]").style.width=((s.n?s.done/s.n:0)*100).toFixed(1)+"%";
  card.querySelector("[data-rtsub]").textContent=rtSubText(s);
  card.classList.toggle("complete",!!s.n&&s.done===s.n);
  const sw=document.querySelector(`[data-rtswc="${rid}"]`);if(sw)sw.textContent=`${s.done}/${s.n}`;
}
document.addEventListener("click",e=>{
  const it=e.target.closest(".rt2-item");
  if(it){
    e.preventDefault();e.stopPropagation();
    const rid=it.dataset.rt2,id=it.dataset.ri;
    rToggle(rid,id);
    const on=!!(rHist(todayKey())[rid]||{})[id];
    it.classList.toggle("done",on);it.setAttribute("aria-pressed",on?"true":"false");
    rtPaint(rid);
    return;
  }
  const sw=e.target.closest("[data-rtsw]");
  if(sw){
    rtShow=sw.dataset.rtsw;
    const w=sw.closest(".rt2-wrap");if(w)w.dataset.show=rtShow;
    sw.parentElement.querySelectorAll("[data-rtsw]").forEach(b=>b.classList.toggle("on",b===sw));
  }
},true);

/* ================= SORTABLE LISTS (goals, buckets) ================= */
const SORT_SRC={goals:()=>BU().goals,buckets:()=>BU().buckets};
function persistSort(list){
  const kind=list.dataset.sortlist,arr=SORT_SRC[kind]&&SORT_SRC[kind]();if(!arr)return;
  [...list.querySelectorAll("[data-sortid]")].forEach((el,k)=>{const o=arr.find(x=>x.id===el.dataset.sortid);if(o)o.order=k;});
  save();
}
function enhanceSortables(){
  const gc=document.querySelector(".goalcard2");
  const lists=[];
  if(gc){gc.parentElement.dataset.sortlist="goals";lists.push(gc.parentElement);}
  const bg=document.querySelector(".bucketgrid");
  if(bg){bg.dataset.sortlist="buckets";lists.push(bg);}
  lists.forEach(list=>{
    list.querySelectorAll(":scope > [data-bgoal], :scope > [data-bbucket]").forEach(el=>{
      el.dataset.sortid=el.dataset.bgoal||el.dataset.bbucket;
      if(el.querySelector("[data-sorth]"))return;
      const h=document.createElement("button");
      h.type="button";h.className="sort-h";h.dataset.sorth="1";
      h.setAttribute("aria-label","Verschieben — ziehen oder Pfeiltasten");
      h.innerHTML=ic("grip");
      (el.querySelector(".g-h")||el).prepend(h);
    });
    bindSortList(list);
  });
}
function bindSortList(list){
  list.querySelectorAll("[data-sorth]").forEach(h=>{
    h.addEventListener("keydown",e=>{
      if(e.key!=="ArrowUp"&&e.key!=="ArrowDown"&&e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
      e.preventDefault();
      const item=h.closest("[data-sortid]");
      const back=e.key==="ArrowUp"||e.key==="ArrowLeft";
      const sib=back?item.previousElementSibling:item.nextElementSibling;
      if(!sib||!sib.dataset.sortid)return;
      list.insertBefore(item,back?sib:sib.nextSibling);
      persistSort(list);h.focus();
    });
    h.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const item=h.closest("[data-sortid]");
      try{h.setPointerCapture(e.pointerId);}catch(x){}
      item.classList.add("sorting");list.classList.add("is-sorting");
      let raf=null;
      const move=ev=>{
        const others=[...list.querySelectorAll("[data-sortid]")].filter(x=>x!==item);
        let target=null,best=Infinity,before=true;
        others.forEach(x=>{
          const r=x.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
          const d=Math.hypot(ev.clientX-cx,ev.clientY-cy);
          if(d<best){best=d;target=x;
            before=ev.clientY<cy-r.height*0.22||(Math.abs(ev.clientY-cy)<=r.height*0.22&&ev.clientX<cx);}
        });
        if(target){
          const ref=before?target:target.nextSibling;
          if(ref!==item&&item.nextSibling!==ref)list.insertBefore(item,ref);
        }
        const vh=window.innerHeight;
        if(!raf&&(ev.clientY<70||ev.clientY>vh-110)){
          raf=requestAnimationFrame(()=>{raf=null;window.scrollBy(0,ev.clientY<70?-14:14);});
        }
      };
      const up=()=>{
        h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
        item.classList.remove("sorting");list.classList.remove("is-sorting");
        persistSort(list);
      };
      h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
    });
  });
}

/* ================= CALENDAR SWIPE ================= */
let calSwipeDir=0;
(function(){
  let s=null;
  document.addEventListener("touchstart",e=>{
    if(route.view!=="calendar"||e.touches.length!==1)return;
    const t=e.target;
    if(!t.closest(".grid-wrap")||t.closest(".blk,.adchip,button,input,select,textarea"))return;
    const wrap=t.closest(".grid-wrap");
    s={x:e.touches[0].clientX,y:e.touches[0].clientY,lock:null,wrap};
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!s)return;
    const dx=e.touches[0].clientX-s.x,dy=e.touches[0].clientY-s.y;
    if(!s.lock&&(Math.abs(dx)>12||Math.abs(dy)>12)){
      const canScrollX=calView==="week"&&s.wrap.scrollWidth>s.wrap.clientWidth+2;
      s.lock=Math.abs(dx)>Math.abs(dy)*1.5&&!canScrollX?"x":"y";
    }
    if(s.lock==="x")s.wrap.style.transform=`translateX(${(dx*0.35).toFixed(1)}px)`;
  },{passive:true});
  const end=e=>{
    if(!s)return;
    const t=e.changedTouches&&e.changedTouches[0];
    const dx=t?t.clientX-s.x:0,locked=s.lock==="x",wrap=s.wrap;s=null;
    wrap.style.transform="";
    if(locked&&Math.abs(dx)>70){calSwipeDir=dx<0?1:-1;calShift(calSwipeDir);}
  };
  document.addEventListener("touchend",end,{passive:true});
  document.addEventListener("touchcancel",end,{passive:true});
})();

function ensureV18(st){
  ensureV16(st);
  if(!Array.isArray(st.hobbies))st.hobbies=[];
  if(!Array.isArray(st.travel))st.travel=[];
  ["morning","evening"].forEach(r=>{
    const R=st.routines&&st.routines[r];if(!R)return;
    if(R.time===undefined)R.time=(st.settings.routines&&st.settings.routines[r]&&st.settings.routines[r].time)||"";
  });
  return st;
}
function ensureV2(st){return ensureV18(st);}
function repairState(st){
  REQUIRED_ARRAYS.forEach(k=>{if(!Array.isArray(st[k]))st[k]=[];});
  st.settings=st.settings||{};
  st.tasks=st.tasks.filter(t=>t&&typeof t==="object").map(t=>({...t,id:t.id||uid()}));
  st.blocks=st.blocks.filter(b=>b&&typeof b==="object"&&(b.date||b.recurrence)).map(b=>({...b,id:b.id||uid()}));
  st.birthdays=st.birthdays.filter(p=>p&&p.day>=1&&p.day<=31&&p.month>=1&&p.month<=12)
    .map(p=>({...p,id:p.id||uid(),gifts:Array.isArray(p.gifts)?p.gifts:[]}));
  ensureV18(st);
  st.schemaVersion=SCHEMA_VERSION;
  return st;
}

const timedOn=dk=>blocksFor(dk).filter(b=>!b.virtual&&!b.allDay);
function conflictsFor(dk,s,e,ignore){
  return timedOn(dk).filter(b=>!(ignore||[]).includes(b.id)&&minutes(b.start)<e&&minutes(b.end)>s);
}
function nextFreeSlot(dk,s,dur){
  const snap=S.settings.snap||15;
  for(let m=Math.ceil(s/snap)*snap;m+dur<=24*60;m+=snap)if(!conflictsFor(dk,m,m+dur).length)return m;

/* ---------- placing a template ---------- */
function newEventFromTpl(t,dk,s,e,extra){
  return{id:uid(),created:Date.now(),title:t.name,type:"event",icon:t.icon,color:t.color,solid:!!t.solid,
    tpl:t.id,origin:"tpl",start:hhmm(s),end:hhmm(Math.min(e,24*60-1)),date:dk,recurrence:null,
    exceptions:{},allDay:false,notes:"",taskId:null,...(extra||{})};
}
function placeTemplate(tplId,dk,startMin,durMin){
  const t=calTpl(tplId);if(!t)return;
  if(t.smart==="workday"){workdayChooser(dk);return;}
  const snap=S.settings.snap||15;
  const dur=Math.max(snap,durMin||t.dur||60);
  let s=clamp(Math.round(startMin/snap)*snap,0,24*60-snap);
  let e=Math.min(s+dur,24*60);
  const go=(a,b)=>calUndo(`${t.icon} ${t.name} · ${hhmm(a)}–${hhmm(b)} eingetragen.`,
    ()=>S.blocks.push(newEventFromTpl(t,dk,a,b)));
  const cf=conflictsFor(dk,s,e);
  if(!cf.length){go(s,e);return;}
  const free=nextFreeSlot(dk,s,dur)??nextFreeSlot(dk,0,dur);
  conflictDlg(cf,()=>go(s,e),free!=null?()=>go(free,free+dur):null,
    free!=null?`Nächste freie Zeit ${hhmm(free)}`:"");
}

/* ---------- smart workday ---------- */
const WD_ROLES={
  home:p=>[["work1",p.home.start,p.lunch.start],["lunch",p.lunch.start,p.lunch.end],["work2",p.lunch.end,p.home.end]],
  office:p=>{const c=p.office.commute||60,st=minutes(p.office.start),en=minutes(p.office.end);
    return[["to",hhmm(st-c),p.office.start],["work1",p.office.start,p.lunch.start],["lunch",p.lunch.start,p.lunch.end],
      ["work2",p.lunch.end,p.office.end],["back",p.office.end,hhmm(Math.min(en+c,24*60-1))]];}
};
function roleTpl(role){return role==="lunch"?calTpl("lunch"):role==="to"||role==="back"?calTpl("bvg"):calTpl("work");}
function roleTitle(role,t){return role==="to"?`${t.name} — Hinfahrt`:role==="back"?`${t.name} — Rückfahrt`:t.name;}
const isEdited=b=>!!b._sig&&(b.start!==b._sig.s||b.end!==b._sig.e||b.title!==b._sig.t||b.date!==b._sig.d);
const sigOf=b=>({s:b.start,e:b.end,t:b.title,d:b.date});
const workdayOn=dk=>S.blocks.find(b=>b.groupKind==="workday"&&b.date===dk);
const defaultMode=dk=>(CAL().prefs.officeDays||[]).includes(dowIdx(parseKey(dk)))?"office":"home";

function workdayChooser(dk){
  const def=defaultMode(dk),ex=workdayOn(dk),wd=DAYL[dowIdx(parseKey(dk))];
  modal({title:"",size:"slim",
    body:`<div class="wd-pop">
      <div class="eyebrow">${esc(relDay(dk))} · ${esc(fmtDate(dk))}</div>
      <h3>Wo arbeitest du ${dk===todayKey()?"heute":"an diesem Tag"}?</h3>
      ${ex?`<p class="meta" style="margin:-4px 0 12px">Für diesen Tag ist schon ein Arbeitstag eingetragen (${ex.workMode==="office"?"Office":"Homeoffice"}). Deine Wahl ändert ihn, statt einen zweiten anzulegen.</p>`:""}
      <div class="wd-opts">
        <button type="button" class="wd-opt ${def==="home"?"def":""}" data-wdm="home"><span>🏠</span><b>Homeoffice</b>
          <small>${CAL().prefs.home.start}–${CAL().prefs.home.end}</small></button>
        <button type="button" class="wd-opt ${def==="office"?"def":""}" data-wdm="office"><span>🏢</span><b>Office Berlin</b>
          <small>${CAL().prefs.office.start}–${CAL().prefs.office.end} + Fahrt</small></button>
      </div>
      <label class="check" style="margin-top:14px"><input type="checkbox" data-wdrem>
        <span style="font-size:13.5px">Als Standard für ${esc(wd)} merken</span></label>
    </div>`,
    footer:`<div class="sp"></div><button class="btn ghost" data-x>Abbrechen</button>`,
    onMount(o,close){
      o.querySelector("[data-x]").onclick=close;
      o.querySelectorAll("[data-wdm]").forEach(b=>b.onclick=()=>{
        const mode=b.dataset.wdm;
        if(o.querySelector("[data-wdrem]").checked){
          const d=dowIdx(parseKey(dk)),od=new Set(CAL().prefs.officeDays||[]);
          mode==="office"?od.add(d):od.delete(d);CAL().prefs.officeDays=[...od].sort();save();
        }
        close();
        const cur=workdayOn(dk);
        if(cur)switchWorkday(cur.group,mode);else createWorkday(dk,mode);
      });
    }});
}
function createWorkday(dk,mode){
  if(workdayOn(dk)){toast("Für diesen Tag steht schon ein Arbeitstag im Kalender.");return;}
  const p=CAL().prefs,group="wd_"+uid();
  const evs=WD_ROLES[mode](p).map(([role,s,e])=>{
    const t=roleTpl(role);
    const ev=newEventFromTpl(t,dk,minutes(s),minutes(e),{title:roleTitle(role,t),origin:"auto",group,groupKind:"workday",role,workMode:mode});
    ev._sig=sigOf(ev);return ev;
  });
  const ids=new Set(evs.map(x=>x.id));
  const cf=[];
  evs.forEach(ev=>conflictsFor(dk,minutes(ev.start),minutes(ev.end)).forEach(c=>{if(!ids.has(c.id)&&!cf.some(x=>x.id===c.id))cf.push(c);}));
  const go=()=>calUndo(`${mode==="office"?"🏢 Office-Tag":"🏠 Homeoffice-Tag"} eingetragen.`,()=>S.blocks.push(...evs));
  if(cf.length)conflictDlg(cf,go,null,"");else go();
}
function switchWorkday(group,mode){
  const blocks=S.blocks.filter(b=>b.group===group);if(!blocks.length)return;
  const dk=blocks[0].date,p=CAL().prefs;
  if(blocks[0].workMode===mode){toast(`Ist schon ${mode==="office"?"Office":"Homeoffice"}.`);return;}
  const want=WD_ROLES[mode](p),wantRoles=want.map(w=>w[0]);
  const touched=blocks.filter(b=>{
    const w=want.find(x=>x[0]===b.role);
    return w?(b.start!==w[1]||b.end!==w[2]):true;
  });
  const editedHit=touched.filter(isEdited);
  const apply=overwrite=>calUndo(`Auf ${mode==="office"?"🏢 Office":"🏠 Homeoffice"} umgestellt.`,()=>{
    want.forEach(([role,s,e])=>{
      const t=roleTpl(role),ex=S.blocks.find(b=>b.group===group&&b.role===role);
      if(ex){
        if(isEdited(ex)&&!overwrite){ex.workMode=mode;return;}
        Object.assign(ex,{start:s,end:e,title:roleTitle(role,t),workMode:mode});ex._sig=sigOf(ex);
      }else{
        const ev=newEventFromTpl(t,dk,minutes(s),minutes(e),{title:roleTitle(role,t),origin:"auto",group,groupKind:"workday",role,workMode:mode});
        ev._sig=sigOf(ev);S.blocks.push(ev);
      }
    });
    S.blocks=S.blocks.filter(b=>b.group!==group||wantRoles.includes(b.role)||(isEdited(b)&&!overwrite));
    S.blocks.filter(b=>b.group===group).forEach(b=>{b.workMode=mode;});
  });
  if(!editedHit.length){apply(true);return;}
  modal({title:"Angepasste Blöcke",size:"slim",
    body:`<p style="margin:0;line-height:1.65">Du hast ${editedHit.length===1?"diesen Block":"diese Blöcke"} selbst verändert:</p>
      ${editedHit.map(b=>`<div class="cf-row" style="--bcs:${evStyle(b).color}"><span>${evStyle(b).icon}</span><b>${esc(b.title)}</b>
        <span class="meta">${b.start}–${b.end}</span></div>`).join("")}
      <p class="meta" style="margin-top:12px">Sollen sie an den neuen Modus angepasst werden?</p>`,
    footer:`<button class="btn ghost" data-x>Abbrechen</button><div class="sp"></div>
      <button class="btn" data-keep>Meine Anpassungen behalten</button><button class="btn primary" data-over>Überschreiben</button>`,
    onMount(o,close){
      o.querySelector("[data-x]").onclick=close;
      o.querySelector("[data-keep]").onclick=()=>{close();apply(false);};
      o.querySelector("[data-over]").onclick=()=>{close();apply(true);};
    }});
}
function moveWorkday(group,toKey){
  const bl=S.blocks.filter(b=>b.group===group);if(!bl.length)return;
  if(workdayOn(toKey)&&workdayOn(toKey).group!==group){toast("Am Zieltag steht schon ein Arbeitstag.");return;}
  calUndo(`Arbeitstag auf ${fmtDate(toKey)} verschoben.`,()=>bl.forEach(b=>{b.date=toKey;if(b._sig)b._sig.d=toKey;}));
}
function workdaySheet(id,dk){

      <div class="wd-acts">

        <div class="wd-move"><span>Ganzen Tag verschieben auf</span><input class="inp" type="date" data-wdto value="${dk}">

      </div></div>`,

      o.querySelector("[data-wdmove]").onclick=()=>{const to=o.querySelector("[data-wdto]").value;if(!to||to===dk)return;close();moveWorkday(b.group,to);};

/* ---------- series: this / this and following / all ---------- */
function seriesChoice3(label,one,following,all){
  modal({title:label,size:"slim",
    body:`<p style="margin:0;line-height:1.6">Das ist ein wiederkehrender Termin. Was soll sich ändern?</p>`,

const stripOcc=o=>{const c={...o};["key","occKey","isException","hasSeries","_col","_cols"].forEach(k=>delete c[k]);return c;};

/* ---------- pointer handling: mouse drags at once, touch needs a long press ---------- */
let touchPend=null;
function calPointerDown(e){
  const blkEl=e.target.closest(".blk");
  const rzEl=e.target.closest(".rz");
  if(!blkEl||!blkEl.dataset.blk)return;
  const dayEl=blkEl.closest(".daycol");if(!dayEl)return;
  const id=blkEl.dataset.blk,dk=blkEl.dataset.dk;
  const b=occursOn(S.blocks.find(x=>x.id===id),dk);if(!b)return;
  hoverHide();
  const mk=()=>({id,dk,el:blkEl,mode:rzEl?"resize":"move",startY:e.clientY,startX:e.clientX,
    origStart:minutes(b.start),origEnd:minutes(b.end),moved:false,
    colW:dayEl.getBoundingClientRect().width,
    days:$$(".daycol").map(d=>({key:d.dataset.day,rect:d.getBoundingClientRect()}))});
  if(e.pointerType==="touch"){
    clearTimeout(touchPend?.t);
    touchPend={x:e.clientX,y:e.clientY,id,dk,pid:e.pointerId,cancel:false,
      t:setTimeout(()=>{
        if(!touchPend||touchPend.cancel)return;
        drag=mk();drag.touch=true;blkEl.classList.add("drag","lifted");
        try{blkEl.setPointerCapture?.(touchPend.pid);}catch(x){}
        try{navigator.vibrate?.(12);}catch(x){}
      },380)};
    return;
  }
  e.preventDefault();
  drag=mk();
  blkEl.classList.add("drag");
  blkEl.setPointerCapture?.(e.pointerId);
}
document.addEventListener("touchmove",e=>{
  if(drag&&drag.touch){e.preventDefault();return;}
  if(touchPend&&!touchPend.cancel){
    const t=e.touches[0];
    if(Math.hypot(t.clientX-touchPend.x,t.clientY-touchPend.y)>8){touchPend.cancel=true;clearTimeout(touchPend.t);}
  }
},{passive:false});
document.addEventListener("pointercancel",()=>{
  if(touchPend){clearTimeout(touchPend.t);touchPend=null;}
  if(drag){drag.el.classList.remove("drag","lifted");drag=null;render();}
});
function openEvent(id,dk){
  const b=S.blocks.find(x=>x.id===id);
  if(b&&b.group)workdaySheet(id,dk);else blockDlg(id,dk);
}
function calPointerUp(){
  if(touchPend&&!drag){
    const p=touchPend;touchPend=null;clearTimeout(p.t);
    if(!p.cancel){dragEndedAt=Date.now();openEvent(p.id,p.dk);}
    return;
  }
  touchPend=null;
  if(!drag)return;
  const d=drag;drag=null;
  d.el.classList.remove("drag","lifted");d.el.style.opacity="";
  dragEndedAt=Date.now();
  if(!d.moved){openEvent(d.id,d.dk);return;}
  if(d.curStart==null){render();return;}
  const base=S.blocks.find(x=>x.id===d.id);if(!base){render();return;}
  const ns=hhmm(d.curStart),ne=hhmm(d.curEnd),target=d.targetDay||d.dk;
  const label=d.mode==="resize"?`Auf ${ns}–${ne} geändert.`:`Verschoben auf ${target!==d.dk?fmtDate(target)+", ":""}${ns}–${ne}.`;
  const one=()=>calUndo(label,()=>{
    base.exceptions=base.exceptions||{};
    const cur=occursOn(base,d.dk)||{};
    if(target!==d.dk){
      base.exceptions[d.dk]={deleted:true};
      S.blocks.push({...stripOcc(cur),id:uid(),created:Date.now(),start:ns,end:ne,date:target,recurrence:null,exceptions:{}});
    }else base.exceptions[d.dk]={...(base.exceptions[d.dk]||{}),start:ns,end:ne};
  });
  const following=()=>calUndo(label+" Gilt ab jetzt für die Serie.",()=>{
    const until=dkey(addDays(parseKey(d.dk),-1));
    const next=JSON.parse(JSON.stringify(base));
    next.id=uid();next.created=Date.now();next.start=ns;next.end=ne;
    next.recurrence={...base.recurrence,from:target};
    if(next.recurrence.freq==="weekly"&&target!==d.dk){
      const f=dowIdx(parseKey(d.dk)),t2=dowIdx(parseKey(target));
      next.recurrence.days=[...new Set((next.recurrence.days||[]).map(x=>x===f?t2:x))].sort();
    }
    if(next.recurrence.freq==="yearly"){const p=parseKey(target);next.recurrence.day=p.getDate();next.recurrence.month=p.getMonth()+1;}
    next.exceptions={};
    Object.entries(base.exceptions||{}).forEach(([k,v])=>{if(k>d.dk)next.exceptions[k]=v;});
    base.recurrence={...base.recurrence,until};
    S.blocks.push(next);
  });
  const all=()=>calUndo(label,()=>{
    base.start=ns;base.end=ne;
    if(base.recurrence&&target!==d.dk){
      const f=dowIdx(parseKey(d.dk)),t2=dowIdx(parseKey(target));
      if(base.recurrence.freq==="weekly")base.recurrence.days=[...new Set((base.recurrence.days||[]).map(x=>x===f?t2:x))].sort();
    }
    if(base.date)base.date=target;
  });
  if(base.recurrence)seriesChoice3(d.mode==="resize"?"Dauer ändern":"Verschieben",one,following,all);
  else all();
}

  el.querySelector(".ns-body").innerHTML=`<div class="ps-head" style="--bcs:${t.color}">
      <span class="ps-ic">${t.icon}</span><div><b>${esc(t.name)}</b><div class="meta">Standard ${t.dur} min</div></div></div>

        <div class="field"><label>Fahrtweg min</label><input class="inp" type="number" min="0" step="5" data-wp="office.commute" value="${P.office.commute}"></div>
      </div>
      <div class="field" style="margin:0"><label>Office-Tage als Vorschlag</label><div style="display:flex;gap:6px;flex-wrap:wrap">
        ${DAYS2.slice(0,5).map((d,i)=>`<button type="button" class="chip ${P.officeDays.includes(i)?"on":""}" data-wpday="${i}">${d}</button>`).join("")}
      </div></div>`,
    footer:`<div class="sp"></div><button class="btn primary" data-x>Fertig</button>`,
    onMount(o,close){
      const T=id=>CAL().lib.find(x=>x.id===id);
      const redraw=()=>{o.querySelector("#leRows").innerHTML=rows();bind();};
      const bind=()=>{
        o.querySelectorAll("[data-leic]").forEach(b=>b.onclick=()=>{const t=T(b.dataset.leic);
          emojiPickDlg(t.icon,v=>{t.icon=v;save();redraw();});});
        o.querySelectorAll("[data-len]").forEach(i=>i.oninput=()=>{T(i.dataset.len).name=i.value||T(i.dataset.len).name;save();});
        o.querySelectorAll("[data-lec]").forEach(i=>i.oninput=()=>{T(i.dataset.lec).color=i.value;save();});
        o.querySelectorAll("[data-led]").forEach(i=>i.oninput=()=>{T(i.dataset.led).dur=Math.max(5,+i.value||5);save();});
        o.querySelectorAll("[data-les]").forEach(i=>i.onchange=()=>{T(i.dataset.les).solid=i.checked;save();});
        o.querySelectorAll("[data-leh]").forEach(i=>i.onchange=()=>{T(i.dataset.leh).hidden=!i.checked;save();redraw();});
        o.querySelectorAll("[data-ledel]").forEach(b=>b.onclick=()=>{CAL().lib=CAL().lib.filter(x=>x.id!==b.dataset.ledel);save();redraw();});
        bindSortList(o.querySelector("#leRows"));
      };
      o.querySelector("[data-leadd]").onclick=()=>{CAL().lib.push({id:"c_"+uid(),name:"Neuer Block",icon:"✨",color:"#a8b8c8",
        dur:60,solid:false,smart:null,hidden:false,custom:true,order:-1});
        calLib().forEach((t,k)=>{t.order=k;});save();redraw();};
      o.querySelectorAll("[data-wp]").forEach(i=>i.onchange=()=>{
        const k=i.dataset.wp,v=i.type==="number"?Math.max(0,+i.value||0):i.value;
        if(k==="end"){P.home.end=v;P.office.end=v;}
        else{const[a,b]=k.split(".");P[a][b]=v;}save();});
      o.querySelectorAll("[data-wpday]").forEach(b=>b.onclick=()=>{const d=+b.dataset.wpday,s=new Set(P.officeDays);
        s.has(d)?s.delete(d):s.add(d);P.officeDays=[...s].sort();b.classList.toggle("on");save();});
      o.querySelector("[data-x]").onclick=()=>{close();render();};
      bind();
    },onClose:render});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const hit=s=>e.target.closest(s);
  if(hit("[data-libedit]")){libEditDlg();return;}
  if(hit("[data-libsheet]")){
    if(mq("(max-width:860px)")||calView==="month")openCalSheet();
    else{CAL().prefs.libOpen=!CAL().prefs.libOpen;save();render();}
    return;}
  if(hit("[data-calsheetclose]")||hit("[data-psback]")){
    if(hit("[data-psback]"))openCalSheet();else closeCalSheet();return;}
  const pt=hit("[data-pstpl]");if(pt){placeSheet(pt.dataset.pstpl);return;}
  const pd=hit("[data-psdur]");if(pd){$("#calsheet").dataset.dur=pd.dataset.psdur;
    $$("#calsheet [data-psdur]").forEach(b=>b.classList.toggle("on",b===pd));return;}
  const pg=hit("[data-psgo]");
  if(pg){const dk=$("#psDay").value||calAnchor,st=$("#psStart").value||"09:00",dur=+$("#calsheet").dataset.dur||60;
    closeCalSheet();if(dk!==calAnchor){calAnchor=dk;}placeTemplate(pg.dataset.psgo,dk,minutes(st),dur);return;}
  const lc=hit("[data-libtpl]");
  if(lc&&route.view==="calendar"){
    openCalSheet();placeSheet(lc.dataset.libtpl);
    return;}
},true);

/* ---------- state + router ---------- */
function ensureV19(st){
  ensureV18(st);
  if(!st.cal||!Array.isArray(st.cal.lib))st.cal=defaultCal();
  const d=defaultCal();
  st.cal.prefs={...d.prefs,...(st.cal.prefs||{}),
    home:{...d.prefs.home,...(st.cal.prefs?.home||{})},office:{...d.prefs.office,...(st.cal.prefs?.office||{})},
    lunch:{...d.prefs.lunch,...(st.cal.prefs?.lunch||{})}};
  if(!Array.isArray(st.cal.prefs.officeDays))st.cal.prefs.officeDays=[1,3];
  d.lib.forEach(t=>{if(!st.cal.lib.some(x=>x.id===t.id))st.cal.lib.push({...t,order:st.cal.lib.length});});
  return st;
}
function ensureV2(st){return ensureV19(st);}
function repairState(st){
  REQUIRED_ARRAYS.forEach(k=>{if(!Array.isArray(st[k]))st[k]=[];});
  st.settings=st.settings||{};
  st.tasks=st.tasks.filter(t=>t&&typeof t==="object").map(t=>({...t,id:t.id||uid()}));
  st.blocks=st.blocks.filter(b=>b&&typeof b==="object"&&(b.date||b.recurrence)).map(b=>({...b,id:b.id||uid()}));
  st.birthdays=st.birthdays.filter(p=>p&&p.day>=1&&p.day<=31&&p.month>=1&&p.month<=12)
    .map(p=>({...p,id:p.id||uid(),gifts:Array.isArray(p.gifts)?p.gifts:[]}));
  ensureV19(st);
  st.schemaVersion=SCHEMA_VERSION;
  return st;
}

function blocksFor(key){
  const real=S.blocks.filter(b=>!b.allDay).map(b=>occursOn(b,key)).filter(Boolean);
  const C=S.cleaning;
  if(C&&C.enabled&&!(S.cal&&S.cal.prefs&&S.cal.prefs.showClean===false)&&cleanSessionOn(key)){
    const mins=Math.max(60,Math.ceil(tasksForSession(key).reduce((s,t)=>s+(t.mins||0),0)/2/15)*15);
    const p=cleanProgress(key);
    real.push({id:"__clean",key,virtual:true,vkind:"clean",type:"cleaning",title:`Home Reset · ${p.done}/${p.total}`,
      start:C.schedule.time,end:hhmm(minutes(C.schedule.time)+mins),notes:"",exceptions:{}});
  }
  if(S.focus&&S.focus.settings&&S.focus.settings.addToCalendar){
    focusOn(key).forEach(s=>{if(!s.start)return;
      real.push({id:"__focus_"+s.id,key,virtual:true,vkind:"focus",type:"focusrun",title:`${fcat(s.category).n}${s.title?" · "+s.title:""}`,
        start:s.start,end:s.end||hhmm(minutes(s.start)+s.actualMin),notes:"",exceptions:{}});});
  }
  return real.sort((a,b)=>minutes(a.start)-minutes(b.start)||minutes(a.end)-minutes(b.end));
}
/* ---------- shared day maths ---------- */
function kwOf(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const w=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-w);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);}
const fmtMinDur=m=>m>=60?`${Math.floor(m/60)} h${m%60?" "+(m%60)+" min":""}`:`${m} min`;
const BUD_GROUPS={work:["work","bvg","orga"],fitness:["fitness","swim"],growth:["growth","deep","read","creative"]};
function dayBudget(dk){
  const ws=S.settings.dayStart*60,we=(S.settings.dayEnd+1)*60;
  const list=blocksFor(dk);
  const iv=list.map(b=>[Math.max(ws,minutes(b.start)),Math.min(we,minutes(b.end))]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);
  let busy=0,cs=-1,ce=-1;
  iv.forEach(([a,b])=>{if(a>ce){if(ce>cs)busy+=ce-cs;cs=a;ce=b;}else ce=Math.max(ce,b);});
  if(ce>cs)busy+=ce-cs;
  const sum=ids=>list.filter(b=>ids.includes(b.tpl)).reduce((s,b)=>s+Math.max(0,minutes(b.end)-minutes(b.start)),0);
  return{busy,free:Math.max(0,we-ws-busy),win:we-ws,work:sum(BUD_GROUPS.work),fitness:sum(BUD_GROUPS.fitness),growth:sum(BUD_GROUPS.growth)};
}
function liveStatus(dk){
  const k=dk||todayKey(),n=berlinNow(),m=n.getHours()*60+n.getMinutes();
  const list=blocksFor(k);
  const now=list.filter(b=>minutes(b.start)<=m&&minutes(b.end)>m).sort((a,b)=>minutes(b.start)-minutes(a.start))[0];
  const next=list.find(b=>minutes(b.start)>m);
  return{now,next,m,list};
}
function statusLine(L){
  if(L.now){const left=minutes(L.now.end)-L.m;
    return{title:L.now.title,sub:left<=90?`noch ${fmtMinDur(left)}`:`bis ${L.now.end}`,ev:L.now};}
  if(L.next)return{title:`Frei bis ${L.next.start}`,sub:`danach ${L.next.title}`,ev:null};
  return{title:"Der Rest des Tages ist frei",sub:"",ev:null};
}

/* ---------- library drag with the pointer: own preview, no browser ghost ---------- */
let lib2=null,lib2End=0;
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest&&e.target.closest("[data-c3tpl]");
  if(!c||e.pointerType==="touch"||e.button>0)return;
  e.preventDefault();
  lib2={id:c.dataset.c3tpl,x:e.clientX,y:e.clientY,on:false,col:null};
});
document.addEventListener("pointermove",e=>{
  if(!lib2)return;
  if(!lib2.on){
    if(Math.hypot(e.clientX-lib2.x,e.clientY-lib2.y)<5)return;
    lib2.on=true;hoverHide();document.body.classList.add("c3-dragging");
    const t=calTpl(lib2.id),f=document.createElement("div");f.className="c3-float"+(t.solid?" solid":"");
    f.style.setProperty("--bcs",t.color);f.innerHTML=`${cic(t.ico)}<span>${esc(t.name)}</span>`;document.body.appendChild(f);
  }
  const f=$(".c3-float");if(f)f.style.transform=`translate(${e.clientX+10}px,${e.clientY+10}px)`;
  const under=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):null;
  const col=under&&under.closest?under.closest(".daycol"):null;
  lib2.col=col;lib2.cy=e.clientY;
  let g=$("#libGhost");
  if(!col){if(g)g.remove();return;}
  const t=calTpl(lib2.id),m=minuteAt(col,e.clientY),dur=t.smart==="workday"?60:t.dur;
  if(!g){g=document.createElement("div");g.id="libGhost";g.className="lib-ghost";}
  if(g.parentNode!==col)col.appendChild(g);
  g.style.cssText=`top:${m/60*HH}px;height:${Math.max(dur/60*HH-3,18)}px;--bcs:${t.color}`;
  g.innerHTML=t.smart==="workday"?`${cic(t.ico)} Arbeitstag wählen …`:`${cic(t.ico)} ${hhmm(m)} – ${hhmm(Math.min(m+dur,1439))}`;
});
document.addEventListener("pointerup",()=>{
  if(!lib2)return;
  const d=lib2;lib2=null;
  $(".c3-float")?.remove();$("#libGhost")?.remove();document.body.classList.remove("c3-dragging");
  lib2End=Date.now();
  if(!d.on){openCalSheet();placeSheet(d.id);return;}
  if(d.col)placeTemplate(d.id,d.col.dataset.day,minuteAt(d.col,d.cy));
});

const SUPP_TIMES=[["morning","Morgens"],["noon","Mittags"],["evening","Abends"],["any","Flexibel"]];
function defaultSupps(){
  const mk=(name,ico,i)=>({id:"sp_"+uid(),name,ico,dose:"",time:"morning",mode:"flex",days:[0,1,2,3,4,5,6],
    active:true,notes:"",since:todayKey(),pauses:[],order:i});
  return{items:[mk("AG1","leaf",0),mk("Omega-3","pill",1),mk("Vitamin B12","pill",2),mk("Vitamin D3 + K2","sun",3),
    mk("Magnesium","pill",4),mk("Kreatin","dumbbell",5)],log:{},auto:{}};
}
const SU=()=>S.supps;
const suppItems=()=>[...SU().items].sort((a,b)=>(a.order??1e9)-(b.order??1e9));
const inPause=(it,dk)=>(it.pauses||[]).some(p=>dk>=p.from&&(!p.to||dk<=p.to));
/** shown on that day: active, existing, not paused, and either flexible or on a planned weekday */
function suppShown(it,dk){
  if(dk<(it.since||"0000")||inPause(it,dk))return false;
  if(!it.active&&!(it.pauses||[]).length)return false;
  return it.mode==="flex"||(it.days||[]).includes(dowIdx(parseKey(dk)));
}
/** counts towards regularity only with fixed weekdays — flexible ones are never "missed" */
const suppPlanned=(it,dk)=>it.mode==="days"&&suppShown(it,dk);
const suppLog=dk=>SU().log[dk]||{};
const suppTaken=(it,dk)=>!!suppLog(dk)[it.id];
function suppToday(dk){
  const k=dk||todayKey(),list=suppItems().filter(it=>suppShown(it,k));
  return{list,done:list.filter(it=>suppTaken(it,k)).length,n:list.length};
}
function suppRoutineStep(){
  return(S.routines.morning.items||[]).find(i=>i.active&&/supplement/i.test(i.name));
}
/** the individual entries are the source of truth; the routine step only follows them */
function suppSyncRoutine(dk){
  const step=suppRoutineStep();if(!step||dk!==todayKey())return;
  const t=suppToday(dk),h=rHist(dk);h.morning=h.morning||{};
  const all=t.n>0&&t.done===t.n;
  if(all&&!h.morning[step.id]){h.morning[step.id]=true;SU().auto[dk]=true;}
  else if(!all&&SU().auto[dk]&&h.morning[step.id]){delete h.morning[step.id];delete SU().auto[dk];}
}
function suppToggle(id,dk){
  const k=dk||todayKey();SU().log[k]=SU().log[k]||{};
  if(SU().log[k][id])delete SU().log[k][id];else SU().log[k][id]=Date.now();
  suppSyncRoutine(k);save();
}
function suppStats(days){
  const out={planned:0,taken:0,per:{}};
  suppItems().forEach(it=>{out.per[it.id]={planned:0,taken:0,intakes:0};});
  for(let i=0;i<days;i++){
    const k=dkey(addDays(berlinNow(),-i));
    suppItems().forEach(it=>{
      const p=out.per[it.id];
      if(suppTaken(it,k))p.intakes++;
      if(suppPlanned(it,k)){p.planned++;out.planned++;if(suppTaken(it,k)){p.taken++;out.taken++;}}
    });
  }
  out.rate=out.planned?out.taken/out.planned:null;
  return out;
}
function suppStreak(){
  let streak=0;
  for(let i=0;i<400;i++){
    const k=dkey(addDays(berlinNow(),-i));
    const pl=suppItems().filter(it=>suppPlanned(it,k));
    if(!pl.length){continue;}
    const ok=pl.every(it=>suppTaken(it,k));
    if(ok)streak++;else if(i===0)continue;else break;
  }
  return streak;
}

}

function buildWorkdayEvents(dk,mode){

    const ev=newEventFromTpl(t,dk,minutes(s),minutes(e),{title:roleTitle(role,t),origin:"auto",group,groupKind:"workday",role,workMode:mode});
    ev._sig=sigOf(ev);return ev;});
}
/** proposals for one day from one day template, with duplicates marked */
function dtProposals(dt,dk){
  const out=[];
  if(dt.workday){
    if(workdayOn(dk))out.push({dup:true,label:`${dt.workday==="office"?"Office":"Homeoffice"}-Arbeitstag`,evs:[]});
    else{const evs=buildWorkdayEvents(dk,dt.workday);out.push({label:`${dt.workday==="office"?"Office":"Homeoffice"}-Arbeitstag · ${evs.length} Blöcke`,evs,ico:"briefcase"});}
  }
  (dt.items||[]).forEach(it=>{
    const t=calTpl(it.tpl)||{name:it.title,ico:it.ico||"dot",color:it.color||"#97a8bb",solid:!!it.solid,id:it.tpl};
    const dup=blocksFor(dk).some(b=>b.start===it.start&&(b.tpl===it.tpl&&it.tpl||b.title===it.title));
    const ev=newEventFromTpl(t,dk,minutes(it.start),minutes(it.end),{title:it.title||t.name,ico:it.ico||t.ico,color:it.color||t.color,solid:it.solid!=null?it.solid:t.solid,origin:"dayTpl"});
    out.push({dup,label:`${it.start}–${it.end} ${it.title||t.name}`,evs:[ev],ico:ev.ico});
  });
  out.forEach(p=>{p.conf=!p.dup&&p.evs.some(ev=>conflictsFor(dk,minutes(ev.start),minutes(ev.end)).length);});
  return out;
}

const ICS_FEEDS=[["work","Work","#2f3846"],["fitness","Fitness","#202328"],["personal","Privat","#dbc8a6"],
  ["growth","Growth","#97d0a3"],["creative","Creative","#a6bea2"],["travel","Reisen","#8fc3c0"],
  ["important","Wichtig","#d24848"],["routine","Routinen","#a8d3ee"]];
const ICS_MAP={work:"work",bvg:"work",lunch:"work",orga:"work",fitness:"fitness",swim:"fitness",growth:"growth",deep:"growth",
  read:"growth",creative:"creative",travel:"travel",deadline:"important",morning:"routine",evening:"routine"};
const icsFeedOf=b=>(b.tpl&&ICS_MAP[b.tpl])||"personal";
function icsCfg(){
  if(!CAL().ics)CAL().ics={enabled:false,gistId:null,owner:null,notes:false,lastAt:0,lastHash:"",
    feeds:{work:true,fitness:true,personal:true,growth:false,creative:false,travel:true,important:true,routine:false}};
  return CAL().ics;
}
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const icsDT=(dk,hm)=>dk.replace(/-/g,"")+"T"+hm.replace(":","")+"00";
function icsFold(line){const out=[];let s=line;while(s.length>72){out.push(s.slice(0,72));s=" "+s.slice(72);}out.push(s);return out.join("\r\n");}
const ICS_TZ=["BEGIN:VTIMEZONE","TZID:Europe/Berlin","BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST",
  "DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT","BEGIN:STANDARD","TZOFFSETFROM:+0200",
  "TZOFFSETTO:+0100","TZNAME:CET","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","END:VTIMEZONE"];
const ICS_BYDAY=["MO","TU","WE","TH","FR","SA","SU"];
function icsFirstDate(b){
  const from=b.recurrence.from||dkey(addDays(berlinNow(),-60));
  for(let i=0;i<400;i++){const k=dkey(addDays(parseKey(from),i));if(occursOn({...b,exceptions:{}},k))return k;}
  return from;
}
function icsEvents(feed,opts){
  const o=opts||{},now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z"),L=[];
  S.blocks.filter(b=>icsFeedOf(b)===feed).forEach(b=>{
    const uidv=`${b.id}@lifeos`,sum=icsEsc(b.title);
    const desc=o.notes&&b.notes?[`DESCRIPTION:${icsEsc(b.notes)}`]:[];
    if(b.allDay){
      const dk=b.date||(b.recurrence?icsFirstDate(b):null);if(!dk)return;
      L.push("BEGIN:VEVENT",`UID:${uidv}`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${dk.replace(/-/g,"")}`,
        `DTEND;VALUE=DATE:${dkey(addDays(parseKey(dk),1)).replace(/-/g,"")}`,`SUMMARY:${sum}`,...desc,"END:VEVENT");return;}
    const first=b.date||icsFirstDate(b);
    const ev=["BEGIN:VEVENT",`UID:${uidv}`,`DTSTAMP:${now}`,`DTSTART;TZID=Europe/Berlin:${icsDT(first,b.start)}`,
      `DTEND;TZID=Europe/Berlin:${icsDT(first,b.end)}`,`SUMMARY:${sum}`,...desc];
    if(b.recurrence){
      const r=b.recurrence,until=r.until?`;UNTIL=${r.until.replace(/-/g,"")}T225959Z`:"";
      const rule=r.freq==="daily"?"FREQ=DAILY":r.freq==="weekly"?`FREQ=WEEKLY;BYDAY=${(r.days||[]).map(d=>ICS_BYDAY[d]).join(",")}`
        :r.freq==="monthly"?`FREQ=MONTHLY;BYMONTHDAY=${r.day||parseKey(first).getDate()}`
        :`FREQ=YEARLY;BYMONTH=${r.month||parseKey(first).getMonth()+1};BYMONTHDAY=${r.day||parseKey(first).getDate()}`;
      ev.push(`RRULE:${rule}${until}`);
      Object.entries(b.exceptions||{}).forEach(([k,x])=>{if(x&&x.deleted)ev.push(`EXDATE;TZID=Europe/Berlin:${icsDT(k,b.start)}`);});
    }
    ev.push("END:VEVENT");L.push(...ev);
    if(b.recurrence)Object.entries(b.exceptions||{}).forEach(([k,x])=>{
      if(!x||x.deleted)return;
      L.push("BEGIN:VEVENT",`UID:${uidv}`,`DTSTAMP:${now}`,`RECURRENCE-ID;TZID=Europe/Berlin:${icsDT(k,b.start)}`,
        `DTSTART;TZID=Europe/Berlin:${icsDT(k,x.start||b.start)}`,`DTEND;TZID=Europe/Berlin:${icsDT(k,x.end||b.end)}`,
        `SUMMARY:${icsEsc(x.title||b.title)}`,"END:VEVENT");});
  });
  return L;
}
function icsCalendar(feed,opts){
  const f=ICS_FEEDS.find(x=>x[0]===feed);
  return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Life OS//Kalender//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    `X-WR-CALNAME:Life OS — ${f?f[1]:feed}`,"X-WR-TIMEZONE:Europe/Berlin",`X-APPLE-CALENDAR-COLOR:${f?f[2]:"#97a8bb"}`,
    "REFRESH-INTERVAL;VALUE=DURATION:PT1H","X-PUBLISHED-TTL:PT1H",...ICS_TZ,...icsEvents(feed,opts),"END:VCALENDAR"]
    .map(icsFold).join("\r\n")+"\r\n";
}
const icsFile=f=>`life-os-${f}.ics`;
const icsUrl=f=>{const c=icsCfg();return c.gistId&&c.owner?`https://gist.githubusercontent.com/${c.owner}/${c.gistId}/raw/${icsFile(f)}`:"";};
function icsPayload(){
  const c=icsCfg(),files={};
  ICS_FEEDS.forEach(([f])=>{files[icsFile(f)]=c.feeds[f]?{content:icsCalendar(f,{notes:c.notes})}:null;});
  return files;
}
const icsHash=files=>{let h=0;const s=JSON.stringify(Object.entries(files).map(([k,v])=>[k,v&&v.content.replace(/DTSTAMP:\S+/g,"")]));
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return String(h);};
let icsBusy=false,icsT=null;
async function icsPublish(force){
  const c=icsCfg();
  if(!c.enabled||!syncOn()||icsBusy)return false;
  const files=icsPayload(),h=icsHash(files);
  if(!force&&h===c.lastHash&&c.gistId)return false;
  icsBusy=true;
  try{
    if(!c.gistId){
      const live={};Object.entries(files).forEach(([k,v])=>{if(v)live[k]=v;});
      if(!Object.keys(live).length){icsBusy=false;return false;}
      /* a gist of its own — the feed address must never lead to the main data gist */
      const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:"Life OS – Kalender-Abo (nur freigegebene Termine)",public:false,files:live})});
      c.gistId=g.id;c.owner=g.owner&&g.owner.login;
    }else{
      const g=await gh("/gists/"+c.gistId);
      const send={};Object.entries(files).forEach(([k,v])=>{if(v||g.files[k])send[k]=v;});
      await gh("/gists/"+c.gistId,{method:"PATCH",body:JSON.stringify({files:send})});
      c.owner=c.owner||(g.owner&&g.owner.login);
    }
    c.lastHash=h;c.lastAt=Date.now();save();return true;
  }catch(err){toast("Apple-Abo konnte nicht aktualisiert werden: "+String(err.message).slice(0,80));return false;}
  finally{icsBusy=false;}
}
const icsSoon=()=>{clearTimeout(icsT);icsT=setTimeout(()=>icsPublish(false),9000);};

/** one write path; after a reset nothing older than the reset may come back, also not via a merge */
function save(){
  if(S&&S.cal&&S.cal.resetAt&&Array.isArray(S.blocks)){const ra=S.cal.resetAt;S.blocks=S.blocks.filter(b=>(b.created||0)>=ra);}
  let probs=[];
  try{probs=validateState(S);}catch(e){probs=["Zustand nicht lesbar"];}
  if(probs.length){
    try{repairState(S);}catch(e){setSave("error");toast("Speichern fehlgeschlagen — die letzte gültige Fassung bleibt erhalten.");return;}
    let after=[];try{after=validateState(S);}catch(e){after=["Zustand nicht lesbar"];}
    if(after.length){setSave("error");toast("Speichern fehlgeschlagen — die letzte gültige Fassung bleibt erhalten.");return;}
  }
  S.schemaVersion=SCHEMA_VERSION;S.meta=S.meta||{};S.meta.updated=Date.now();
  if(fileHandle)setSave("dirty");
  flush();keepBackup();syncPushSoon();
  if(S.cal&&S.cal.ics&&S.cal.ics.enabled)icsSoon();
}
function ensureV20(st){
  ensureV19(st);

  C.lib.forEach(t=>{

    if(v19Pal()[t.id]&&t.color===v19Pal()[t.id])t.color=palOf()[t.id];
  });
  if(!Array.isArray(C.dayTpls))C.dayTpls=d.dayTpls;
  if(C.prefs.showClean===undefined)C.prefs.showClean=true;
  if(C.resetAt)st.blocks=st.blocks.filter(b=>(b.created||0)>=C.resetAt);
  if(!st.supps||!Array.isArray(st.supps.items))st.supps=defaultSupps();
  /* one-time: the visible window becomes 07:00–23:00 as requested */
  if(!C.winSet){C.winSet=true;if(st.settings.dayStart>7)st.settings.dayStart=7;if(st.settings.dayEnd<22)st.settings.dayEnd=22;}
  st.supps.log=st.supps.log||{};st.supps.auto=st.supps.auto||{};

}
function ensureV2(st){return ensureV20(st);}
function repairState(st){
  REQUIRED_ARRAYS.forEach(k=>{if(!Array.isArray(st[k]))st[k]=[];});
  st.settings=st.settings||{};
  st.tasks=st.tasks.filter(t=>t&&typeof t==="object").map(t=>({...t,id:t.id||uid()}));
  st.blocks=st.blocks.filter(b=>b&&typeof b==="object"&&(b.date||b.recurrence)).map(b=>({...b,id:b.id||uid()}));
  st.birthdays=st.birthdays.filter(p=>p&&p.day>=1&&p.day<=31&&p.month>=1&&p.month<=12)
    .map(p=>({...p,id:p.id||uid(),gifts:Array.isArray(p.gifts)?p.gifts:[]}));
  ensureV20(st);st.schemaVersion=SCHEMA_VERSION;return st;
}

  if(route.view==="recipe")document.querySelectorAll('#sbNav [data-nav="food"]').forEach(b=>b.classList.add("on"));
}
document.addEventListener("click",e=>{
  const hit=s=>e.target.closest&&e.target.closest(s);
  if(hit("[data-c3dtpl]")){dayTplDlg();return;}
  if(hit("[data-c3plan]")){weekPlanDlg();return;}
  const ad=hit("[data-c3applydt]");if(ad){applyDayTpl(ad.dataset.c3applydt,calAnchor);return;}
  if(hit("[data-c3ics]")){icsDlg();return;}
},true);

boot();
</script>
</body>
</html>
